<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Promise • Lahari</title>
<meta name="theme-color" content="#eef3ec">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#1f2a24;--muted:#66726b;--accent:#2e7d4f;--soft:#e6f4ea;--line:#e2e8e4;--warn:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(135deg,#e3f3e8 0%,#ffffff 55%,#fdecec 100%);padding:28px 18px 20px;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.title{font-size:27px;font-weight:800}.sub{color:var(--muted)}
nav{display:flex;gap:7px;overflow:auto;margin-top:16px}nav button,.pill{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer}
nav button.active{background:var(--accent);color:white}
/* Brain Dump + Priority Matrix polish */
.task-transfer{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;margin-top:12px;padding:0;border:0;background:transparent;box-shadow:none}
.task-transfer .transfer-count{display:none}
.task-transfer .transfer-count .badge{display:none}
.task-transfer .transfer-btn{font-size:13px;padding:8px 11px}
.transfer-btn{box-shadow:0 4px 12px #0000000b}
.matrix-header{background:linear-gradient(135deg,#f4f8f3,#ffffff);border-color:#dbe4db}
.matrix-grid{margin-top:12px}
.matrix-quadrant{position:relative;overflow:hidden}
.matrix-quadrant:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent);opacity:.55}
.matrix-quadrant h4{margin:2px 0 10px;font-size:16px}
.matrix-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 2px}
.matrix-empty{padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fafbf9}
main{padding:22px 14px 60px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 3px 15px #00000006}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}
h2,h3{margin:0 0 10px}.small{font-size:13px;color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px}.score{font-size:40px;font-weight:800}.progress{height:10px;background:#edf0ec;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f1ef}.check:last-child{border:0}.check input{margin-top:4px;accent-color:var(--accent)}
.daygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.day{padding:8px 2px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;text-align:center}.day.selected{outline:2px solid var(--accent)}.day.done{background:var(--soft)}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--soft);font-size:12px}.timer{font-size:28px;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;background:var(--accent);color:white;padding:9px 13px;border-radius:10px;cursor:pointer}.btn.secondary{background:#eef1ed;color:var(--ink)}
.meal{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.foodgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.food{border:1px solid var(--line);padding:9px;border-radius:11px;cursor:pointer}.food input{margin-right:6px;accent-color:var(--accent)}
textarea,input[type=text],input[type=url]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}textarea{min-height:80px}
.quote{font-size:18px;font-weight:700}.alert{background:#fff6f6;border-left:4px solid #b48a51;padding:11px;border-radius:8px}
@media(max-width:800px){.span8,.span6,.span4{grid-column:span 12}.daygrid{grid-template-columns:repeat(6,1fr)}.hero{display:block}}

.business-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:10px}
.business-kpi{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafbf9}
.business-kpi b{display:block;font-size:23px}
.business-kpi span{font-size:12px;color:var(--muted)}
.business-day{border:1px solid var(--line);border-radius:15px;margin:10px 0;background:#fff;overflow:hidden}
.business-day summary{cursor:pointer;list-style:none;padding:13px 15px;display:flex;align-items:center;gap:10px}
.business-day summary::-webkit-details-marker{display:none}
.business-day summary:before{content:"＋";font-weight:800;color:var(--accent)}
.business-day[open] summary:before{content:"−"}
.business-day.done summary{background:var(--soft)}
.business-day .bd-body{padding:0 15px 15px}
.business-meta{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.business-progress{height:7px;background:#edf0ec;border-radius:99px;overflow:hidden;margin:5px 0 10px}
.business-progress .bar{height:100%;background:var(--accent)}
.business-checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.business-checkgrid .check{min-height:38px}
.business-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.business-metrics input{min-width:0}
.status-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.status-row button{font-size:12px}
.followup-row{display:grid;grid-template-columns:1.2fr .9fr .9fr 1fr auto;gap:7px;align-items:center;margin:7px 0}
.food .btn.secondary{border:0;line-height:1}.pipeline-table{width:100%;border-collapse:collapse;font-size:13px}
.pipeline-table th,.pipeline-table td{padding:7px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:800px){.business-kpis{grid-template-columns:repeat(2,1fr)}.business-checkgrid,.business-metrics{grid-template-columns:1fr}.followup-row{grid-template-columns:1fr 1fr}.business-meta{margin-left:0}}

/* Food Choices layout */
.food-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
.food-choice-section{background:#fbfcfa;border:1px solid var(--line);border-radius:14px;padding:15px}
.food-choice-section h4{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.food-choice-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.food-choice-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid #e8ece8;border-radius:10px;background:#fff;min-height:42px}
.food-choice-item input{margin-top:3px;flex:0 0 auto;accent-color:var(--accent)}
.food-choice-item span{line-height:1.35}
.food-choice-intro{margin-bottom:2px}
@media(max-width:800px){.food-choice-grid{grid-template-columns:1fr}.food-choice-items{grid-template-columns:1fr}}

/* Manage added items — compact single-line rows */
.custom-item-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.custom-item-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(180px,260px);gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid #eef0ed}
.custom-item-row:last-child{border-bottom:0}
.custom-item-row:hover{background:#fafbf9}
.custom-item-row input[type=checkbox]{margin:0;accent-color:var(--accent)}
.custom-item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.custom-item-row select{width:100%;min-width:0;margin:0}
@media(max-width:650px){.custom-item-row{grid-template-columns:auto minmax(0,1fr);gap:8px}.custom-item-row select{grid-column:2}}

/* Shopping list: category header + drag/drop + move-to dropdown */
.cat-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cat-header h4{margin:0;padding:0;border:0}
.cat-edit-btn{padding:4px 10px;font-size:12px;white-space:nowrap}
.cat-drop{transition:background .12s,outline .12s}
.cat-drop.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;background:#eef8f1}
.shop-item-row{cursor:grab}
.shop-item-row:active{cursor:grabbing}
.shop-item-row .drag-handle{color:var(--muted);margin-right:2px}
.buy-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.buy-summary-grid .custom-item-row{border-bottom:1px solid #eef0ed}
@media(max-width:650px){.buy-summary-grid{grid-template-columns:1fr}}

/* Today planner — matches the app's card/check/badge language instead of standalone colors */
.plan-task{border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin:10px 0;background:#fff}
.plan-task.plan-done{background:var(--soft)}
.plan-top{display:flex;align-items:flex-start;gap:12px}
.plan-order{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.plan-order button{width:24px;height:20px;font-size:10px;padding:0;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--muted);cursor:pointer}
.plan-order button:disabled{opacity:.3;cursor:default}
.plan-time{font-size:12.5px;color:var(--muted);min-width:86px;padding-top:2px}
.plan-time input[type=time]{padding:4px 6px;font-size:12.5px;margin-top:4px;width:100%}
.plan-body{flex:1;min-width:0}
.plan-body h4{margin:0 0 3px;font-size:15px}
.plan-body p{margin:0;color:var(--muted)}
.plan-target{font-size:12.5px;color:var(--muted);margin-top:7px}
.plan-target input{width:54px;padding:3px 6px;font-size:12.5px;margin:0 4px}
.plan-check{flex-shrink:0}
.plan-check input{width:19px;height:19px;accent-color:var(--accent);margin-top:2px}
.plan-confirm{margin-top:10px;padding-top:10px;border-top:1px solid #f0f1ef;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.plan-confirm input[type=time]{padding:6px 8px;width:auto}
.plan-items{margin-top:10px;padding-top:10px;border-top:1px solid #f0f1ef}
.plan-items .check{padding:5px 0}
.plan-add-sub{border:0!important;border-bottom:1px dashed var(--line)!important;border-radius:0!important;padding:6px 2px!important;font-size:13px;background:transparent!important}
.plan-add-sub:focus{outline:none;border-bottom-color:var(--accent)!important}
.plan-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:700;margin-left:7px;vertical-align:middle}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.plan-recap{background:var(--soft);border-radius:12px;padding:11px 14px;font-size:13.5px;margin:10px 0}
.plan-time-big{font-weight:800;font-size:15px;color:var(--ink);min-width:104px;line-height:1.3}
.plan-time-big input[type=time]{font-weight:400;font-size:12.5px;padding:4px 6px;margin-top:5px;width:100%}
.subtask-toggle{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0;margin-bottom:8px;display:inline-block}
.subtask-table{width:100%;border-collapse:collapse;margin-top:2px;font-size:13px}
.subtask-table th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.subtask-table td{padding:7px 6px;border-bottom:1px solid #f0f1ef;vertical-align:middle}
.subtask-table tr.sub-done td{color:var(--muted);text-decoration:line-through}
.subtask-table td input[type=number]{width:56px;padding:3px 5px;font-size:12.5px}
.subtask-table tfoot td{border-top:1px solid var(--line);border-bottom:0;padding-top:9px}
.sub-del{background:none;border:0;color:#b23b3b;cursor:pointer;font-size:15px;padding:2px 8px;line-height:1}
.sub-hide{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;line-height:1}
.plan-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.plan-title-edit{border:none;background:transparent;font-weight:700;font-size:15px;color:var(--ink);padding:2px 4px;margin-left:-4px;flex:1;min-width:80px;font-family:inherit}
.plan-title-edit:focus{outline:none;border-bottom:1px dashed var(--accent);background:#fff}

/* ===== v2 polish: shared ===== */
:root{--bg:#ffffff;--ink:#1f2a24;--muted:#66726b;--accent:#2e7d4f;--accent-2:#1f5c39;--soft:#e6f4ea;--line:#e2e8e4;--warn:#c0392b;--mint:#ecf7f0;--red:#c0392b;--red-soft:#fdecec}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15.5px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
input,select,textarea,button{font:inherit;color:inherit}
header{padding:18px 18px 12px;background:linear-gradient(160deg,#e3ece2 0%,#f4f7f5 70%)}
.title{font-size:25px;letter-spacing:-.015em}
.sub{font-size:14px}
nav{scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin-top:12px}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;flex:0 0 auto;font-size:14.5px;font-weight:600;color:var(--ink)}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{font-weight:600;transition:filter .12s}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.icon{padding:8px 10px}
.link-btn{background:none;border:0;padding:0;color:var(--accent-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px;font-weight:600}
.card{border-radius:18px;box-shadow:0 1px 2px #0000000a}
h2{font-size:22px;letter-spacing:-.01em}
h3{font-size:17px}
h4{margin:14px 0 4px;font-size:14.5px}
label.small{display:block;margin:10px 0 4px}
select,input[type=number],input[type=date],input[type=time]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px}
textarea.tall{min-height:120px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.card-head h3{margin:0}
.daynav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px}
.daynav-date{font-weight:500;margin-left:4px}
.back-row{margin-top:16px}
.split-left{grid-column:span 7}
.split-right{grid-column:span 5;align-self:start}
#app > .daynav{margin-bottom:14px}
.more-almost summary{list-style:none;margin:8px 0}
.more-almost summary::-webkit-details-marker{display:none}
.more-almost[open] summary{display:none}
.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daygrid{grid-template-columns:repeat(15,1fr)}
.day{font-weight:600;font-variant-numeric:tabular-nums;min-height:38px}
.page-head h2{margin-bottom:4px}
.stat-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--mint);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
.stat b{font-size:17px;margin-right:3px}
.stat.warn{background:#fbf3e8;border-color:#eed9bd}

/* Dashboard check-in */
.checkin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 22px;margin-top:6px}
.checkin-grid section{min-width:0}
.checkin-grid h4{margin:12px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.checkin-grid select,.checkin-grid input,.checkin-grid textarea{width:100%}
.gratitude input{margin-bottom:8px}

/* Today */
.today-hero{background:linear-gradient(150deg,#e6efe5,#ffffff 75%);border-color:#d6e2d5}
.today-hero h2{font-size:26px;margin:8px 0 4px}
.quote-main{font-size:20px;font-weight:700;line-height:1.35;margin:6px 0 10px;max-width:40ch}
.quote-more{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.quote-more li{padding-left:12px;border-left:3px solid #c9d8c8;color:var(--muted);font-size:14.5px}
.mini-row{grid-column:span 12;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mini{padding:13px 15px}
.mini h3{font-size:15px;margin:0 0 8px}
.mini p.small{margin:6px 0 0}
.mini input[type=date]{width:100%}
.mini-fields{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.mini-fields input,.mini-fields select{width:100%;min-width:0}
.timer-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mini .timer{font-size:26px;font-variant-numeric:tabular-nums}
.mini .row .btn{padding:7px 11px}
.routine-progress{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.routine-progress .progress{flex:1;height:8px}
.routine{width:100%;border-collapse:collapse}
.routine td{padding:9px 6px;border-bottom:1px solid #eef1ed;vertical-align:top}
.routine tr:last-child td{border-bottom:0}
.routine td.c{width:1%;padding-left:2px}
.routine td.t{width:1%;white-space:nowrap;font-weight:700;color:var(--accent-2);font-size:13.5px;font-variant-numeric:tabular-nums;padding-top:10px}
.routine td.a{line-height:1.4}
.routine label{cursor:pointer}
.routine input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin:1px 0 0}
.routine tr.done td.a label{color:var(--muted);text-decoration:line-through;text-decoration-color:#b9c4bb}
.routine tr.now td{background:var(--mint)}
.routine tr.now td.c{box-shadow:inset 3px 0 0 var(--accent)}
.go-btn{display:inline-block;margin-left:8px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:1px 9px;font-size:12px;color:var(--accent-2);cursor:pointer;vertical-align:1px}
.routine-edit{display:grid;gap:6px;margin:8px 0 10px}
.re-row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:6px}
.re-row input{width:100%;min-width:0}
.re-new{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.care h4{color:var(--accent-2)}
.care .check{padding:6px 0;font-size:14.5px}

/* Food */
.water{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}
.water-count{font-size:15px;color:var(--muted)}
.water-count b{font-size:30px;color:var(--ink);margin-right:2px}
.cups{display:flex;gap:4px;flex-wrap:wrap}
.cup{width:36px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;cursor:pointer;filter:grayscale(1);opacity:.35;padding:0}
.cup.full{filter:none;opacity:1;background:#eef5fb;border-color:#cfe0ee}
.cup.extra{border-style:dashed}
.drink-week{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:8px}
.drink{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer}
.drink input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.drink>span{display:flex;flex-direction:column;gap:3px}
.drink-day{font-size:12.5px;color:var(--muted);font-weight:600}
.drink.today{background:var(--mint);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tips{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff6f6;border:1px solid #efe2cf}
.tips h4{margin:0 0 4px}
.tips p{margin:4px 0}

/* Grocery */
.pantry-cat{border:1px solid var(--line);border-radius:14px;background:#fff;margin:8px 0;overflow:hidden}
.pantry-cat summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;font-weight:700}
.pantry-cat summary::-webkit-details-marker{display:none}
.pantry-cat summary:before{content:"+";color:var(--accent);font-weight:800;margin-right:8px}
.pantry-cat[open] summary:before{content:"−"}
.pantry-cat summary span:first-child{flex:1}
.pantry-row{display:grid;grid-template-columns:auto minmax(0,1fr) 78px 76px;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid #f0f2ef}
.pantry-row.have{background:#f5f9f4}
.pantry-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.pantry-row input[type=number],.pantry-row select{width:100%;min-width:0;padding:6px 8px;min-height:36px}
.pname{min-width:0;overflow:hidden;text-overflow:ellipsis}
.low-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);background:#fdecec;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.recipe-list{display:flex;flex-wrap:wrap;gap:7px}

// Everyone who opens this file shares the same Firebase project, so each person
// needs their own cloud "folder" (profile) or their data would mix together.
// If this device already has a remembered profile we skip straight in; otherwise
// we show a list of existing profiles to pick from (or let you create a new one),
// and ask for a passcode if that profile has one set — so a reset in one login
// never touches anyone else's tracker.
const GUEST_ID="guest"; // singleton guest profile — never randomly generated, always pinned to top of the picker
function sanitizeProfileId(v){
  return (v||"").trim().toLowerCase().replace(/[^a-z0-9-_]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
}
function hashPasscode(p){
  const s=String(p||""); let h=0;
  for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  return h.toString(36);
}
async function fetchExistingProfiles(){
  // Union of the metadata node AND the actual data node — a profile with saved
  // data but no passcode-metadata entry (e.g. created before that concept existed)
  // must still show up, or it becomes invisible/unopenable and risks being
  // silently overwritten by someone creating a "new" profile with the same name.
  try{
    const [profSnap,stateSnap]=await Promise.all([
      firebase.database().ref("adhdPlannerProfiles").once("value"),
      firebase.database().ref("adhdPlannerState").once("value")
    ]);
    const a=Object.keys(profSnap.val()||{});
    const b=Object.keys(stateSnap.val()||{});
    return Array.from(new Set([...a,...b]));
  }catch(e){return [];}
}
async function fetchProfileMeta(id){
  try{
    const snap=await firebase.database().ref("adhdPlannerProfiles/"+id).once("value");
    return snap.val();
  }catch(e){return null;}
}

      if(entered===null)return false;
      if(hashPasscode(entered)===meta.passcodeHash)return true;

  const p1=window.prompt("Set a passcode for \""+id+"\" so it's protected next time (used only when someone chooses this tracker from the list). Leave blank to skip:","");
  if(p1){
    try{await firebase.database().ref("adhdPlannerProfiles/"+id).set({passcodeHash:hashPasscode(p1)});}catch(e){}
  } else if(!meta){
    try{await firebase.database().ref("adhdPlannerProfiles/"+id).set({passcodeHash:null});}catch(e){}

// Deleting a profile always requires its passcode. If none is set yet, one must be
// created (and re-typed to confirm) as the deletion gate — this is the deliberate
// "passcode must be added to delete" safety rail.
async function requirePasscodeToDelete(id){
  if(id===GUEST_ID){alert("The Guest profile is shared and can't be deleted.");return false;}
  const meta=await fetchProfileMeta(id);
  if(meta && meta.passcodeHash){
    for(let tries=0;tries<3;tries++){
      const entered=window.prompt("Deleting \""+id+"\" permanently removes its saved data.\n\nEnter its passcode to confirm:","");
      if(entered===null)return false;
      if(hashPasscode(entered)===meta.passcodeHash)return true;
      alert("Incorrect passcode.");
    }
    return false;
  }
  const p1=window.prompt("\""+id+"\" has no passcode set yet. Set one now and re-enter it to confirm you want to permanently delete it:","");
  if(!p1)return false;
  const p2=window.prompt("Re-enter the passcode to confirm deleting \""+id+"\":","");
  if(p1!==p2){alert("Passcodes didn't match — deletion cancelled.");return false;}
  return true;
}

const MASTER_DELETE_ALL_HASH="b0axxf";
async function deleteAllProfiles(ids){

    if(entered===null)return false;

function businessState(){
  state.business=state.business||{};
  state.business.days=state.business.days||{};
  state.business.leads=state.business.leads||[];
  state.business.metrics=state.business.metrics||{};
  state.business.followups=state.business.followups||[];
  return state.business;
}
function bday(d){
  const b=businessState();
  b.days[d]=b.days[d]||{tasks:{},calls:0,answered:0,leads:0,meetings:0,proposals:0,won:0,expected:0,notes:""};
  return b.days[d];
}
function btoggle(d,i){
  const b=bday(d); b.tasks[i]=!b.tasks[i]; saveBusinessOnly();
}
function setBusinessMetric(d,field,val){
  const b=bday(d); let n=parseFloat(val);
  if(!Number.isFinite(n)||n<0)n=0;
  b[field]=n; saveBusinessOnly();
}
function saveBusinessOnly(){
  persist();
  if(currentTab==="Focus") tab("Focus");
}
function businessDayPct(d){
  const b=bday(d), total=businessDays[d-1][1].length;
  const done=Object.values(b.tasks||{}).filter(Boolean).length;
  return total?Math.round(done/total*100):0;
}
function businessTotals(){
  const b=businessState(), totals={calls:0,answered:0,leads:0,meetings:0,proposals:0,won:0,expected:0,revenue:incomeTotals().total};
  for(let d=1;d<=30;d++){
    const x=bday(d);
    ["calls","answered","leads","meetings","proposals","won","expected"].forEach(k=>totals[k]+=Number(x[k]||0));
  }
  return totals;
}
function addBusinessLead(){
  const name=(document.getElementById("blName")?.value||"").trim();
  if(!name)return;
  const b=businessState();
  b.leads.push({

    stage:document.getElementById("blStage")?.value||"New",
    next:(document.getElementById("blNext")?.value||""),
    value:parseFloat(document.getElementById("blValue")?.value||0)||0,
    source:(document.getElementById("blSource")?.value||"").trim()
  });
  saveBusinessOnly();
}
function removeBusinessLead(i){businessState().leads.splice(i,1);saveBusinessOnly()}
function addBusinessFollowup(){
  const name=(document.getElementById("fuName")?.value||"").trim();
  const date=document.getElementById("fuDate")?.value||"";
  if(!name||!date)return;
  businessState().followups.push({name,date,note:(document.getElementById("fuNote")?.value||"").trim(),done:false});

}
function toggleFollowup(i){businessState().followups[i].done=!businessState().followups[i].done;saveBusinessOnly()}
function removeFollowup(i){businessState().followups.splice(i,1);saveBusinessOnly()}
function businessSummary(){
  const t=businessTotals(), b=businessState();
  const totalTasks=businessDays.reduce((s,_,i)=>s+businessDays[i][1].length,0);
  const doneTasks=businessDays.reduce((s,_,i)=>s+Object.values(bday(i+1).tasks||{}).filter(Boolean).length,0);
  const pct=totalTasks?Math.round(doneTasks/totalTasks*100):0;
  const conv=t.calls?Math.round(t.won/t.calls*100):0;
  const response=t.calls?Math.round(t.answered/t.calls*100):0;
  return `<div class="card span12"><h3>📊 30-day business summary</h3>
    <div class="business-kpis">
      <div class="business-kpi"><b>${pct}%</b><span>Business plan complete</span></div>
      <div class="business-kpi"><b>${t.calls}</b><span>Calls</span></div>
      <div class="business-kpi"><b>${t.leads}</b><span>Leads</span></div>
      <div class="business-kpi"><b>${t.meetings}</b><span>Meetings</span></div>
      <div class="business-kpi"><b>${t.proposals}</b><span>Proposals</span></div>
      <div class="business-kpi"><b>${t.won}</b><span>Clients won</span></div>
    </div>
    <div class="business-kpis">
      <div class="business-kpi"><b>$${t.revenue.toFixed(0)}</b><span>Revenue received</span></div>
      <div class="business-kpi"><b>$${t.expected.toFixed(0)}</b><span>Expected project value</span></div>
      <div class="business-kpi"><b>${response}%</b><span>Call answer rate</span></div>
      <div class="business-kpi"><b>${conv}%</b><span>Call-to-client rate</span></div>
      <div class="business-kpi"><b>${b.leads.filter(x=>x.stage==="Hot").length}</b><span>Hot leads</span></div>
      <div class="business-kpi"><b>${b.followups.filter(x=>!x.done).length}</b><span>Open follow-ups</span></div>
    </div>
  </div>`;
}

}

const DEFAULT_TAB_ORDER=["Dashboard","Today","Weight Loss","Nutrition","Shopping","Brain Dump","Focus","Summary"];
function orderedTabs(){
  const order=(Array.isArray(state.tabOrder)&&state.tabOrder.length?state.tabOrder:DEFAULT_TAB_ORDER).filter(k=>ALL_TABS.some(t=>t[0]===k));
  ALL_TABS.forEach(t=>{if(!order.includes(t[0]))order.push(t[0]);});
  return order.map(k=>ALL_TABS.find(t=>t[0]===k));
}
function enabledTabList(){
  const set=new Set(state.enabledTabs&&state.enabledTabs.length?state.enabledTabs:ALL_TABS.map(x=>x[0]));
  set.add("Dashboard");
  return orderedTabs().filter(x=>set.has(x[0]));

  const wkTxt=h.freq==="weekly"?`${wk.done}/${h.weekly} this week`:`${wk.done}/${wk.days} this week`;
  const meta=[st==="done"?"✓ done":st==="miss"?"missed today":h.auto?"counts automatically":h.count?(h.count.u?escapeHtml(h.count.u):""):"tap when done",wkTxt,str>1?`🔥 ${str}`:""].filter(Boolean).join(" · ");
  if(h.count&&!h.auto){const v=habCountVal(h);
    return `<div class="hab ${st}"><span class="hab-i">${h.i}</span><span class="hab-t"><b>${escapeHtml(habLabel(h))}</b><span class="small">${meta}</span></span>
     <span class="qty hab-q"><button type="button" onclick="habCount('${h.id}',-1)" aria-label="Less">−</button><b>${v}<span class="small">/${h.count.t}</span></b><button type="button" onclick="habCount('${h.id}',1)" aria-label="More">+</button></span></div>`;}
  return `<button type="button" class="hab ${st}" ${h.auto?`title="Counts automatically"`:`onclick="habCycle('${h.id}')"`} aria-pressed="${st==="done"}"><span class="hab-i">${h.i}</span><span class="hab-t"><b>${escapeHtml(habLabel(h))}</b><span class="small">${meta}</span></span></button>`;
}
function habitsHtml(page){
  page=page||"today";
  const c=h40(), day=h40Day(), L=habList(page).filter(h=>habApplies(h)), doneN=L.filter(h=>{const st=habStatus(h);return st==="done"||st==="rest";}).length;
  const title=page==="today"?"🙏 Sankalp · daily promises":"🙏 Sankalp · Arogya promises";
  if(c.start==null) return `<div class="card span12 hab-card"><div class="card-head"><h3>${title}</h3></div>
    <p class="small">Sankalp is your 40-day resolve. Each day you tick the promises you kept, and your intention is written from them.</p>
    <button class="btn" onclick="h40Start()">Begin my 40-day Sankalp</button>${habAddHtml(page)}</div>`;
  if(day>40) return `<div class="card span12 hab-card"><div class="card-head"><h3>${title}</h3></div>${h40Html()}${habAddHtml(page)}</div>`;
  const run=h40CurrentRun(), open=!!(state.ui&&state.ui.skOpen), locked=run>=4;
  return `<div class="card span12 hab-card"><details class="sk-wrap" ${open?"open":""} ontoggle="skToggle(this.open)">
   <summary><span class="sk-sum"><b>${title}</b><span class="small">Day ${day} of 40 · ${doneN}/${L.length} kept today${run>1?` · 🔥 ${run} days`:""}</span></span></summary>
   ${page==="today"?`<div class="progress" style="margin-top:10px"><div class="bar" style="width:${Math.round(day/40*100)}%"></div></div><p class="small h40-int">🌟 ${escapeHtml(h40Intention())}</p>`:""}
   ${sankalpGrid(page)}
   ${page==="today"?`<div class="row sk-reset"><button class="btn secondary sm" ${locked?"disabled":""} onclick="h40Restart()">↺ Restart from Day 1</button><span class="small">${locked?`Locked while you're on a ${run}-day run. Keep going!`:"Available until you've kept 4 days in a row."}</span></div>`:""}
   ${habAddHtml(page)}</details></div>`;
}

let habForm={open:false,edit:null,page:null,freq:"daily",days:[]};
function habFormFields(h,page){
  const f=habForm, freq=f.freq, days=f.days;
  return `<div class="own-grid hab-grid-form">
    <label class="small">Habit<input type="text" id="habName" value="${escapeAttr(h?h.n:"")}" placeholder="e.g. Drink water before coffee"></label>

    ${h&&h.auto?`<span class="small">Counts automatically</span>`:`<label class="small">How often<select id="habFreq" onchange="habForm.freq=this.value;habKeepForm()"><option value="daily" ${freq==="daily"?"selected":""}>Every day</option><option value="weekly" ${freq==="weekly"?"selected":""}>Times a week</option><option value="days" ${freq==="days"?"selected":""}>Certain days</option></select></label>`}

   </div>
   ${freq==="days"&&!(h&&h.auto)?`<div class="chips wrap hab-days">${weekdayOrder.map(d=>`<button type="button" class="chip ${days.includes(d)?"on":""}" onclick="habToggleDay('${d}')">${d.slice(0,3)}</button>`).join("")}</div>`:""}`;

function habKeepForm(){const g=id=>(document.getElementById(id)||{}).value;habForm.draft={n:g("habName"),i:g("habIcon"),page:g("habPage"),weekly:g("habWeekly"),ct:g("habCountT"),cu:g("habCountU")};habForm.open=true;tab(currentTab);}
function habAddHtml(page){
  const f=habForm, hid=habHidden(), all=habAll();
  const editing=f.edit?habFind(f.edit):null, dr=f.draft||{};
  const base=editing||(dr.n!=null?{n:dr.n,i:dr.i,page:dr.page||page,weekly:Number(dr.weekly)||3,count:dr.ct?{t:Number(dr.ct),u:dr.cu||""}:null}:null);
  const mine=all.filter(h=>h.page===page&&!habDeleted()[h.id]), gone=all.filter(h=>h.page===page&&habDeleted()[h.id]);
  return `<details class="hab-add" ${f.open&&f.page===page?"open":""} ontoggle="if(this.open){habForm.open=true;habForm.page='${page}';}else if(habForm.page==='${page}'){habForm.open=false;}"><summary><b>➕ Add or edit promises</b></summary>
   <h4 style="margin:10px 0 6px">${editing?`Edit: ${escapeHtml(editing.n)}`:"New habit"}</h4>
   ${habFormFields(base,page)}
   <div class="row" style="gap:8px">${editing?`<button class="btn" onclick="habSaveEdit()">Save changes</button><button class="link-btn" onclick="habForm.edit=null;habForm.draft=null;habForm.freq='daily';habForm.days=[];habKeepOpen()">Cancel</button>`:`<button class="btn" onclick="habSaveNew()">Add habit</button>`}</div>
   <h4 style="margin:14px 0 6px">Habits on ${page==="today"?"Today":"Wellness"}</h4>
   <div class="cook-list">${mine.map(h=>`<div class="cook-row ${hid[h.id]?"off":""}"><span><b>${h.i||"•"} ${escapeHtml(h.n)}</b><span class="small">${h.auto?"automatic":h.freq==="weekly"?h.weekly+" a week":h.freq==="days"?(h.days||[]).map(x=>x.slice(0,3)).join(", "):"every day"}${h.own?" · added by you":""}${hid[h.id]?" · hidden":""}</span></span>
     <span class="row" style="gap:6px"><button class="btn secondary sm" onclick="habStartEdit('${h.id}')">✏️ Edit</button>${h.own?"":`<button class="btn secondary sm" onclick="habHide('${h.id}')">${hid[h.id]?"Show":"Hide"}</button>`}<button class="btn secondary sm del" onclick="habDelete('${h.id}')" title="Delete">🗑 Delete</button></span></div>`).join("")}</div>
   ${gone.length?`<p class="small" style="margin-top:8px">Deleted: ${gone.map(h=>`<button class="link-btn" onclick="habRestore('${h.id}')">${h.i} ${escapeHtml(h.n)} · restore</button>`).join(" ")}</p>`:""}
  </details>`;
}
function habKeepOpen(){habForm.open=true;tab(currentTab);}
function habToggleDay(d){habKeepForm();const l=habForm.days,i=l.indexOf(d);if(i>=0)l.splice(i,1);else l.push(d);habForm.open=true;tab(currentTab);}
function habStartEdit(id){const h=habFind(id);if(!h)return;habForm={open:true,page:h.page,edit:id,freq:h.freq||"daily",days:(h.days||[]).slice(),draft:null};tab(currentTab);setTimeout(()=>{const e=document.getElementById("habName");if(e)e.focus();},0);}
function habReadForm(){
  const g=id=>((document.getElementById(id)||{}).value||"").trim();
  const n=g("habName"); if(!n){toast("Give the habit a name");return null;}
  const o={n,i:g("habIcon")||"⭐",page:g("habPage")||habForm.page||"today",freq:habForm.freq};
  if(o.freq==="weekly")o.weekly=Math.max(1,Math.min(7,Number(g("habWeekly"))||3));
  if(o.freq==="days"){if(!habForm.days.length){toast("Pick at least one day");return null;}o.days=habForm.days.slice();}
  return o;
}
function habSaveNew(){const o=habReadForm();if(!o)return;habCustom().push(Object.assign({id:"u"+Date.now(),own:1,kind:"build"},o));habForm={open:true,page:o.page,edit:null,freq:"daily",days:[],draft:null};save();toast("Habit added to "+(o.page==="today"?"Today":"Wellness"));}
function habSaveEdit(){
  const id=habForm.edit, h=habFind(id); if(!h)return;
  const o=habReadForm(); if(!o) return;
  if(h.auto){delete o.freq;delete o.count;delete o.weekly;delete o.days;}
  const own=habCustom().find(x=>x.id===id);
  if(own){Object.assign(own,o);if(o.freq!=="weekly")delete own.weekly;if(o.freq!=="days")delete own.days;}
  else{habEdits()[id]=Object.assign({},habEdits()[id]||{},o);const e=habEdits()[id];if(o.freq&&o.freq!=="weekly")delete e.weekly;if(o.freq&&o.freq!=="days")delete e.days;if(o.count===null)e.count=null;}
  habForm={open:true,page:o.page,edit:null,freq:"daily",days:[],draft:null};save();toast("Habit updated");
}
function habHide(id){const h=habHidden();if(h[id])delete h[id];else h[id]=true;habForm.open=true;save();}
function habDelete(id){const h=habFind(id);if(!h)return;if(!confirm(`Delete "${h.n}"? It will be removed from your Sankalp.`))return;if(h.own)state.customHabits=habCustom().filter(x=>x.id!==id);else habDeleted()[id]=true;habForm.open=true;save();toast("Promise deleted");}
function habRestore(id){delete habDeleted()[id];habForm.open=true;save();toast("Promise restored");}

// ---- 1.5-hour job block (in the focus timer) ----
const JOB_BLOCK_MIN=90;
function startJobBlock(){
  clearInterval(timer); seconds=JOB_BLOCK_MIN*60;
  const show=()=>{const el=document.getElementById("timer");if(el)el.textContent=Math.floor(seconds/3600)+":"+String(Math.floor(seconds%3600/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");};
  show(); toast("1.5-hour job block started"); {const h=habState();if(!h.jobStarted){h.jobStarted=true;persist();const r=document.querySelector(".job-row");if(!r){const t=document.getElementById("timer");const card=t&&t.closest(".card");if(card)card.insertAdjacentHTML("beforeend",jobBlockRow());}}}
  timer=setInterval(()=>{seconds--;show();
    if(seconds===10*60) toast("10 minutes left. Finish the application you're on.");
    if(seconds<=0){clearInterval(timer);const h=habState();h.jobs="done";save();alert("Time's up. Good work today. Stopping on time is a win: save the rest for tomorrow or the 4:30 follow-ups.");}
  },1000);
}
function jobMark(v){const h=habState();h.jobs=h.jobs===v?undefined:v;if(h.jobs===undefined)delete h.jobs;save();}
function jobBlockRow(){const h=habState(),st=h.jobs||"";if(!h.jobStarted&&!st)return "";return `<div class="job-row"><span class="small">Job block:</span><button class="chip xs ${st==="done"?"on":""}" onclick="jobMark('done')">✓ On time</button><button class="chip xs ${st==="slip"?"on-miss":""}" onclick="jobMark('slip')">Went over</button></div>`;}

function wlGapPlan(){
  const T=wlTargets(), tot=wlMealTotals();
  let L=T.kcal-tot.k, R=T.prot-tot.p; const pick=[];
  const used=new Set(WL_SLOTS.flatMap(s=>wlSlotAddons(s).map(a=>a.id)));
  const cands=WL_ADDONS.filter(a=>!used.has(a.id)&&!wlMissing(a).length).sort((a,b)=>b.p/b.k-a.p/a.k);
  for(const a of cands){ if(pick.length>=3||R<=3) break; if(a.k<=L+40&&a.p>=3){pick.push(a);L-=a.k;R-=a.p;} }
  return {pick,L:T.kcal-tot.k,R:T.prot-tot.p};
}

function wlFitCheck(d){
  const T=wlTargets(), k=Number(d.k)||0, p=Number(d.p)||0, c=Number(d.c)||0, f=Number(d.f)||0, fib=Number(d.fib)||0;
  if(!k) return null;
  const share=WL_SHARE[d.slot]||.3, budget=Math.round(T.kcal*share), pneed=Math.round(T.prot*share);
  const notes=[]; let score=0;
  if(k<=budget*1.2){notes.push(["ok",`${k} kcal suits a ${d.slot.toLowerCase()} (about ${budget} planned)`]);score++;} else notes.push(["bad",`${k} kcal is heavy for a ${d.slot.toLowerCase()}; about ${budget} is planned. Try a smaller portion`]);
  const pd=p*4/k;
  if(p>=pneed*.8||pd>=.2){notes.push(["ok",`Good protein: ${p} g`]);score++;} else if(pd>=.12) notes.push(["mid",`Protein is a bit low (${p} g). Pair it with a top-up like curd, egg or paneer`]); else notes.push(["bad",`Low protein (${p} g). It will need a protein side`]);
  const fd=9*f/k;
  if(fd<=.35){notes.push(["ok",`Fat is moderate (${f} g)`]);score++;} else notes.push(["mid",`High in fat (${f} g, ${Math.round(fd*100)}% of calories). Use less oil, ghee or coconut`]);
  if(fib>=5){notes.push(["ok",`Good fibre (${fib} g)`]);score+=.5;}
  const sg=Number(d.s)||0, sLim=Math.max(4,Math.round(T.sugarIdeal*share*1.5));
  if(d.s!==""&&d.s!=null){ if(sg<=sLim) notes.push(["ok",`Free sugar is fine (${sg} g)`]); else {notes.push(["bad",`${sg} g free sugar. That's a lot of your ${T.sugarIdeal} g daily ideal`]);score-=1;} }
  if(p&&c&&f){const calc=4*p+4*c+9*f;if(Math.abs(calc-k)/k>.2) notes.push(["mid",`The numbers don't add up (macros give about ${calc} kcal). Double-check them`]);}
  const verdict=score>=3?["ok","Good fit, add it"]:score>=2?["mid","Fits with a small tweak"]:["bad","Not a great fit as it is"];
  return {verdict,notes};
}

// ---- Restaurant dishes and saved items never appear as "cook at home" suggestions ----
function wlHomeMeals(slot){return wlAllMeals(slot).filter(x=>!x.rest);}

// ---- Extras: anything added to a meal (store items, restaurant dishes, combos, search results) ----
function wlExtras(slot,d){const w=wlState();w.extras=w.extras||{};const k=String(d==null?state.day:d);w.extras[k]=w.extras[k]||{};return w.extras[k][slot]=w.extras[k][slot]||[];}
function wlSnap(x,qty){return {n:x.n+(x.place?` · ${x.place}`:""),k:x.k,p:x.p||0,c:x.c||0,f:x.f||0,s:x.s||0,caf:x.caf||0,qty:qty||1,nr:x.nr?1:0};}
function wlAddExtra(slot,x,qty){
  if(!slot){toast("Choose a meal first");return;}
  const sn=wlSnap(x,qty);wlExtras(slot).push(sn);
  const fq=wlFreq(sn.n);
  wlLastMsg=x.nr?`Not recommended: ${x.why||"high in sugar or fat"}. ${fq.w7>=3||fq.w14>=5?`That's ${fq.w7} times in 7 days, so it's becoming frequent. `:""}${x.swap?"Next time try: "+x.swap+".":""}`:(x.warn?`Good to know: ${x.warn}.`:"");
  save();toast(`Added to ${slot.toLowerCase()}`);
}
function wlDelExtra(slot,i){wlExtras(slot).splice(i,1);save();}
function wlExtrasHtml(slot){
  const l=wlExtras(slot); if(!l.length) return "";
  return `<div class="wl-added">${l.map((x,i)=>`<button type="button" class="chip on ${x.nr?'nr':''}" onclick="wlDelExtra('${slot}',${i})" title="Remove">${x.qty!==1?x.qty+" × ":""}${escapeHtml(x.n)} · ${Math.round(x.k*x.qty)} ✕</button>`).join("")}</div>`;
}
let wlLastMsg="";
// how often an item was logged recently (extras and treats)
function wlFreq(name){
  const w=wlState(), base=String(name).split(" · ")[0].toLowerCase(); let w7=0,w14=0;
  for(let d=state.day-13;d<=state.day;d++){
    let n=0; const ex=(w.extras||{})[String(d)]||{};
    Object.values(ex).forEach(l=>l.forEach(x=>{if(String(x.n).split(" · ")[0].toLowerCase()===base)n++;}));
    ((w.treats||{})[String(d)]||[]).forEach(t=>{if(String(t.n).toLowerCase()===base)n++;});
    w14+=n; if(d>state.day-7) w7+=n;
  }
  return {w7,w14};
}
// what you log most in the last 30 days
function wlFrequent(){
  const w=wlState(), cnt={}, last={};
  for(let d=state.day-29;d<=state.day;d++){
    const ex=(w.extras||{})[String(d)]||{};
    Object.entries(ex).forEach(([sl,l])=>l.forEach(x=>{cnt[x.n]=(cnt[x.n]||0)+1;last[x.n]={slot:sl,x};}));
    const ms=(w.meals||{})[String(d)]||{};
    Object.entries(ms).forEach(([sl,id])=>{const m=wlAllMeals(sl).find(z=>z.id===id);if(m&&sl!=="Breakfast"){cnt[m.n]=(cnt[m.n]||0)+1;last[m.n]={slot:sl,meal:m};}});
  }
  return Object.keys(cnt).filter(n=>cnt[n]>=2).sort((a,b)=>cnt[b]-cnt[a]).slice(0,8).map(n=>Object.assign({n,count:cnt[n]},last[n]));
}
function wlUseFrequent(i){const f=wlFrequent()[i];if(!f)return;if(f.meal){wlDayMeals()[f.slot]=f.meal.id;save();toast(f.slot+" set");}else{wlExtras(f.slot).push(Object.assign({},f.x));save();toast("Added to "+f.slot.toLowerCase());}}

// ---- Fit tag for any item ----
function wlItemFit(x){
  if(x.nr) return ["bad","Not recommended"];
  if(x.warn) return ["mid","Okay, watch it"];
  const k=x.k||0; if(k<=60) return ["ok","Good"];
  const pd=(x.p||0)*4/k, fd=9*(x.f||0)/k;
  if((x.s||0)>12) return ["mid","Sugary"];
  if(k>700) return ["bad","Heavy: cheat day or ½"];
  if(k<=480&&pd>=.25) return ["ok","Good fit"];
  if(k>480||fd>.45) return ["mid","Heavy: have less"];
  if(pd>=.15) return ["ok","Good fit"];
  return ["mid","Low protein"];
}
function wlFitBadge(x){const f=wlItemFit(x);return `<span class="fitb ${f[0]}">${f[0]==="ok"?"✅":f[0]==="mid"?"⚠️":"❌"} ${f[1]}</span>`;}

let wlFind={q:"",slot:"Snack",qty:1};
function wlSearchPool(){
  const w=wlState(), out=[];
  WL_FOODS.forEach(x=>out.push({x,kind:"food"}));
  (w.foods||[]).forEach(x=>out.push({x,kind:"food",mine:1}));
  WL_SLOTS.forEach(s=>wlAllMeals(s).forEach(x=>out.push({x,kind:"meal",slot:s})));
  WL_ADDONS.forEach(x=>out.push({x,kind:"food"}));
  WL_BLOCKS.forEach(x=>out.push({x,kind:"food"}));
  ["treat","meal","drink"].forEach(k=>WL_TREATS[k].forEach(x=>out.push({x,kind:"treat",tk:k})));
  return out;
}
function wlFindHits(q){const seen=new Set();return wlSearchPool().filter(o=>(o.x.n+" "+(o.x.place||"")).toLowerCase().includes(q)).filter(o=>{const k=o.x.n+"|"+(o.x.place||"")+"|"+o.kind;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>(a.x.n.toLowerCase().startsWith(q)?0:1)-(b.x.n.toLowerCase().startsWith(q)?0:1)).slice(0,14);}
function wlFindResults(){
  const q=wlFind.q.trim().toLowerCase();
  if(!q){
    const fr=wlFrequent();
    return fr.length?`<p class="small"><b>My frequent:</b></p><div class="chips wrap">${fr.map((f,i)=>`<button type="button" class="chip" onclick="wlUseFrequent(${i})">${escapeHtml(f.n)} <span class="small">×${f.count}</span></button>`).join("")}</div>`:`<p class="small">Type a food, drink, brand or restaurant: e.g. "chaap", "barebells", "GYG", "coke".</p>`;
  }
  const hits=wlFindHits(q);
  const g=encodeURIComponent(wlFind.q.trim()+" nutrition calories protein");
  return `${hits.map((o,i)=>{const x=o.x,fq=wlFreq(x.n);return `<div class="find-row"><span class="find-n"><b>${escapeHtml(x.n)}</b>${x.place?` <span class="small">· ${escapeHtml(x.place)}</span>`:""}<span class="small">${x.k} kcal · P ${x.p||0} · F ${x.f||0}${x.s?` · sugar ${x.s} g`:""}${x.g?" · check label for gelatine":""}</span>${wlFitBadge(x)}${x.nr&&(fq.w7>=3||fq.w14>=5)?`<span class="small fitb bad">Had ${fq.w7}× this week: becoming frequent</span>`:""}</span>

// ---- Suggested for you: from what's actually been eaten ----
function wlEatenTotals(){
  const e=wlEaten(); let k=0,p=0;
  wlCoffeeItems().forEach(x=>{k+=x.k;p+=x.p;}); wlTreats().forEach(t=>{k+=t.k*t.qty;p+=(t.p||0)*t.qty;});
  WL_SLOTS.forEach(s=>{if(e[s]!=="ate")return;const m=wlMeal(s);if(m){const pf=wlPortion(s);k+=m.k*pf;p+=m.p*pf;}wlSlotAddons(s).forEach(a=>{k+=a.k;p+=a.p;});wlExtras(s).forEach(x=>{k+=x.k*x.qty;p+=x.p*x.qty;});});
  return {k:Math.round(k),p:Math.round(p)};
}
function wlSuggest(slot){
  const T=wlTargets(), E=wlEatenTotals(), e=wlEaten();
  const open=WL_SLOTS.filter(s=>!e[s]); if(!open.includes(slot)) return null;
  const sh=WL_SHARE[slot]/open.reduce((a,s)=>a+WL_SHARE[s],0);
  const budget=Math.max(80,Math.min(T.kcal*WL_SHARE[slot]*1.3,(T.kcal-E.k)*sh)), pneed=Math.max(4,Math.min(slot==="Snack"?15:35,(T.prot-E.p)*sh));
  const meals=wlHomeMeals(slot).filter(x=>!wlMissing(x).length);
  const adds=[null].concat(WL_ADDONS.filter(a=>!a.sauce&&a.p>=3&&!wlMissing(a).length));
  let best=null;
  meals.forEach(m=>adds.forEach(a=>{const k=m.k+(a?a.k:0),p=m.p+(a?a.p:0),f=m.f+(a?a.f:0);
    const score=Math.abs(k-budget)/budget*3+Math.max(0,pneed-p)/pneed*4+Math.max(0,9*f/k-.35)*4+(a?.15:0);
    if(!best||score<best.score)best={m,a,k,p,score};}));
  if(!best) return null;
  return Object.assign(best,{budget:Math.round(budget),pneed:Math.round(pneed),left:T.kcal-E.k,pleft:T.prot-E.p});
}
function wlUseSuggest(slot){const g=wlSuggest(slot);if(!g)return;wlDayMeals()[slot]=g.m.id;if(g.a){const d=wlDayAddons();d[slot]=d[slot]||[];if(!d[slot].includes(g.a.id))d[slot].push(g.a.id);}wlSwap[slot]=false;save();toast(slot+" set");}
function wlSuggestHtml(slot){

  if(cur&&cur.id===g.m.id) return "";
  const why=g.pleft>25?`You're ${g.pleft} g short on protein, so this leans on protein.`:g.left<g.budget?`Only ${Math.max(g.left,0)} kcal left today, so this keeps it light.`:`Fits about ${g.budget} kcal and ${g.pneed} g protein for this meal.`;
  return `<div class="wl-sug"><span class="small"><b>✨ Suggested for you</b> · based on what you've had so far</span>
   <b>${escapeHtml(g.m.n)}${g.a?` + ${escapeHtml(g.a.n.toLowerCase())}`:""}</b><span class="small">${g.k} kcal · ${g.p} g protein · ${why}</span>
   <button class="btn sm" onclick="wlUseSuggest('${slot}')">Use this</button></div>`;
}

let calMonth=null;
function dayActivity(n){
  const rt=dayRoutine(n), done=rt.filter(r=>state.done["routine_"+n+"_"+r.id]).length;
  const frac=rt.length?done/rt.length:0;
  const rec=(state.records&&state.records[n])||{};
  const any=done>0||(state.water&&state.water[n]>0)||Object.keys(rec).some(k=>rec[k]!==""&&rec[k]!=null)||Object.keys(state.done).some(k=>state.done[k]&&k.split("_")[1]===String(n));
  return {frac,done,level:frac>=0.8?3:frac>=0.5?2:any?1:0};
}
function streakInfo(){
  let n=todayDayNumber(), streak=0;
  if(dayActivity(n).level===0) n--; // today not started yet doesn't break the streak
  while(n>=trackStartDay() && dayActivity(n).level>0 && streak<3650){streak++;n--;}
  return streak;
}
function calShift(delta){const base=calMonth||dateForDay(state.day).slice(0,7);let [y,m]=base.split("-").map(Number);m+=delta;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}const nm=y+"-"+String(m).padStart(2,"0");if(state.trackFrom&&nm<state.trackFrom.slice(0,7)){toast("Tracking starts "+niceDate(state.trackFrom));return;}calMonth=nm;render();}
function calendarHtml(){
  const selIso=dateForDay(state.day), todayIso=fmtLocalDate(new Date());
  const base=calMonth||selIso.slice(0,7); const [y,m]=base.split("-").map(Number);
  const first=new Date(y,m-1,1), lead=(first.getDay()+6)%7, dim=new Date(y,m,0).getDate();
  let cells="", active=0, strong=0;
  for(let i=0;i<lead;i++) cells+=`<span class="cal-cell empty"></span>`;
  for(let dd=1;dd<=dim;dd++){
    const iso=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`, n=dayNumberForDate(iso);
    if(state.trackFrom&&iso<state.trackFrom){cells+=`<span class="cal-cell before" aria-hidden="true">${dd}</span>`;continue;}
    const a=dayActivity(n);
    if(a.level>0) active++; if(a.level>=2) strong++;
    cells+=`<button type="button" class="cal-cell l${a.level} ${iso===selIso?'sel':''} ${iso===todayIso?'today':''}" onclick="onSelectDate('${iso}')" aria-label="${niceDate(iso)}">${dd}</button>`;
  }
  const monthName=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  return `<div class="card span12 cal-card">
   <div class="cal-top"><h3>📅 ${monthName}</h3><div class="row"><button class="btn secondary sm" onclick="calShift(-1)" aria-label="Previous month">‹</button><button class="btn secondary sm" onclick="calMonth=null;goToday()">Today</button><button class="btn secondary sm" onclick="calShift(1)" aria-label="Next month">›</button></div></div>
   <div class="cal-stats"><span class="stat"><b>${streakInfo()}</b> day streak</span><span class="stat"><b>${active}</b> active days this month</span><span class="stat"><b>${strong}</b> days with half the routine or more</span></div>
   <div class="cal-grid">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<span class="cal-wd">${w}</span>`).join("")}${cells}</div>
   <div class="cal-legend small"><span><i class="l1"></i>started</span><span><i class="l2"></i>half the routine</span><span><i class="l3"></i>80%+</span></div>
  </div>`;
}

function check(prefix,text){
 let id=text.replace(/[^a-z0-9]/gi,"").slice(0,24);let k=key(prefix,id);
 return `<label class="check"><input type="checkbox" ${state.done[k]?'checked':''} onchange="toggle('${prefix}','${id}')"><span>${text}</span></label>`;

function waterBar(){
  const n=(state.water&&state.water[state.day])||0, goal=8, ml=n*250, pct=Math.min(100,Math.round(n/goal*100));

  return `<div class="card water-top ${n>=goal?'done':''}"><div class="wt-head"><span class="wt-ml">💧 <b>${ml.toLocaleString()}</b> / ${(goal*250).toLocaleString()} ml</span><span class="small">${n>=goal?"Goal reached 🎉":`${goal-n} more glass${goal-n===1?"":"es"} of 250 ml`}</span>
   <span class="wt-btns"><button class="btn secondary sm" aria-label="Remove 250 ml" onclick="state.water[state.day]=Math.max(0,(state.water[state.day]||0)-1);save()">−</button><button class="btn sm" onclick="state.water[state.day]=Math.min(12,(state.water[state.day]||0)+1);save()">+ 250 ml</button></span></div>

function tab(name){

 // Re-read the shared saved state before every page render so changes made on any page are reflected everywhere.
 const saved=localStorage.getItem(dataKey());
 if(saved){try{state=JSON.parse(saved);}catch(e){/* keep current in-memory state if storage is temporarily invalid */}}
 ensureStateDefaults();
 if(name!=="Dashboard" && !enabledTabList().some(x=>x[0]===name)){ render(); return; } // page turned off for this profile
 currentTab=name;
 updateTabHighlight();
 if(name==="Dashboard"){render();return}
 if(name==="Preparation"||name==="Food") name="Nutrition";
 let d=planFor(state.day), body="";
 if(name==="Today") body=todayPage(d);
 if(name==="Nutrition") body=nutritionPage();
 if(name==="Weight Loss") body=weightLossPage();
 if(name==="Summary") body=summaryPage();
 if(name==="Shopping") body=shoppingPage();

 if(name==="Focus") body=focusPage();
 if(name==="Brain Dump") body=brainDumpPriorityPage();
 document.getElementById("app").innerHTML=dayNav()+body+`<p class="back-row"><button class="btn secondary" onclick="render()">← Dashboard</button></p>`;
 window.scrollTo&&name!==lastTabRendered&&window.scrollTo(0,0); lastTabRendered=name;
 if(name==="Focus") setTimeout(updatePomoDisplay,0);
}

let routineEditing=false, quoteShift=0;
function toMin(hhmm){const p=String(hhmm||"0:0").split(":").map(Number);return (p[0]||0)*60+(p[1]||0);}
function fmt12(hhmm){const m=toMin(hhmm);let h=Math.floor(m/60)%24;const mm=String(m%60).padStart(2,"0");const ap=h<12?"am":"pm";h=h%12||12;return h+":"+mm+" "+ap;}
function routineText(a){
  let txt=String(a||"").replace("{chore}",choreOfDay());
  if(/\{chore\}/.test(a||"") && ((state.day%10)+10)%10===1) txt+=" + change bed sheets and towels";
  return txt;
}
function dayRoutine(n){n=(n==null?state.day:n);const d=state.routineByDay&&state.routineByDay[String(n)];return Array.isArray(d)?d:(state.routine||[]);}
function ownDayRoutine(){state.routineByDay=state.routineByDay||{};const k=String(state.day);if(!Array.isArray(state.routineByDay[k]))state.routineByDay[k]=(state.routine||[]).map(r=>({...r}));return state.routineByDay[k];}
function dayHasOwnRoutine(){return !!(state.routineByDay&&Array.isArray(state.routineByDay[String(state.day)]));}
function sortedRoutine(){return [...dayRoutine()].sort((x,y)=>toMin(x.t)-toMin(y.t));}
const ROUTINE_SEGS=[
  {k:"morning",n:"Morning",i:"🌅",from:0,to:12*60},
  {k:"afternoon",n:"Afternoon",i:"☀️",from:12*60,to:17*60},
  {k:"evening",n:"Evening",i:"🌇",from:17*60,to:21*60},
  {k:"night",n:"Night",i:"🌙",from:21*60,to:24*60}
];
let routineOpen={};
function routineSegToggle(k,open){routineOpen[state.day+"_"+k]=open;}
function routineHtml(){
  const rows=sortedRoutine();
  const isToday=dateForDay(state.day)===fmtLocalDate(new Date());
  const now=plannerNowMinutes();
  let nowId=null; if(isToday) rows.forEach(r=>{if(toMin(r.t)<=now) nowId=r.id;});
  const doneN=rows.filter(r=>state.done[key("routine",r.id)]).length;
  const pct=rows.length?Math.round(doneN/rows.length*100):0;
  if(routineEditing){
    return `<div class="card split-left"><div class="card-head"><h3>🗓 Edit routine</h3><button class="btn" onclick="routineToggleEdit()">Done</button></div>
    <p class="small">Change a time or activity and it saves straight away. Use {chore} to show the chore of the day.</p>
    <div class="routine-edit">${rows.map(r=>`<div class="re-row"><input type="time" value="${r.t}" data-id="${r.id}" onchange="routineSet(this.dataset.id,'t',this.value)"><input type="text" value="${escapeAttr(r.a)}" data-id="${r.id}" onchange="routineSet(this.dataset.id,'a',this.value)"><button class="btn secondary" title="Delete" data-id="${r.id}" onclick="routineDelete(this.dataset.id)">✕</button></div>`).join("")}
    <div class="re-row re-new"><input type="time" id="reNewTime" value="12:00"><input type="text" id="reNewText" placeholder="New activity" onkeydown="if(event.key==='Enter'){routineAdd()}"><button class="btn" onclick="routineAdd()">Add</button></div></div>
    <p class="small">Changes here apply to <b>${niceDate(dateForDay(state.day),{weekday:"long",day:"numeric",month:"short"})}</b> only.</p>
    <div class="row"><button class="btn secondary sm" onclick="routineSaveAsDefault()">Use for future days too</button>${dayHasOwnRoutine()?`<button type="button" class="link-btn" onclick="routineResetDay()">Undo this day's changes</button>`:""}</div></div>`;
  }
  // which segment is "now" (or the first unfinished one on other days)
  const segOf=r=>ROUTINE_SEGS.find(s=>toMin(r.t)>=s.from&&toMin(r.t)<s.to)||ROUTINE_SEGS[3];
  const segs=ROUTINE_SEGS.map(s=>({...s,items:rows.filter(r=>segOf(r)===s)})).filter(s=>s.items.length);
  let activeK=null;
  if(isToday){const cur=segs.find(s=>now>=s.from&&now<s.to);activeK=cur?cur.k:null;}
  if(!activeK){const firstOpen=segs.find(s=>s.items.some(r=>!state.done[key("routine",r.id)]));activeK=firstOpen?firstOpen.k:null;}
  const segHtml=segs.map(s=>{
    const d=s.items.filter(r=>state.done[key("routine",r.id)]).length, all=d===s.items.length;
    const ok=state.day+"_"+s.k, open=ok in routineOpen?routineOpen[ok]:true;
    const range=fmt12(s.items[0].t).replace(":00","")+" – "+fmt12(s.items[s.items.length-1].t).replace(":00","");
    return `<details class="rseg ${all?'all':''} ${s.k===activeK&&isToday?'cur':''}" ${open?'open':''} data-k="${s.k}" ontoggle="routineSegToggle(this.dataset.k,this.open)">
      <summary><span class="rseg-ic">${s.i}</span><span class="rseg-name">${s.n}<span class="rseg-range">${range}</span></span><span class="rseg-count ${all?'ok':''}">${all?'✓ ':''}${d}/${s.items.length}</span></summary>
      <ul class="rlist">${s.items.map(r=>{const k=key("routine",r.id),done=!!state.done[k];
        const go=r.go&&r.go!=="Today"?`<button type="button" class="go-btn" onclick="${r.go==="Dashboard"?"render()":`tab('${r.go}')`}">${(r.go==="Nutrition"||r.go==="Preparation")?"Arogya":r.go==="Dashboard"?"Journal":(r.go==="Weight Loss"?"Arogya":r.go)} →</button>`:"";
        return `<li class="${done?'done':''} ${r.id===nowId?'now':''}"><label><input type="checkbox" ${done?'checked':''} onchange="toggle('routine','${r.id}')"><span class="rt">${fmt12(r.t)}</span><span class="ra">${escapeHtml(routineText(r.a))}</span></label>${go}</li>`;}).join("")}</ul>
    </details>`;
  }).join("");
  return `<div class="card split-left routine-card"><details class="routine-fold" ${state.hideRoutine?'':'open'} ontoggle="state.hideRoutine=!this.open;persist()">
  <summary><b>🗓 Dinacharya <span class="small">· today's routine</span></b><button type="button" class="link-btn late-btn" onclick="event.preventDefault();lateStartPrompt()">⏰ Late start</button><span class="small routine-sum"><b>${doneN}</b>/${rows.length} done</span></summary>
  <div class="routine-tools"><div class="routine-progress"><div class="progress"><div class="bar" style="width:${pct}%"></div></div></div><button class="btn secondary sm" onclick="routineToggleEdit()">✏️ Edit</button></div>
  ${segHtml}
  <div class="rq-add"><input type="time" id="rqTime" value="12:00" aria-label="Time"><input type="text" id="rqText" placeholder="Add something to today" onkeydown="if(event.key==='Enter'){routineQuickAdd()}"><button class="btn sm" onclick="routineQuickAdd()">+ Add</button></div>
  ${dayHasOwnRoutine()?`<p class="small rq-note">This day has its own routine. <button type="button" class="link-btn" onclick="routineResetDay()">Go back to usual</button></p>`:""}
  </details></div>`;
}

function artDomain(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}}
function articleRow(a){
  const dom=artDomain(a.url), init=(a.name||dom||"?").trim().charAt(0).toUpperCase();
  const title=a.url?`<a href="${escapeAttr(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a>`:`<span>${escapeHtml(a.name)}</span>`;

  return `<li class="art ${a.read?'read':''}"><span class="art-body">${title}</span>
   <button class="art-tick ${a.read?'on':''}" title="${a.read?'Mark unread':'Mark as read'}" data-id="${a.id}" onclick="articleToggle(this.dataset.id)">✓</button>
   <button class="icon-x" title="Remove" data-id="${a.id}" onclick="articleDelete(this.dataset.id)">✕</button></li>`;

  ${shown.length?(()=>{const per=10,pages=Math.max(1,Math.ceil(shown.length/per));if(artPage>=pages)artPage=pages-1;const slice=shown.slice(artPage*per,artPage*per+per);

  </div>`;

  const dkey=String(state.day);
  if(!state.plannerByDay[dkey]) state.plannerByDay[dkey]=plannerSeed();
  return state.plannerByDay[dkey];
}

    {id:"job1",cat:"job",title:"Focus block 1",desc:"Phone away.",target:90,min:60,tier:2,collapsed:false,
      items:[{id:"j1",text:"Applications",done:false,hidden:false,est:30},{id:"j2",text:"Follow-ups",done:false,hidden:false,est:20},{id:"j3",text:"One real outreach message",done:false,hidden:false,est:10}]},
    {id:"break1",cat:"rest",title:"Short break",desc:"Stretch, water, no scrolling.",target:15,min:5,tier:1,collapsed:false,items:[]},
    {id:"business",cat:"business",title:"Focus block 2",desc:"Deep, focused block — phone away.",target:90,min:60,tier:2,collapsed:false,items:[]},

    {id:"lunch",cat:"rest",title:"Lunch",desc:w.lunch,target:45,min:20,tier:1,collapsed:false,items:[]},
    {id:"job2",cat:"job",title:"Second deep block",desc:"Whichever is behind — job search or business. Phone away again.",target:75,min:45,tier:2,collapsed:false,items:[]},
    {id:"home2",cat:"home",title:"Household tasks 2",desc:"Dinner and the evening reset.",target:45,min:10,tier:1,collapsed:false,
      items:[{id:"weatherChore",text:w.home2,done:false,hidden:false,est:10},{id:"h2",text:"Cook dinner",done:false,hidden:false,est:30},{id:"h3",text:"Clean up (incl. lunch dishes)",done:false,hidden:false,est:15}]}
  ];
  const fixedSum=base.reduce((s,t)=>s+t.target,0);
  const flexTarget=Math.max(PLANNER_FLEX_MIN, PLANNER_DAY_END-plannerToMinutes(wakeTime)-fixedSum);
  base.push({id:"flex",cat:"flex",title:"Open block",desc:"Extra push on the business, family time, or whatever the day needs.",target:flexTarget,min:PLANNER_FLEX_MIN,tier:1,collapsed:false,items:[]});

function plannerApplyWeather(cat){
  const w=PLANNER_WEATHER_TEXT[cat]||PLANNER_WEATHER_TEXT.cloudy, pd=plannerDay();
  const home1=pd.tasks.find(t=>t.id==="home1"); if(home1) home1.desc=w.home1;
  const lunch=pd.tasks.find(t=>t.id==="lunch"); if(lunch) lunch.desc=w.lunch;
  const home2=pd.tasks.find(t=>t.id==="home2");
  if(home2){const wc=home2.items.find(i=>i.id==="weatherChore"); if(wc) wc.text=w.home2;}
}
function plannerCompress(blocks,available){
  const totalTarget=blocks.reduce((s,b)=>s+b.target,0);
  if(totalTarget<=available) return {list:blocks.map(b=>Object.assign({},b,{dur:b.target})),overflow:0};
  let needed=totalTarget-available;
  const dur={}; blocks.forEach(b=>dur[b.id]=b.target);
  function applyReduction(tier,amount){
    const pool=blocks.filter(b=>b.tier===tier && dur[b.id]>b.min);
    const poolReducible=pool.reduce((s,b)=>s+(dur[b.id]-b.min),0);
    if(poolReducible<=0) return amount;
    const actualCut=Math.min(amount,poolReducible);
    pool.forEach(b=>{const share=(dur[b.id]-b.min)/poolReducible; dur[b.id]-=actualCut*share;});
    return amount-actualCut;
  }
  needed=applyReduction(1,needed);
  if(needed>0.5) needed=applyReduction(2,needed);
  const overflow=needed>0.5?needed:0;
  return {list:blocks.map(b=>Object.assign({},b,{dur:Math.max(b.min,Math.round(dur[b.id]/5)*5)})),overflow};
}
function plannerCompute(){
  const pd=plannerDay();
  let cursor=plannerToMinutes(pd.wakeTime);
  const doneList=[],remaining=[];
  pd.tasks.forEach(t=>{
    if(t.done){
      const end=(t.actualEnd!=null)?t.actualEnd:cursor+t.target;
      cursor=Math.max(cursor,end);
      doneList.push(Object.assign({},t,{start:cursor,end:end}));
    } else remaining.push(t);
  });
  if(pd.tasks.some(t=>t.done)){const now=plannerNowMinutes(); if(now>cursor) cursor=now;}
  const available=PLANNER_DAY_END-cursor;
  const {list,overflow}=plannerCompress(remaining,Math.max(available,0));
  let t2=cursor; list.forEach(b=>{b.start=t2;b.end=t2+b.dur;t2=b.end;});
  return {doneList,pendingList:list,overflow};
}
function plannerRestAlert(doneList,pendingList){
  const doneRest=doneList.find(b=>b.restFlag);
  if(doneRest) return doneRest.end>23*60 ? ("Wind-down finished at "+plannerFormatTime(doneRest.end)+" — later than ideal for rest.") : null;
  const pendRest=pendingList.find(b=>b.restFlag);
  if(pendRest){
    if(pendRest.dur<pendRest.target) return "Wind-down is trimmed to "+pendRest.dur+" min (planned "+pendRest.target+") and lands around "+plannerFormatTime(pendRest.start)+" — today's tight on rest.";
    if(pendRest.end>22*60+30) return "Wind-down runs until "+plannerFormatTime(pendRest.end)+" tonight — later than your usual bedtime target.";
  }
  return null;
}

      <td><button type="button" class="sub-hide" title="Hide this subtask" onclick="plannerToggleItemHidden('${b.id}','${it.id}')">🙈</button></td>
      <td><input type="checkbox" ${it.done?"checked":""} onchange="plannerToggleItem('${b.id}','${it.id}')"></td>

  const hiddenNote=hiddenCount?`<p class="small" style="margin-top:6px">${hiddenCount} subtask${hiddenCount>1?"s":""} hidden. <button type="button" class="subtask-toggle" style="margin:0" onclick="plannerUnhideAllItems('${b.id}')">Show hidden</button></p>`:"";
  return `<div class="plan-items">
    <button type="button" class="subtask-toggle" onclick="plannerToggleCollapse('${b.id}')">${toggleLabel}</button>
    <table class="subtask-table">
      <thead><tr><th></th><th></th><th>Activity</th><th>Suggested</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="small">No subtasks yet.</td></tr>'}</tbody>
      ${visible.length?('<tfoot><tr><td></td><td></td><td><b>Suggested time to complete</b></td><td colspan="2"><b>'+total+' min</b></td></tr></tfoot>'):""}
    </table>
    ${hiddenNote}
    <div class="row" style="margin-top:8px">
      <input type="text" id="subText_${b.id}" class="plan-add-sub" placeholder="Add a subtask…" style="flex:1" onkeydown="if(event.key==='Enter'){plannerAddItem('${b.id}');event.preventDefault();}">
      <input type="number" id="subMin_${b.id}" value="10" min="0" step="5" style="width:64px">
      <button type="button" class="btn secondary" onclick="plannerAddItem('${b.id}')">Add</button>
    </div>
  </div>`;
}
function plannerBlockRow(b,isDone,idx,total){
  const isPending=plannerPendingConfirm===b.id;

  const badge=b.tier===2?'<span class="plan-badge">focus block</span>':(b.restFlag?'<span class="plan-badge">wind down</span>':"");
  const orderCol=isDone?"":`<div class="plan-order">
      <button type="button" onclick="plannerMove('${b.id}','up')" ${idx===0?"disabled":""}>▲</button>
      <button type="button" onclick="plannerMove('${b.id}','down')" ${idx===total-1?"disabled":""}>▼</button>
    </div>`;
  const timeCol=isDone
    ? `<div class="plan-time-big">from ${plannerFormatTime(b.start)}<input type="time" value="${plannerMinutesToHHMM(b.end)}" onchange="plannerSetActualEnd('${b.id}',this.value)"></div>`
    : `<div class="plan-time-big">${plannerFormatTime(b.start)}<br>–${plannerFormatTime(b.end)}</div>`;
  const targetRow=isDone?"":`<div class="plan-target">Planned<input type="number" min="5" step="5" value="${b.target}" onchange="plannerSetTarget('${b.id}',this.value)">min</div>`;
  const confirmRow=isPending?`<div class="plan-confirm">
      <span>Finished at</span>
      <input type="time" class="confirm-time" data-confirm-id="${b.id}" value="${plannerMinutesToHHMM(plannerNowMinutes())}">
      <button type="button" class="btn" onclick="plannerConfirmDone('${b.id}')">Confirm</button>
      <button type="button" class="btn secondary" onclick="plannerCancelConfirm()">Cancel</button>
    </div>`:"";
  return `<div class="plan-task ${isDone?'plan-done':''}">
    <div class="plan-top">
      ${orderCol}
      ${timeCol}
      <div class="plan-body">
        <div class="plan-title-row">
          <span>${emoji}</span>
          <input type="text" class="plan-title-edit" value="${escapeAttr(b.title)}" onchange="plannerSetTitle('${b.id}',this.value)">
          ${badge}
        </div>
        <p class="small">${escapeHtml(b.desc||"")}</p>

}
function plannerHtml(){
  const pd=plannerDay();
  const {doneList,pendingList,overflow}=plannerCompute();
  const restMsg=plannerRestAlert(doneList,pendingList);
  let statusHtml="";
  if(restMsg) statusHtml=`<div class="alert" style="margin:10px 0"><b>Rest check:</b> ${escapeHtml(restMsg)}</div>`;
  else if(overflow>0) statusHtml=`<div class="alert" style="margin:10px 0">Today's tight — everything is trimmed to its minimum and it still runs about ${Math.round(overflow)} min past 9:30pm.</div>`;
  let rows="";
  doneList.forEach(b=>{rows+=plannerBlockRow(b,true,0,0);});
  pendingList.forEach((b,i)=>{rows+=plannerBlockRow(b,false,i,pendingList.length);});
  const rest=pd.tasks.find(t=>t.restFlag);
  let recapHtml="";
  if(rest && rest.done){
    const missed=pd.tasks.filter(t=>!t.restFlag && !t.done).map(t=>t.title);
    recapHtml=missed.length
      ? `<div class="plan-recap">Didn't get to today: ${missed.map(escapeHtml).join(", ")}.</div>`
      : `<div class="plan-recap">Everything on today's list got done. 🎉</div>`;
  }
  return `<div class="card span12">
    <h3>🕐 Wake &amp; weather</h3>
    <div class="plan-head">
      <div><label class="small">Woke up at</label><br><input type="time" value="${pd.wakeTime}" onchange="plannerSetWake(this.value)"></div>
      <div><label class="small">Weather today</label><br><select onchange="plannerSetWeather(this.value)">
        ${["sunny","cloudy","rainy","hot","cold"].map(w=>`<option value="${w}" ${pd.weather===w?"selected":""}>${w[0].toUpperCase()+w.slice(1)}</option>`).join("")}
      </select></div>
      <button class="btn secondary" type="button" onclick="plannerFetchWeather()">🌤 Use live weather</button>
    </div>
    <p class="small" id="plannerWeatherNote" style="margin-top:10px">${pd.weatherManual?"Set manually.":"Tap “Use live weather” to auto-detect, or just pick it above."}</p>
  </div>
  <div class="card span12">
    <details ${pd.flowOpen!==false?"open":""} ontoggle="plannerSetFlowOpen(this.open)">
      <summary style="cursor:pointer"><b>📋 Today's flow</b></summary>
      <div style="margin-top:12px">
        <div class="row" style="margin-bottom:10px">
          <button class="btn secondary" type="button" onclick="plannerSetAllCollapsed(true)">Hide all subtasks</button>
          <button class="btn secondary" type="button" onclick="plannerSetAllCollapsed(false)">Show all subtasks</button>
        </div>
        ${statusHtml}
        ${rows}
        <div class="plan-task" style="border-style:dashed">
          <h4 style="margin:0 0 10px">➕ Add a task</h4>
          <div class="row">
            <input type="text" id="plannerNewTitle" placeholder="Task name" style="flex:1">
            <input type="number" id="plannerNewMinutes" value="30" min="5" step="5" style="width:80px">
            <button class="btn" type="button" onclick="plannerAddTask()">Add</button>
          </div>
        </div>
        ${recapHtml}
        <p class="small">Use ▲▼ to reorder anything not done yet. Check a task off, confirm what time it actually finished, and everything after it re-times itself. <button type="button" style="background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px" onclick="plannerResetToday()">Reset today's plan</button></p>
      </div>
    </details>
  </div>`;
}
function plannerSetWake(v){const pd=plannerDay();pd.wakeTime=v||"07:00";save();}
function plannerSetTitle(id,val){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===id); if(!t) return;
  const v=(val||"").trim();
  t.title=v||t.title;
  save();
}
function plannerSetWeather(v){const pd=plannerDay();pd.weather=v;pd.weatherManual=true;plannerApplyWeather(v);save();}
function plannerSetTarget(id,v){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===id); if(!t) return;
  let n=parseInt(v,10); if(isNaN(n)||n<5) n=5;
  t.target=n; if(t.min>t.target) t.min=t.target;
  save();
}
function plannerSetActualEnd(id,v){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===id); if(!t||!v) return;
  t.actualEnd=plannerToMinutes(v); save();
}
function plannerMove(id,dir){
  const pd=plannerDay(); const idx=pd.tasks.findIndex(t=>t.id===id); if(idx===-1) return;
  const swap=dir==="up"?idx-1:idx+1; if(swap<0||swap>=pd.tasks.length) return;
  const tmp=pd.tasks[idx]; pd.tasks[idx]=pd.tasks[swap]; pd.tasks[swap]=tmp;
  save();
}
function plannerToggleItem(taskId,itemId){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===taskId); if(!t) return;
  const it=(t.items||[]).find(i=>i.id===itemId); if(it) it.done=!it.done;
  save();
}
function plannerSetItemEst(taskId,itemId,val){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===taskId); if(!t) return;
  const it=(t.items||[]).find(i=>i.id===itemId); if(!it) return;
  let n=parseInt(val,10); if(isNaN(n)||n<0) n=0;
  it.est=n; save();
}
function plannerDeleteItem(taskId,itemId){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===taskId); if(!t) return;
  t.items=(t.items||[]).filter(i=>i.id!==itemId);
  save();
}
function plannerToggleItemHidden(taskId,itemId){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===taskId); if(!t) return;
  const it=(t.items||[]).find(i=>i.id===itemId); if(!it) return;
  it.hidden=!it.hidden; save();
}
function plannerUnhideAllItems(taskId){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===taskId); if(!t) return;
  (t.items||[]).forEach(it=>it.hidden=false);
  save();
}
function plannerToggleCollapse(taskId){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===taskId); if(!t) return;
  t.collapsed=!t.collapsed; save();
}
function plannerSetAllCollapsed(val){
  const pd=plannerDay();
  pd.tasks.forEach(t=>{ t.collapsed=val; });
  save();
}
function plannerSetFlowOpen(val){
  const pd=plannerDay();
  pd.flowOpen=!!val;
  persist(); // quiet save — the browser already toggled the details natively, no need to re-render
}
function plannerAddItem(taskId){
  const textEl=document.getElementById("subText_"+taskId), minEl=document.getElementById("subMin_"+taskId);
  const text=(textEl.value||"").trim(); if(!text) return;
  let est=parseInt(minEl.value,10); if(isNaN(est)||est<0) est=0;
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===taskId); if(!t) return;
  t.items=t.items||[]; t.items.push({id:"i"+Date.now(),text,done:false,hidden:false,est});
  save();
}
function plannerAddTask(){
  const titleEl=document.getElementById("plannerNewTitle"),minEl=document.getElementById("plannerNewMinutes");
  const title=(titleEl.value||"").trim(); if(!title) return;
  let mins=parseInt(minEl.value,10); if(isNaN(mins)||mins<5) mins=5;
  const pd=plannerDay();
  const task={id:"custom"+Date.now(),cat:"custom",title,desc:"",target:mins,min:Math.max(10,Math.round(mins/2)),tier:1,collapsed:false,items:[],done:false,actualEnd:null};
  const restIdx=pd.tasks.findIndex(t=>t.restFlag);
  if(restIdx===-1) pd.tasks.push(task); else pd.tasks.splice(restIdx,0,task);
  save();
}
function plannerToggleDone(id){
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.done){ plannerPendingConfirm=id; tab("Today"); }
  else { t.done=false; t.actualEnd=null; if(plannerPendingConfirm===id) plannerPendingConfirm=null; save(); }
}
function plannerConfirmDone(id){
  const timeEl=document.querySelector('.confirm-time[data-confirm-id="'+id+'"]');
  if(!timeEl||!timeEl.value) return;
  const pd=plannerDay(),t=pd.tasks.find(x=>x.id===id); if(!t) return;
  t.done=true; t.actualEnd=plannerToMinutes(timeEl.value); plannerPendingConfirm=null;
  save();
}
function plannerCancelConfirm(){ plannerPendingConfirm=null; tab("Today"); }
async function plannerFetchWeather(){
  const noteEl=document.getElementById("plannerWeatherNote");
  if(noteEl) noteEl.textContent="Checking local weather…";
  try{
    const coords=await new Promise((resolve)=>{
      if(!navigator.geolocation){resolve({lat:-37.8136,lon:144.9631});return;}
      const timer=setTimeout(()=>resolve({lat:-37.8136,lon:144.9631}),4000);
      navigator.geolocation.getCurrentPosition(
        pos=>{clearTimeout(timer);resolve({lat:pos.coords.latitude,lon:pos.coords.longitude});},
        ()=>{clearTimeout(timer);resolve({lat:-37.8136,lon:144.9631});},
        {timeout:3800}
      );
    });
    const url="https://api.open-meteo.com/v1/forecast?latitude="+coords.lat+"&longitude="+coords.lon+"&current_weather=true&temperature_unit=celsius";
    const res=await fetch(url);
    if(!res.ok) throw new Error("bad response");
    const data=await res.json();
    const cw=data.current_weather;
    const isRain=(cw.weathercode>=51&&cw.weathercode<=67)||(cw.weathercode>=80&&cw.weathercode<=82)||(cw.weathercode>=95);
    let cat; if(isRain) cat="rainy"; else if(cw.temperature>=29) cat="hot"; else if(cw.temperature<=11) cat="cold"; else if(cw.weathercode<=1) cat="sunny"; else cat="cloudy";
    const pd=plannerDay(); pd.weather=cat; pd.weatherManual=false; plannerApplyWeather(cat);
    save();
    const noteEl2=document.getElementById("plannerWeatherNote");
    if(noteEl2) noteEl2.textContent=Math.round(cw.temperature)+"°C. "+(WALK_TIP[cat]||"");
  }catch(e){
    if(noteEl) noteEl.textContent="Couldn't get live weather — set it manually.";
  }
}
function plannerResetToday(){
  if(!confirm("Reset this day's plan? This clears wake time, weather, and all tasks/checklists for "+dateForDay(state.day)+".")) return;
  state.plannerByDay=state.plannerByDay||{};
  state.plannerByDay[String(state.day)]=plannerSeed();
  plannerPendingConfirm=null;
  save();
}

const brainDumpCategories=["To call","To email","New idea","To research"];
function brainDumpMigrate(){
  // Older items did not have a day. Keep them with the day that was active when this version first opens.
  let changed=false;
  (state.brainDump||[]).forEach(it=>{
    if(!it.day){it.day=state.day;changed=true;}
  });
  if(changed)persist();
}
function addBrainDump(){
  const el=document.getElementById("bdInput");
  const catEl=document.getElementById("bdCategory");
  const v=(el&&el.value||"").trim();

function escapeAttr(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;");}
function addCategory(){

function renameCategory(oldName){
  const val=((window.prompt(`Rename category "${oldName}" to:`,oldName))||"").trim();
  if(!val||val===oldName)return;
  const clash=allBaseCategories().some(c=>c.toLowerCase()===val.toLowerCase()&&c.toLowerCase()!==oldName.toLowerCase());
  if(clash){alert(`A category named "${val}" already exists.`);return;}
  Object.keys(state.itemCategories).forEach(item=>{if(state.itemCategories[item]===oldName)state.itemCategories[item]=val;});
  if(Object.keys(shoppingCatalog).includes(oldName)){
    shoppingCatalog[oldName].forEach(it=>{if(!state.itemCategories[it])state.itemCategories[it]=val;});
  }
  if(state.customCategories.includes(oldName)){
    state.customCategories=state.customCategories.map(c=>c===oldName?val:c);
  }else if(!state.customCategories.includes(val)){
    state.customCategories.push(val);
  }
  save();
}
