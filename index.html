    <p class="small"><b>${profileId}</b> · ${fbReady? "☁️ connected":"📴 offline"} · saved ${formatLastSaved(state.lastSaved)}</p>
    <div class="pc-actions" style="margin:6px 0 14px">
      <button type="button" class="btn secondary" onclick="cloudResyncNow(true)">🔄 Sync now</button>
      <button type="button" class="btn secondary" onclick="manualSaveHeader();acctMsg('Saved ✓',false)">💾 Save now</button>
      <button type="button" class="btn secondary" ${undoStack.length?'':'disabled'} onclick="performUndo();openAccountPanel()">↺ Undo (${undoStack.length})</button>
    </div>

    <h4 style="margin:4px 0 4px">Backup</h4>
    <div class="pc-actions">
      <button type="button" class="btn secondary" onclick="exportBackup()">⇧ Export</button>
      <button type="button" class="btn secondary" onclick="triggerImport()">⇩ Import</button>
    </div>

    <h4 style="margin:12px 0 4px">Switch profile</h4>
    <input type="text" id="acctSwitchInput" placeholder="e.g. family-name">
    <div class="pc-actions">
      <button type="button" class="btn secondary" onclick="switchProfileFromInput()">Switch</button>
      <button type="button" class="btn secondary" onclick="closeAccountPanel();showProfilePicker({mode:'switch'})">Browse profiles</button>
    </div>

    <h4 style="margin:16px 0 4px">📅 Start date</h4>
    <input type="date" id="acctStartDate" value="${trackStartDate()}">
    <div class="pc-actions">
      <button type="button" class="btn secondary" onclick="resetTrackStartDate()">Set start date</button>
    </div>
    <p class="small pc-msg" id="startDateMsg"></p>

    <h4 style="margin:16px 0 4px">⚠️ Reset</h4>
    <p class="small">Clears this profile's daily tracking only. Can't be undone.</p>
    <div class="pc-actions">
      <button type="button" class="btn secondary" onclick="resetCalendar()" style="color:#b23b3b;border-color:#f0dada">Reset</button>
    </div>

    <div class="pc-actions" style="margin-top:14px">
      <button type="button" class="btn secondary" onclick="managePasscode()" title="Login and passcode">🔒 Passcode</button>
    </div>
    <button type="button" class="link-btn" style="margin-top:14px" onclick="closeAccountPanel()">Close</button>
  </div>`;
  el.addEventListener("click", e=>{ if(e.target===el) el.remove(); });
  document.body.appendChild(el);
}
/* Per-day data is stored under keys relative to Day 1 (e.g. "d12"), not under the actual
   calendar date — so when the start date moves, every one of those keys has to move with it,
   by the same number of days, or old entries would silently resurface under the new Day 1
   onward instead of staying put on the dates they were actually recorded for. */
const DAY_KEYED_FIELDS = ["days","checkins","meals","water","move","journal","foodLog","coffeeLog","pomodoro","gapDecisions"];
function shiftDayKeyedData(shift){
  if(!shift) return;
  DAY_KEYED_FIELDS.forEach(f=>{
    const src = state[f]; if(!src || typeof src!=="object" || Array.isArray(src)) return;
    const out = {};
    Object.keys(src).forEach(k=>{
      const m = /^d(-?\d+)$/.exec(k);
      if(!m){ out[k] = src[k]; return; }
      out["d"+(parseInt(m[1],10)+shift)] = src[k];
    });
    state[f] = out;
  });
  if(state.exercisePlanDone && typeof state.exercisePlanDone==="object"){
    const out = {};
    Object.keys(state.exercisePlanDone).forEach(k=>{
      const n = parseInt(k,10);
      if(Number.isNaN(n)){ out[k] = state.exercisePlanDone[k]; return; }
      out[String(n+shift)] = state.exercisePlanDone[k];
    });
    state.exercisePlanDone = out;
  }
  if(Array.isArray(state.brainDump)){
    state.brainDump = state.brainDump.map(it => (it && typeof it.day==="number") ? {...it, day: it.day+shift} : it);
  }
}
function startDateMsg(t, bad){ const m=document.getElementById("startDateMsg"); if(m){ m.textContent=t; m.className="small pc-msg"+(bad?" bad":" good"); } }
function resetTrackStartDate(){
  try{
    const v = (document.getElementById("acctStartDate")||{}).value || "";
    if(!v){ startDateMsg("Pick a date first.", true); return; }
    if(v===trackStartDate()){ startDateMsg("That's already the start date.", true); return; }
    if(!confirm("Set \""+v+"\" as the tracker's start date?\n\nDay 1 and the calendar will now count from here. Your saved day entries move with it so they stay tied to the same real dates — nothing is deleted — but anything before "+v+" will no longer be reachable. Recipes/custom foods and your To-read list are unaffected.")) return;
    const oldStart = trackStartDate();
    const shift = Math.round((new Date(oldStart+"T00:00:00") - new Date(v+"T00:00:00"))/86400000);
    shiftDayKeyedData(shift);
    state.startDate = v;
    selectedDay = Math.max(1, dayNumberFor(todayISO()));
    calMonthOffset = 0;
    // Persist the new start date under the currently active profile before refreshing UI.
    save();
    toast("Start date set to "+niceDate(v,{day:"numeric",month:"short",year:"numeric"})+" — earlier days are now locked ✓");
    closeAccountPanel();
    render();
    openAccountPanel();
    startDateMsg("Set to "+v+" ✓ — days before this are now locked.", false);
  }catch(e){
    console.error("resetTrackStartDate failed:", e);
    try{ save(); }catch(e2){}
    alert("Start date was updated, but something went wrong refreshing the view. Reopening the app should fix it.");
  }
}
/* ---- destructive resets, both scoped to the CURRENT profile only — works for Guest too, same
   as every other profile; nothing here special-cases GUEST_ID. ---- */
const CALENDAR_RESET_KEYS = ["days","checkins","meals","water","move","journal","foodLog","coffeeLog","exercisePlanDone","gapDecisions","adhocTasks","adhocDone","parallelActivities","pomodoro","foodFreq","weight","brainDump"];
const CALENDAR_RESET_ARRAY_KEYS = ["weight","brainDump","adhocTasks"]; // these are arrays in defaultState(); everything else in the list is an object
function resetCalendar(){
  try{
    if(!confirm("Reset?\n\nThis permanently deletes ALL daily tracking for this profile — every day's timeline, check-ins, meals/water/move logs, journal entries, weight log, and your Sankalp progress.\n\nYour tracker start date stays as it is — this doesn't change it.\n\nKept: recipes/custom foods, your To-read list, and your business plan/pipeline/income.\n\nThis can't be undone.")) return;
    CALENDAR_RESET_KEYS.forEach(k=>{ state[k] = CALENDAR_RESET_ARRAY_KEYS.includes(k) ? [] : {}; });
    state.sankalp = {text:"", startDay:1, done:{}};
    selectedDay = Math.max(1, todayDayNum());
    calMonthOffset = 0;
    save();
    toast("Reset — all daily tracking cleared, start date unchanged");
    closeAccountPanel();
  }catch(e){
    console.error("resetCalendar failed:", e);
    try{ save(); }catch(e2){}
    alert("Data was cleared, but something went wrong refreshing the view. Reopening the app should fix it.");
    closeAccountPanel();
  }
}
/* ---- standalone Passcode overlay — opened only when the 🔒 icon in the Account panel is
   tapped, kept out of the main panel so that panel isn't cluttered with passcode fields by
   default (matches old.html's managePasscode() pattern). Guest is shared and never
   passcode-protected, so it's blocked here rather than inside the Account panel. ---- */
function pcMsg(t, bad){ const m=document.getElementById("pcMsg"); if(m){ m.textContent=t; m.className="small pc-msg"+(bad?" bad":" good"); } }
function closePasscodeOverlay(){ const el=document.getElementById("pcOverlay"); if(el) el.remove(); }
async function managePasscode(){
  if(profileId===GUEST_ID){ toast("The shared Guest profile has no passcode", true); return; }
  const meta = await pcFetchMeta();
  const has = !!(meta && meta.passcodeHash);
  const old = document.getElementById("pcOverlay"); if(old) old.remove();
  const el = document.createElement("div");
  el.id = "pcOverlay"; el.className = "pc-overlay";
  el.innerHTML = `<div class="pc-box" role="dialog" aria-modal="true" aria-labelledby="pcTitle">
    <h3 id="pcTitle">🔒 Login and passcode</h3>
    <p class="small">Tracker: <b>${escapeHtml(profileId)}</b> · ${has? "passcode is on":"no passcode set"}</p>
    ${has? `<label class="small">Current passcode<input type="password" id="pcCur" autocomplete="current-password"></label>`:""}
    <label class="small">${has? "New passcode":"Passcode"}<input type="password" id="pcNew" autocomplete="new-password" placeholder="At least 4 characters"></label>
    <label class="small">Type it again<input type="password" id="pcNew2" autocomplete="new-password"></label>
    <p class="small pc-msg" id="pcMsg"></p>
    <div class="pc-actions">
      <button type="button" class="btn" onclick="pcSetNew(${has})">${has? "Change passcode":"Set passcode"}</button>
      ${has? `<button type="button" class="btn secondary" onclick="pcRemoveNow()">Remove passcode</button><button type="button" class="btn secondary" onclick="lockNowFromAccount()">Lock now</button>`:""}
      <button type="button" class="link-btn" onclick="closePasscodeOverlay()">Close</button>
    </div>
  </div>`;
  el.addEventListener("click", e=>{ if(e.target===el) el.remove(); });
  document.body.appendChild(el);
  setTimeout(()=>{ const f=document.getElementById(has? "pcCur":"pcNew"); if(f) f.focus(); }, 0);
}
async function pcSetNew(has){
  const n1 = (document.getElementById("pcNew")||{}).value || "";
  const n2 = (document.getElementById("pcNew2")||{}).value || "";
  if(has){
    const meta = await pcFetchMeta();
    const cur = (document.getElementById("pcCur")||{}).value || "";
    if(!(meta && meta.passcodeHash) || hashPasscode(cur) !== meta.passcodeHash){ pcMsg("Current passcode isn't right.", true); return; }
  }
  if(n1.length < 4){ pcMsg("Use at least 4 characters.", true); return; }
  if(n1 !== n2){ pcMsg("The two passcodes don't match.", true); return; }
  if(!fbReady){ pcMsg("You're offline — connect to set a passcode.", true); return; }
  const hash = hashPasscode(n1);
  try{ await firebase.database().ref("adhdPlannerProfiles/"+profileId).set({passcodeHash:hash}); }
  catch(e){ pcMsg("Couldn't save — check your connection.", true); return; }
  try{ localStorage.setItem(pcLocalKey(), hash); }catch(e){}
  locallyKnownPcHash = hash;
  startSession();
  pcMsg(has? "Passcode changed ✓" : "Passcode set ✓", false);
  toast(has? "Passcode changed" : "Passcode set");
  setTimeout(closePasscodeOverlay, 900);
}
async function pcRemoveNow(){
  const meta = await pcFetchMeta();
  const has = !!(meta && meta.passcodeHash);
  if(has){
    const cur = (document.getElementById("pcCur")||{}).value || "";
    if(hashPasscode(cur) !== meta.passcodeHash){ pcMsg("Current passcode isn't right.", true); return; }
  }
  if(!confirm("Remove the passcode? Anyone with this link will be able to open the app.")) return;
  if(!fbReady){ pcMsg("You're offline — connect to remove the passcode.", true); return; }
  try{ await firebase.database().ref("adhdPlannerProfiles/"+profileId).remove(); }
  catch(e){ pcMsg("Couldn't save — check your connection.", true); return; }
  try{ localStorage.removeItem(pcLocalKey()); }catch(e){}
  locallyKnownPcHash = null;
  endSession();
  pcMsg("Passcode removed ✓", false);
  toast("Passcode removed");
  setTimeout(closePasscodeOverlay, 900);
}
function lockNowFromAccount(){
  endSession();
  closePasscodeOverlay();
  closeAccountPanel();
  appLocked = true;
  showLockScreen();
}
function exportBackup(){
  save();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=fmtLocal(new Date());
  a.href=url;a.download="dinacharya-backup-"+profileId+"-"+stamp+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){ const el=document.getElementById("importFile"); if(el) el.click(); }
function importBackup(evt){
  const file=evt.target.files&&evt.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const incoming=JSON.parse(e.target.result);
      if(!confirm("Import this backup? It will replace everything currently on this profile.")) return;
      state=Object.assign({}, defaultState(), incoming);
      saveLocalOnly();
      pushToFirebase();
      location.reload();
    }catch(err){
      alert("That file doesn't look like a valid backup (couldn't be read as JSON).");
    }
  };
  reader.readAsText(file);
  evt.target.value="";
}
function switchProfileFromInput(){
  const v = (document.getElementById("acctSwitchInput")||{}).value || "";
  const id = sanitizeProfileId(v);
  if(!id){ acctMsg("Enter a name for the new profile.", true); return; }
  if(id === profileId){ acctMsg("That's already the current profile.", true); return; }
  if(!confirm("Switch to tracker \""+id+"\"? The app will reload.")) return;
  localStorage.setItem("dinacharya_profileId", id);
  location.reload();
}

showProfilePicker(); // ask which tracker to open every time the app opens, then (via confirmProfile) the passcode lock before entering
setInterval(()=>cloudResyncNow(false), 15*60*1000);
</script>
