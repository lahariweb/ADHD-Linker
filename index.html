<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soham</title>
<meta name="theme-color" content="#17121f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f6f3ec; --card:#fffefa; --ink:#2a2740; --muted:#73708a;
--accent:#3d4a8a; --accent-2:#232150; --soft:#e6e3f2; --mint:#eceaf7;
--line:#dcd8ea; --gold:#c9ae77; --warn:#8a5a2e; --rest-bg:#eceaf2;
--turquoise:#4a7a8a; --indigo:#6a4a8a;
--glass-bg:linear-gradient(165deg,rgba(255,253,245,.9),rgba(255,247,222,.78));
--glass-border:rgba(201,174,119,.4);
--glass-glow:0 0 0 1px rgba(255,255,255,.5) inset,0 2px 18px rgba(201,174,119,.14);
--glass-glow-hover:0 0 0 1px rgba(255,255,255,.6) inset,0 4px 26px rgba(201,174,119,.26);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 "Nunito Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:500;letter-spacing:-.015em;margin:0 0 6px;color:var(--accent-2)}
button,input,select,textarea{font-family:inherit}
.bg-wm{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.055;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg-wm svg{width:150vmin;height:150vmin;transition:opacity .4s}
.bg-wm svg *{stroke:#40364f}
header,main,.pc-overlay{position:relative;z-index:1}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ===== Header / nest nav ===== */
header{background:radial-gradient(ellipse at 15% -20%,#32263f 0%,transparent 50%),linear-gradient(150deg,#17141f 0%,#17141f 55%,#32263f 100%);padding:0 0 0;color:#d8c8f1;position:sticky;top:0;z-index:30;box-shadow:0 6px 24px #1c1a3d2e,0 1px 0 rgba(228,194,102,.25)}
.hdr-inner{padding:18px 0 0}
.hdr-trim{height:9px;background-image:linear-gradient(135deg,var(--gold) 25%,transparent 25.5%),linear-gradient(225deg,var(--gold) 25%,transparent 25.5%);background-position:0 0,7px 0;background-size:14px 9px;opacity:.6;box-shadow:0 0 12px 1px rgba(228,194,102,.35)}
.affirm-strip{text-align:center;font-family:"Fraunces",serif;font-style:italic;font-size:14px;color:var(--accent-2);background:var(--mint);border:1px solid var(--line);border-radius:14px;padding:11px 16px;margin-bottom:14px}
.checklist-fab-row{position:sticky;top:132px;z-index:25;margin:0 0 14px}
.checklist-bar-scroll{display:flex;gap:16px;overflow-x:auto;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #00000030;-ms-overflow-style:none;scrollbar-width:none}
.checklist-bar-scroll::-webkit-scrollbar{display:none}
.checklist-bar-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;cursor:pointer;min-width:48px;padding:0}
.checklist-bar-circle{position:relative;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--bg);font-size:19px}
.checklist-bar-item small{font-size:9.5px;color:var(--muted);white-space:nowrap}
.checklist-bar-item.is-done .checklist-bar-circle{border-color:var(--accent);box-shadow:0 0 0 2px #e2b67c55}
.checklist-bar-check{position:absolute;bottom:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#1a1115;display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;font-weight:800;border:2px solid var(--card)}
.checklist-bar-item.is-skipped .checklist-bar-circle{opacity:.4;border-style:dashed}
.checklist-bar-item.is-skipped small{opacity:.5;text-decoration:line-through}
@media(max-width:600px){.checklist-fab-row{top:150px}}
.lotus-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 16px;color:var(--gold)}
.lotus-divider::before,.lotus-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.lotus-divider span{font-size:13px;letter-spacing:.06em}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .leaf{font-size:27px;font-family:'Noto Sans Devanagari',sans-serif;font-weight:700;line-height:1;display:inline-flex;align-items:center}
.brand b{font-family:"Fraunces",serif;font-weight:500;font-size:19px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:#d8c8f1;letter-spacing:.04em}
.datepill{font-size:12px;background:#211e2c1c;border:1px solid #40364f30;padding:5px 11px;border-radius:99px;color:#d8c8f1;white-space:nowrap}
.nestnav{display:flex;gap:6px;margin-top:18px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.nestnav::-webkit-scrollbar{display:none}
.nestbtn{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:transparent;border:0;color:#d8c8f1;padding:10px 16px;border-radius:14px 14px 0 0;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;position:relative;top:1px;transition:background .15s,color .15s}
.nestbtn .ic{font-size:15px}
.nestbtn:hover:not(.on):not(.soon){background:rgba(228,194,102,.1);color:#d8c8f1}
.nestbtn.on{background:var(--bg);color:var(--accent-2);box-shadow:0 -1px 0 rgba(228,194,102,.5) inset}
.nestbtn.soon{opacity:.55;cursor:default}
.nestbtn .tag{font-size:9px;font-weight:800;background:#211e2c20;border-radius:99px;padding:1px 6px;margin-left:2px}
.nestbtn.on .tag{background:var(--mint);color:var(--accent)}
main{padding:22px 0 60px}

/* ===== shared card ===== */
.card{background:var(--glass-bg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--glass-border);border-radius:20px;padding:18px 19px;box-shadow:var(--glass-glow);transition:box-shadow .2s}
.card.card-compact{padding:12px 14px;border-radius:16px}
.card.card-compact h3{font-size:13px;margin:0}
.card.card-compact .small{font-size:11.5px}
.card.card-compact .counterbox{gap:6px}
.card.card-compact .cval{font-size:13px!important}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.card.card-compact .btn.sm{padding:3px 8px;font-size:11.5px}
.card.card-compact .macro-glance{margin-top:4px}
.card.card-compact .cofcup-row{margin-top:6px}
.card:hover{box-shadow:var(--glass-glow-hover)}
.card h3{font-size:14.5px;margin:0 0 4px;letter-spacing:.01em}
.card>p.small:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}
@media(max-width:720px){.span6,.span4{grid-column:span 12}}
.small{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid rgba(228,194,102,.4);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#e6e0ed;padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:700;font-size:13.5px;box-shadow:0 2px 10px rgba(35,33,80,.18);transition:box-shadow .15s,transform .15s}
.btn:hover:not(:disabled){box-shadow:0 0 0 1px rgba(228,194,102,.5),0 4px 18px rgba(201,174,119,.35);transform:translateY(-1px)}
.btn.secondary{background:linear-gradient(165deg,rgba(255,255,255,.9),rgba(255,249,230,.75));color:var(--accent-2);border:1px solid var(--glass-border);box-shadow:var(--glass-glow)}
.btn.secondary:hover:not(:disabled){box-shadow:0 0 0 1px rgba(228,194,102,.45),0 3px 14px rgba(201,174,119,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent-2);text-decoration:underline;padding:4px 2px;font-weight:600;box-shadow:none;border:0}
.export-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);border:1.5px solid var(--gold);color:var(--accent-2);padding:7px 14px;border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;transition:background .15s,box-shadow .15s,transform .15s}
.export-btn:hover{background:rgba(228,194,102,.12);box-shadow:0 0 0 1px rgba(228,194,102,.5),0 2px 16px rgba(201,174,119,.4);transform:translateY(-1px)}
.export-btn .arrow{display:inline-block;transition:transform .15s}
.export-btn:hover .arrow{transform:translateY(-2px)}
.link-btn{background:none;border:0;padding:0;margin:0;color:var(--accent-2);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{opacity:.82}
.chip{border:1px solid var(--line);background:#211e2c;padding:6px 12px;border-radius:99px;font-size:12.5px;cursor:pointer;color:var(--accent-2);transition:box-shadow .15s}
.chip:hover{box-shadow:0 0 0 1px rgba(228,194,102,.35)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:var(--gold);color:#e6e0ed;box-shadow:0 0 0 1px rgba(228,194,102,.45),0 2px 12px rgba(201,174,119,.3)}
.chip.mini{padding:3px 8px;font-size:10.5px}
.catalog-chip{font-size:11.5px}
.catalog-chip.added{background:var(--mint);border-color:var(--accent);color:var(--accent-2)}
.blkicon{cursor:pointer;display:inline-block}

/* ===== Dashboard ===== */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:16px 18px;color:#d8c8f1;background:radial-gradient(ellipse at 110% -10%,#55407545 0%,transparent 55%),linear-gradient(150deg,#17141f,#17141f 75%);border:1px solid rgba(228,194,102,.35);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 36px 2px rgba(201,174,119,.16),0 10px 30px #0b0a1c55}
.hero-wm{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;opacity:.07;pointer-events:none;overflow:hidden}
.hero-wm svg{width:110%;height:auto}
.hero-wm svg *{stroke:#40364f}
.hero .eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#d8c8f1;font-weight:700}
.hero .hero-subquote{font-size:10px;line-height:1.3;letter-spacing:.02em;color:#d8c8f1;margin:0 0 2px}
.hero .hero-inspiration{font-family:"Fraunces",serif;font-style:italic;font-size:clamp(15px,2vw,18px);line-height:1.45;color:#d8c8f1;margin:7px 0 0;max-width:62ch}
.hero .hero-attribution{font-family:"Fraunces",serif;font-style:italic;font-size:12px;line-height:1.35;color:#d8c8f1;margin:2px 0 0}
.hero h1{color:#d8c8f1;font-size:clamp(18px,3vw,22px);margin:4px 0 3px;text-shadow:0 0 18px rgba(244,227,171,.25)}
.hero p{color:#d8c8f1;max-width:48ch;margin:0;font-size:12.5px}
.hero .hero-text{position:relative;z-index:1}
.hero .mandala2{position:absolute;right:-30px;top:-30px;width:110px;height:110px;opacity:.22;pointer-events:none;z-index:0}
.hero-art-picker{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:4px}
.hero-art-picker .hap-btn{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:10.5px;cursor:pointer;opacity:.55;transition:opacity .15s}
.hero-art-picker .hap-btn.on{opacity:1;background:rgba(255,255,255,.18)}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative}
.stat{background:transparent;border:0;border-radius:0;padding:0 8px 0 0;min-width:0;display:flex;align-items:baseline;gap:4px}
.stat b{display:inline;font-family:inherit;font-size:11px;font-weight:700;color:#d8c8f1;text-shadow:none}
.stat span{font-size:10px;color:#d8c8f1}
.quotecard{background:linear-gradient(135deg,rgba(236,234,247,.75),rgba(255,254,250,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:18px;padding:18px 20px;position:relative;box-shadow:var(--glass-glow)}
.quotecard p{font-family:"Fraunces",serif;font-style:italic;font-size:18px;line-height:1.5;margin:0 0 6px;color:var(--accent-2)}
.quotecard span{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.knot{width:14px;height:14px;flex:0 0 auto;opacity:.75}
.mantra-line{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(236,234,247,.7),rgba(255,251,236,.85));border:1px solid rgba(201,174,119,.3);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:9px 13px;margin-bottom:12px;box-shadow:0 2px 10px rgba(201,174,119,.1)}
.mantra-line b{font-family:"Fraunces",serif;font-size:14.5px;color:var(--accent-2);white-space:nowrap}
.mantra-line p{margin:0;font-family:"Fraunces",serif;font-style:italic;font-size:12.5px;color:var(--muted);line-height:1.4}
.tip-card{padding:12px 14px}
.tip-card-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-2);margin-bottom:4px}
.tip-card-text{margin:0;font-family:"Fraunces",serif;font-style:italic;font-size:13.5px;color:var(--muted);line-height:1.45}
.calcard{max-width:min(340px,100%);margin:0 auto;padding:14px 15px}
.calcard .caltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.calcard .caltop .nm{font-family:"Fraunces",serif;font-size:14.5px}
.calcard .caltop .btn.secondary{padding:4px 10px;font-size:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:280px;margin:0 auto}
.calgrid .wd{font-size:9px;text-align:center;color:var(--muted);padding-bottom:2px}
.calgrid .cell{aspect-ratio:1;max-width:34px;margin:0 auto;width:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;background:#211e2c;color:var(--muted);border:1px solid transparent}
.calgrid .cell.empty{background:transparent}
.calgrid .cell.locked{color:#d8c8f1;text-decoration:line-through;cursor:not-allowed}
.calgrid .cell.l1{background:var(--soft);color:var(--accent)}
.calgrid .cell.l2{background:#292436;color:#ece7f3}
.calgrid .cell.l3{background:var(--accent);color:#e6e0ed}
.calgrid .cell.today{outline:2px solid var(--gold);outline-offset:1px}
/* A bit bigger on laptop/desktop than the compact phone sizing above, but capped — letting this
grow with the full viewport width (as it did before) made the grid tall enough on a wide
monitor that the whole Overview page needed to scroll just to see the calendar's bottom row. */
@media(min-width:700px){
.calcard{width:100%;max-width:420px;box-sizing:border-box;padding:20px 24px}
.calcard .caltop .nm{font-size:16px}
.calcard .caltop .btn.secondary{padding:5px 12px;font-size:13px}
.calgrid{width:100%;max-width:360px;box-sizing:border-box;gap:6px}
.calgrid .wd{font-size:10.5px;padding-bottom:3px}
.calgrid .cell{width:100%;max-width:44px;font-size:13px;border-radius:10px}
}
.calcard p.small{text-align:center;font-size:11px}

/* ===== Today nest ===== */
.todaytabs{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;overflow:visible}
.todaytabs button{flex:none}
.todaytabs button{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent-2);transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;opacity:.6}
.todaytabs button:hover{transform:translateY(-1px);opacity:.85}
.todaytabs button.on{opacity:1;border-color:var(--accent);background:rgba(61,74,138,.1);box-shadow:0 0 0 3px rgba(61,74,138,.12);transform:scale(1.08)}

/* strip */
.strip-scroll{position:relative;display:flex;gap:16px;overflow-x:auto;padding:18px 6px 14px;scrollbar-width:thin}
.strip-scroll::before{content:"";position:absolute;left:6px;right:6px;top:38px;height:2px;background:var(--line);z-index:0}
.bead{flex:0 0 auto;width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;z-index:1}
.bead .circ{position:relative;width:40px;height:40px;border-radius:50%;background:#211e2c;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;transition:transform .12s,box-shadow .15s}
.bead:active .circ{transform:scale(.92)}
.bead.done .circ{background:var(--mint);border-color:var(--accent);box-shadow:0 2px 8px rgba(61,74,138,.18)}
.bead.done .circ::after{content:"✓";position:absolute;bottom:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#e6e0ed;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #40364f}
.bead.now .circ{border-color:var(--gold);box-shadow:0 0 0 3px #c9ae7733}
.bead .t{font-size:9.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.bead.skipped .circ{opacity:.45}
.bead.skipped .circ::before{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:#32263f;transform:rotate(-35deg);z-index:2}

/* timeline */
.timeline{position:relative;margin-top:4px}
.tblock{display:flex;gap:12px;padding:10px 0;border-left:2px solid var(--line);margin-left:7px;padding-left:16px;position:relative}
.tblock.dragging{opacity:.45}
.tblock:last-child{border-left-color:transparent}
.tblock::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:#211e2c;border:2px solid var(--line)}
.tblock.done::before{background:var(--accent);border-color:var(--accent)}
.tblock.now::before{background:var(--gold);border-color:var(--gold)}
.tblock.anchor .bar{border-left:3px solid var(--warn)}
.tblock.skipped{opacity:.6}
.tblock.skipped .tbody{background:var(--rest-bg)}
.skiptag{background:var(--warn)!important;color:#e6e0ed!important}
.missedtag{background:#554075!important;color:#e6e0ed!important}
.tblock.missed .tbody.bar{border-left-color:#40364f!important;background:#211e2c}
.unschedtag{background:#554075!important;color:#e6e0ed!important}
.tblock.unscheduled{opacity:.7}
.tblock.unscheduled .tbody.bar{border-left-color:#40364f!important;background:#211e2c}
.tbody{flex:1;background:#211e2c;border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer}
.tblock.done .tbody{background:var(--mint);border-color:var(--gold)}
.tblock.now .tbody{border-color:var(--gold)}
.tbody .thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tbody .time{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.tbody .nm{font-weight:700;font-size:14.5px;margin:3px 0 0}
.tbody .nm.doneline{text-decoration:line-through;color:var(--muted)}
.tbody .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.tbody .dur{font-size:10.5px;background:var(--mint);color:var(--accent-2);padding:2px 8px;border-radius:99px;white-space:nowrap}
.checkdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;align-self:center;cursor:pointer;background:#211e2c}
.blk-move-col{display:flex;flex-direction:column;gap:1px;align-self:center;flex:0 0 auto}
.tl-move-col{display:none}
.today-agenda.timeplan-expanded .tl-move-col{display:flex}
.blk-move{background:transparent;border:none;opacity:.3;font-size:9px;line-height:1;padding:3px;cursor:pointer;border-radius:4px}
.blk-move:hover:not(:disabled){opacity:.8;background:rgba(0,0,0,.05)}
.blk-move:disabled{opacity:.1;cursor:default}
.checkdot.on{background:var(--accent);border-color:var(--accent);position:relative}
.checkdot.on::after{content:"✓";color:#e6e0ed;font-size:12px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.checkdot.fail{background:#554075;border-color:#40364f;position:relative}
.checkdot.fail::after{content:"✕";color:#e6e0ed;font-size:11px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cf-row{transition:background .15s}
.cf-row.open{background:#211e2c}
.bc-phase{border-top:1px dashed var(--line);padding-top:12px}
.bc-phase:first-child{border-top:0;padding-top:0}
.bc-item{border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.bc-item.done{background:#211e2c}
.bc-item.failed{background:#211e2c}
.tristate{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border:2px solid var(--line);border-radius:6px;cursor:pointer;font-size:11px;flex:0 0 auto;background:#211e2c}
.tristate.pass{background:#292436;border-color:#40364f}
.tristate.fail{background:#211e2c;border-color:#40364f}

/* Apple-inspired day calendar beside the timetable */
/* Desktop/laptop: Schedule + Calendar side by side on one row, Unplanned as its own full-width
row below them (not a third column) — this does mean the page can scroll on a tall Unplanned
list, which is the trade-off for Unplanned reading as clearly separate from the day's planned
schedule. On phone there's no room for any of this side by side, so it stays tab-switched
(below) regardless of this layout. */
.today-split{display:grid;grid-template-columns:minmax(230px,.68fr) minmax(0,1fr);gap:12px;align-items:stretch;margin-top:12px;overflow:visible}
.today-agenda,.apple-day-card{min-width:0;display:flex;flex-direction:column;height:var(--daypanel-h);min-height:0;overflow:hidden}
.today-additions{min-width:0;display:flex;flex-direction:column;grid-column:1/-1;height:280px;min-height:0;overflow:hidden}
.today-agenda{padding:10px 9px!important}
.today-agenda .tblock{gap:6px;padding:6px 0 6px 10px;margin-left:4px}
.today-agenda .tbody{padding:7px 8px;border-radius:9px}
.today-agenda .tbody .nm{font-size:11.5px;margin-top:2px}
.today-agenda .tbody .time,.today-agenda .tbody .meta{font-size:9px}
.today-agenda .tbody .dur{font-size:9px;padding:2px 5px}
.today-agenda .tblock{align-items:flex-start}
.today-agenda .blkicon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:transparent;border:1px solid #40364f33;font-size:13px;vertical-align:middle;margin-right:3px}
.today-agenda .tbody .nm{line-height:1.25}
.today-agenda .tt-code{display:inline-flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.tt-code-tag{font-size:8px;line-height:1.25;padding:2px 5px;border:1px solid currentColor;border-radius:99px;background:transparent!important;opacity:.86}
.today-agenda .checkdot{width:17px;height:17px}
.today-agenda .tblock::before{width:8px;height:8px;left:-5px;top:11px}
.today-agenda .timeline{margin-top:0}
.apple-day-card{padding:14px 12px;overflow:hidden}
.apple-day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.today-subnav{margin-bottom:10px}
.apple-day-head h3{margin:0;font-family:'Fraunces',serif;font-size:16px}
.timeplan-head-actions{display:flex;align-items:center;gap:8px}
.timeplan-expand-btn{border:1px solid rgba(120,125,145,.25);background:rgba(120,125,145,.07);border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;color:inherit}
.timeplan-scroll{flex:1;min-height:0;height:auto;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:thin;padding-right:3px}
.today-split.timeplan-is-expanded{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.today-agenda.timeplan-expanded{width:auto!important;max-width:none;box-sizing:border-box}
.today-agenda.timeplan-expanded .timeplan-scroll{height:calc(100vh - 250px);max-height:none;overflow-y:auto;overscroll-behavior:contain}
@media(max-width:1000px){.today-split.timeplan-is-expanded{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:760px){.today-split.timeplan-is-expanded{grid-template-columns:minmax(0,1fr)}}
.today-additions{padding:10px 12px}
.today-tabbar{display:none}
.today-additions-list{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;height:auto;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding-right:3px}
.today-addition{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid #40364f;border-left:3px solid #40364f;border-radius:10px;background:#211e2c;cursor:pointer;min-width:0}
.today-addition.done{opacity:.65}
.today-addition.done .ta-line{text-decoration:line-through}
.today-addition-main{min-width:0;flex:1}
.ta-line{display:flex;align-items:baseline;gap:6px;flex-wrap:nowrap;min-width:0;line-height:1.3}
.ta-time{font-size:10px;color:#c0b5d1;font-weight:800;white-space:nowrap;flex:0 0 auto}
.ta-title{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.ta-line>.small{flex:0 0 auto;white-space:nowrap}
.today-additions-empty{font-size:12px;color:var(--muted);padding:14px 8px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.rearrange-box{flex:0 0 auto;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.rearrange-box .btn.ghost.small{font-size:12px;padding:4px 2px}
.rearrange-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin:10px 0}
.rearrange-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#211e2c}
.rearrange-row .rearrange-title{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rearrange-row .rearrange-time-input{flex:0 0 auto;width:92px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;background:#211e2c}
.sheet-thin{width:min(400px,calc(100vw - 24px));max-width:400px}
.apple-live-clock{font-size:12px;font-weight:800;color:#c0b5d1;white-space:nowrap;font-variant-numeric:tabular-nums}
.apple-allday{display:grid;grid-template-columns:48px minmax(0,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:43px;margin-bottom:8px;font-size:10px;color:var(--muted)}
.apple-allday-label{padding:9px 4px 7px 0;font-weight:700}
.apple-allday-content{padding:7px 0;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.apple-allday-chip{background:#211e2c;color:#ece7f3;border-radius:5px;padding:4px 7px;font-size:10px;font-weight:700}
.apple-day-scroll{flex:1;min-height:0;height:auto;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative;scrollbar-width:thin;border-bottom:1px solid var(--line)}
/* Fit-the-viewport sizing: the panel height is "whatever's left of the screen" after the header,
nav tabs, date-nav row and mantra/streak strip above it, clamped so it's never cramped on a
short window or absurdly tall on a long one. This replaces a fixed vh guess — that approach
could add up to more than one screen's height once three panels were involved, forcing the
whole page to scroll, which is exactly what this is meant to avoid. */
:root{--daypanel-h:clamp(460px, calc(100vh - 260px), 700px)}
.apple-day-grid{position:relative;min-width:210px;height:1440px;margin-left:48px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,var(--line) 59px,var(--line) 60px)}
.apple-hour-label{position:absolute;left:-48px;top:-7px;width:40px;text-align:right;padding-right:6px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.apple-event{position:absolute;left:4px;right:5px;min-height:27px;box-sizing:border-box;border-left:3px solid var(--accent);border-radius:5px;padding:4px 6px;background:#211e2c;color:#ece7f3;overflow:hidden;cursor:pointer;font-size:10px;line-height:1.25;z-index:2}
.apple-day-grid{cursor:crosshair}
.icon-picker{margin:4px 0 2px}
.icon-picker-row{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.icon-opt{font-size:17px;padding:4px 8px;border:1px solid var(--line);border-radius:9px;background:#211e2c;cursor:pointer;line-height:1.2}
.icon-fill{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;font-size:11px;line-height:1;vertical-align:middle}
.icon-opt.selected{border-color:var(--gold);background:var(--mint)}
.apple-event.done{opacity:.62;text-decoration:line-through}
.apple-parallel-event{background:#211e2c;color:#ece7f3;border-left-style:solid}
.apple-event-tag{display:block;font-size:8px;font-weight:800;opacity:.8;margin-top:2px}
.parallel-add{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#211e2c}
.parallel-add summary{font-size:11px;font-weight:800;cursor:pointer;color:var(--accent-2)}
.parallel-form{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px;align-items:center}
.parallel-form input{min-width:0;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;background:#211e2c;font:inherit;font-size:12px}
.parallel-form input[type=text],.parallel-form button{grid-column:1/-1}
.parallel-form label{font-size:10px;color:var(--muted);font-weight:700}
.apple-event .apple-event-time{font-size:9px;opacity:.78;display:block;margin-bottom:2px;white-space:nowrap}
.apple-now-line{position:absolute;left:-5px;right:0;height:2px;background:#554075;z-index:5;pointer-events:none;box-shadow:0 0 0 1px #e34d4d18}
.apple-now-line::before{content:'';position:absolute;left:-3px;top:-4px;width:9px;height:9px;border-radius:50%;background:#554075}
.apple-now-label{position:absolute;left:4px;top:-8px;background:#554075;color:#e6e0ed;border-radius:4px;padding:2px 4px;font-size:9px;font-weight:800;white-space:nowrap}
.apple-calendar-note{font-size:10px;color:var(--muted);margin:8px 0 0}
@media(max-width:760px){
/* phones: no room for three side-by-side panels, so only one shows at a time (tab-switched)
and it takes the full remaining screen height instead — this is how the page stays
scroll-free on a phone rather than stacking Schedule + Calendar + Unplanned on top of
each other, which was the real cause of "v v small" / endless scrolling before. */
.today-split{grid-template-columns:minmax(0,1fr)}
.today-tabbar{display:flex;gap:6px;margin-bottom:10px}
.today-tabbar button{flex:1;border:1px solid var(--line);background:#211e2c;color:var(--accent-2);padding:8px 4px;border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer}
.today-tabbar button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#e6e0ed;border-color:var(--gold)}
.today-agenda,.apple-day-card,.today-additions{display:none}
.today-agenda.tab-active,.apple-day-card.tab-active,.today-additions.tab-active{display:flex}
:root{--daypanel-h:clamp(480px, calc(100vh - 200px), 820px)}
}
@media(max-width:600px){
.apple-day-card{padding:12px 10px}
.apple-day-head{flex-wrap:wrap;gap:6px}
}


/* editor sheet */
.sheet-overlay{position:fixed;inset:0;background:#17141fcc;display:flex;align-items:center;justify-content:center;z-index:100;padding:12px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain}
.sheet{background:#211e2c;width:min(680px,calc(100vw - 24px));max-width:680px;max-height:calc(100dvh - 24px);overflow:auto;border-radius:22px;padding:16px 18px 20px;box-shadow:0 10px 50px #00000040}

.sheet label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:700}

.cascade-alert{font-size:12px;background:#211e2c;border:1px solid #40364f;color:#c0b5d1;border-radius:12px;padding:9px 12px;margin:10px 0}

/* checkin */

/* ===== Arogya ===== */

<script>

function neonLandscape(key='today'){
const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230"><defs><linearGradient id="bg"><stop stop-color="#271c32"/><stop offset="1" stop-color="#4b273b"/></linearGradient></defs><path fill="url(#bg)" d="M0 0h700v230H0z"/><g stroke="#d4a464" fill="none" opacity=".5"><path d="M420 230V120q0-48 55-68 15-6 25-24 10 18 25 24 55 20 55 68v110M433 230V122q0-40 48-58 12-5 19-17 7 12 19 17 48 18 48 58v108"/><circle cx="500" cy="125" r="27"/><circle cx="500" cy="125" r="36" opacity=".3"/><path d="M500 147q-22-18 0-42 22 24 0 42Zm0 0q-35 0-32-29 27 0 32 29Zm0 0q35 0 32-29-27 0-32 29Zm-39 10q39 20 78 0M390 230V110q0-68 83-98M610 230V110q0-68-83-98"/><path d="M30 215h640M30 205h640" opacity=".3"/><g opacity=".4"><path d="m65 45 5-10 5 10-5 10ZM130 90l4-8 4 8-4 8ZM640 55l4-8 4 8-4 8Z"/></g></g></svg>`;
return 'data:image/svg+xml,'+encodeURIComponent(svg).replace(/'/g,'%27');
}
const PAGE_PHOTOS=Object.fromEntries(['today','arogya','business','journal'].map(k=>[k,neonLandscape(k)]));
/* Planner improvements — continuous days, page progress, calendar and summary. */
function findWakeBlock(list){
if(!Array.isArray(list))return null;
return list.find(b=>b.plannerRole==='wake')||list.find(b=>b.id==='t1')||list.find(b=>/\b(?:wake(?:[\s-]*up)?|waking|rise\s*(?:&|and)\s*shine)\b/i.test(String(b.title||'')))||null;
}
function isWakeMilestone(block){return !!block&&(block.plannerRole==='wake'||block.id==='t1');}
function splitWakeAndFreshen(list){
const wake=findWakeBlock(list);if(!wake)return false;
if(wake.wakeSplitVersion===1)return false;
const oldDuration=Number(wake.dur)||0;
let fresh=list.find(b=>b.id===wake.id+'_freshen'||(!isWakeMilestone(b)&&b!==wake&&/^freshen(?:ing)?(?:\s+up)?$/i.test(String(b.title||'').trim())));
{
if(!fresh){fresh={id:wake.id+'_freshen',time:wake.time,title:'Freshen up',dur:60,cat:'rest',icon:'🚿',done:!!wake.done,skipped:!!wake.skipped,plannerRole:'freshen'};list.splice(list.indexOf(wake)+1,0,fresh);}
else {fresh.dur=60;fresh.plannerRole='freshen';}
}
wake.plannerRole='wake';wake.title='Wake up';wake.dur=0;wake.wakeSplitVersion=1;
if(fresh&&oldDuration<60){const boundary=toMin(wake.time),relative=time=>{const m=toMin(time);return m<boundary?m+1440:m;};let cursor=relative(fresh.time)+60;for(let i=list.indexOf(fresh)+1;i<list.length;i++){const block=list[i];if(block.skipped||block.unscheduled)continue;let start=relative(block.time);if(start<cursor&&!block.done&&!block.locked){block.time=toHHMM(cursor);start=cursor;}cursor=Math.max(cursor,start)+(Number(block.dur)||0);}}
return true;
}
function wakeTimeDifference(actual,target){let minutes=toMin(actual)-toMin(target);if(minutes>720)minutes-=1440;if(minutes< -720)minutes+=1440;return minutes;}
function wakeTimeStatus(actual,target){const delta=wakeTimeDifference(actual,target);return delta===0?'On time':Math.abs(delta)+' min '+(delta>0?'later':'earlier');}
function setWakeTarget(value){
if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(value))return;
snapshotForUndo('Wake-up target updated');state.wakeTargetTime=value;state.templateOverrides=state.templateOverrides||{};state.templateOverrides.t1={...(state.templateOverrides.t1||{}),time:value};
const list=getDayBlocks(selectedDay),wake=findWakeBlock(list);if(wake){wake.time=value;const fresh=list.find(b=>b.plannerRole==='freshen');if(fresh&&!fresh.done&&!fresh.locked)fresh.time=value;recomputeCascade(list);}
openSheetId=null;sheetDraft=null;save();toast('Wake-up target saved for this day and new days.');
}
function setWakeTracking(enabled){state.wakeTrackingEnabled=!!enabled;save();}
function saveActualWake(value){
if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(value))return toast('Choose your actual wake-up time.');
const iso=dateForDay(selectedDay);if(iso>todayISO())return toast('Wake-up time can be logged on or after that date.');
snapshotForUndo('Wake-up time logged');state.wakeLog=state.wakeLog||{};state.wakeLog[iso]={actual:value,target:toHHMM(planningStart()),loggedAt:new Date().toISOString()};save();
}
function logWakeNow(){const now=new Date();saveActualWake(toHHMM(now.getHours()*60+now.getMinutes()));}
function renderWakeTracking(wake){
const iso=dateForDay(selectedDay),entry=state.wakeLog?.[iso],enabled=!!state.wakeTrackingEnabled;
const history=Object.entries(state.wakeLog||{}).filter(([date,x])=>date<=todayISO()&&date>=addDaysISO(todayISO(),-6)&&x?.actual&&x?.target);
return `<details class="wake-tracking" onclick="event.stopPropagation()" ${enabled?'open':''}><summary>Wake-up target & optional tracking</summary><label class="small">Daily wake-up target <input type="time" aria-label="Daily wake-up target" value="${escapeHtml(state.wakeTargetTime||wake.time)}" onchange="setWakeTarget(this.value)"></label><p class="small">Updates this day and new days. Existing customised days keep their planned time.</p><label class="small"><input type="checkbox" ${enabled?'checked':''} onchange="setWakeTracking(this.checked)"> Track actual wake-up time</label>${enabled?`<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px"><label class="small">Actual wake-up <input id="actualWakeTime" type="time" aria-label="Actual wake-up time" value="${escapeHtml(entry?.actual||'')}"></label><button class="btn secondary small" ${iso>todayISO()?'disabled':''} onclick="saveActualWake(document.getElementById('actualWakeTime').value)">Save time</button>${iso===todayISO()?'<button class="btn secondary small" onclick="logWakeNow()">Woke up now</button>':''}</div>${entry?`<p class="small">Planned ${fmt12(entry.target)} · Actual ${fmt12(entry.actual)} · ${wakeTimeStatus(entry.actual,entry.target)}</p>`:''}<p class="small">Last 7 days: ${history.length} logged · ${history.filter(([,x])=>x.actual===x.target).length} at the planned time</p>`:''}</details>`;
}
function renderWakeEditSheet(block){return `<div class="sheet-overlay" onclick="if(event.target===this){openSheetId=null;render()}"><div class="sheet sheet-thin" role="dialog" aria-modal="true" aria-label="Edit wake-up time"><h3>Wake up</h3><label>Wake-up time<input id="wakeEditTime" type="time" value="${escapeHtml(block.time)}"></label><p class="small">Wake up is a single time. Freshen up remains a separate 60-minute activity.</p><div class="sheetactions"><button class="btn secondary" onclick="openSheetId=null;sheetDraft=null;render()">Cancel</button><button class="btn" onclick="setWakeTarget(document.getElementById('wakeEditTime').value)">Save wake-up time</button></div></div></div>`;}
function planningStart(dayNum){
// Read saved blocks directly: creating a day here would recurse through time sorting.
const n=typeof dayNum==='number'?dayNum:(typeof selectedDay==='number'?selectedDay:1);
const day=(state.days||{})[dayKey(n)];
const wake=findWakeBlock(day);
const importedFirst=Array.isArray(day)?day.find(b=>String(b.id||'').startsWith('ai_')):null;
return toMin(wake?.time||importedFirst?.time||state.wakeTargetTime||state.templateOverrides?.t1?.time||'08:00');
}
function planMinute(time,dayNum){const m=toMin(time);return m<planningStart(dayNum)?m+1440:m;}
function plannerTimeLabel(time,dayNum){return fmt12(time)+(toMin(time)<planningStart(dayNum)?' · next day':'');}
function choosePlannerDate(iso){
if(!iso || iso<trackStartDate())return;
selectedDay=dayNumberFor(iso);calMonthOffset=0;openSheetId=null;render();
}
let dateSlideDirection='forward';
let lastRenderedPlannerDay=null;
function returnDateBarToday(event){
if(event.target.closest('button,a,input,select,textarea'))return;
event.preventDefault();goToday();
}
function renderDaySelector(){
const iso=dateForDay(selectedDay),changed=lastRenderedPlannerDay!==null&&lastRenderedPlannerDay!==selectedDay;
const direction=lastRenderedPlannerDay!==null&&selectedDay<lastRenderedPlannerDay?'backward':'forward';
lastRenderedPlannerDay=selectedDay;
let days='';
for(let i=-3;i<=3;i++){
const d=addDaysISO(iso,i),n=dayNumberFor(d),v=new Date(d+'T00:00:00');
days+=`<button class="day-bubble ${i===0?'chosen':''} ${d===todayISO()?'is-today':''}" ${n<1?'disabled':''} onclick="choosePlannerDate('${d}')" aria-pressed="${i===0}" title="${niceDate(d)}"><small>${v.toLocaleDateString(undefined,{weekday:'short'})}</small><b>${v.getDate()}</b><i>${dayActivity(n).done?'•':''}</i></button>`;
}
return `<div class="day-selector" ondblclick="returnDateBarToday(event)" tabindex="0" role="group" aria-label="Date navigation. Double-click the empty bar or press Home to return to today." title="Double-click the empty bar to return to today" onkeydown="if(event.key==='Home'&&event.target===this){event.preventDefault();goToday();}"><button class="btn ghost" onclick="changeDay(-7)" aria-label="Previous week">‹</button><div class="date-slide-window"><div class="day-bubbles ${changed?'date-slide-'+direction:''}">${days}</div></div><button class="btn ghost" onclick="changeDay(7)" aria-label="Next week">›</button></div>`;
}
function renderOverviewClock(){
const now=new Date(),zone=Intl.DateTimeFormat().resolvedOptions().timeZone;
return `<div class="overview-clock" style="--surface-image:url('${PAGE_PHOTOS.arogya}');position:relative"><small style="position:absolute;top:8px;left:16px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.75">Kala &middot; Time &amp; Date</small><div class="clock-date"><b>${String(now.getDate()).padStart(2,'0')}.${String(now.getMonth()+1).padStart(2,'0')}</b><span>${now.toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</span></div><div><span>Today · ${now.toLocaleDateString(undefined,{weekday:'long'})}</span><b id="overviewTime">${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</b><small>${escapeHtml(zone.replaceAll('_',' '))}</small></div></div>`;
}
function updateOverviewClock(){const e=document.getElementById('overviewTime');if(e)e.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
setInterval(updateOverviewClock,1000);
function sectionProgress(key,n){
const k=dayKey(n),iso=dateForDay(n);
if(key==='today'){const l=(state.days||{})[k]||DEFAULT_TEMPLATE;return {done:l.filter(b=>b.done&&!b.skipped).length,total:l.length};}
if(key==='arogya'){
const m=(state.meals||{})[k]||{},w=(state.water||{})[k],move=(state.move||{})[k];
return {done:['breakfast','lunch','dinner'].filter(x=>m[x]?.done).length+Number(Number(w?.glasses||0)>=Number(w?.target||8))+Number(Number(move?.minutes||0)>=Number(move?.target||30)||Object.values(workoutState().completedDates||{}).includes(iso)),total:5};
}
if(key==='business'){const l=(state.brainDump||[]).filter(t=>t.scope==='business'&&t.day===n);return {done:l.filter(t=>t.done).length,total:Math.max(1,l.length)};}
if(key==='learning'){const skills=getLearningSkills();return {done:skills.filter(x=>!!x.practice[iso]).length,total:Math.max(1,skills.length)};}
const j=(state.journal||{})[k],c=(state.checkins||{})[k];
return {done:Number(!!j?.entry?.trim())+Number(!!c&&Object.values(c).some(v=>Array.isArray(v)?v.length>0:!!v)),total:2};
}
function renderPageCards(){
const details={today:'Your daily rhythm',arogya:'Nourish & move',business:'Your business workspace',learning:'Skills, software & hobbies',journal:'Pause & reflect'};
return `<div class="page-card-grid">${NESTS.filter(n=>n.k!=='dashboard').map(n=>{
const p=sectionProgress(n.k,selectedDay),pct=Math.min(100,Math.round(p.done/p.total*100));
return `<button class="page-card" onclick="goNest('${n.k}')" aria-label="Open ${n.hint||n.label}"><span class="page-photo" style="background-image:url('${PAGE_PHOTOS[n.k]||PAGE_PHOTOS.journal}');filter:blur(${(100-pct)/90}px) brightness(${.85+pct/500})"></span><span class="page-shade"></span><span class="page-card-top">${n.icon} ${n.label}<span>↗</span></span><span class="page-card-bottom"><strong>${details[n.k]}</strong></span></button>`;
}).join('')}</div>`;
}
let summaryMetric='routine';
function summaryScore(n){
const k=dayKey(n),iso=dateForDay(n);
if(summaryMetric==='workout')return Object.values(workoutState().completedDates||{}).includes(iso)?100:0;
if(summaryMetric==='journal')return (state.journal||{})[k]?.entry?.trim()?100:0;
if(summaryMetric==='checkin')return Object.values((state.checkins||{})[k]||{}).some(v=>Array.isArray(v)?v.length>0:!!v)?100:0;
return Math.round(dayActivity(n).frac*100);
}
function saveSummaryNote(text){state.summaryNotes=state.summaryNotes||{};state.summaryNotes[dateForDay(selectedDay)]=text;saveQuiet();}
function deleteSummaryNote(iso){snapshotForUndo('Summary note deleted');delete state.summaryNotes[iso];save();}
function renderProgressSummary(){
const scores=Array.from({length:7},(_,i)=>{const n=selectedDay-6+i;return {n,value:n>=1?summaryScore(n):0};});
const avg=Math.round(scores.reduce((a,b)=>a+b.value,0)/7);
const poly=scores.map((x,i)=>`${25+i*40},${125-x.value}`).join(' ');
let streak=0,best=0;for(let n=1;n<=selectedDay;n++){streak=summaryScore(n)>0?streak+1:0;best=Math.max(best,streak);}
const notes=Object.entries(state.summaryNotes||{}).filter(([,v])=>v?.trim()).sort((a,b)=>b[0].localeCompare(a[0]));
return `<div class="summary-head"><h2>Your progress, at a glance</h2><select aria-label="Summary habit" onchange="summaryMetric=this.value;render()">${[['routine','Routine completion'],['workout','Workout'],['journal','Journal'],['checkin','Daily check-in']].map(([k,v])=>`<option value="${k}" ${summaryMetric===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="progress-summary"><div class="card summary-calendar">${renderMonthCalendar()}<p class="small">Calendar shading: routine completion</p><h3>Daily performance</h3><div class="performance-dots">${scores.map(x=>`<button style="--p:${x.value}%" ${x.n<1?'disabled':''} onclick="selectDayFromCal(${x.n})" title="${x.value}%"><i>${x.value}%</i><small>${x.n>=1?new Date(dateForDay(x.n)+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'}):'—'}</small></button>`).join('')}</div></div><div class="summary-metrics"><div class="card"><h3>Last 7 days</h3><svg viewBox="0 0 290 155" role="img" aria-label="Completion over the selected seven days, 0 to 100 percent"><path d="M25 25H265M25 75H265M25 125H265" stroke="#e5e4ed"/><text x="0" y="28" font-size="9">100</text><text x="7" y="128" font-size="9">0</text><polyline points="${poly}" fill="none" stroke="#68814f" stroke-width="3"/>${scores.map((x,i)=>`<circle cx="${25+i*40}" cy="${125-x.value}" r="4" fill="#68814f"><title>${x.n>=1?dateForDay(x.n):'Before start'}: ${x.value}%</title></circle>`).join('')}</svg><b>${avg}%</b><span class="small"> · seven-day average</span></div><div class="card"><h3>Consistency</h3><p><b>${streak}</b> current active-day streak</p><p><b>${best}</b> longest active-day streak</p><p class="small">Any progress counts as an active day.</p></div></div><div class="card summary-notes"><h3>Notes</h3><label class="small" for="summaryNote">${niceDate(dateForDay(selectedDay))}</label><textarea id="summaryNote" placeholder="What helped? What got in the way?" oninput="saveSummaryNote(this.value)">${escapeHtml((state.summaryNotes||{})[dateForDay(selectedDay)]||'')}</textarea><button class="btn secondary" onclick="saveSummaryNote(document.getElementById('summaryNote').value);render()">Save note</button><div class="note-list">${notes.map(([iso,v])=>`<article><div><small>${niceDate(iso)}</small><button class="btn ghost" onclick="deleteSummaryNote('${iso}')" aria-label="Delete note for ${iso}">×</button></div><p>${escapeHtml(v)}</p></article>`).join('')||'<p class="small">Your reflections will appear here.</p>'}</div></div></div>`;
}

const STORAGE_KEY = "dinacharya_v1";

const DEFAULT_TEMPLATE = [

/* Firebase Realtime Database silently turns a JS array into a plain {"0":..,"1":..} OBJECT
whenever it's written with a gap or a non-numeric-sequential key (e.g. after deleting an
item leaves a hole) — snap.val() then hands back an object where the app expects .filter()/
.find() to work. Run every array-shaped field in state through this after any merge of
remote/imported data so "X.filter is not a function" can't recur from a bad round trip. */
const ARRAY_STATE_KEYS = ["brainDump","pantry","shopping","weight","pipeline","income","reading",
"adhocTasks","parallelActivities","customFoods","customRecipes","opsTasks","marketing","goals",
"clients","projects","invoices","expenses","savedSubstackLinks","savedYoutubeLinks","sankalps","learningSkills","importRepairArchive"];
function normalizeStateArrays(s){
if(!s) return s;
ARRAY_STATE_KEYS.forEach(k=>{
const v = s[k];
if(Array.isArray(v)) return;
if(v && typeof v === "object"){
s[k] = Object.keys(v).sort((a,b)=>Number(a)-Number(b)).map(key=>v[key]).filter(x=>x!=null);
} else if(v==null){
s[k] = [];
}
});
if(repairNumberedImports(s))s.importRepairPending=true;
return s;
}

async function fetchProfileMetaDC(id){

/* Writes a bare profile-meta node (no passcode) the moment a brand-new profile is created,
so it shows up in fetchExistingProfilesDC()'s list on any device right away — matching
old.html, which does the same write as part of its passcode prompt on creation. Without
this, a freshly created profile is only remembered in this device's localStorage and stays
invisible in the shared list until its first save pushes state to adhdPlannerState. */
async function registerNewProfileDC(id){
try{
ensureFirebaseInit();
const existing = await fetchProfileMetaDC(id);
if(existing) return; // already has a meta node (e.g. set a passcode) — don't overwrite it
await firebase.database().ref("adhdPlannerProfiles/"+id).set({passcodeHash:null});
}catch(e){ /* offline — profile still gets created locally; it'll register next time it saves while online */ }
}
async function requirePasscodeToDeleteDC(id){
if(id.toLowerCase()===GUEST_ID){ alert("The Guest profile is shared and can't be deleted."); return false; }
const meta = await fetchProfileMetaDC(id);
if(meta && meta.passcodeHash){
for(let tries=0; tries<3; tries++){
const entered = window.prompt("Deleting \""+id+"\" permanently removes its saved data.\n\nEnter its passcode to confirm:", "");
if(entered===null) return false;
if(hashPasscode(entered)===meta.passcodeHash) return true;
alert("Incorrect passcode.");
}
return false;
}
// No passcode is set on this profile, so there's nothing to verify against — the confirm()
// dialog the caller already showed is confirmation enough. (Previously this made the user
// invent a throwaway passcode on the spot just to delete; leaving either prompt blank failed
// the deletion silently, with no error shown.)
return true;
}
async function deleteProfileDC(id, opts){
opts = opts || {};
const silent = !!opts.silent; // suppress the per-profile "was deleted" alert (bulk delete)
const reload = opts.reload!==false; // suppress the self-reload (bulk delete reloads once, at the end)
const ok = await requirePasscodeToDeleteDC(id);
if(!ok) return false;
const isSelf = (id===profileId);
if(isSelf){
// A pending debounced autosave (pushToFirebase's 400ms syncTimer) can still be queued from
// something edited moments ago. If it fires after we remove the node but before reload —
// entirely possible while these awaits are in flight — it silently writes the whole profile
// right back, making the deletion look like it never happened. Kill it first.
clearTimeout(syncTimer);
if(stateRef){ try{ stateRef.off(); }catch(e){} }
}
try{
ensureFirebaseInit();
await firebase.database().ref("adhdPlannerState/"+id).remove();
await firebase.database().ref("adhdPlannerProfiles/"+id).remove();
}catch(e){
alert("Couldn't reach the cloud to delete that profile right now. Try again once you're online.");
return false;
}
if(isSelf){ try{ localStorage.removeItem("dinacharya_profileId"); localStorage.removeItem(storageKey()); }catch(e){} }
if(!silent) alert("\""+id+"\" was deleted.");
if(isSelf && reload) location.reload();
return true;
}

/* ---- passcode lock: a per-profile passcode, stored hashed under adhdPlannerProfiles/<profileId>,
mirrored to localStorage so the lock screen can appear instantly without waiting on the network ---- */
const PASSCODE_SESSION_MS = 6*60*60*1000; // once unlocked in this browser, stay unlocked for 6 hours
function pcLocalKey(){ return "dinacharya_pcHash_"+profileId; }
function sessionKey(){ return "dinacharya_session_"+profileId; }
function hasValidSession(){ let exp=0; try{ exp=Number(localStorage.getItem(sessionKey()))||0; }catch(e){} return exp>Date.now(); }

function hashPasscode(p){ const s=String(p||""); let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h.toString(36); }
let locallyKnownPcHash = null;

/* A flaky mobile connection can fail the very first read even though Firebase is reachable a
moment later — retry a couple of times with a short backoff before giving up and falling
back to the on-device copy. */
function pullInitialState(retriesLeft){
stateRef.once("value").then(snap=>{
const remote = snap.val();
const local = loadState();
if(remote){
// Compare timestamps before replacing anything — if this device has local changes newer
// than what's in the cloud (made while offline, or before the last successful push), the
// cloud copy must NOT silently clobber them. Only take the remote copy when it's actually
// newer; otherwise keep the local copy and push it up so the cloud catches up instead.
const remoteNewer = !local.lastSaved || (remote.lastSaved && new Date(remote.lastSaved) > new Date(local.lastSaved));
if(remoteNewer){
state = normalizeStateArrays(Object.assign({}, local, remote));
state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
saveLocalOnly();
}else{
state = normalizeStateArrays(local);
state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
pushToFirebase();
}
}
attachRemoteListener();
setSyncPill("☁️ synced");
updateSavedLabel();
if(!appLocked) render();
autoImportOldAppData();
}).catch(err=>{
if(retriesLeft>0){ setTimeout(()=>pullInitialState(retriesLeft-1), 1500); return; }
console.error("Firebase pull failed:", err);
setSyncPill("⚠️ sync error — using device copy");
if(!appLocked) render();
});
}
function cloudResyncNow(manual){

setSyncPill("☁️ syncing…");

const remote = snap.val();
if(remote && remote.lastSaved && (!state.lastSaved || new Date(remote.lastSaved) > new Date(state.lastSaved))){
state = normalizeStateArrays(Object.assign({}, state, remote));
state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
saveLocalOnly();

}
setSyncPill("☁️ synced");
updateSavedLabel();
if(manual) acctMsg("Synced ✓", false);
}).catch(err=>{
console.error("Resync failed:", err);

});
}
function attachRemoteListener(){
stateRef.on("value", snap=>{
const remote = snap.val();
if(!remote) return;
const json = JSON.stringify(remote);
if(json === lastPushedJSON) return; // our own write echoing back
// Last-write-wins: a shared profile (Guest above all — many devices can have it open
// at once) can have another device's listener fire with an OLDER snapshot than what
// we just saved locally (e.g. it was already mid-flight before our save went out).
// Without this check, that stale snapshot silently overwrites a change — like a
// just-set start date — moments after it was made. Only accept the remote version
// when it's actually newer than what we already have.
if(remote.lastSaved && state.lastSaved && new Date(remote.lastSaved) <= new Date(state.lastSaved)) return;
state = normalizeStateArrays(Object.assign({}, state, remote));
state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
saveLocalOnly();
setSyncPill("☁️ updated from another device");
updateSavedLabel();
if(!appLocked) render();
});
}

console.error("Firebase push failed:", err);
setSyncPill("⚠️ sync error — saved on device");
});
}, 400);
}

/* ---- undo: snapshot the whole state before each destructive action, keep up to 15 steps of history.
The stack itself is never auto-cleared — only the little pop-up toast auto-hides after a few
seconds. The history stays available from the ⚙️ Account panel until it's actually used. ---- */
const UNDO_MAX = 15;
let undoStack = [], redoStack = [], undoToastTimer = null;
function snapshotForUndo(label){
undoStack.push({label, json: JSON.stringify(state)});
if(undoStack.length>UNDO_MAX) undoStack.shift();
redoStack = []; // a fresh action invalidates whatever could have been redone
renderUndoToast();
}
function performUndo(){
if(!undoStack.length) return;
const last = undoStack.pop();
redoStack.push({label:last.label, json: JSON.stringify(state)});
if(redoStack.length>UNDO_MAX) redoStack.shift();
state = JSON.parse(last.json);
state.lastSaved = new Date().toISOString();
saveLocalOnly(); pushToFirebase(); render(); renderUndoToast(); updateSavedLabel();
}
function performRedo(){
if(!redoStack.length) return;
const next = redoStack.pop();
undoStack.push({label:next.label, json: JSON.stringify(state)});
if(undoStack.length>UNDO_MAX) undoStack.shift();
state = JSON.parse(next.json);
state.lastSaved = new Date().toISOString();
saveLocalOnly(); pushToFirebase(); render(); renderUndoToast(); updateSavedLabel();
}
let toastTimer = null;

let el = document.getElementById("toastMsg");
if(!el){ el = document.createElement("div"); el.id = "toastMsg"; el.className = "toast-msg"; document.body.appendChild(el); }
el.textContent = (bad? "⚠️ " : "") + msg;
el.className = "toast-msg" + (bad? " bad" : "");
el.style.display = "block";
clearTimeout(toastTimer);
toastTimer = setTimeout(()=>{ el.style.display="none"; }, bad? 3600 : 2600);
}
function renderUndoToast(){
const headerBtn = document.getElementById("undoBtnHeader");
if(headerBtn){ headerBtn.disabled = !undoStack.length; headerBtn.title = undoStack.length? ("Undo: "+undoStack[undoStack.length-1].label+" ("+undoStack.length+")") : "Nothing to undo"; }
const el = document.getElementById("undoToast");
if(!el) return;
clearTimeout(undoToastTimer);
if(!undoStack.length){ el.style.display="none"; el.innerHTML=""; return; }
const top = undoStack[undoStack.length-1];
el.style.display="flex";
el.innerHTML = `<span>${top.label}${undoStack.length>1?` <span style="opacity:.7">(${undoStack.length-1} more)</span>`:""}</span><button onclick="performUndo()">Undo</button>`;
undoToastTimer = setTimeout(()=>{ el.style.display="none"; }, 8000); // hides the pop-up only — the stack itself stays intact
}

/* ---- automatic pull from the OLD app's Firebase data (adhdPlannerState/<profileId>) ----
The old app ("A Daily Promise" / reset30) stored everything — pantry, shopping, and any
custom foods you'd saved (with a "place" field marking restaurant dishes) — under the same
kind of profile id this app uses. Runs quietly after every sync; only adds what's missing,
never overwrites anything you've already got here. */
function legacyNamedItems(raw,collection){
if(!raw||typeof raw!=='object')return [];
return Object.entries(raw).flatMap(([key,value])=>{
if(value===false||value===null||value===undefined)return [];
const record=value&&typeof value==='object'&&!Array.isArray(value)?value:null;
const name=String(record?(record.name||record.n||''):(typeof value==='string'?value:(/^\d+$/.test(key)?'':key))).trim();
if(!name)return [];
const prefix=collection==='pantry'?'p':'s',id=record?.id?String(record.id):prefix+Date.now()+'_'+Math.random().toString(36).slice(2,8);
if(collection==='shopping')return [{...record,id,name,done:!!record?.done}];
const qty=record?.qty??(typeof value==='number'?value:1),low=record?.low??1;
return [{...record,id,name,qty:Number.isFinite(Number(qty))?Math.max(0,Number(qty)):1,unit:String(record?.unit||'pcs'),low:Number.isFinite(Number(low))?Math.max(0,Number(low)):1}];
});
}
function repairNumberedImports(data){
if(!data||typeof data!=='object')return false;
if(!Array.isArray(data.importRepairArchive))data.importRepairArchive=data.importRepairArchive&&typeof data.importRepairArchive==='object'?Object.values(data.importRepairArchive):[];
let changed=false;
for(const collection of ['pantry','shopping']){
if(!Array.isArray(data[collection]))continue;
const prefix=collection==='pantry'?'p':'s';
const suspect=data[collection].filter(item=>item&&!item.keepNumericName&&/^\d+$/.test(String(item.name))&&new RegExp('^'+prefix+'\\d{13}[a-z0-9]{1,6}$').test(String(item.id))&&(collection==='shopping'||(item.unit==='pcs'&&Number(item.low)===1)));
// Multiple sequential index names plus the old import ID pattern distinguish the bug from a deliberate numeric item name.
const indexes=[...new Set(suspect.map(item=>Number(item.name)))].sort((a,b)=>a-b);
let run=1,confirmed=false;for(let i=1;i<indexes.length;i++){run=indexes[i]===indexes[i-1]+1?run+1:1;if(run>=3)confirmed=true;}
if(!confirmed)continue;
const ids=new Set(suspect.map(item=>item.id));
suspect.forEach(item=>{if(!data.importRepairArchive.some(x=>x.collection===collection&&x.item?.id===item.id))data.importRepairArchive.push({collection,item:{...item},reason:'Sequential list positions imported as names',archivedAt:new Date().toISOString()});});
data[collection]=data[collection].filter(item=>!ids.has(item?.id));changed=true;
}
return changed;
}
function restoreImportRepair(index){
const entry=state.importRepairArchive?.[index];if(!entry)return;
snapshotForUndo('Import repair entry restored');
const list=state[entry.collection]=state[entry.collection]||[];
if(!list.some(item=>item.id===entry.item.id))list.push({...entry.item,keepNumericName:true});
state.importRepairArchive.splice(index,1);save();
}
function renderImportRepairArchive(){
const entries=Array.isArray(state.importRepairArchive)?state.importRepairArchive:[];if(!entries.length)return '';
return `<details class="card" style="margin-top:14px"><summary>Import repair · ${entries.length} numbered entries saved for recovery</summary><p class="small">These entries matched the old import bug. They are archived with their original quantities. Restore any item you intended to keep.</p>${entries.map((entry,i)=>`<div class="row" style="justify-content:space-between;gap:8px;padding:7px 0"><span>${escapeHtml(entry.collection)} · ${escapeHtml(entry.item?.name||'')} ${entry.collection==='pantry'?'· '+escapeHtml(String(entry.item.qty))+' '+escapeHtml(entry.item.unit||''):''}</span><button class="btn secondary small" onclick="restoreImportRepair(${i})">Restore</button></div>`).join('')}</details>`;
}
async function autoImportOldAppData(){
if(!fbReady) return;
try{
const snap = await firebase.database().ref("adhdPlannerState/"+profileId).once("value");
const old = snap.val();
if(!old) return;
let changed = false;
state.pantry = state.pantry || [];
state.shopping = state.shopping || [];
state.customFoods = state.customFoods || [];
for(const collection of ['pantry','shopping']){
const incoming=legacyNamedItems(old[collection],collection);
for(const item of incoming){
if(!state[collection].some(existing=>String(existing.name||'').trim().toLowerCase()===item.name.toLowerCase())){
state[collection].push(item);changed=true;
}
}
}
if(repairNumberedImports(state))changed=true;
const oldFoods = (old.wl && Array.isArray(old.wl.foods)) ? old.wl.foods : [];
oldFoods.forEach(f=>{
if(!f || !f.n) return;
const exists = allFoodsForMeal("lunch").some(x=>x.n.toLowerCase()===f.n.toLowerCase());
if(!exists){
state.customFoods.push({n:f.n, k:Math.round(f.k)||0, p:Math.round(f.p)||0, c:Math.round(f.c)||0, f:Math.round(f.f)||0, meal:"lunch", src: f.place?"restaurant":"homemade"});
changed = true;
}
});
if(changed){ saveLocalOnly(); pushToFirebase(); render(); }
}catch(err){ console.error("Auto old-app import failed:", err); }
}

/* ---- date helpers ---- */
function fmtLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function trackStartDate(){ return (state && state.startDate) || START_DATE; } // resettable via the Account panel — "Day 1" and the calendar count from here
function dayNumberFor(iso){
const a = new Date(trackStartDate()+"T00:00:00"), b = new Date(iso+"T00:00:00");
return Math.round((b-a)/86400000)+1;
}
function dateForDay(n){
const d = new Date(trackStartDate()+"T00:00:00"); d.setDate(d.getDate()+(n-1)); return fmtLocal(d);
}
function todayISO(){ return fmtLocal(new Date()); }
function todayDayNum(){ return dayNumberFor(todayISO()); }
let selectedDay = Math.max(1, todayDayNum());
function niceDate(iso, opts){ return new Date(iso+"T00:00:00").toLocaleDateString(undefined, opts||{weekday:"long",day:"numeric",month:"long"}); }
function addDaysISO(iso, n){ const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return fmtLocal(d); }
function toMin(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function toHHMM(min){ min=((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }
function fmt12(hhmm){ const m=toMin(hhmm); let h=Math.floor(m/60), mm=m%60; const ap=h<12?"am":"pm"; h=h%12||12; return h+(mm?":"+String(mm).padStart(2,"0"):"")+" "+ap; }
// A block's icon is usually an emoji string, but can be a custom image (a data: URI the person
// supplied). Render either the right way instead of printing a raw data: URI as text.
function iconHTML(ic, size){
size = size||20;
if(ic && typeof ic==='string' && ic.indexOf('data:image')===0){
return `<img src="${ic}" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;border-radius:5px">`;
}
return ic||"";
}

/* ---- per-day block list ---- */
function dayKey(n){ return "d"+n; }
// Icons for the default template blocks can change (e.g. a re-icon pass) after a day's blocks
// were already saved into state — those are frozen copies, so a template edit alone never shows
// up for a day that already exists. Re-sync each block's icon to the current template on every
// read, by id, so old saved days pick up new icons automatically without touching anything else
// the person edited (title, time, duration, skip status, etc).
const TEMPLATE_ICON_BY_ID = Object.fromEntries(DEFAULT_TEMPLATE.map(b=>[b.id, b.icon]));
// A brief earlier version split "Self-care" (t4) and "Lunch + rest" (t11) each into two blocks
// (t4/t4b, t11/t11b). That's undone now — merge any day that already has the split pair back
// into one block, keeping the first half's done/skipped state and its original start time.
function mergeLegacySplits(list){
[["t4","t4b"],["t11","t11b"]].forEach(([aId,bId])=>{
const idxB = list.findIndex(b=>b.id===bId);
if(idxB<0) return;
const idxA = list.findIndex(b=>b.id===aId);
const tplA = DEFAULT_TEMPLATE.find(b=>b.id===aId);
if(!tplA) return;
const old = idxA>=0 ? list[idxA] : list[idxB];
const merged = {...tplA, time:old.time, done:!!old.done, skipped:!!old.skipped};
if(idxA>=0 && idxA<idxB){ list.splice(idxA, 2, merged); }

/* ---- cascade edit logic ---- */
const DAY_END_TARGET = 23*60; // 11:00pm sleep target
function applyBlockEdit(n, id, patch){
const list = getDayBlocks(n).map(b=>({...b}));
const idx0 = list.findIndex(b=>b.id===id);
if(idx0<0) return {list, overflow:0};
Object.assign(list[idx0], patch);
// A time edit can move this block earlier/later than its neighbors — re-sort chronologically
// first so the list keeps reading top-to-bottom in time order, instead of leaving it at its
// old array position with a time that no longer matches where it sits on screen.
if('time' in patch) list.sort((a,b)=>planMinute(a.time)-planMinute(b.time));
const idx = list.findIndex(b=>b.id===id);
// Recompute the forward chain from idx+1, based on idx's new end time (skipped blocks cost 0
// time) — but a protected block (locked/fixed, OR already completed) never has its own time
// overwritten; the cursor just resyncs to it, same as recomputeCascade. Durations are never
// shortened to make things fit — if the day runs past the end target, that's surfaced as a
// message (cascadeMsg) instead of silently trimming anyone's activity.
let cursor = planMinute(list[idx].time) + effDur(list[idx]);
for(let i=idx+1;i<list.length;i++){
// Gap-preserving, same as recomputeCascade: only push a flexible block forward when it's
// actually overlapping; otherwise its existing time (and any intentional gap before it) stays.
if(list[i].skipped || list[i].unscheduled) continue;
if(isProtectedTime(list[i])){ cursor = planMinute(list[i].time); }
else if(planMinute(list[i].time) < cursor){ list[i].time = toHHMM(cursor); }
cursor = Math.max(cursor, planMinute(list[i].time)) + effDur(list[i]);
}
const overflow = Math.max(0, cursor - DAY_END_TARGET);
setDayBlocks(n, list);
return {list, overflow};
}

function dayActivity(n){

const done = list.filter(b=>b.done).length;
const total = list.length;
const frac = total? done/total : 0;
return {frac, done, total, level: frac>=0.8?3:frac>=0.5?2:done>0?1:0};
}

if(dayActivity(n).level===0) n--;

return streak;
}

list.forEach(b=>{ if(!b.skipped) b.time = toHHMM(planMinute(b.time)+delta); });

/* Reset a day's Schedule back to the default template — but stay in sync with whatever's
already sitting on the Agenda for that day: any 🗓️ Schedule-category parallel activity keeps
its spot, and the default block(s) it now overlaps are marked skipped (and the gap closed)
rather than silently double-booked. ➕ Spontaneous items aren't schedule blocks at all, so they're
untouched either way. */
function resetScheduleForDay(dayNum){
try{
if(!confirm("Reset this day's Schedule to the default template? Every routine block's time, done and skipped status goes back to default — anything you added to today's Schedule yourself (via the calendar) stays untouched."))return;
snapshotForUndo("Schedule reset to default");
// A true reset: every default-routine block (ids t1, t2, …) goes back to not-done/not-skipped
// at its default time (or your saved "fix this time for future days" override, if you set
// one) — nothing re-marks it skipped afterward. Anything you added yourself through the
// calendar composer isn't part of the recurring template, so it's kept as-is rather than
// wiped out by the reset.
state.templateOverrides = state.templateOverrides || {};
const ov = state.templateOverrides;
const custom = getDayBlocks(dayNum).filter(b=>!/^t\d+$/.test(b.id));
let list = DEFAULT_TEMPLATE.map(b=>({...b, ...(ov[b.id]||{}), done:false, skipped:false})).concat(custom);
list.sort((a,b)=>planMinute(a.time)-planMinute(b.time));
recomputeCascade(list);
setDayBlocks(dayNum, list);
save();
toast("Schedule reset to default ✓");
render();
}catch(e){
console.error("Reset day failed:", e);
alert("Reset day hit a snag: "+(e && e.message || e)+"\nNothing was changed — try again, and if it keeps happening, tell me exactly this message.");
}
}

// Any row typed by hand in this modal is pinned at exactly that time for this one commit —
// everything else (every ordinary, non-pinned row, including row 0) gets retimed from scratch
// in the new order, back-to-back, using its own full saved duration. This is a deliberate "put
// things in this order" action, not an incidental cascade, so unlike recomputeCascade it's
// allowed to move a block's time earlier as well as later — and if that now overlaps a
// protected (locked/fixed or completed) block, the conflict resolver stops and asks instead of

newOrder.forEach(b=>{ if(b._manualTime) b._pinned = true; });
repackSequential(newOrder, 0);
startConflictFlow(selectedDay, newOrder, 'Schedule rearranged', finalList=>{
finalList.forEach(b=>{ delete b._manualTime; });

// block-by-block. Blocks the person chose "shift" for have already been moved (in
// resolveScheduleConflict, via applyBlockEdit) by the time this runs. Blocks they chose

function finalizeTTInsert(p){

list.push({id, time, title, dur, cat:'custom', icon:icon||'🗓️', anchor:false, done:false, desc});

/* Conflict resolution is asked ONE overlapping Schedule block at a time (not as one combined
popup) — per block the choice is: keep that block exactly where it is and let the new activity
sit alongside it in parallel, or shift that one block later (cascading whatever follows it
forward too). Choosing "parallel" for one block only resolves THAT block — if other blocks are
still in the queue (or still overlap after a later shift), they're still asked about one at a
time; it never short-circuits the rest of the queue. A shift only ever pushes a block later,
never earlier. Shifting one block can newly overlap a block that wasn't in the original list,
so after each shift the overlap check re-runs and any newly-conflicting block is queued too.
Once every overlap is resolved, the new activity is inserted as a real Schedule block — any
block resolved as "parallel" keeps its own time through that insert, same as an anchor. */

function cancelScheduleConflict(){ pendingTTActivity=null; conflictQueue=[]; document.getElementById('scheduleConflictModal')?.remove(); }
function resolveScheduleConflict(action){
const p=pendingTTActivity; if(!p) return;
const id=conflictQueue.shift();
if(action==='parallel'){
// This ONE overlapping block is kept exactly where it is, and the new activity is allowed to
// sit alongside it at the same time (parallel) — that resolves only this block's conflict.
// Any OTHER overlapping block still queued (or still overlapping after a later shift) must
// still be asked about on its own; picking "parallel" here must never short-circuit the rest.
p.parallelIds = p.parallelIds || [];
if(id) p.parallelIds.push(id);
askNextScheduleConflict();
return;
}
const newStart=planMinute(p.time), newEnd=newStart+p.dur;
const list=getDayBlocks(p.dayNum);
const b=list.find(x=>x.id===id);
if(b && planMinute(b.time)<newEnd) applyBlockEdit(p.dayNum, id, {time:toHHMM(newEnd)});
// re-check for any block (already-queued or not) still overlapping after that shift — but skip
// blocks already resolved as "parallel" above, those are allowed to keep overlapping on purpose
const refreshed=getDayBlocks(p.dayNum).filter(x=>!x.skipped && !(p.parallelIds||[]).includes(x.id) && planMinute(x.time)<newEnd && (planMinute(x.time)+effDur(x))>newStart);
refreshed.forEach(x=>{ if(!conflictQueue.includes(x.id)) conflictQueue.push(x.id); });

}

function moveBlock(id, dir){
const list = getDayBlocks(selectedDay).map(b=>({...b}));
const idx = list.findIndex(b=>b.id===id); if(idx<0) return;
const swapIdx = idx+dir;
if(swapIdx<0 || swapIdx>=list.length) return;
[list[idx], list[swapIdx]] = [list[swapIdx], list[idx]];
// A manual reorder is a "put this where I say" action, not an incidental cascade — the two
// swapped blocks' stored times belong to their OLD position and must be recalculated for the
// new one, using their own full saved duration. recomputeCascade's gap-preserving rule only ever
// pushes a block LATER (closes a genuine overlap) and never pulls one EARLIER, so after a swap it
// would just leave a moved-up block's old, later time in place — times would silently stop
// matching the new order. repackSequential (below) retimes everything from the earlier of the
// two swapped slots onward, tightly, until it hits a protected block (which still keeps its own
// time and resyncs the cursor, so a deliberately fixed/completed break stays put) — if that now
// overlaps a protected block, runConflictFlow (below) stops and asks instead of silently
// double-booking it.
repackSequential(list, Math.min(idx, swapIdx));
startConflictFlow(selectedDay, list, 'Schedule reordered', finalList=>{
setDayBlocks(selectedDay, finalList);
save();
});
}
// Used by moveBlock (up/down buttons), commitRearrangeModal (Rearrange Schedule window), confirmEdit
// (the editor) and unskipBlock (restoring a skipped activity): all four are deliberate "put this
// where I say" actions, so — unlike recomputeCascade, which only closes genuine overlaps and
// otherwise leaves existing times/gaps alone — this retimes every ordinary flexible block from
// `fromIdx` onward in sequence, back-to-back, using each one's own full saved duration. A protected
// block (locked/fixed, already completed, or `_pinned` — a time you just chose in the conflict
// resolver for this one operation) keeps its own time and the cursor resyncs to it, which is what
// preserves a fixed break's slot instead of flattening it into the pack. An Unscheduled block isn't
// occupying a slot at all, so it's skipped over entirely. This can still leave a protected block
// overlapping the flow around it — that's a genuine conflict for runConflictFlow to catch, not
// something to paper over here.
function repackSequential(list, fromIdx){

if(b.unscheduled || b.skipped){ continue; }
const protect = isProtectedTime(b) || b._pinned;

if(protect){ cursor = planMinute(b.time); cursor += effDur(b); continue; }
if(cursor===null) cursor = planMinute(b.time);
b.time = toHHMM(cursor);
cursor += effDur(b);
}
}

/* Dragging to reorder Schedule blocks was removed — it made it too easy to shuffle the day by
accident on touch. Nudging order now happens via the small ⬆️⬇️ buttons on each block (moveBlock,
above) or the "Rearrange Schedule" picker (below) — both tap-based, no pointer-drag. Times/titles
still only change through the block's own "edit task" sheet or the Schedule-conflict /
reschedule-or-skip popups that come from the Agenda side. */
/* ---- done / skip-inference logic ---- */
function effDur(b){ return b.skipped||isWakeMilestone(b) ? 0 : b.dur; }
// A block's time is locked if it's a template anchor (Exercise, Bath, etc.) or you've manually
// fixed it (editing its start time does this automatically) — UNLESS you've explicitly unlocked
// it via "Unlock time", which overrides either source until you set a time by hand again.
// A block's time is locked (never auto-moved) if it's a template anchor, you've manually fixed
// it, OR it's already marked done — completing an activity must never let it get silently moved
// around later, same as a fixed time. "unlocked" is an explicit override that beats all three,
// Locking is a single explicit flag you set yourself (via the Lock/Unlock button in the edit
// sheet, or the inline 🔒/🔓 icon) — nothing is locked by default, including the routine's own
// template positions (Exercise, Bath, etc. used to be auto-locked just for being template blocks;
// they aren't anymore), and checking an activity done does NOT lock it either — only you locking
// it, explicitly, does that. A lock also only ever applies to the one day it was set on — it's a
// property of that day's block, not of the template, so it never carries forward on its own.
function isLockedTime(b){ return !!(b && b.locked); }

// than isLockedTime: a completed activity must be preserved the same way a fixed/locked one is

function isProtectedTime(b){ return !!(b && (b.locked || b.done)); }

// the way — used to suggest "the next available slot" instead of silently overlapping or just
// refusing outright.
function findNextSlotAfter(list, afterMin, durMin, excludeId){
const busy = list.filter(b=>b.id!==excludeId && !b.skipped && !b.unscheduled).map(b=>({start:planMinute(b.time), end:planMinute(b.time)+effDur(b)})).sort((a,b)=>a.start-b.start);

// Scan from the day's own earliest activity, not literally from midnight — otherwise "find a
// slot that fits" could happily suggest 12:00am for Breakfast just because nothing's scheduled
// there yet.
const starts = list.filter(b=>b.id!==excludeId && !b.unscheduled && !b.skipped).map(b=>planMinute(b.time));
const dayStart = starts.length ? Math.min(...starts) : 0;
const start = findNextSlotAfter(list, dayStart, durMin, excludeId);

}
function recomputeCascade(list){

// and the cursor resyncs to it. A FLEXIBLE block only gets its time changed when it's actually
// overlapping (its stored time is earlier than the cursor) — otherwise its existing time, and
// any gap before it, is left exactly as it is. This preserves intentional gaps/breaks instead of
// always packing every block tight against whatever precedes it.

// Curved emoji check-ins preserve the original field values and toggle behaviour.
const CHECKIN_ARC_FIELDS = new Set(['energy','mood','pain','stress','sleep','focus','overall']);
function checkinArc(field,icon,label){
const c=getCheckin(selectedDay),opts=CHECKIN_CHIP_OPTIONS[field]||[],multi=MULTI_CHECKIN_FIELDS.has(field);
const displayIcon=uiIcon(({energy:'movement',mood:'mind',pain:'leaf',gut:'bowl',stress:'mind',sleep:'mountain',cravings:'bowl',skin:'lotus',mindbody:'balance',focus:'target',overall:'lamp'})[field]||'lotus',17);
return `<div class="checkin-field balance-linear-card" style="--fc:${CHECKIN_CHIP_COLOR[field]||'#77618e'}"><div class="balance-linear-head"><span class="lbl">${displayIcon} ${label}</span>${multi?'<span class="balance-multi-hint">Choose any</span>':''}</div><div class="balance-options" role="group" aria-label="${label}">${opts.map(([value,emoji,text])=>`<button type="button" class="balance-option ${hasCheckinValue(c,field,value)?'selected':''}" aria-label="${escapeHtml(label+': '+text)}" aria-pressed="${hasCheckinValue(c,field,value)}" onclick="setCheckin('${field}','${value}')"><span>${emoji}</span><small>${escapeHtml(text)}</small></button>`).join('')}</div></div>`;
}
function checkinChips(field,icon,label){return checkinArc(field,icon,label);}
