${checkinChips("skin","🌸","Skin")}

</div>

<textarea class="checkin-note" placeholder="What actually happened today?" oninput="updateCheckinNoteDraft(this.value)" onblur="saveNote(this.value)">${c.note||""}</textarea>`;
}
// The old handler was `oninput="c.note=this.value"` — `c` only existed inside this function's own
// closure at render time, so every keystroke threw "c is not defined" instead of actually saving
// the text anywhere; a stray re-render while typing (e.g. a chip tapped elsewhere) would silently
// drop whatever hadn't been blurred yet. This writes straight into state on every keystroke instead.
function updateCheckinNoteDraft(v){ getCheckin(selectedDay).note = v; }
function saveNote(v){ getCheckin(selectedDay).note = v; saveQuiet(); }

/* ---- brain dump ---- */
const BD_TYPES = [["call","📞 Call"],["email","📧 Correspond"],["todo","✅ Action"],["learn","📚 Study"],["lookup","🔍 Explore"]];
const BD_PRIORITIES = [["red","🔴 Do Now","Needs attention first"],["yellow","🟡 Handle Soon","Being worked on or awaiting action"],["green","🟢 Schedule","Plan a time for this"],["grey","⚪ Defer","Not a priority right now"]];
const BD_TYPE_COLOR = {call:"#477c9b",email:"#7864a5",todo:"#3f7a52",learn:"#b4875a",lookup:"#6a7c8a"};
const BD_COLOR = {red:"#b4552b", yellow:"#caa23c", green:"#3f7a52", grey:"#9c8268"};
let bdDraftType = "todo", bdDraftPriority = "yellow", bdFilter = "Board", bdDraftText = "";
let bdPullSelection = new Set();
// The add-item draft (text, type, priority) is read from these module-level vars, not the DOM,
// and the <input> below is rendered with its current value every time — so switching the draft
// type/priority/filter/tab (any of which re-renders the whole page) never wipes what you've typed.
function addBrainDump(){
const v = (bdDraftText||"").trim();
if(!v) return;
state.brainDump = state.brainDump || [];
const scope = todaySubpage==="brain" ? "today" : "business";
const entry = {id:"bd"+Date.now(), text:v, type:bdDraftType, priority:bdDraftPriority, day:selectedDay, done:false, ts:Date.now(), scope};
if(scope==="today") entry.calendarDate = dateForDay(selectedDay);
state.brainDump.unshift(entry);
bdDraftText = "";
save();
}
function bdDraftInput(v){
bdDraftText = v;
// Toggle the type/priority panel directly in the DOM (no full render()) so typing stays snappy
// and doesn't cost a redraw on every keystroke — bdDraftText itself is still what gets read on
// the next real render(), which is what actually preserves it across tab/filter/day changes.
const panel = document.getElementById("bdOptions");
if(panel) panel.style.display = v.trim() ? "" : "none";
}
function pullThoughtVaultTasks(){
const targetISO=dateForDay(selectedDay);
const pending=(state.brainDump||[]).filter(it=>(it.scope||"business")==="today" && !it.done && (it.calendarDate || (Number.isFinite(Number(it.day)) ? dateForDay(Number(it.day)) : "")) < targetISO);
if(!pending.length){toast("No remaining tasks to pull");return;}
snapshotForUndo("Previous Thought Vault tasks pulled");
for(const item of pending){ item.calendarDate=targetISO; item.day=selectedDay; }
save();
toast("Pulled "+pending.length+" task(s) into today ✓");
}
function toggleBdPullSelect(id){ if(bdPullSelection.has(id)) bdPullSelection.delete(id); else bdPullSelection.add(id); render(); }
function pullSelectedThoughtVaultTasks(){
if(!bdPullSelection.size){toast("Select at least one task to pull");return;}
const targetISO=dateForDay(selectedDay);
snapshotForUndo("Selected Thought Vault tasks pulled");
let n=0;
(state.brainDump||[]).forEach(it=>{ if(bdPullSelection.has(it.id)){ it.calendarDate=targetISO; it.day=selectedDay; n++; } });
bdPullSelection.clear();
save();
toast("Pulled "+n+" task(s) into today ✓");
}
// Moving an item between days/priority/category edits its own fields in place — the same object,
// same id, same text — never deletes and re-adds it, so nothing is duplicated or reset.
function moveBdToTomorrow(id){
const it=(state.brainDump||[]).find(x=>x.id===id); if(!it) return;
const base = it.calendarDate ? dayNumberFor(it.calendarDate) : (Number(it.day)||selectedDay);
snapshotForUndo("Task moved to tomorrow");
it.day = base+1; it.calendarDate = dateForDay(base+1);
save();
toast("Moved to tomorrow ✓");
}
function moveBdToDate(id){
const it=(state.brainDump||[]).find(x=>x.id===id); if(!it) return;
const iso = prompt("Move to which date? (YYYY-MM-DD)", it.calendarDate || todayISO());
if(!iso) return;
const n = dayNumberFor(iso);
snapshotForUndo("Task moved to a chosen date");
it.day = n; it.calendarDate = iso;
save();
toast("Moved to "+iso+" ✓");
}
function setBdItemPriority(id, val){ const it=(state.brainDump||[]).find(x=>x.id===id); if(it){ it.priority=val; save(); } }
function setBdItemType(id, val){ const it=(state.brainDump||[]).find(x=>x.id===id); if(it){ it.type=val; save(); } }
function toggleBd(id){ const it=state.brainDump.find(x=>x.id===id); if(it){ it.done=!it.done; if(it.calendarActivityId){const a=(state.parallelActivities||[]).find(x=>x.id===it.calendarActivityId);if(a)a.done=it.done;} save(); } }
function deleteBd(id){ snapshotForUndo("Item deleted"); state.brainDump = state.brainDump.filter(x=>x.id!==id); save(); }
function setBdType(t){ bdDraftType = t; render(); }
function setBdPriority(p){ bdDraftPriority = p; render(); }
function renderBdItem(it, scope){
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
return `<div class="bd-item ${it.done?'done':''}" style="border-left:4px solid ${BD_COLOR[it.priority]||'var(--line)'};align-items:flex-start">
<input type="checkbox" ${it.done?"checked":""} onchange="toggleBd('${it.id}')" style="margin-top:3px">
<div class="bd-item-main">
<span>${esc(it.text)}</span>
<div class="bd-item-controls">
<select class="bd-mini-select" onchange="setBdItemPriority('${it.id}', this.value)" title="Priority">
${BD_PRIORITIES.map(([id,l])=>`<option value="${id}" ${it.priority===id?'selected':''}>${l}</option>`).join('')}
</select>
<select class="bd-mini-select" onchange="setBdItemType('${it.id}', this.value)" title="Category">
${BD_TYPES.map(([id,l])=>`<option value="${id}" ${it.type===id?'selected':''}>${l}</option>`).join('')}
</select>
${scope==='today' ? `<button class="bd-mini-btn" onclick="moveBdToTomorrow('${it.id}')">→ Tomorrow</button><button class="bd-mini-btn" onclick="moveBdToDate('${it.id}')">→ Date…</button>` : ""}
</div>
</div>
<button onclick="deleteBd('${it.id}')">✕</button>
</div>`;
}
function renderBrainDump(scope="business"){
const selectedISO = dateForDay(selectedDay);
const all = (state.brainDump||[]).filter(it=>{
if((it.scope||"business")!==scope) return false;
if(scope!=="today") return true;
return (it.calendarDate || (Number.isFinite(Number(it.day)) ? dateForDay(Number(it.day)) : selectedISO)) === selectedISO;
});
const previousPendingItems = scope==="today" ? (state.brainDump||[]).filter(it=>(it.scope||"business")==="today" && !it.done && (it.calendarDate || (Number.isFinite(Number(it.day)) ? dateForDay(Number(it.day)) : "")) < selectedISO) : [];
const items = ["All","Board"].includes(bdFilter) ? all : all.filter(it=>it.priority===bdFilter);
return `<div class="card">
<h3>🧠 ${scope==="today"?"Brain dump":"Business Scratchpad"}</h3>
<p class="small">${scope==="today"?"A little space for tasks, ideas and reminders.":"Catch it here before it becomes a worry — tag it so you can find it again."}</p>
${scope==="today" && previousPendingItems.length ? `<div class="card" style="margin-top:10px;padding:10px 12px;background:#211e2c">
<div class="row" style="justify-content:space-between;align-items:center">
<span class="small" style="font-weight:700">Unfinished from earlier days (${previousPendingItems.length})</span>
<span class="row" style="gap:6px">
<button class="btn ghost small" onclick="pullSelectedThoughtVaultTasks()">Pull selected (${bdPullSelection.size})</button>
<button class="btn secondary small" onclick="pullThoughtVaultTasks()">Pull all</button>
</span>
</div>
${previousPendingItems.map(it=>`<div class="previous-pending-item">
<label style="display:flex;align-items:center;gap:7px;flex:1;cursor:pointer">
<input type="checkbox" ${bdPullSelection.has(it.id)?'checked':''} onchange="toggleBdPullSelect('${it.id}')">
<span>${String(it.text).replace(/</g,'&lt;')} <span class="small">(${it.calendarDate||dateForDay(it.day)})</span></span>
</label>
</div>`).join('')}
</div>` : ""}
<div class="bd-input" style="margin-top:10px">
<input type="text" id="bdInput" placeholder="${scope==='today'?'Call someone, pick up groceries…':'Call the dentist, business idea, worry about rent…'}" value="${String(bdDraftText).replace(/"/g,'&quot;')}" oninput="bdDraftInput(this.value)" onkeydown="if(event.key==='Enter')addBrainDump()">
<button class="btn" onclick="addBrainDump()">Add</button>
</div>
<div id="bdOptions" style="${bdDraftText.trim()?'':'display:none'}">
<div class="row" style="margin-top:9px;gap:6px">
${BD_TYPES.map(([id,l])=>`<button class="chip ${bdDraftType===id?'on':''}" onclick="setBdType('${id}')">${l}</button>`).join("")}
</div>
<div class="row" style="margin-top:7px;gap:6px">
${BD_PRIORITIES.map(([id,l,desc])=>`<button class="pchip ${bdDraftPriority===id?'on':''}" style="--pc:${BD_COLOR[id]}" title="${desc}" onclick="setBdPriority('${id}')"><span class="dot"></span>${l}</button>`).join("")}
</div>
</div>
<div class="row bd-view-toggle" style="margin-top:14px;gap:8px" aria-label="Brain dump view">
<button class="chip ${bdFilter!=='All'?'on':''}" aria-pressed="${bdFilter!=='All'}" onclick="bdFilter='Board';render()">Priority cards</button>
<button class="chip ${bdFilter==='All'?'on':''}" aria-pressed="${bdFilter==='All'}" onclick="bdFilter='All';render()">Everything (${all.length})</button>
</div>
${bdFilter==='All'?`<div class="bd-everything-grid">${all.map(it=>renderBdItem(it,scope)).join('')||'<p class="small">No activities yet.</p>'}</div>`:`<div class="bd-priority-grid">${BD_PRIORITIES.map(([pid,label,description])=>{
const grouped=all.filter(it=>(it.priority||'yellow')===pid);
return `<section class="bd-priority-panel" style="--priority-color:${BD_COLOR[pid]}" aria-label="${label.replace(/^[^ ]+ /,'')}"><h4>${label} <span class="small">(${grouped.length})</span></h4><p class="small bd-priority-description">${description}</p><div class="bd-list">${grouped.map(it=>renderBdItem(it,scope)).join('')||'<p class="small bd-empty">Nothing here yet.</p>'}</div></section>`;
}).join('')}</div>`}
</div>`;
}

/* ---- how often has this food actually been eaten at THIS meal slot (breakfast/lunch/etc),
not just overall — this is what makes "bread" float to the top for breakfast specifically ---- */
function mealTimeFreqMap(meal){
const map = {};
Object.values(state.foodLog||{}).forEach(entries=>{
(entries||[]).forEach(e=>{ if(e.meal===meal){ const k=(e.name||"").toLowerCase(); map[k]=(map[k]||0)+1; } });
});
return map;
}
function allFoodsSorted(meal){
const southLean = (state.dietPrefs||{}).southIndianLean;
const mealFreq = mealTimeFreqMap(meal);
return allFoodsForMeal(meal).filter(dietAllowed)
.slice().sort((a,b)=>{
if(lastAddedFoodName){
if(a.n===lastAddedFoodName && b.n!==lastAddedFoodName) return -1;
if(b.n===lastAddedFoodName && a.n!==lastAddedFoodName) return 1;
}
const sb = southLean ? (SI_RE.test(b.n)?1:0) - (SI_RE.test(a.n)?1:0) : 0;
if(sb) return sb;
const mf = (mealFreq[b.n.toLowerCase()]||0)-(mealFreq[a.n.toLowerCase()]||0);
if(mf) return mf;
return (state.foodFreq[b.n]||0)-(state.foodFreq[a.n]||0);
});
}
function mostEatenForMeal(meal, n){ return allFoodsSorted(meal).slice(0, n||8); }

if(mt.calories){

it.qty = Math.max(0, +(it.qty+delta).toFixed(2));
save();
}
function addPantryItem(){
const nm = document.getElementById("pName"), qt = document.getElementById("pQty"), un = document.getElementById("pUnit");
const name = (nm.value||"").trim(); if(!name) return;
// A typed 0 is a real quantity ("I have none left yet") — `+qt.value||1` used to silently turn
// that into 1 because 0 is falsy in JS. Only an actually-empty/invalid field falls back to 1.
const qtyVal = qt.value==="" ? 1 : (Number.isFinite(+qt.value) ? +qt.value : 1);
state.pantry.push({id:"p"+Date.now(), name, qty:Math.max(0,qtyVal), unit:(un.value||"").trim()||"pcs", low:1});
nm.value=""; qt.value=""; un.value="";
save();
}
function addLowToShopping(){
const low = state.pantry.filter(p=>p.qty<=p.low);
state.shopping = state.shopping || [];
low.forEach(p=>{ if(!state.shopping.find(s=>s.name.toLowerCase()===p.name.toLowerCase() && !s.done)) state.shopping.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,6), name:p.name, done:false, fromPantry:p.id}); });
save();
}
function addShoppingItem(){
const el = document.getElementById("shopInput");
const v = (el.value||"").trim(); if(!v) return;
state.shopping = state.shopping || [];
state.shopping.push({id:"s"+Date.now(), name:v, done:false});
el.value=""; save();

else{

}

function escRecipe(s){ return String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/'/g,"&#39;"); }
function recipeNeedFromIngredient(line){
let v=String(line||"").toLowerCase().replace(/^\s*\d+(?:[./]\d+)?\s*/,"").replace(/^(?:cups?|tbsp|tablespoons?|tsp|teaspoons?|g|kg|ml|l|grams?|kilograms?|millilit(?:er|re)s?|pieces?|pcs|small|medium|large)\s+/i,"").trim();
v=v.replace(/^(?:of)\s+/,"").replace(/\s*\([^)]*\)/g,"").split(/[,;]/)[0].trim();
const synonyms=[[/(lentil|dal|dhal)/,"Lentils/Dal"],[/chickpea|chana/,"Chickpeas"],[/kidney bean|rajma/,"Rajma"],[/toor/,"Toor dal"],[/moong/,"Moong dal"],[/onion/,"Onion"],[/tomato/,"Tomato"],[/paneer/,"Paneer"],[/spinach/,"Spinach"],[/rice/,"Rice"],[/egg/,"Eggs"],[/potato/,"Potato"],[/carrot/,"Carrot"],[/tofu/,"Tofu"],[/yogurt|yoghurt|curd/,"Plain yoghurt"]];
const hit=synonyms.find(([re])=>re.test(v)); return hit?hit[1]:(v.charAt(0).toUpperCase()+v.slice(1));
}
function parseRecipeDraft(){
const raw=(document.getElementById("recipePaste")?.value||"").trim();
const url=(document.getElementById("recipeUrl")?.value||"").trim();
if(!raw && !url){ alert("Paste recipe text or add a recipe link first."); return; }
const meal0=document.getElementById("recipeMeal")?.value||"lunch";
// A link with nothing pasted is just a bookmark — there's no actual recipe content to estimate
// anything from, so it must NOT get a fabricated kcal/macro estimate that looks like real data.
if(url && !raw){
let name0=(document.getElementById("recipeName")?.value||"").trim();
if(!name0) name0=(url.split("/").filter(Boolean).pop()||"Saved recipe").replace(/[-_]/g," ").replace(/\.html?.*$/i,"");
const bookmark={id:"custom_recipe_"+Date.now(),name:name0,icon:"🔖",group:meal0,meal:meal0,url,bookmarkOnly:true,need:[],ingredients:[],instructions:[],macros:null,sourceText:""};
state.customRecipes=state.customRecipes||[]; state.customRecipes.unshift(bookmark); recipeOpenId=bookmark.id; save();
return;
}
const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
let name=(document.getElementById("recipeName")?.value||"").trim();
if(!name){ name=lines.find(x=>!/^https?:\/\//i.test(x) && !/^(ingredients|instructions|method|directions|steps|how to make)\s*:?$/i.test(x)) || (url.split("/").filter(Boolean).pop()||"My recipe").replace(/[-_]/g," ").replace(/\.html?.*$/i,""); }
const ingredientLines=[]; let mode=""; const steps=[];
for(const line of lines){
if(/^(ingredients|what you need)\s*:?$/i.test(line)){mode="ingredients";continue;}
if(/^(method|instructions|directions|steps|how to make)\s*:?$/i.test(line)){mode="steps";continue;}
if(/^(nutrition|macros|per serving)\s*:?$/i.test(line)){mode="macros";continue;}
if(/^https?:\/\//i.test(line)) continue;
if(mode==="ingredients") ingredientLines.push(line.replace(/^[-*•\d.)\s]+/,""));
else if(mode==="steps") steps.push(line.replace(/^[-*•\d.)\s]+/,""));
}
if(!ingredientLines.length){
const section=raw.match(/ingredients?\s*:?([\s\S]*?)(?=\n\s*(?:method|instructions|directions|steps|how to make)\s*:|$)/i);
if(section) ingredientLines.push(...section[1].split(/\n/).map(x=>x.replace(/^[-*•\d.)\s]+/,"").trim()).filter(Boolean));
}
if(!steps.length){ const section=raw.match(/(?:method|instructions|directions|steps|how to make)\s*:?([\s\S]*)/i); if(section) steps.push(...section[1].split(/\n/).map(x=>x.replace(/^[-*•\d.)\s]+/,"").trim()).filter(Boolean)); }
const ing=ingredientLines.filter(Boolean);
// Transparent, editable rough estimates: use common ingredient keywords, never present these as verified nutrition.
let kcal=220, protein=8, carbs=28, fat=8;
const nutrition=[[/paneer|cheese/,120,8,2,9],[/tofu/,80,9,2,5],[/egg/,72,6,0,5],[/dal|lentil|chickpea|chana|rajma|beans/,110,7,18,1],[/rice|roti|wheat|atta|oats|bread|pasta|noodle/,140,4,27,2],[/oil|ghee|butter/,45,0,0,5],[/milk|yoghurt|curd/,60,4,6,2],[/vegetable|spinach|tomato|onion|carrot|broccoli|potato/,35,2,7,0]];
kcal=0; protein=0; carbs=0; fat=0;
for(const ingLine of (ing.length?ing:[raw])){ let hit=false; for(const [re,k,pr,ca,fa] of nutrition){ if(re.test(ingLine)){kcal+=k;protein+=pr;carbs+=ca;fat+=fa;hit=true;break;} } if(!hit){kcal+=45;protein+=1;carbs+=6;fat+=1;} }
kcal=Math.round(kcal||220); protein=Math.round(protein); carbs=Math.round(carbs); fat=Math.round(fat);
const meal=document.getElementById("recipeMeal")?.value||"lunch";
const custom={id:"custom_recipe_"+Date.now(),name,icon:"📖",group:meal,meal,url,need:ing.map(recipeNeedFromIngredient).filter(Boolean),ingredients:ing,instructions:steps,macros:{kcal,protein,carbs,fat,estimate:true},sourceText:raw};
state.customRecipes=state.customRecipes||[]; state.customRecipes.unshift(custom); recipeOpenId=custom.id; save();
}
function updateCustomRecipeMacro(id,key,value){ const r=(state.customRecipes||[]).find(x=>x.id===id); if(!r)return; r.macros=r.macros||{}; r.macros[key]=Math.max(0,Number(value)||0); saveQuiet(); }
function deleteCustomRecipe(id){ if(!confirm("Delete this recipe?"))return; state.customRecipes=(state.customRecipes||[]).filter(r=>r.id!==id); if(recipeOpenId===id)recipeOpenId=null; save(); }

let recipeSearch='';
let customFoodsMealTarget='lunch';
const RECIPE_SEARCH_FAMILIES=[['dal','dhal','lentil','lentils'],['chickpea','chickpeas','chana','garbanzo'],['curd','yogurt','yoghurt'],['paneer','cottage cheese'],['aubergine','eggplant','brinjal'],['capsicum','bell pepper'],['coriander','cilantro'],['rice','pulao','pilaf','biryani'],['roti','chapati','flatbread'],['spinach','palak']];
function recipeSearchText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function withinOneEdit(a,b){
if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;
while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}
return e+(i<a.length||j<b.length?1:0)<=1;
}
function recipeSearchMatches(r,query){
const q=recipeSearchText(query);if(!q)return true;
const hay=recipeSearchText([r.name,r.group,...(r.need||[]),...(r.ingredients||[])].join(' '));
const words=hay.split(' ');
return q.split(' ').every(term=>{
const family=RECIPE_SEARCH_FAMILIES.find(f=>f.some(w=>w===term));
return (family||[term]).some(word=>hay.includes(word)) || (term.length>=5&&words.some(w=>withinOneEdit(term,w)));
});
}

return `<details class="card recipe-add-card"><summary>＋ Create recipe</summary><p class="small">Paste recipe text or add a link. The app will split out ingredients and steps where it can, then create editable rough macro estimates. A link alone is saved as a source link; this offline HTML app cannot reliably read recipe pages from other websites.</p>

/* ---- weight trend ---- */
function logWeight(){
const el = document.getElementById("weightInput");
const kg = parseFloat(el.value);
if(!kg || kg<=0) return;
const iso = dateForDay(selectedDay);
state.weight = state.weight || [];
const existing = state.weight.find(w=>w.date===iso);
if(existing) existing.kg = kg; else state.weight.push({date:iso, kg});
state.weight.sort((a,b)=>a.date.localeCompare(b.date));
el.value = "";
save();
}
function deleteWeight(date){ snapshotForUndo("Weight entry deleted"); state.weight = state.weight.filter(w=>w.date!==date); save(); }
function setWeightGoal(){
const s=document.getElementById("goalStart"), t=document.getElementById("goalTarget"), d=document.getElementById("goalDate");
const start=parseFloat(s.value), target=parseFloat(t.value);
if(!start || !target || !d.value) return;
state.weightGoal = {start, target, targetDate:d.value, setDate:todayISO()};
save();
}
function clearWeightGoal(){ state.weightGoal = {start:null,target:null,targetDate:null}; save(); }
function setProfile(){
const a=document.getElementById("profAge"), h=document.getElementById("profHeight"),
sx=document.getElementById("profSex"), ac=document.getElementById("profActivity");
const age=parseInt(a.value,10), heightCm=parseFloat(h.value);
if(!age || !heightCm) return;
state.profile = {age, heightCm, sex:sx.value, activity:ac.value};
save();
}
const ACTIVITY_MULT = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725};
function bmrFor(weightKg){
const p = state.profile||{};
const age = p.age||30, h = p.heightCm||155, sex = p.sex||"female";
return sex==="male" ? (10*weightKg + 6.25*h - 5*age + 5) : (10*weightKg + 6.25*h - 5*age - 161);
}
function tdeeFor(weightKg){
const p = state.profile||{};
const mult = ACTIVITY_MULT[p.activity||"sedentary"] || 1.2;
return bmrFor(weightKg) * mult;
}
function calorieTargetFor(weightKg){
const t = tdeeFor(weightKg);
const sex = (state.profile||{}).sex||"female";
const floor = sex==="male" ? 1500 : 1200;
return Math.max(floor, Math.round(t - 500));
}
function goalTargetForDate(iso){
const g = state.weightGoal;
if(!g || !g.start || !g.target || !g.targetDate) return null;
const total = toMin; // noop guard not used
const d0 = new Date(g.setDate+"T00:00:00"), d1 = new Date(g.targetDate+"T00:00:00"), dq = new Date(iso+"T00:00:00");
const totalDays = Math.max(1,(d1-d0)/86400000);
const elapsed = Math.max(0,(dq-d0)/86400000);
const frac = Math.min(1, elapsed/totalDays);
return g.start + (g.target - g.start)*frac;
}
function renderWeightSVG(entries){
if(entries.length<2) return `<p class="small">Log at least two days to see your trend line.</p>`;
const g = state.weightGoal;
const hasGoal = g && g.start && g.target && g.targetDate;
const w=560,h=140,pad=24;
const kgs = entries.map(e=>e.kg);
if(hasGoal){ kgs.push(g.start, g.target); }
const min=Math.min(...kgs)-1, max=Math.max(...kgs)+1;
const x = i => pad + (i/(entries.length-1))*(w-pad*2);
const y = kg => h-pad - ((kg-min)/(max-min||1))*(h-pad*2);
const pts = entries.map((e,i)=>x(i)+","+y(e.kg)).join(" ");
const goalPts = hasGoal ? entries.map((e,i)=>x(i)+","+y(goalTargetForDate(e.date))).join(" ") : "";
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px;margin-top:10px">
${hasGoal? `<polyline points="${goalPts}" fill="none" stroke="#9c8268" stroke-width="1.6" stroke-dasharray="4 4"/>` : ""}
<polyline points="${pts}" fill="none" stroke="#3d4a8a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
${entries.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.kg)}" r="3.5" fill="#c9ae77"/>`).join("")}
</svg>
${hasGoal? `<p class="small">Solid line: your actual weight. Dashed: the pace needed to hit ${g.target}kg by ${niceDate(g.targetDate,{day:"numeric",month:"short",year:"numeric"})}.</p>` : ""}`;
}
function renderWeight(){
const entries = state.weight||[];
const first = entries[0], last = entries[entries.length-1];
const change = (first && last && entries.length>1) ? (last.kg-first.kg) : 0;
const g = state.weightGoal || {};
const hasGoal = g.start && g.target && g.targetDate;
let goalCard = "";
const prof = state.profile || {};
const profileFields = `<div class="weight-row" style="margin-top:10px">
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Age</label><input type="number" id="profAge" value="${prof.age||''}" placeholder="30"></div>
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Height (cm)</label><input type="number" id="profHeight" value="${prof.heightCm||''}" placeholder="155"></div>
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Sex</label>
<select id="profSex">
<option value="female" ${prof.sex==="female"?"selected":""}>Female</option>
<option value="male" ${prof.sex==="male"?"selected":""}>Male</option>
</select>
</div>
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Activity</label>
<select id="profActivity">
<option value="sedentary" ${(prof.activity||"sedentary")==="sedentary"?"selected":""}>Sedentary</option>
<option value="light" ${prof.activity==="light"?"selected":""}>Lightly active</option>
<option value="moderate" ${prof.activity==="moderate"?"selected":""}>Moderately active</option>
<option value="active" ${prof.activity==="active"?"selected":""}>Very active</option>
</select>
</div>
<button class="btn" onclick="setProfile()">Save profile</button>
</div>`;
if(hasGoal){
const todayTarget = goalTargetForDate(todayISO());
const currentKg = last ? last.kg : g.start;
const aheadBy = todayTarget!=null ? (todayTarget - currentKg) : 0;
const proteinLow = Math.round(g.target*1.6), proteinHigh = Math.round(g.target*2);
goalCard = `<div class="card" style="margin-bottom:14px">
<h3>🎯 Goal</h3>
<p class="small">${g.start}kg → ${g.target}kg by ${niceDate(g.targetDate,{day:"numeric",month:"short",year:"numeric"})}.</p>
<div class="weight-stats">
<div class="wstat"><b>${todayTarget!=null?todayTarget.toFixed(1)+" kg":"—"}</b><span>today's pace target</span></div>
<div class="wstat"><b>${currentKg? (aheadBy>=0?"on pace":(Math.abs(aheadBy)).toFixed(1)+"kg behind") : "—"}</b><span>vs. pace</span></div>
<div class="wstat"><b>${proteinLow}–${proteinHigh}g</b><span>daily protein target</span></div>
</div>
<p class="small" style="margin-top:8px">No calorie or fat counting here — just the weight trend against your pace line, and a protein target to keep muscle while you lose. Treat the trend as truth and adjust how you eat if the pace drifts for more than ~2 weeks.</p>
<button class="btn ghost" style="margin-top:6px" onclick="clearWeightGoal()">Clear goal</button>
</div>`;
} else {
goalCard = `<div class="card" style="margin-bottom:14px">
<h3>🎯 Set a goal</h3>
<p class="small">Pick a start weight, target, and date — the chart below will show the pace you need alongside your actual trend.</p>
<div class="weight-row">
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Start (kg)</label><input type="number" id="goalStart" value="${last?last.kg:''}" placeholder="100"></div>
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Target (kg)</label><input type="number" id="goalTarget" placeholder="70"></div>
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Target date</label><input type="date" id="goalDate"></div>
<button class="btn" onclick="setWeightGoal()">Set goal</button>
</div>
</div>`;
}
return `<div class="grid">
<div class="span12">${goalCard}</div>
<div class="span12 card">
<h3>⚖️ Weight trend</h3>
<p class="small">A gentle log, not a judgment. Weekly glances matter more than daily swings.</p>
<div class="weight-row">
<div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Log for ${niceDate(dateForDay(selectedDay),{day:"numeric",month:"short"})}</label>
<input type="number" step="0.1" id="weightInput" placeholder="kg"></div>
<button class="btn" onclick="logWeight()">Save</button>
</div>
<div class="weight-stats">
<div class="wstat"><b>${last? last.kg+" kg" : "—"}</b><span>latest</span></div>
<div class="wstat"><b>${entries.length>1? (change>0?"+":"")+change.toFixed(1)+" kg" : "—"}</b><span>since first log</span></div>
<div class="wstat"><b>${entries.length}</b><span>entries logged</span></div>
</div>
${renderWeightSVG(entries)}
<div class="weight-log">
${entries.slice().reverse().map(e=>`<div class="wl"><span>${niceDate(e.date,{day:"numeric",month:"short"})}</span><span>${e.kg} kg <button onclick="deleteWeight('${e.date}')" style="background:none;border:0;color:var(--muted);cursor:pointer;margin-left:6px">✕</button></span></div>`).join("")}
</div>
</div>
</div>`;
}

const WORKOUT_START_DATE = "2026-10-19";
function workoutState(){
if(!state.workout) state.workout = {startDate:trackStartDate(), totalShift:0, shiftLog:[], completed:{}};
if(state.workout.totalShift===undefined) state.workout.totalShift=0;
if(!state.workout.shiftLog) state.workout.shiftLog=[];
if(!state.workout.completed) state.workout.completed={};
if(!state.workout.completedDates) state.workout.completedDates={};
if(!state.workout.startDate) state.workout.startDate=trackStartDate();
return state.workout;
}
function workoutCurrentDayNum(){
const w = workoutState();
let n=1;
while(w.completed[n] && n<WORKOUT_PLAN274.length) n++;
return n;
}
function workoutDateForDay(n){
const w = workoutState();
// A completed day's date is locked in at the moment it's completed (workoutCompletedDates[n]) —
// marking a LATER day missed must shift only the still-unfinished days forward, never move a
// day that's already done. Only an unfinished day falls through to the live shift formula.
const locked = n===1 ? null : (w.completedDates||{})[n];
if(locked) return new Date(locked+"T00:00:00");
const start = new Date(w.startDate+"T00:00:00");
const d = new Date(start.getTime());
d.setDate(d.getDate() + (n-1) + w.totalShift);
return d;
}
function workoutFmtDate(d){
return d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function workoutCompletedCount(){
const w = workoutState();
return Object.values(w.completed).filter(Boolean).length;
}
function workoutMarkComplete(n){
const w = workoutState();
// Lock in today's actual date for this day BEFORE marking it complete — so a later "missed"
// shift (which only moves unfinished days) can never retroactively move it.
w.completedDates = w.completedDates || {};
w.completedDates[n] = fmtLocal(workoutDateForDay(n));
w.completed[n] = true;
save();
toast("Day "+n+" done — Day "+(n+1)+" is next");
}
function workoutUnmark(n){
const w = workoutState();
delete w.completed[n];
if(w.completedDates) delete w.completedDates[n];
save();
}
function workoutMissToday(){
const w = workoutState();
const n = workoutCurrentDayNum();
w.totalShift += 1;
w.shiftLog.push({day:n, ts:Date.now()});
save();
toast("Day "+n+" stays next — remaining days shifted forward 1 day");
}
function workoutUndoShift(){
const w = workoutState();
if(!w.shiftLog.length) return;
w.shiftLog.pop();
w.totalShift = Math.max(0, w.totalShift-1);
save();
toast("Last shift undone");
}
/* ACL-conscious strength work, folded into each plan day as an optional extra rather than a
separate week-numbered program. Phase boundaries mirror the 274-day plan's own length
(28 + 42 + 70 + 134 = 274) and the item for a given day cycles through that phase's 7-item week. */
function aclAdditionalFor(n){
const bounds = [28,70,140,274];
const phaseIdx = bounds.findIndex(b=>n<=b);
const phase = EXERCISE_PLAN[phaseIdx<0?EXERCISE_PLAN.length-1:phaseIdx];
const itemIdx = (n-1) % 7;
return phase.items[itemIdx] || "";
}
function renderWorkoutDayCard(n, isCurrent){
const p = WORKOUT_PLAN274[n-1]; if(!p) return "";
const w = workoutState();
const done = !!w.completed[n];
const date = workoutDateForDay(n);
const extra = aclAdditionalFor(n);
return `<div class="card" style="margin-bottom:10px;${isCurrent?'border:1px solid var(--gold)':''}">
<div class="row" style="justify-content:space-between;align-items:center;gap:8px">
<h3 style="margin:0">Day ${n}${p.rest?' · Rest day':''}${isCurrent?' · On deck':''}</h3>
<span class="small">${workoutFmtDate(date)}</span>
</div>
<div style="margin-top:8px">
${p.items.map((it,i)=>`<div class="plan-item"><span style="font-weight:800;color:var(--accent-2)">${i+1}.</span><div class="ptxt">${escapeHtml(it)}</div></div>`).join('')}
</div>
${extra? `<div class="small" style="font-weight:700;margin-top:10px;color:var(--muted)">＋ Additional (optional, ACL-conscious strength)</div>
<div class="plan-item" style="border-style:dashed;opacity:.9"><span style="font-weight:800;color:var(--accent-2)">＋</span><div class="ptxt">${escapeHtml(extra)}</div></div>` : ""}
<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
${done? `<span class="small" style="color:#c0b5d1;font-weight:700">✓ Completed</span><button class="btn ghost" style="font-size:11px" onclick="workoutUnmark(${n})">Undo complete</button>`
: isCurrent? `<button class="btn" onclick="workoutMarkComplete(${n})">✅ Mark complete</button><button class="btn ghost" onclick="workoutMissToday()">⏭️ Missed today — shift schedule</button>`
: `<span class="small">Pending</span>`}
</div>
</div>`;
}
let workoutShowCount = 2;
function renderWorkoutPlan(){
const w = workoutState();
const total = WORKOUT_PLAN274.length;
const doneCount = workoutCompletedCount();
const curN = workoutCurrentDayNum();
const lastShown = Math.min(total, curN + workoutShowCount - 1);
const upcoming = [];
for(let n=curN+1; n<=lastShown; n++) upcoming.push(n);
return `
<div class="card" style="margin-bottom:14px">
<h3 style="margin:0 0 6px">🏋️ Activity <span class="small" style="font-weight:400">· ${doneCount} / ${total} days completed</span></h3>
<p class="small">Day 1: ${niceDate(w.startDate)} · <label>Starts on <input type="date" id="activityStartDate" value="${w.startDate}"></label> <button class="btn secondary small" onclick="resetActivityStart()">Set & restart</button></p>
${w.shiftLog.length? `<button class="btn ghost small" onclick="workoutUndoShift()">↩️ Undo last missed day (${w.shiftLog.length} shift${w.shiftLog.length>1?'s':''} so far)</button>` : ""}
</div>
${renderWorkoutDayCard(curN, true)}
${upcoming.length? `<h3 style="margin:14px 0 6px">Next up</h3>${upcoming.map(n=>renderWorkoutDayCard(n,false)).join('')}` : ""}
${lastShown<total? `<button class="btn secondary" onclick="workoutShowCount+=14;render()">Show more days</button>` : `<p class="small">That's the full 274-day plan — nicely done getting this far down the list.</p>`}
`;
}

/* Accepts items either as plain strings (older shape) or {text, sub:[...]} objects — either way

function applyPlanJson(parsed, {resetAnchor}={}){

state.myPlan.phases = parsed.map(p=>({

state.planSubtasks[day] = it.sub.filter(s=>String(s||"").trim()).map((s,si)=>({id:"ps"+day+"_"+si+"_"+Math.random().toString(36).slice(2,6), text:String(s), done:false, tag:""}));

/* ---- re-check progress with AI: exports the current day/subtask status (and the hours/day

let recheckBoxOpen = false;
function buildRecheckPrompt(){

(state.planSubtasks&&state.planSubtasks[d]||[]).forEach(s=>{
const tagLbl = s.tag==="onhold"?"ON HOLD":s.tag==="followup"?"FOLLOW UP":"";
lines.push(" • "+s.text+" — "+(s.done?"done":"not done")+(tagLbl?" ["+tagLbl+"]":"")+(s.note?" (note: "+s.note+")":""));
});
});
});
return "Here is my current business plan with today's progress, day by day:\n\n"
+lines.join("\n")
+(hrs? "\n\nI can realistically only spend about "+hrs+" hour(s) a day on this — keep that in mind when resizing or re-pacing anything.\n" : "\n")
+"\nBased on what's done, not done, on hold, or flagged follow-up, suggest a revised plan going forward — keep what's working, adjust or re-pace what's stalled, and fold in anything flagged for follow-up. "

+"[\n {\"phase\": \"Week 1 · <short phase name>\", \"items\": [{\"text\":\"step 1\",\"sub\":[\"optional micro-task\"]}, {\"text\":\"step 2\",\"sub\":[]}]}\n]\n\n"
+"Keep each item/sub-task one short, concrete, actionable line. I'll paste that JSON back into my tracker, so it must be valid JSON and nothing else.";
}
async function openRecheckBox(){

/* ---- export: whole Ledger or a single project, as a real .xlsx workbook (SheetJS, loaded via CDN) ---- */
function downloadWorkbook(sheets, filename){
if(typeof XLSX==="undefined"){ alert("Export needs an internet connection the first time (to load the Excel library). Try again once you're online."); return; }
const wb = XLSX.utils.book_new();
sheets.forEach(({name,rows})=>{
const ws = XLSX.utils.json_to_sheet(rows&&rows.length? rows : [{}]);
XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
});
XLSX.writeFile(wb, filename);
}

/* ---- pomodoro ---- */
// The timer used to be a plain in-memory decrement-by-1-per-tick: it reset on every page refresh,
// and browsers throttle setInterval in background tabs, so time spent away was simply lost
// instead of counted. It's now anchored to a real wall-clock end time (pomo.endAt), persisted to
// localStorage every tick, and restored on load by comparing against Date.now() — so a refresh,
// or minutes spent in a backgrounded tab, both produce the correct remaining time. A session is
// also tagged with the day it was STARTED on (pomo.startDay), not whatever day happens to be
// selected when it finishes, so navigating away mid-session doesn't mis-credit the session.
const POMO_LS_KEY = "dinacharyaPomoActive_v1";
let pomo = { mode:"focus", secondsLeft:25*60, total:25*60, running:false, timer:null, endAt:null, startDay:null };
function savePomoState(){
try{ localStorage.setItem(POMO_LS_KEY, JSON.stringify({mode:pomo.mode, total:pomo.total, secondsLeft:pomo.secondsLeft, running:pomo.running, endAt:pomo.endAt, startDay:pomo.startDay})); }catch(e){}
}
function restorePomoState(){
try{
const raw = localStorage.getItem(POMO_LS_KEY);
if(!raw) return;
const p = JSON.parse(raw);
pomo.mode = p.mode||"focus"; pomo.total = p.total||25*60; pomo.startDay = p.startDay||null;
if(p.running && p.endAt){
pomo.endAt = p.endAt; pomo.running = true;
pomo.secondsLeft = Math.max(0, Math.round((p.endAt - Date.now())/1000));
pomo.timer = setInterval(pomoTick, 1000);
} else {
pomo.secondsLeft = p.secondsLeft!=null ? p.secondsLeft : pomo.total; pomo.running = false;
}
}catch(e){}
}
function pomoSessions(n){ state.pomodoro = state.pomodoro || {}; return state.pomodoro[dayKey(n)] = state.pomodoro[dayKey(n)] || {sessions:0}; }
function pomoTick(){
if(pomo.running && pomo.endAt){ pomo.secondsLeft = Math.max(0, Math.round((pomo.endAt - Date.now())/1000)); }
if(pomo.secondsLeft<=0){
if(pomo.mode==="focus"){ pomoSessions(pomo.startDay||selectedDay).sessions++; saveQuiet(); pomo.mode="break"; pomo.total=5*60; }
else { pomo.mode="focus"; pomo.total=25*60; }
pomo.secondsLeft = pomo.total;
pomo.endAt = pomo.running ? Date.now()+pomo.total*1000 : null;
}
savePomoState();
renderPomoRing();
}
function pomoStart(){
if(pomo.running) return;
pomo.running=true;
pomo.endAt = Date.now() + pomo.secondsLeft*1000;
if(pomo.mode==="focus" && !pomo.startDay) pomo.startDay = selectedDay; // tag with the day the session actually started on
pomo.timer=setInterval(pomoTick,1000);
savePomoState();
renderPomoRing();
}
function pomoPause(){
if(pomo.endAt) pomo.secondsLeft = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
pomo.running=false; pomo.endAt=null; clearInterval(pomo.timer);
savePomoState();
renderPomoRing();
}
function pomoReset(){ pomo.running=false; clearInterval(pomo.timer); pomo.mode="focus"; pomo.total=25*60; pomo.secondsLeft=25*60; pomo.endAt=null; pomo.startDay=null; savePomoState(); renderPomoRing(); }
function renderPomoRing(){
const pct = Math.round((1-pomo.secondsLeft/pomo.total)*100);
const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
const ss = String(pomo.secondsLeft%60).padStart(2,"0");
const el = document.getElementById("pomoRingWrap");
if(el){
el.querySelector(".pomo-ring").style.setProperty("--p", pct);
el.querySelector(".inner b").textContent = mm+":"+ss;
el.querySelector(".inner span").textContent = pomo.mode;
}
const ct = document.getElementById("pomoCompactTime");
if(ct){ ct.textContent = mm+":"+ss; }
const cm = document.getElementById("pomoCompactMode");
if(cm){ cm.textContent = pomo.mode; }
const startBtn = document.getElementById("pomoStartBtn");
if(startBtn) startBtn.textContent = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
}
function pomoToggle(){ pomo.running? pomoPause() : pomoStart(); }
function renderPomodoro(){
const s = pomoSessions(selectedDay);
const pct = Math.round((1-pomo.secondsLeft/pomo.total)*100);
const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
const ss = String(pomo.secondsLeft%60).padStart(2,"0");
const btnLabel = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
return `<div class="card">
<h3>⏳ Focus timer</h3>
<p class="small">25 minutes of focus, 5 to breathe. ${s.sessions} focus session${s.sessions===1?"":"s"} today.</p>
<div id="pomoRingWrap">
<div class="pomo-ring" style="--p:${pct}"><div class="inner"><b>${mm}:${ss}</b><span>${pomo.mode}</span></div></div>
<div class="pomo-actions">
<button class="btn" id="pomoStartBtn" onclick="pomoToggle()">${btnLabel}</button>
<button class="btn secondary" onclick="pomoReset()">Reset</button>
</div>
</div>
</div>`;
}
/* compact one-line version — used at the top of the Control panel so focus stays small and out
of the way rather than taking up a full card. */
function renderPomodoroCompact(){
const s = pomoSessions(selectedDay);
const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
const ss = String(pomo.secondsLeft%60).padStart(2,"0");
const btnLabel = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
return `<div class="card" style="margin-bottom:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
<div style="display:flex;align-items:baseline;gap:8px">
<b style="font-size:13px">⏳ Focus</b>
<span style="font-family:'Fraunces',serif;font-size:16px" id="pomoCompactTime">${mm}:${ss}</span>
<span class="small" id="pomoCompactMode">${pomo.mode}</span>
<span class="small">· ${s.sessions} session${s.sessions===1?"":"s"} today</span>
</div>
<div class="row" style="gap:6px">
<button class="btn secondary" id="pomoStartBtn" style="padding:5px 12px;font-size:12px" onclick="pomoToggle()">${btnLabel}</button>
<button class="btn secondary" style="padding:5px 12px;font-size:12px" onclick="pomoReset()">Reset</button>
</div>
</div>`;
}

/* ---- Ledger: leads → clients → projects → invoices → expenses, one page — mirrors the reference

function ledgerKpis(){
const openPipeline = (state.pipeline||[]).filter(l=>!["Won","Lost"].includes(l.stage)).reduce((s,l)=>s+(parseFloat(l.value)||0),0);

const outstanding = (state.invoices||[]).filter(i=>i.status!=="Paid").reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
const overdue = (state.invoices||[]).filter(i=>i.status==="Overdue").length;
const spend = (state.expenses||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
return [
{label:"Deals in motion", value:openPipeline.toFixed(0)},
{label:"Active circle", value:activeClients},
{label:"Still owed", value:outstanding.toFixed(0)},
{label:"Late bills", value:overdue},
{label:"Spend", value:spend.toFixed(0)}
];
}

let pendingAppConfirmation=null;
function openAppConfirmation(title,message,onConfirm,confirmLabel='Confirm'){
document.getElementById('appConfirmOverlay')?.remove();
pendingAppConfirmation={onConfirm,returnFocus:document.activeElement};
const overlay=document.createElement('div');overlay.id='appConfirmOverlay';overlay.className='pc-overlay app-confirm-overlay';
overlay.innerHTML=`<section class="pc-box app-confirm-box" role="dialog" aria-modal="true" aria-labelledby="appConfirmTitle" aria-describedby="appConfirmMessage"><h3 id="appConfirmTitle">${escapeHtml(title)}</h3><p id="appConfirmMessage">${escapeHtml(message)}</p><div class="pc-actions"><button class="btn secondary" id="appConfirmCancel" onclick="cancelAppConfirmation()">Cancel</button><button class="btn" onclick="acceptAppConfirmation()">${escapeHtml(confirmLabel)}</button></div></section>`;
overlay.addEventListener('keydown',event=>{
if(event.key==='Escape'){event.preventDefault();cancelAppConfirmation();return;}
if(event.key!=='Tab')return;
const focusable=[...overlay.querySelectorAll('button,input,select,textarea,[tabindex="0"]')];
const first=focusable[0],last=focusable.at(-1);
if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
});
document.body.appendChild(overlay);document.getElementById('appConfirmCancel')?.focus();
}
function cancelAppConfirmation(){const old=pendingAppConfirmation;pendingAppConfirmation=null;document.getElementById('appConfirmOverlay')?.remove();if(old?.returnFocus?.isConnected)old.returnFocus.focus();}
function acceptAppConfirmation(){const current=pendingAppConfirmation;pendingAppConfirmation=null;document.getElementById('appConfirmOverlay')?.remove();if(current?.onConfirm)current.onConfirm();}
function resetBusinessProgress(){
state.bizPlanDone={};state.bizPlanEffort={};state.bizPlanStartDate=todayISO();

}

function isoDayDistance(start,end){return Math.round((Date.parse(end+'T12:00:00Z')-Date.parse(start+'T12:00:00Z'))/86400000);}
function getSankalps(){
if(!Array.isArray(state.sankalps))state.sankalps=state.sankalps&&typeof state.sankalps==='object'?Object.values(state.sankalps):[];
if(!state.sankalpMigrated){
const old=state.sankalp||{};
if((old.text||'').trim()||Object.values(old.done||{}).some(Boolean))state.sankalps.unshift({id:'legacy_sankalp',text:old.text||'My vow',startDate:dateForDay(old.startDay||1),done:{...(old.done||{})}});
state.sankalpMigrated=true;
}
state.sankalps.forEach(v=>{v.done=v.done||{};v.missed=v.missed||{};if(!Array.isArray(v.history))v.history=v.history&&typeof v.history==='object'?Object.values(v.history):[];});
return state.sankalps;
}
function createSankalp(text,startDate){
text=String(text||'').trim();if(!text||!/^\d{4}-\d{2}-\d{2}$/.test(startDate))return false;
snapshotForUndo('New vow created');
getSankalps().push({id:'vow_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),text,startDate,done:{}});save();return true;
}
function addSankalpFromForm(){createSankalp(document.getElementById('sankalpNewText').value,document.getElementById('sankalpNewStart').value);}
function renameSankalp(id,value){const vow=getSankalps().find(v=>v.id===id);if(vow&&value.trim()){vow.text=value.trim();saveQuiet();}}

const vowDayTimers=new Map();
const vowMissModes={};
function sankalpRestartReason(missed){
const days=Object.keys(missed||{}).map(Number).filter(d=>Number.isInteger(d)&&d>=1&&d<=40&&missed[d]).sort((a,b)=>a-b);
for(let i=1;i<days.length;i++)if(days[i]-days[i-1]===1)return 'Two consecutive missed days';
for(let i=1;i<days.length;i++)if(days[i]-days[i-1]<=4)return 'Two missed days within a five-day period';
if(days.length>3)return 'More than three missed days in this attempt';
return null;
}
function restartSankalpAttempt(vow,startDate,reason){
const hasMarks=Object.values(vow.done||{}).some(Boolean)||Object.values(vow.missed||{}).some(Boolean);
if(hasMarks)vow.history.push({startDate:vow.startDate,endedAt:new Date().toISOString(),done:{...(vow.done||{})},missed:{...(vow.missed||{})},reason});
vow.startDate=startDate;vow.done={};vow.missed={};vow.resetCount=(vow.resetCount||0)+1;vow.lastRestart={reason,startDate};
for(const [key,timer] of vowDayTimers){if(key.startsWith(vow.id+'|')){clearTimeout(timer);vowDayTimers.delete(key);}}
}
function markSankalpDay(id,d,mode='kept'){
if(!Number.isInteger(d)||d<1||d>40||!['kept','missed'].includes(mode))return false;
const vow=getSankalps().find(v=>v.id===id);if(!vow)return false;
const date=addDaysISO(vow.startDate,d-1);
if(date>todayISO()){toast('This day has not arrived yet.');return false;}
snapshotForUndo(mode==='missed'?'Vow day marked missed':'Vow day checked');
const already=mode==='kept'?!!vow.done[d]:!!vow.missed[d];
delete vow.done[d];delete vow.missed[d];
if(!already)(mode==='kept'?vow.done:vow.missed)[d]=true;
const reason=mode==='missed'&&!already?sankalpRestartReason(vow.missed):null;
if(reason){restartSankalpAttempt(vow,addDaysISO(date,1),reason);save();toast(reason+' — a fresh 40-day attempt starts '+niceDate(vow.startDate)+'. History kept.');}
else save();
return true;
}
function toggleSankalpDay(id,d){return markSankalpDay(id,d,'kept');}
function vowDayTap(event,id,d){
if(vowMissModes[id]){if(event.detail<2)markSankalpDay(id,d,'missed');return;}
const key=id+'|'+d;
if(event.detail===0){markSankalpDay(id,d,'kept');return;}
if(event.detail===2){if(vowDayTimers.has(key))clearTimeout(vowDayTimers.get(key));vowDayTimers.delete(key);markSankalpDay(id,d,'missed');return;}
if(event.detail!==1)return;
if(vowDayTimers.has(key))clearTimeout(vowDayTimers.get(key));
const timer=setTimeout(()=>{vowDayTimers.delete(key);markSankalpDay(id,d,'kept');},450);vowDayTimers.set(key,timer);
}
function toggleVowMissMode(id){vowMissModes[id]=!vowMissModes[id];render();}
function requestSankalpReset(id){
const vow=getSankalps().find(v=>v.id===id);if(!vow)return;
openAppConfirmation('Restart this vow?', '“'+vow.text+'” will begin a fresh 40-day attempt today. Current kept and missed marks move to this vow’s history. Other vows will be unchanged.',()=>{snapshotForUndo('Vow restarted');restartSankalpAttempt(vow,todayISO(),'Manual restart');save();toast('Vow restarted. Previous attempt kept in history.');},'Restart vow');
}
function requestSankalpDelete(id){

function renderVowHistory(v){

}
function renderSankalp(){
const vows=getSankalps();
return `<section class="card sankalp-intro"><div class="section-title"><h3>${uiIcon('target')} 40-day Vows</h3>${vows.length?'<button class="btn ghost small" onclick="requestAllSankalpsReset()">Restart all vows…</button>':''}</div><p class="small">Each promise has its own dates and history. A restart changes the attempt, not your worth.</p><details class="vow-rules"><summary>Missed-day rules</summary><p>Double-click a past or current day to mark it missed. On a phone, turn on “Mark missed” and tap a day. A fresh attempt starts the following day after: more than 3 total misses, 2 consecutive misses, or 2 misses within any 5-day period. Unmarked days are not automatically counted as missed. Previous attempts stay in history.</p></details><div class="new-vow-form"><input id="sankalpNewText" aria-label="New vow" placeholder="A promise you want to keep…"><input id="sankalpNewStart" aria-label="Vow start date" type="date" value="${dateForDay(selectedDay)}"><button class="btn" onclick="addSankalpFromForm()">＋ Start a vow</button></div></section><div class="independent-vows">${vows.map(v=>{
const count=Array.from({length:40},(_,i)=>i+1).filter(d=>v.done?.[d]).length,relative=isoDayDistance(v.startDate,dateForDay(selectedDay))+1;
const missed=Object.values(v.missed).filter(Boolean).length;
return `<section class="card vow-card"><div class="vow-card-tools"><input class="vow-title" aria-label="Vow name" value="${escapeHtml(v.text)}" onchange="renameSankalp('${v.id}',this.value)"><button class="icon-action" onclick="requestSankalpReset('${v.id}')" aria-label="Restart ${escapeHtml(v.text)}" title="Restart this vow">${uiIcon('reset',17)}</button><button class="icon-action" onclick="requestSankalpDelete('${v.id}')" aria-label="Delete ${escapeHtml(v.text)}" title="Delete this vow">${uiIcon('trash',17)}</button></div><div class="vow-meta"><span>${niceDate(v.startDate,{day:'numeric',month:'short'})} → ${niceDate(addDaysISO(v.startDate,39),{day:'numeric',month:'short'})}</span><b>${count} / 40 kept · ${missed} missed</b></div>${v.lastRestart?`<p class="vow-restart-note">Fresh attempt from ${niceDate(v.startDate,{day:'numeric',month:'short'})} · ${escapeHtml(v.lastRestart.reason)}</p>`:''}<div class="progtrack"><i style="width:${count/40*100}%"></i></div><div class="vow-mark-controls"><button class="btn ghost small ${vowMissModes[v.id]?'miss-mode-on':''}" aria-pressed="${!!vowMissModes[v.id]}" onclick="toggleVowMissMode('${v.id}')">${uiIcon('close',13)} Mark missed</button><small>${vowMissModes[v.id]?'Tap a day to mark / clear a miss.':'Tap: kept · double-click: missed'}</small></div><div class="sankalp-grid">${Array.from({length:40},(_,i)=>{
const d=i+1,date=addDaysISO(v.startDate,i),status=v.missed[d]?'missed':v.done[d]?'kept':'unmarked';
return `<button class="sankalp-day ${v.done[d]?'done':''} ${v.missed[d]?'missed':''} ${d===relative?'today':''}" ${date>todayISO()?'disabled':''} aria-label="${escapeHtml(v.text)} · day ${d} · ${date} · ${status}" aria-pressed="${status!=='unmarked'}" title="${niceDate(date)} · ${status}" onclick="vowDayTap(event,'${v.id}',${d})" ondblclick="event.preventDefault()"><span>${d}</span></button>`;
}).join('')}</div>${renderVowHistory(v)}</section>`;
}).join('')||'<section class="card"><p class="small">Begin one promise. Add another whenever it fits your life.</p></section>'}</div>`;
}

function addSavedLink(){
const nameEl = document.getElementById("newSavedLinkName"), urlEl = document.getElementById("newSavedLinkUrl");
const name = (nameEl.value||"").trim(), url = (urlEl.value||"").trim();
if(!name || !url) return;
// Always files under whichever tab (Articles/Videos) is currently open — this used to read a
// separate "newSavedLinkType" variable that no button ever actually set, so a video added while
// viewing the Videos tab silently landed in Articles. Fixed by using the one tab state directly.
const type = savedLinksViewType;

state[listKey].unshift({id:(type==="video"?"sy":"ss")+Date.now(), name, url, read:false, readOn:""});

save();
}

/* Compact rows with a checkbox, title, open link and remove control. */
function savedLinksRowsFiltered(items, listKey, icon){
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
return items.map(item => `<div style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)">
<input type="checkbox" ${item.read?"checked":""} onchange="toggleSavedLinkRead('${listKey}','${item.id}',this.checked)" aria-label="Mark ${esc(item.name)} completed" style="width:15px;height:15px;cursor:pointer;flex:0 0 auto">
<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" title="Open ${esc(item.name)}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:${item.read?'var(--muted)':'inherit'};text-decoration:${item.read?'line-through':'none'}">${icon} ${esc(item.name)}</a>
<button type="button" onclick="deleteSavedLink('${listKey}','${item.id}')" title="Remove" style="flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px">✕</button>
</div>`).join("");
}
function savedLinksBucket(items, listKey, icon, type, bucket, heading){
const perPage = 10;
const totalPages = Math.max(1, Math.ceil(items.length/perPage));
const page = Math.min(savedLinksPages[type][bucket]||1, totalPages);
savedLinksPages[type][bucket] = page;
const shown = items.slice((page-1)*perPage, page*perPage);
const pager = totalPages>1 ? `<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 0 2px">
<button type="button" class="btn secondary" style="padding:4px 10px;font-size:12px" ${page<=1?'disabled':''} onclick="setSavedLinksPage('${type}','${bucket}',${page-1})">← Prev</button>
<span class="small">Page ${page} of ${totalPages}</span>
<button type="button" class="btn secondary" style="padding:4px 10px;font-size:12px" ${page>=totalPages?'disabled':''} onclick="setSavedLinksPage('${type}','${bucket}',${page+1})">Next →</button>
</div>` : "";
return `<div style="margin-top:12px"><h4 style="font-size:13px;margin:0 0 4px;color:var(--accent-2)">${heading} <span class="small" style="font-weight:400">(${items.length})</span></h4>
${shown.length ? savedLinksRowsFiltered(shown,listKey,icon) : `<p class="small" style="margin:7px 0">${bucket==='done'?'No completed items yet.':'Nothing here yet.'}</p>`}
${pager}</div>`;
}

skill.steps.push({id:'step_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),text,done:false});save();return true;
}

function removeLearningStep(id,stepId){const skill=getLearningSkills().find(s=>s.id===id);if(!skill)return;snapshotForUndo('Learning milestone removed');skill.steps=skill.steps.filter(t=>t.id!==stepId);save();}

function deleteLearningSkill(id){const skill=getLearningSkills().find(s=>s.id===id);if(!skill)return;openAppConfirmation('Remove this learning topic?', 'Remove “'+skill.name+'” with its notes and milestones? Undo is available after removal.',()=>{snapshotForUndo('Learning topic removed');state.learningSkills=getLearningSkills().filter(s=>s.id!==id);save();},'Remove topic');}
function getLearningDraft(){if(!state.learningDraft)state.learningDraft={topic:'',category:'skill',level:'Beginner',outcome:'',minutes:30,sessions:14,cadence:'daily',startDate:''};const d=state.learningDraft;if(d.notes===undefined)d.notes='';if(d.device===undefined)d.device='';return d;}
let learningImportPreview=null,learningImportError='';
function setLearningDraft(key,value){const draft=getLearningDraft();if(!(key in draft))return;draft[key]=value;saveQuiet();}
function learningTemplate(){const learningDraft=getLearningDraft();return {version:1,title:learningDraft.topic.trim()||'My learning topic',category:learningDraft.category,outcome:learningDraft.outcome.trim()||'Describe what I will be able to demonstrate',sessions:[{title:'First practical session',minutes:Number(learningDraft.minutes)||30,tasks:['Complete one specific exercise','Save an example of the result'],deliverable:'An example I can show or explain',resource:'',resourceTitle:'Official guide'}]};}
function buildLearningPrompt(){
const d=getLearningDraft();
return `Act as my practical learning coach. Create a learning tracker for any software, skill, language or hobby.\nTopic: ${d.topic.trim()||'[I will name the topic]'}\nCategory: ${d.category}\nCurrent level: ${d.level}\nDesired outcome: ${d.outcome.trim()||'Help me identify a useful, demonstrable outcome first.'}\nTime per session: ${d.minutes} minutes\nNumber of sessions: ${d.sessions}\nStart date: ${d.startDate||todayISO()}\nDevice / tools: ${d.device}\nNotes and constraints: ${d.notes}\nPractice cadence: ${d.cadence}\nAsk questions before generating the plan if the topic or goal is unclear. For employment skills, distinguish job-relevant practice from certificates and use realistic tasks. For hobbies, keep discovery and enjoyment in the plan. Build progressively from foundations to a small demonstrable project. Include spaced retrieval and a practical checkpoint every 7 sessions and in the final session, labelled Checkpoint in its title. Check each session fits the daily time budget. Give each resource a resourceTitle. Account for my daily capacity across all skills: ${learningCapacityMinutes()} minutes. Existing scheduled load at my start date: ${learningLoad(d.startDate||todayISO())} minutes. If top 1% is requested, explain a realistic benchmark in the outcome and do not promise expertise within the deadline; do not claim that finishing a checklist establishes expertise. Each session needs 1–6 concrete tasks, a deliverable, and a realistic time estimate. Use official or primary learning resources where possible; verify links if browsing is available, otherwise leave resource empty rather than inventing a URL.\nWhen ready, return only one valid JSON object in this exact schema, with ${d.sessions} sessions. No markdown or explanation. Do not include completion flags.\n${JSON.stringify(learningTemplate(),null,2)}`;
}
async function copyLearningPrompt(){const prompt=buildLearningPrompt();try{await navigator.clipboard.writeText(prompt);toast('Prompt copied. Paste it into your AI chat.');}catch{showPromptFallback(prompt);}}
function downloadLearningTemplate(){const blob=new Blob([JSON.stringify(learningTemplate(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='learning-tracker-template.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
function validateLearningPlan(raw){
const text=String(raw||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
if(text.length>1000000)throw new Error('This plan is too large. Use a JSON file smaller than 1 MB.');
let plan;try{plan=JSON.parse(text);}catch{throw new Error('Use valid JSON from the copied prompt. Nothing has been imported.');}
const clean=(value,label,max=2000)=>{if(typeof value!=='string'||!value.trim()||value.length>max)throw new Error(label+' must be text between 1 and '+max+' characters.');return value.trim();};
if(!plan||typeof plan!=='object'||Array.isArray(plan)||plan.version!==1)throw new Error('Use the version 1 learning template.');
const title=clean(plan.title,'Plan title',150),category=['skill','topic','codex','software','hobby','language','other'].includes(plan.category)?plan.category:'other';
if(!Array.isArray(plan.sessions)||plan.sessions.length<1||plan.sessions.length>365)throw new Error('Include between 1 and 365 sessions.');
const sessions=plan.sessions.map((session,i)=>{
if(!session||typeof session!=='object')throw new Error('Session '+(i+1)+' is missing.');
if(!Array.isArray(session.tasks)||!session.tasks.length||session.tasks.length>20)throw new Error('Session '+(i+1)+' needs 1–20 task texts.');
const minutes=Number(session.minutes);if(!Number.isFinite(minutes)||minutes<1||minutes>480)throw new Error('Session '+(i+1)+' needs a duration of 1–480 minutes.');
const resource=String(session.resource||'').trim();if(resource&&!learningResourceURL(resource))throw new Error('Session '+(i+1)+' has an invalid resource URL. Use an https:// link or leave it empty.');
return {title:clean(session.title,'Session '+(i+1)+' title',200),minutes:Math.round(minutes),tasks:session.tasks.map(t=>clean(t,'Task',1000)),deliverable:session.deliverable?clean(session.deliverable,'Deliverable'): '',resource,resourceTitle:session.resourceTitle?clean(session.resourceTitle,'Resource title',200):''};
});
return {title,category,outcome:plan.outcome?clean(plan.outcome,'Outcome'): '',sessions};
}
function previewLearningImport(raw){try{learningImportPreview=validateLearningPlan(raw);learningImportError='';}catch(e){learningImportPreview=null;learningImportError=e.message;}render();return !!learningImportPreview;}
async function uploadLearningPlan(event){const file=event.target.files?.[0];if(!file)return;if(file.size>1000000){learningImportPreview=null;learningImportError='Use a JSON file smaller than 1 MB.';render();return;}try{previewLearningImport(await file.text());}catch{learningImportPreview=null;learningImportError='The file could not be read. Paste its JSON instead.';render();}}
function previewLearningPaste(){previewLearningImport(document.getElementById('learningPlanPaste').value);}
function learningPlanDates(start,count,cadence){const dates=[];let iso=start;while(dates.length<count){const weekday=new Date(iso+'T12:00:00').getDay();if(cadence!=='weekdays'||(weekday!==0&&weekday!==6))dates.push(iso);iso=addDaysISO(iso,1);}return dates;}
function installLearningPlan(){
const plan=learningImportPreview;if(!plan)return false;
const learningDraft=getLearningDraft();
const start=learningDraft.startDate||dateForDay(selectedDay),cadence=learningDraft.cadence==='weekdays'?'weekdays':'daily';
if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||Number.isNaN(Date.parse(start+'T12:00:00'))||fmtLocal(new Date(start+'T12:00:00'))!==start){learningImportError='Choose a valid start date.';render();return false;}
const capacityDates=learningPlanDates(start,plan.sessions.length,cadence);
if(plan.sessions.some((x,i)=>learningLoad(capacityDates[i])+x.minutes>learningCapacityMinutes())){learningImportError='This plan exceeds your daily capacity. Adjust the plan or start date, pause another plan, or increase capacity on My Vidya / My Vichara.';render();return false;}
const dates=learningPlanDates(start,plan.sessions.length,cadence),id='skill_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
snapshotForUndo('Learning plan imported');
getLearningSkills().push({id,name:plan.title,kind:plan.category,notes:plan.outcome,resource:'',steps:[],practice:{},practicePlan:'',evidenceNotes:'',blockers:'',nextAction:'',plan:{startDate:start,cadence,level:learningDraft.level,device:learningDraft.device,notes:learningDraft.notes,sessions:plan.sessions.map((session,i)=>({...session,id:'session_'+i,date:dates[i],tasks:session.tasks.map((text,j)=>({id:'task_'+j,text,done:false})),evidence:''}))}});
learningImportPreview=null;learningImportError='';state.learningJSONPaste='';learningPage=['hobby','language','other'].includes(plan.category)?'vichara':'vidya';save();toast('Learning tracker created. Existing topics are kept.');return true;
}
function getLearningSession(skillId,sessionId){return getLearningSkills().find(s=>s.id===skillId)?.plan?.sessions.find(s=>s.id===sessionId);}
function toggleLearningPlanTask(skillId,sessionId,taskId){if(getLearningSkills().find(s=>s.id===skillId)?.plan?.paused)return;const task=getLearningSession(skillId,sessionId)?.tasks.find(t=>t.id===taskId);if(!task)return;task.done=!task.done;save();}
function setLearningEvidence(skillId,sessionId,value){const session=getLearningSession(skillId,sessionId);if(!session)return;session.evidence=value;saveQuiet();}
function renderLearningSessions(skill){
const p=skill.plan,sessions=p?.sessions;if(!sessions?.length)return '<section class="learning-session-plan"><h4>Daily activity & checkpoints</h4><p class="small">No plan yet. Create one in Planner AI.</p></section>';
const iso=dateForDay(selectedDay),current=sessions.filter(x=>x.date===iso),done=x=>x.tasks.length&&x.tasks.every(t=>t.done),complete=sessions.filter(done).length,checkpoints=sessions.filter(x=>/checkpoint/i.test(x.title)),dates=sessions.map(x=>x.date).sort();
return `<section class="learning-session-plan"><h4>Daily activity & checkpoints</h4><p class="small">${complete} / ${sessions.length} days completed · ${p.paused?'Paused':'Active'}</p><progress max="${sessions.length}" value="${complete}" style="width:100%" aria-label="Plan completion"></progress><p class="small">Start: ${niceDate(dates[0])} · End: ${niceDate(dates.at(-1))}</p><div class="row" style="gap:8px;flex-wrap:wrap">${p.paused?`<button class="btn secondary" onclick="rescheduleLearningPlan('${skill.id}',true)">Resume from today</button>`:`<button class="btn secondary" onclick="pauseLearningPlan('${skill.id}')">Pause</button>`}<label class="small">New date <input type="date" id="reschedule_${skill.id}" value="${iso}" aria-label="Reschedule ${escapeHtml(skill.name)} from"></label><button class="btn secondary" onclick="rescheduleLearningPlan('${skill.id}')">Reschedule unfinished</button></div>${p.paused?'<p class="small">Plan paused. Resume to continue tracking.</p>':current.length?current.map(session=>`<div class="learning-session-current"><span class="learning-kind">Day ${sessions.indexOf(session)+1} · ${session.minutes} min</span><h4>${escapeHtml(session.title)}</h4>${session.tasks.map(task=>`<label class="learning-plan-task"><input type="checkbox" ${task.done?'checked':''} onchange="toggleLearningPlanTask('${skill.id}','${session.id}','${task.id}')"><span class="${task.done?'is-kept':''}">${escapeHtml(task.text)}</span></label>`).join('')}${session.deliverable?`<p class="learning-deliverable">${escapeHtml(session.deliverable)}</p>`:''}${learningResourceURL(session.resource)?`<a class="learning-resource" href="${escapeHtml(learningResourceURL(session.resource))}" target="_blank" rel="noopener">${escapeHtml(session.resourceTitle||session.title+' · guidance')} ↗</a>`:''}</div>`).join(''):'<p class="small">No activity scheduled for this date. Choose another day below or reschedule unfinished sessions.</p>'}<details><summary>Checkpoints · ${checkpoints.length}</summary>${checkpoints.map(x=>`<p class="small">${done(x)?'✓':'○'} ${niceDate(x.date)} · ${escapeHtml(x.title)}<br>${escapeHtml(x.deliverable||'Demonstrate the tasks without help.')}</p>`).join('')||'<p class="small">Ask AI to label assessment sessions as Checkpoint.</p>'}</details><details class="learning-plan-outline"><summary>All days</summary>${sessions.map((x,i)=>`<button class="learning-session-link" onclick="choosePlannerDate('${x.date}')"><span>${done(x)?'✓':i+1}</span><div><b>${escapeHtml(x.title)}</b><small>${niceDate(x.date)} · ${x.minutes} min</small></div></button>`).join('')}</details></section>`;
}

ng plan start date" value="${start}" onchange="setLearningDraft('startDate',this.value);render()"></label><label>Device / tools available<input aria-label="Device or tools" value="${escapeHtml(d.device)}" placeholder="Laptop, phone, software, materials…" oninput="setLearningDraft('device',this.value)"></label><label class="learning-outcome">Notes for AI<input aria-label="Notes for AI" value="${escapeHtml(d.notes)}" placeholder="Constraints, interests, prior experience, budget…" oninput="setLearningDraft('notes',this.value)"></label></div><p class="small">Planned end: ${niceDate(learningPlanDates(start,d.sessions,d.cadence).at(-1))} · ${(d.sessions*d.minutes/60).toFixed(1)} total hours</p><div class="planner-workflow"><button class="btn secondary" onclick="copyLearningPrompt()">${uiIcon('copy',16)} Copy prompt</button><label class="learning-label" for="learningPlanPaste">Paste AI JSON</label><textarea id="learningPlanPaste" aria-label="AI learning plan JSON" spellcheck="false" placeholder="Paste the JSON response from your AI chat…" oninput="state.learningJSONPaste=this.value;saveQuiet()">${escapeHtml(state.learningJSONPaste||'')}</textarea><button class="btn" onclick="previewLearningPaste()">Preview plan</button></div>${learningImportError?`<p class="learning-import-error" role="alert">${escapeHtml(learningImportError)}</p>`:''}${plan?`<div class="learning-import-preview"><h4>Review · ${escapeHtml(plan.title)}</h4><p>${plan.sessions.length} sessions · ${niceDate(dates[0])} → ${niceDate(dates.at(-1))}</p><p class="small">${escapeHtml(plan.outcome)}</p>${renderImportCapacity(plan,dates)}<details><summary>See the sessions and tasks</summary>${plan.sessions.map((s,i)=>`<article><b>${i+1}. ${escapeHtml(s.title)}</b><small>${niceDate(dates[i])} · ${s.minutes} min</small><ul>${s.tasks.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul></article>`).join('')}</details><button class="btn" onclick="installLearningPlan()">Add to ${['hobby','language','other'].includes(plan.category)?'My Vichara':'My Vidya'}</button><small>A new topic will be added. Your existing topics stay as they are.</small></div>`:''}`;

return skill.resources;
}

function addLearningResource(id){const skill=getLearningSkills().find(s=>s.id===id),title=document.getElementById('resourceTitle_'+id).value.trim(),url=learningResourceURL(document.getElementById('resourceUrl_'+id).value);if(!skill)return;if(!title||!url)return toast('Enter a resource title and a valid http or https link.');learningResources(skill).push({title,url});save();}
function removeLearningResource(id,i){const skill=getLearningSkills().find(s=>s.id===id);if(!skill)return;snapshotForUndo('Resource removed');learningResources(skill).splice(i,1);save();}
function openLearningPlanner(){getLearningDraft().category=learningPage==='vichara'?'hobby':'skill';learningPage='drill';learningBuilderOpen=true;save();}
function learningCapacityMinutes(){return Number(state.learningCapacityMinutes)||120;}
function setLearningCapacity(hours){const n=Number(hours);if(!Number.isFinite(n)||n<0.25||n>24)return toast('Choose 0.25–24 hours.');state.learningCapacityMinutes=Math.round(n*60);save();}
function learningLoad(iso){return getLearningSkills().filter(s=>!s.plan?.paused).flatMap(s=>s.plan?.sessions||[]).filter(x=>x.date===iso).reduce((n,x)=>n+Number(x.minutes||0),0);}
function renderLearningCapacity(){const iso=dateForDay(selectedDay),load=learningLoad(iso),cap=learningCapacityMinutes();return `<div style="margin-top:16px"><label class="small">Daily capacity across both pages · hours <input type="number" style="width:90px" min="0.25" max="24" step="0.25" aria-label="Daily learning capacity hours" value="${cap/60}" onchange="setLearningCapacity(this.value)"></label><p class="small" role="status">${niceDate(iso)} · ${load} / ${cap} min planned${load>cap?' · Over capacity — pause a plan or reschedule unfinished sessions.':''}</p></div>`;}
function pauseLearningPlan(id){const p=getLearningSkills().find(s=>s.id===id)?.plan;if(!p)return;p.paused=true;p.pausedOn=todayISO();save();}
function rescheduleLearningPlan(id,resume=false){
const p=getLearningSkills().find(s=>s.id===id)?.plan;if(!p)return;
const start=resume?todayISO():document.getElementById('reschedule_'+id)?.value;
if(!start||!/^\d{4}-\d{2}-\d{2}$/.test(start)||Number.isNaN(Date.parse(start+'T12:00:00'))||fmtLocal(new Date(start+'T12:00:00'))!==start)return toast('Choose a valid date.');
const pending=p.sessions.filter(x=>!x.tasks.length||!x.tasks.every(t=>t.done));
if(!pending.length)return toast('All sessions are already complete.');
const dates=learningPlanDates(start,pending.length,p.cadence);
const over=dates.some((date,i)=>{const other=getLearningSkills().flatMap(s=>s.plan?.paused?[]:(s.plan?.sessions||[]).filter(x=>!pending.includes(x))).filter(x=>x.date===date).reduce((n,x)=>n+Number(x.minutes||0),0);return other+pending[i].minutes>learningCapacityMinutes();});
if(over)return toast('Reschedule exceeds daily capacity. Choose another date, pause a plan, or increase capacity.');
snapshotForUndo('Learning schedule changed');
pending.forEach((x,i)=>x.date=dates[i]);p.paused=false;delete p.pausedOn;save();toast('Unfinished sessions rescheduled. Completed sessions kept.');
}

const LEARNING_KINDS={skill:'Skill',topic:'Topic',codex:'Codex',software:'Software',hobby:'Hobby',language:'Language · Vine',other:'Topic to master'};
let learningPage='vidya';
function setLearningPage(page){learningPage=page;render();}
function resetActivityStart(){

/* Per-day data is stored under keys relative to Day 1 (e.g. "d12"), not under the actual
calendar date — so when the start date moves, every one of those keys has to move with it,
by the same number of days, or old entries would silently resurface under the new Day 1
onward instead of staying put on the dates they were actually recorded for. */
const DAY_KEYED_FIELDS = ["days","checkins","meals","water","move","journal","foodLog","coffeeLog","pomodoro","gapDecisions","bizChecklistDone"];
function shiftDayKeyedData(shift){
if(!shift) return;
DAY_KEYED_FIELDS.forEach(f=>{
const src = state[f]; if(!src || typeof src!=="object" || Array.isArray(src)) return;
const out = {};
Object.keys(src).forEach(k=>{
const m = /^d(-?\d+)$/.exec(k);
if(!m){ out[k] = src[k]; return; }
out["d"+(parseInt(m[1],10)+shift)] = src[k];
});
state[f] = out;
});
if(state.exercisePlanDone && typeof state.exercisePlanDone==="object"){
const out = {};
Object.keys(state.exercisePlanDone).forEach(k=>{
const n = parseInt(k,10);
if(Number.isNaN(n)){ out[k] = state.exercisePlanDone[k]; return; }
out[String(n+shift)] = state.exercisePlanDone[k];
});
state.exercisePlanDone = out;
}
if(Array.isArray(state.brainDump)){
state.brainDump = state.brainDump.map(it => (it && typeof it.day==="number") ? {...it, day: it.day+shift} : it);
}
}

function importBackup(evt){

if(!file)return;
const reader=new FileReader();
reader.onload=async function(e){
try{
const incoming=JSON.parse(e.target.result);
if(!confirm("Import this backup? It will replace everything currently on this profile.")) return;
state=normalizeStateArrays(Object.assign({}, defaultState(), incoming));
state.lastSaved = new Date().toISOString();
// Device copy first — this alone guarantees the import isn't lost even if everything below
// fails or the tab closes.
saveLocalOnly();
// The cloud save MUST finish (or definitively fail) before reloading — the old code called
// pushToFirebase() (which debounces 400ms, then saves) and reloaded immediately after,
// almost always cutting the cloud write off mid-flight. Push directly and await it instead.
if(fbReady && stateRef){
clearTimeout(syncTimer);
try{
lastPushedJSON = JSON.stringify(state);
await stateRef.set(state);
location.reload();
}catch(err){
console.error("Import: cloud save failed:", err);
alert("The import was saved on this device, but saving it to the cloud failed (" + (err&&err.message||err) + "). It will sync next time you're online — not reloading yet so you can retry \"Sync now\" from the Account panel first if you'd like.");
}
}else{
location.reload();
}
}catch(err){
alert("That file doesn't look like a valid backup (couldn't be read as JSON).");
}
};
reader.readAsText(file);
evt.target.value="";
}

if(!raw.trim()){acctMsg("Enter a new profile name.",true);return;}
if(next===profileId){acctMsg("That is already this profile name.",true);return;}
if(!confirm(`Rename this profile from "${profileId}" to "${next}"? Its saved data will be moved to the new profile name.`))return;
const old=profileId, oldKey=STORAGE_KEY+"_"+old, newKey=STORAGE_KEY+"_"+next;
try{
const local=localStorage.getItem(oldKey);
if(local!==null)localStorage.setItem(newKey,local);
if(fbReady){
const db=firebase.database();
const snap=await db.ref("adhdPlannerState/"+old).once("value");
if(snap.exists()) await db.ref("adhdPlannerState/"+next).set(snap.val());
const prof=await db.ref("adhdPlannerProfiles/"+old).once("value");
if(prof.exists()) await db.ref("adhdPlannerProfiles/"+next).set(prof.val());
}
localStorage.setItem("dinacharya_profileId",next);
profileId=next;
acctMsg("Profile renamed. Reloading…",false);
location.reload();
}catch(e){acctMsg("Could not rename profile: "+(e.message||"sync error"),true);}
}
function switchProfileFromInput(){
const v = (document.getElementById("acctSwitchInput")||{}).value || "";
const id = sanitizeProfileId(v);
if(!id){ acctMsg("Enter a name for the new profile.", true); return; }
if(id === profileId){ acctMsg("That's already the current profile.", true); return; }
if(!confirm("Switch to tracker \""+id+"\"? The app will reload.")) return;
localStorage.setItem("dinacharya_profileId", id);
location.reload();
}

showProfilePicker(); // ask which tracker to open every time the app opens, then (via confirmProfile) the passcode lock before entering
setInterval(()=>cloudResyncNow(false), 15*60*1000);
restorePomoState(); // pick the focus timer back up where it actually is, even after a refresh or a backgrounded tab
</script>
