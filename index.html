<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinacharya • A Daily Promise</title>
<meta name="theme-color" content="#232150">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fffefa; --ink:#2a2740; --muted:#73708a;
  --accent:#3d4a8a; --accent-2:#232150; --soft:#e6e3f2; --mint:#eceaf7;
  --line:#dcd8ea; --gold:#c9ae77; --warn:#8a5a2e; --rest-bg:#eceaf2;
  --turquoise:#4a7a8a; --indigo:#6a4a8a;
  --glass-bg:linear-gradient(165deg,rgba(255,253,245,.9),rgba(255,247,222,.78));
  --glass-border:rgba(201,174,119,.4);
  --glass-glow:0 0 0 1px rgba(255,255,255,.5) inset,0 2px 18px rgba(201,174,119,.14);
  --glass-glow-hover:0 0 0 1px rgba(255,255,255,.6) inset,0 4px 26px rgba(201,174,119,.26);
  }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 "Nunito Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:500;letter-spacing:-.015em;margin:0 0 6px;color:var(--accent-2)}
button,input,select,textarea{font-family:inherit}
.bg-wm{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.055;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg-wm svg{width:150vmin;height:150vmin;transition:opacity .4s}
.bg-wm svg *{stroke:#a9873f}
header,main,.pc-overlay{position:relative;z-index:1}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ===== Header / nest nav ===== */
header{background:radial-gradient(ellipse at 15% -20%,#3a3570 0%,transparent 50%),linear-gradient(150deg,#1c1a3d 0%,#232150 55%,#2f2d66 100%);padding:0 0 0;color:#fdf9ee;position:sticky;top:0;z-index:30;box-shadow:0 6px 24px #1c1a3d2e,0 1px 0 rgba(228,194,102,.25)}
.hdr-inner{padding:18px 0 0}
.hdr-trim{height:9px;background-image:linear-gradient(135deg,var(--gold) 25%,transparent 25.5%),linear-gradient(225deg,var(--gold) 25%,transparent 25.5%);background-position:0 0,7px 0;background-size:14px 9px;opacity:.6;box-shadow:0 0 12px 1px rgba(228,194,102,.35)}
.affirm-strip{text-align:center;font-family:"Fraunces",serif;font-style:italic;font-size:14px;color:var(--accent-2);background:var(--mint);border:1px solid var(--line);border-radius:14px;padding:11px 16px;margin-bottom:14px}
.lotus-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 16px;color:var(--gold)}
.lotus-divider::before,.lotus-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.lotus-divider span{font-size:13px;letter-spacing:.06em}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .leaf{font-size:20px}
.brand b{font-family:"Fraunces",serif;font-weight:500;font-size:19px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:#d8d4ec;letter-spacing:.04em}
.datepill{font-size:12px;background:#ffffff1c;border:1px solid #ffffff30;padding:5px 11px;border-radius:99px;color:#fdf9ee;white-space:nowrap}
.nestnav{display:flex;gap:6px;margin-top:18px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.nestnav::-webkit-scrollbar{display:none}
.nestbtn{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:transparent;border:0;color:#d8d4ec;padding:10px 16px;border-radius:14px 14px 0 0;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;position:relative;top:1px;transition:background .15s,color .15s}
.nestbtn .ic{font-size:15px}
.nestbtn:hover:not(.on):not(.soon){background:rgba(228,194,102,.1);color:#f4e5bd}
.nestbtn.on{background:var(--bg);color:var(--accent-2);box-shadow:0 -1px 0 rgba(228,194,102,.5) inset}
.nestbtn.soon{opacity:.55;cursor:default}
.nestbtn .tag{font-size:9px;font-weight:800;background:#ffffff20;border-radius:99px;padding:1px 6px;margin-left:2px}
.nestbtn.on .tag{background:var(--mint);color:var(--accent)}
main{padding:22px 0 60px}

/* ===== shared card ===== */
.card{background:var(--glass-bg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--glass-border);border-radius:20px;padding:18px 19px;box-shadow:var(--glass-glow);transition:box-shadow .2s}
.card.card-compact{padding:12px 14px;border-radius:16px}
.card.card-compact h3{font-size:13px;margin:0}
.card.card-compact .small{font-size:11.5px}
.card.card-compact .counterbox{gap:6px}
.card.card-compact .cval{font-size:13px!important}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.card.card-compact .btn.sm{padding:3px 8px;font-size:11.5px}
.card.card-compact .macro-glance{margin-top:4px}
.card.card-compact .cofcup-row{margin-top:6px}
.card:hover{box-shadow:var(--glass-glow-hover)}
.card h3{font-size:14.5px;margin:0 0 4px;letter-spacing:.01em}
.card>p.small:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}
@media(max-width:720px){.span6,.span4{grid-column:span 12}}
.small{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid rgba(228,194,102,.4);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:700;font-size:13.5px;box-shadow:0 2px 10px rgba(35,33,80,.18);transition:box-shadow .15s,transform .15s}
.btn:hover:not(:disabled){box-shadow:0 0 0 1px rgba(228,194,102,.5),0 4px 18px rgba(201,174,119,.35);transform:translateY(-1px)}
.btn.secondary{background:linear-gradient(165deg,rgba(255,255,255,.9),rgba(255,249,230,.75));color:var(--accent-2);border:1px solid var(--glass-border);box-shadow:var(--glass-glow)}
.btn.secondary:hover:not(:disabled){box-shadow:0 0 0 1px rgba(228,194,102,.45),0 3px 14px rgba(201,174,119,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent-2);text-decoration:underline;padding:4px 2px;font-weight:600;box-shadow:none;border:0}
.export-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);border:1.5px solid var(--gold);color:var(--accent-2);padding:7px 14px;border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;transition:background .15s,box-shadow .15s,transform .15s}
.export-btn:hover{background:rgba(228,194,102,.12);box-shadow:0 0 0 1px rgba(228,194,102,.5),0 2px 16px rgba(201,174,119,.4);transform:translateY(-1px)}
.export-btn .arrow{display:inline-block;transition:transform .15s}
.export-btn:hover .arrow{transform:translateY(-2px)}
.link-btn{background:none;border:0;padding:0;margin:0;color:var(--accent-2);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{opacity:.82}
.chip{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-size:12.5px;cursor:pointer;color:var(--accent-2);transition:box-shadow .15s}
.chip:hover{box-shadow:0 0 0 1px rgba(228,194,102,.35)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:var(--gold);color:#fff;box-shadow:0 0 0 1px rgba(228,194,102,.45),0 2px 12px rgba(201,174,119,.3)}
.chip.mini{padding:3px 8px;font-size:10.5px}
.catalog-chip{font-size:11.5px}
.catalog-chip.added{background:var(--mint);border-color:var(--accent);color:var(--accent-2)}
.blkicon{cursor:pointer;display:inline-block}

/* ===== Dashboard ===== */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:16px 18px;color:#fdf9ee;background:radial-gradient(ellipse at 110% -10%,#c9ae7745 0%,transparent 55%),linear-gradient(150deg,#232150,#15132e 75%);border:1px solid rgba(228,194,102,.35);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 36px 2px rgba(201,174,119,.16),0 10px 30px #0b0a1c55}
.hero-wm{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;opacity:.07;pointer-events:none;overflow:hidden}
.hero-wm svg{width:110%;height:auto}
.hero-wm svg *{stroke:#f4e2ab}
.hero .eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#e8c98a;font-weight:700}
.hero h1{color:#fdf9ee;font-size:clamp(18px,3vw,22px);margin:4px 0 3px;text-shadow:0 0 18px rgba(244,227,171,.25)}
.hero p{color:#ecdcc0;max-width:48ch;margin:0;font-size:12.5px}
.hero .hero-text{position:relative;z-index:1}
.hero .mandala2{position:absolute;right:-30px;top:-30px;width:110px;height:110px;opacity:.22;pointer-events:none;z-index:0}
.hero-art-picker{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:4px}
.hero-art-picker .hap-btn{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:10.5px;cursor:pointer;opacity:.55;transition:opacity .15s}
.hero-art-picker .hap-btn.on{opacity:1;background:rgba(255,255,255,.18)}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative}
.stat{background:#ffffff12;border:1px solid #ffffff22;border-radius:12px;padding:6px 11px;min-width:74px}
.stat b{display:block;font-family:"Fraunces",serif;font-size:16px;font-weight:500;color:var(--gold);text-shadow:0 0 10px rgba(201,174,119,.45)}
.stat span{font-size:9.5px;color:#e8c98a}
.quotecard{background:linear-gradient(135deg,rgba(236,234,247,.75),rgba(255,254,250,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:18px;padding:18px 20px;position:relative;box-shadow:var(--glass-glow)}
.quotecard p{font-family:"Fraunces",serif;font-style:italic;font-size:18px;line-height:1.5;margin:0 0 6px;color:var(--accent-2)}
.quotecard span{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.knot{width:14px;height:14px;flex:0 0 auto;opacity:.75}
.mantra-line{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(236,234,247,.7),rgba(255,251,236,.85));border:1px solid rgba(201,174,119,.3);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:9px 13px;margin-bottom:12px;box-shadow:0 2px 10px rgba(201,174,119,.1)}
.mantra-line b{font-family:"Fraunces",serif;font-size:14.5px;color:var(--accent-2);white-space:nowrap}
.mantra-line p{margin:0;font-family:"Fraunces",serif;font-style:italic;font-size:12.5px;color:var(--muted);line-height:1.4}
.tip-card{padding:12px 14px}
.tip-card-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-2);margin-bottom:4px}
.tip-card-text{margin:0;font-family:"Fraunces",serif;font-style:italic;font-size:13.5px;color:var(--muted);line-height:1.45}
.calcard{max-width:min(340px,100%);margin:0 auto;padding:14px 15px}
.calcard .caltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.calcard .caltop .nm{font-family:"Fraunces",serif;font-size:14.5px}
.calcard .caltop .btn.secondary{padding:4px 10px;font-size:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:280px;margin:0 auto}
.calgrid .wd{font-size:9px;text-align:center;color:var(--muted);padding-bottom:2px}
.calgrid .cell{aspect-ratio:1;max-width:34px;margin:0 auto;width:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;background:#f4f7ee;color:var(--muted);border:1px solid transparent}
.calgrid .cell.empty{background:transparent}
.calgrid .cell.locked{color:#cac3ae;text-decoration:line-through;cursor:not-allowed}
.calgrid .cell.l1{background:var(--soft);color:var(--accent)}
.calgrid .cell.l2{background:#cfc9ec;color:#2f2d66}
.calgrid .cell.l3{background:var(--accent);color:#fff}
.calgrid .cell.today{outline:2px solid var(--gold);outline-offset:1px}
/* Scale the calendar up on laptop/desktop widths — phones keep the compact sizing above. */
@media(min-width:700px){
  .calcard{width:100%;max-width:none;box-sizing:border-box;padding:28px 34px}
  .calcard .caltop .nm{font-size:19px}
  .calcard .caltop .btn.secondary{padding:6px 14px;font-size:14px}
  .calgrid{width:100%;max-width:none;box-sizing:border-box;gap:clamp(8px,1.2vw,18px)}
  .calgrid .wd{font-size:12px;padding-bottom:4px}
  .calgrid .cell{width:100%;max-width:none;font-size:clamp(16px,1.5vw,22px);border-radius:12px}
}
.calcard p.small{text-align:center;font-size:11px}

/* ===== Today nest ===== */
.todaytabs{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;overflow:visible}
.todaytabs button{flex:none}
.todaytabs button{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent-2);transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;opacity:.6}
.todaytabs button:hover{transform:translateY(-1px);opacity:.85}
.todaytabs button.on{opacity:1;border-color:var(--accent);background:rgba(61,74,138,.1);box-shadow:0 0 0 3px rgba(61,74,138,.12);transform:scale(1.08)}

/* strip */
.strip-scroll{position:relative;display:flex;gap:16px;overflow-x:auto;padding:18px 6px 14px;scrollbar-width:thin}
.strip-scroll::before{content:"";position:absolute;left:6px;right:6px;top:38px;height:2px;background:var(--line);z-index:0}
.bead{flex:0 0 auto;width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;z-index:1}
.bead .circ{position:relative;width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;transition:transform .12s,box-shadow .15s}
.bead:active .circ{transform:scale(.92)}
.bead.done .circ{background:var(--mint);border-color:var(--accent);box-shadow:0 2px 8px rgba(61,74,138,.18)}
.bead.done .circ::after{content:"✓";position:absolute;bottom:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.bead.now .circ{border-color:var(--gold);box-shadow:0 0 0 3px #c9ae7733}
.bead .t{font-size:9.5px;color:var(--muted);font-weight:700;white-space:nowrap}

/* timeline */
.timeline{position:relative;margin-top:4px}
.tblock{display:flex;gap:12px;padding:10px 0;border-left:2px solid var(--line);margin-left:7px;padding-left:16px;position:relative}
.tblock:last-child{border-left-color:transparent}
.tblock::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tblock.done::before{background:var(--accent);border-color:var(--accent)}
.tblock.now::before{background:var(--gold);border-color:var(--gold)}
.tblock.anchor .bar{border-left:3px solid var(--warn)}
.tblock.skipped{opacity:.6}
.tblock.skipped .tbody{background:var(--rest-bg)}
.skiptag{background:var(--warn)!important;color:#fff!important}
.tbody{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer}
.tblock.done .tbody{background:var(--mint);border-color:var(--gold)}
.tblock.now .tbody{border-color:var(--gold)}
.tbody .thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tbody .time{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.tbody .nm{font-weight:700;font-size:14.5px;margin:3px 0 0}
.tbody .nm.doneline{text-decoration:line-through;color:var(--muted)}
.tbody .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.tbody .dur{font-size:10.5px;background:var(--mint);color:var(--accent-2);padding:2px 8px;border-radius:99px;white-space:nowrap}
.checkdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;align-self:center;cursor:pointer;background:#fff}
.checkdot.on{background:var(--accent);border-color:var(--accent);position:relative}
.checkdot.on::after{content:"✓";color:#fff;font-size:12px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

/* Apple-inspired Today workspace: system typography, soft surfaces, responsive text */
:root{--apple-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body,button,input,select,textarea{font-family:var(--apple-font)}
.today-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:stretch;margin-top:12px;overflow:visible;min-height:0}
.today-agenda,.apple-day-card,.today-additions{min-width:0;min-height:0;border-radius:18px;box-shadow:0 2px 12px rgba(35,40,60,.055);border:1px solid rgba(120,125,145,.18);font-family:var(--apple-font);container-type:inline-size}
.today-agenda,.today-additions{overflow:hidden;max-width:100%}
.today-split.timeplan-is-expanded{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);}
.today-agenda.timeplan-expanded{width:auto!important;max-width:none;box-sizing:border-box;box-shadow:0 2px 14px rgba(0,0,0,.08);border-radius:18px;background:var(--card,#fff);}
.today-agenda.timeplan-expanded .timeplan-scroll{height:calc(100vh - 250px);max-height:none}
@media(max-width:1000px){.today-split.timeplan-is-expanded{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:760px){.today-split.timeplan-is-expanded{grid-template-columns:minmax(0,1fr)}}
.timeplan-head-actions{display:flex;align-items:center;gap:8px}
.timeplan-expand-btn{border:1px solid rgba(120,125,145,.25);background:rgba(120,125,145,.07);border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;color:inherit}
.today-agenda{padding:10px 9px!important;display:flex;flex-direction:column;min-height:0}
.timeplan-scroll{min-height:0;height:calc(100vh - 250px);max-height:none;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;padding-right:3px}
.today-agenda .tblock{gap:6px;padding:6px 0 6px 10px;margin-left:4px}
.today-agenda .tbody{padding:7px 8px;border-radius:9px}
.today-agenda .tbody .nm{font-size:11.5px;margin-top:2px}
.today-agenda .tbody .time,.today-agenda .tbody .meta{font-size:9px}
.today-agenda .tbody .dur{font-size:9px;padding:2px 5px}
.today-agenda .tblock{align-items:flex-start}
.today-agenda .blkicon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:transparent;border:1px solid #b8b5c333;font-size:13px;vertical-align:middle;margin-right:3px}
.today-agenda .tbody .nm{line-height:1.25}
.today-agenda .tt-code{display:inline-flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.tt-code-tag{font-size:8px;line-height:1.25;padding:2px 5px;border:1px solid currentColor;border-radius:99px;background:transparent!important;opacity:.86}

/* Compact Time Plan: keep each activity on one line where possible. */
.today-agenda .tblock{gap:4px;padding:3px 0 3px 8px;margin-left:3px;align-items:center}
.today-agenda .tbody{padding:4px 6px;min-width:0;overflow:hidden}
.today-agenda .thead{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.today-agenda .tbody .time{white-space:nowrap;font-size:10px}
.today-agenda .tbody .dur{white-space:nowrap;font-size:8px;padding:1px 4px}
.today-agenda .tbody .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;font-size:11.5px;margin:0}
.today-agenda .tbody .meta,.today-agenda .tt-code{display:none}
.today-agenda .blkicon{width:15px;height:15px;font-size:10px;margin-right:2px;flex-shrink:0}

.today-agenda .checkdot{width:17px;height:17px}
.today-agenda .tblock::before{width:8px;height:8px;left:-5px;top:11px}
.today-agenda .timeline{margin-top:0}
.apple-day-card{padding:14px 12px;overflow:hidden;min-width:0;resize:horizontal;max-width:100%;transform-origin:right center}
.apple-day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

      try{ localStorage.setItem(pcLocalKey(), remoteHash); }catch(e){}
      locallyKnownPcHash = remoteHash;
      if(!hasValidSession() && !appLocked){ appLocked = true; showLockScreen(); }
    } else if(locallyKnownPcHash){
      try{ localStorage.removeItem(pcLocalKey()); }catch(e){}
      locallyKnownPcHash = null;
    }
  }).catch(()=>{});
  pullInitialState(2);
}
/* A flaky mobile connection can fail the very first read even though Firebase is reachable a
   moment later — retry a couple of times with a short backoff before giving up and falling
   back to the on-device copy. */
function pullInitialState(retriesLeft){
  stateRef.once("value").then(snap=>{
    const remote = snap.val();
    if(remote){
      state = Object.assign({}, loadState(), remote);
      state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
      saveLocalOnly();
    }
    attachRemoteListener();
    setSyncPill("☁️ synced");
    updateSavedLabel();
    if(!appLocked) render();
    autoImportOldAppData();
  }).catch(err=>{
    if(retriesLeft>0){ setTimeout(()=>pullInitialState(retriesLeft-1), 1500); return; }
    console.error("Firebase pull failed:", err);
    setSyncPill("⚠️ sync error — using device copy");
    if(!appLocked) render();
  });
}
function cloudResyncNow(manual){
  if(!fbReady || !stateRef){ if(manual) acctMsg("You're offline — nothing to sync right now.", true); return; }
  setSyncPill("☁️ syncing…");
  stateRef.once("value").then(snap=>{
    const remote = snap.val();
    if(remote && remote.lastSaved && (!state.lastSaved || new Date(remote.lastSaved) > new Date(state.lastSaved))){
      state = Object.assign({}, state, remote);
      state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
      saveLocalOnly();
      if(!appLocked) render();
    }
    setSyncPill("☁️ synced");
    updateSavedLabel();
    if(manual) acctMsg("Synced ✓", false);
  }).catch(err=>{
    console.error("Resync failed:", err);
    setSyncPill("⚠️ sync error");
    if(manual) acctMsg("Sync failed — check your connection.", true);
  });
}
function attachRemoteListener(){
  stateRef.on("value", snap=>{
    const remote = snap.val();
    if(!remote) return;
    const json = JSON.stringify(remote);
    if(json === lastPushedJSON) return; // our own write echoing back
    // Last-write-wins: a shared profile (Guest above all — many devices can have it open
    // at once) can have another device's listener fire with an OLDER snapshot than what
    // we just saved locally (e.g. it was already mid-flight before our save went out).
    // Without this check, that stale snapshot silently overwrites a change — like a
    // just-set start date — moments after it was made. Only accept the remote version
    // when it's actually newer than what we already have.
    if(remote.lastSaved && state.lastSaved && new Date(remote.lastSaved) <= new Date(state.lastSaved)) return;
    state = Object.assign({}, state, remote);
    state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
    saveLocalOnly();
    setSyncPill("☁️ updated from another device");
    updateSavedLabel();
    if(!appLocked) render();
  });
}
function pushToFirebase(){
  if(!fbReady || !stateRef) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{
    const json = JSON.stringify(state);
    lastPushedJSON = json;
    setSyncPill("☁️ saving…");
    stateRef.set(state).then(()=>{ setSyncPill("☁️ synced"); updateSavedLabel(); }).catch(err=>{
      console.error("Firebase push failed:", err);
      setSyncPill("⚠️ sync error — saved on device");
    });
  }, 400);
}
function saveLocalOnly(){ localStorage.setItem(storageKey(), JSON.stringify(state)); }
function save(){
  state.lastSaved = new Date().toISOString();
  saveLocalOnly();
  try{ render(); }catch(e){ console.error("render() failed during save:", e); }
  pushToFirebase();
  updateSavedLabel();
}
function saveQuiet(){ state.lastSaved = new Date().toISOString(); saveLocalOnly(); pushToFirebase(); updateSavedLabel(); }
/* header save button: always shows a ✓ Saved confirmation, even offline — saveLocalOnly()
   never fails, so the tick is an honest signal the device copy is safe, while pushToFirebase()
   keeps syncing to the cloud in the background. */
function manualSaveHeader(){
  const btn = document.getElementById("saveBtnHeader");

}

/* ---- undo: snapshot the whole state before each destructive action, keep up to 15 steps of history.
   The stack itself is never auto-cleared — only the little pop-up toast auto-hides after a few
   seconds. The history stays available from the ⚙️ Account panel until it's actually used. ---- */
const UNDO_MAX = 15;
let undoStack = [], undoToastTimer = null;
function snapshotForUndo(label){
  undoStack.push({label, json: JSON.stringify(state)});
  if(undoStack.length>UNDO_MAX) undoStack.shift();
  renderUndoToast();
}
function performUndo(){
  if(!undoStack.length) return;
  const last = undoStack.pop();
  state = JSON.parse(last.json);
  state.lastSaved = new Date().toISOString();
  saveLocalOnly(); pushToFirebase(); render(); renderUndoToast(); updateSavedLabel();
}
let toastTimer = null;
function toast(msg, bad){
  let el = document.getElementById("toastMsg");
  if(!el){ el = document.createElement("div"); el.id = "toastMsg"; el.className = "toast-msg"; document.body.appendChild(el); }
  el.textContent = (bad? "⚠️ " : "") + msg;
  el.className = "toast-msg" + (bad? " bad" : "");
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display="none"; }, bad? 3600 : 2600);
}
function renderUndoToast(){
  const headerBtn = document.getElementById("undoBtnHeader");
  if(headerBtn){ headerBtn.disabled = !undoStack.length; headerBtn.title = undoStack.length? ("Undo: "+undoStack[undoStack.length-1].label+" ("+undoStack.length+")") : "Nothing to undo"; }
  const el = document.getElementById("undoToast");
  if(!el) return;
  clearTimeout(undoToastTimer);
  if(!undoStack.length){ el.style.display="none"; el.innerHTML=""; return; }
  const top = undoStack[undoStack.length-1];
  el.style.display="flex";
  el.innerHTML = `<span>${top.label}${undoStack.length>1?` <span style="opacity:.7">(${undoStack.length-1} more)</span>`:""}</span><button onclick="performUndo()">Undo</button>`;
  undoToastTimer = setTimeout(()=>{ el.style.display="none"; }, 8000); // hides the pop-up only — the stack itself stays intact
}

/* ---- automatic pull from the OLD app's Firebase data (adhdPlannerState/<profileId>) ----
   The old app ("A Daily Promise" / reset30) stored everything — pantry, shopping, and any
   custom foods you'd saved (with a "place" field marking restaurant dishes) — under the same
   kind of profile id this app uses. Runs quietly after every sync; only adds what's missing,
   never overwrites anything you've already got here. */
async function autoImportOldAppData(){
  if(!fbReady) return;
  try{
    const snap = await firebase.database().ref("adhdPlannerState/"+profileId).once("value");
    const old = snap.val();
    if(!old) return;
    let changed = false;
    state.pantry = state.pantry || [];
    state.shopping = state.shopping || [];
    state.customFoods = state.customFoods || [];
    if(old.pantry){
      Object.keys(old.pantry).forEach(name=>{
        if(old.pantry[name] && !state.pantry.some(p=>p.name.toLowerCase()===name.toLowerCase())){
          state.pantry.push({id:"p"+Date.now()+Math.random().toString(36).slice(2,6), name, qty:1, unit:"pcs", low:1});
          changed = true;
        }
      });
    }
    if(old.shopping){
      Object.keys(old.shopping).forEach(name=>{
        if(old.shopping[name] && !state.shopping.some(s=>s.name.toLowerCase()===name.toLowerCase())){
          state.shopping.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,6), name, done:false});
          changed = true;
        }
      });
    }
    const oldFoods = (old.wl && Array.isArray(old.wl.foods)) ? old.wl.foods : [];
    oldFoods.forEach(f=>{
      if(!f || !f.n) return;
      const exists = allFoodsForMeal("lunch").some(x=>x.n.toLowerCase()===f.n.toLowerCase());
      if(!exists){
        state.customFoods.push({n:f.n, k:Math.round(f.k)||0, p:Math.round(f.p)||0, c:Math.round(f.c)||0, f:Math.round(f.f)||0, meal:"lunch", src: f.place?"restaurant":"homemade"});
        changed = true;
      }
    });
    if(changed){ saveLocalOnly(); pushToFirebase(); render(); }
  }catch(err){ console.error("Auto old-app import failed:", err); }
}

/* ---- date helpers ---- */
function fmtLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function trackStartDate(){ return (state && state.startDate) || START_DATE; } // resettable via the Account panel — "Day 1" and the calendar count from here
function dayNumberFor(iso){
  const a = new Date(trackStartDate()+"T00:00:00"), b = new Date(iso+"T00:00:00");
  return Math.round((b-a)/86400000)+1;
}
function dateForDay(n){
  const d = new Date(trackStartDate()+"T00:00:00"); d.setDate(d.getDate()+(n-1)); return fmtLocal(d);
}
function todayISO(){ return fmtLocal(new Date()); }
function todayDayNum(){ return dayNumberFor(todayISO()); }
let selectedDay = Math.max(1, todayDayNum());
function niceDate(iso, opts){ return new Date(iso+"T00:00:00").toLocaleDateString(undefined, opts||{weekday:"long",day:"numeric",month:"long"}); }
function toMin(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function toHHMM(min){ min=((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }
function fmt12(hhmm){ const m=toMin(hhmm); let h=Math.floor(m/60), mm=m%60; const ap=h<12?"am":"pm"; h=h%12||12; return h+(mm?":"+String(mm).padStart(2,"0"):"")+" "+ap; }

/* ---- per-day block list ---- */
function dayKey(n){ return "d"+n; }
function getDayBlocks(n){
  state.days = state.days || {};
  if(!state.days[dayKey(n)]){
    state.days[dayKey(n)] = DEFAULT_TEMPLATE.map(b=>({...b, done:false}));
  }
  return state.days[dayKey(n)];
}
function setDayBlocks(n, list){ state.days[dayKey(n)] = list; }

/* ---- cascade edit logic ---- */
const DAY_END_TARGET = 23*60; // 11:00pm sleep target
function applyBlockEdit(n, id, patch){
  const list = getDayBlocks(n).map(b=>({...b}));
  const idx = list.findIndex(b=>b.id===id);
  if(idx<0) return {list, overflow:0};
  Object.assign(list[idx], patch);
  // recompute forward chain from idx+1 based on idx's new end time (skipped blocks cost 0 time)
  let cursor = toMin(list[idx].time) + effDur(list[idx]);
  for(let i=idx+1;i<list.length;i++){
    list[i].time = toHHMM(cursor);
    cursor += effDur(list[i]);
  }
  let overflow = Math.max(0, cursor - DAY_END_TARGET);
  if(overflow>0){
    // squeeze flexible (non-anchor, non-skipped) blocks after idx first
    let remaining = overflow;
    const flexIdxs = [];
    for(let i=idx+1;i<list.length;i++) if(!list[i].anchor && !list[i].skipped && list[i].dur>10) flexIdxs.push(i);
    const totalFlex = flexIdxs.reduce((s,i)=>s+(list[i].dur-10),0);
    if(totalFlex>0){
      flexIdxs.forEach(i=>{
        const share = (list[i].dur-10)/totalFlex;
        const cut = Math.min(remaining*share, list[i].dur-10);
        list[i].dur = Math.max(10, Math.round(list[i].dur - cut));
      });
      // recompute times again after trimming
      let c2 = toMin(list[idx].time) + effDur(list[idx]);
      for(let i=idx+1;i<list.length;i++){ list[i].time = toHHMM(c2); c2 += effDur(list[i]); }
      overflow = Math.max(0, c2 - DAY_END_TARGET);
    }
  }
  setDayBlocks(n, list);
  return {list, overflow};
}

/* ---- streak / activity ---- */
function dayActivity(n){
  const list = state.days && state.days[dayKey(n)];
  if(!list) return {frac:0, level:0, done:0, total:0};
  const done = list.filter(b=>b.done).length;
  const total = list.length;
  const frac = total? done/total : 0;
  return {frac, done, total, level: frac>=0.8?3:frac>=0.5?2:done>0?1:0};
}
function streakCount(){
  let n = todayDayNum(), streak=0;
  if(dayActivity(n).level===0) n--;
  while(n>=1 && dayActivity(n).level>0 && streak<3650){ streak++; n--; }
  return streak;
}

  const todayIso = todayISO(), selIso = dateForDay(selectedDay);
  let cells = "";
  for(let i=0;i<lead;i++) cells += `<div class="cell empty"></div>`;
  for(let d=1; d<=dim; d++){

    if(iso < trackStartDate()){ cells += `<div class="cell empty locked" title="Before the tracker's start date — not reachable">${d}</div>`; continue; }

function monthActiveCount(){
  const base = new Date(dateForDay(selectedDay)+"T00:00:00"); base.setMonth(base.getMonth()+calMonthOffset);
  const y=base.getFullYear(), m=base.getMonth(), dim=new Date(y,m+1,0).getDate();

function startLateToday(){
  const list = getDayBlocks(selectedDay);
  const current = list[0]?.time || "08:00";
  const entered = prompt("What time are you starting the day? Enter the new start time (HH:MM, 24-hour clock). The day’s timetable will shift by the same amount.", current);
  if(entered===null) return;
  if(!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(entered)){ alert("Enter a valid time in 24-hour format, e.g. 09:30."); return; }
  const delta = toMin(entered)-toMin(current);
  if(delta===0) return;
  list.forEach(b=>{ b.time = toHHMM(toMin(b.time)+delta); });
  save();
  toast("Timetable shifted by "+Math.abs(delta)+" min "+(delta>0?"later":"earlier")+" ✓");
  render();
}

/* ---- done / skip-inference logic ---- */
function effDur(b){ return b.skipped ? 0 : b.dur; }
function recomputeCascade(list){
  if(!list.length) return;
  let cursor = toMin(list[0].time);
  for(let i=0;i<list.length;i++){
    list[i].time = toHHMM(cursor);
    cursor += effDur(list[i]);
  }
}
function inferSkipped(list, idx){
  let i = idx-1;
  while(i>=0 && !list[i].done){
    if(list[i].anchor) break; // anchors are checkpoints — don't guess past them
    list[i].skipped = true;
    i--;
  }
}
function toggleDone(id){
  const list = getDayBlocks(selectedDay);
  const idx = list.findIndex(x=>x.id===id); if(idx<0) return;
  const b = list[idx];
  b.done = !b.done;
  if(b.done){
    b.skipped = false;
    inferSkipped(list, idx);
  }
  recomputeCascade(list);
  save();
}
function unskipBlock(id){
  const list = getDayBlocks(selectedDay);
  const b = list.find(x=>x.id===id); if(!b) return;
  b.skipped = false;
  recomputeCascade(list);
  save();
}

/* ---- gap-before-sleep handling (ask each time) ---- */
function sleepGapInfo(list){
  if(!list.length) return null;
  const sleep = list[list.length-1];
  const gap = DAY_END_TARGET - toMin(sleep.time);
  return {sleep, gap};
}
function resolveGap(n, choice){
  state.gapDecisions = state.gapDecisions || {};
  state.gapDecisions[dayKey(n)] = choice;

}

function pullThoughtVaultTasks(){
  const targetISO=dateForDay(selectedDay);
  const pending=(state.brainDump||[]).filter(it=>(it.scope||"business")==="today" && !it.done && (it.calendarDate || (Number.isFinite(Number(it.day)) ? dateForDay(Number(it.day)) : "")) < targetISO);
  if(!pending.length){toast("No remaining tasks to pull");return;}
  snapshotForUndo("Previous Thought Vault tasks pulled");
  let minute=(targetISO===todayISO()) ? new Date().getHours()*60+new Date().getMinutes() : 9*60;
  for(const item of pending){
    let activity=(state.parallelActivities||[]).find(a=>String(a.id)===String(item.calendarActivityId));
    if(activity){
      activity.date=targetISO;
      activity.time=toHHMM(minute);
      activity.dur=Number(activity.dur)||30;
      activity.done=false;
    }else{
      const id="pa"+Date.now()+Math.random().toString(36).slice(2,6);
      activity={id,date:targetISO,title:item.text,time:toHHMM(minute),dur:30,icon:"📌",done:false,brainDumpId:item.id,type:item.type||"todo",priority:item.priority||"yellow",category:"Planned",desc:item.desc||""};
      state.parallelActivities=state.parallelActivities||[];state.parallelActivities.push(activity);
      item.calendarActivityId=id;
    }
    item.calendarDate=targetISO;item.day=selectedDay;item.done=false;item.scope="today";
    minute+=Math.max(30,Number(activity.dur)||30);
    if(minute>=23*60) minute=9*60;
  }
  save();toast(pending.length+" remaining task(s) pulled into this day");
}

    ${scope==="today" && previousPending ? `<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn secondary" onclick="pullThoughtVaultTasks()">Pull remaining from previous days (${previousPending})</button></div>` : ""}
    <div class="bd-input" style="margin-top:10px">
      <input type="text" id="bdInput" placeholder="${scope==="today"?"Call someone, pick up groceries…":"Business idea, client follow-up…"}" oninput="bdOnInput()" onkeydown="if(event.key==='Enter')addBrainDump()">
      <button class="btn" onclick="addBrainDump()">Add</button>
    </div>
    <div id="bdOptions" style="display:none">
      <div class="row" style="margin-top:9px;gap:6px">
        ${BD_TYPES.map(([id,l])=>`<button class="chip ${bdDraftType===id?'on':''}" onclick="setBdType('${id}')">${l}</button>`).join("")}
      </div>
      <div class="row" style="margin-top:7px;gap:6px">
        ${BD_PRIORITIES.map(([id,l])=>`<button class="pchip ${bdDraftPriority===id?'on':''}" style="--pc:${BD_COLOR[id]}" title="${l}" onclick="setBdPriority('${id}')"><span class="dot"></span>${id}</button>`).join("")}
      </div>
    </div>
    <div class="row" style="margin-top:14px;gap:6px">
      <button class="chip ${bdFilter==='All'?'on':''}" onclick="bdFilter='All';render()">All (${all.length})</button>
      ${BD_PRIORITIES.map(([id])=>`<button class="pchip ${bdFilter===id?'on':''}" style="--pc:${BD_COLOR[id]}" onclick="bdFilter='${id}';render()"><span class="dot"></span>${id} (${all.filter(x=>x.priority===id).length})</button>`).join("")}
    </div>
    <div class="bd-list" style="margin-top:12px">
      ${items.length? items.map(it=>`
        <div class="bd-item ${it.done?'done':''}" style="border-left:4px solid ${BD_COLOR[it.priority]||'var(--line)'}">
          <input type="checkbox" ${it.done?"checked":""} onchange="toggleBd('${it.id}')">
          <div style="flex:1">
            <span>${it.text}</span>
            <div class="bdtype-tag">${typeLabel(it.type)}</div>
          </div>
          <button onclick="deleteBd('${it.id}')">✕</button>
        </div>`).join("") : `<p class="small">Nothing here for this filter.</p>`}
    </div>
  </div>`;
}

const EGG_RE = /egg|omelette|omelet|frittata/i;
const SI_RE = /idli|dosa|sambar|rasam|uttapam|pongal|upma|poriyal|vada|pesarattu|adai|chutney|bisi bele|avial|thoran|kootu|rava|semiya|kadhi/i;

  return FOOD_CATALOG.concat(state.customFoods||[]).concat(BRANDED_FOODS);

function brandedFoodFor(name){
  const n = (name||"").toLowerCase();

}
/* ---- daily macro log (protein/carbs/fat/sugar/caffeine consumed vs target) ---- */
function foodMacroLookup(name){
  const n = (name||"").toLowerCase();
  const hit = FOOD_CATALOG.concat(state.customFoods||[]).concat(BRANDED_FOODS).find(f=>f.n.toLowerCase()===n);
  return hit ? {k:hit.k||0, p:hit.p||0, c:hit.c||0, f:hit.f||0, s:hit.s||0, caf:hit.caf||0} : null;
}
function logFoodEntry(meal, name){
  state.foodLog = state.foodLog || {};
  const key = dayKey(selectedDay);
  state.foodLog[key] = state.foodLog[key] || [];
  const macro = foodMacroLookup(name) || {k:0,p:0,c:0,f:0,s:0,caf:0};
  state.foodLog[key].push({id:"fl"+Date.now()+Math.random().toString(36).slice(2,5), name, meal, ...macro, ts:Date.now()});
}
/* ---- frequency nudges: how often has this item been logged recently ---- */
function foodFrequencyCount(name, days){
  const nl = (name||"").toLowerCase();
  let count = 0;
  for(let d=selectedDay-(days-1); d<=selectedDay; d++){
    const entries = (state.foodLog||{})[dayKey(d)] || [];
    entries.forEach(e=>{ if((e.name||"").toLowerCase()===nl) count++; });
  }
  return count;
}
let lastFoodNote = null;
function noteForLoggedFood(name){
  const b = brandedFoodFor(name);
  if(!b || (b.tag!=="bad" && b.tag!=="okay")) { lastFoodNote = null; return; }
  const freq = foodFrequencyCount(name, 7);
  let msg = b.tag==="bad" ? `Not recommended: ${b.note}.` : `Okay, watch it: ${b.note}.`;
  if(freq>=3) msg += ` That's ${freq} times in the last 7 days — getting frequent.`;
  if(b.swap) msg += ` Next time try: ${b.swap}.`;
  lastFoodNote = {name, tag:b.tag, msg};
}
function dismissFoodNote(){ lastFoodNote = null; render(); }

const COFFEE_TYPES = {
  filter:{n:"Filter coffee", d:"South Indian: ½ milk, ½ decoction", k:65,p:3.4,f:3.4,c:5,s:0,caf:100},

function getCoffeeLog(n){ state.coffeeLog = state.coffeeLog||{}; const k=dayKey(n); state.coffeeLog[k]=state.coffeeLog[k]||[]; return state.coffeeLog[k]; }
function coffeeCupAdd(){ const l=getCoffeeLog(selectedDay); if(l.length>=8) return; l.push(l.length?l[l.length-1]:"filter"); save(); }
function coffeeCupRemove(){ const l=getCoffeeLog(selectedDay); l.pop(); save(); }
function coffeeCupType(i, type){ const l=getCoffeeLog(selectedDay); l[i]=type; save(); }
function coffeeTotals(n){
  const l = getCoffeeLog(n);
  return l.reduce((a,t)=>{ const c=COFFEE_TYPES[t]; if(!c) return a; return {k:a.k+c.k, p:a.p+c.p, c:a.c+c.c, f:a.f+c.f, s:a.s+c.s, caf:a.caf+c.caf}; }, {k:0,p:0,c:0,f:0,s:0,caf:0});
}
function dayMacroTotals(){
  const key = dayKey(selectedDay);
  const entries = (state.foodLog||{})[key] || [];
  const base = entries.reduce((a,e)=>({k:a.k+(e.k||0), p:a.p+(e.p||0), c:a.c+(e.c||0), f:a.f+(e.f||0), s:a.s+(e.s||0), caf:a.caf+(e.caf||0)}), {k:0,p:0,c:0,f:0,s:0,caf:0});
  const coffee = coffeeTotals(selectedDay);
  return {k:base.k+coffee.k, p:base.p+coffee.p, c:base.c+coffee.c, f:base.f+coffee.f, s:base.s+coffee.s, caf:base.caf+coffee.caf};
}

const MACRO_RING_COLOR = {Protein:"#3d4a8a", Carbs:"#c9ae77", Fat:"#8a6f4a", Sugar:"#b85c5c"};
function macroRing(label, consumed, target, unit){
  const c = Math.round(consumed)||0;
  const pct = target ? Math.min(100, Math.round(c/target*100)) : 0;
  const color = MACRO_RING_COLOR[label] || "var(--accent)";
  return `<div class="macroring-item">
    <div class="macroring" style="--p:${pct};--ring-c:${color}">
      <div class="inner"><b>${c}</b>${target?`/${target}${unit}`:unit}</div>

}

function allFoodsSorted(meal){
  const southLean = (state.dietPrefs||{}).southIndianLean;
  return allFoodsForMeal(meal).filter(dietAllowed)
    .slice().sort((a,b)=>{
      const sb = southLean ? (SI_RE.test(b.n)?1:0) - (SI_RE.test(a.n)?1:0) : 0;
      if(sb) return sb;
      return (state.foodFreq[b.n]||0)-(state.foodFreq[a.n]||0);
    });
}
function mostEatenForMeal(meal, n){ return allFoodsSorted(meal).slice(0, n||8); }
function foodListHtml(pool, meal){
  return pool.map(f=>`<div class="food-row" onclick="addFoodToMeal('${meal}','${f.n.replace(/'/g,"\\'")}')"><span class="fname">${f.n}</span><span class="fmacro">${f.p}g protein</span></div>`).join("");

function updateFoodResults(meal, query){
  const raw = (query||"").trim();
  const q = raw.toLowerCase();
  const pool = q ? allFoodsSorted(meal).filter(f=>f.n.toLowerCase().includes(q)) : allFoodsSorted(meal);
  const el = document.getElementById("fresults_"+meal);
  if(!el) return;
  const exactMatch = q && pool.some(f=>f.n.toLowerCase()===q);
  let html = foodListHtml(pool, meal);
  if(q && !exactMatch){
    html += `<div class="food-row addnew" onclick="addNewFood('${meal}', document.getElementById('fsearch_${meal}').value)">+ Add "${raw.replace(/"/g,'&quot;')}" as new food</div>`;
  }

  el.innerHTML = html;
}

  return (tok||"").split("|").some(t=>{
    const tl = t.trim().toLowerCase();
    return (state.pantry||[]).some(p=>p.qty>0 && (p.name.toLowerCase()===tl || p.name.toLowerCase().includes(tl) || tl.includes(p.name.toLowerCase())));
  });
}
function recipeMatches(){
  const can=[], almost=[];
  RECIPES.forEach(r=>{
    const miss = r.need.filter(t=>!pantryHasItem(t));
    if(!miss.length) can.push(r);
    else if(miss.length===1 && r.need.length>1) almost.push({r, miss:miss[0]});
  });
  return {can, almost};
}
function addMissingToShopping(name){
  const nm = (name||"").split("|")[0].trim();
  if(!nm) return;
  state.shopping = state.shopping || [];
  if(!state.shopping.some(s=>s.name.toLowerCase()===nm.toLowerCase() && !s.done)){
    state.shopping.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,6), name:nm, done:false});
  }
  save();
}

/* ---- weight trend ---- */
function logWeight(){
  const el = document.getElementById("weightInput");
  const kg = parseFloat(el.value);
  if(!kg || kg<=0) return;
  const iso = dateForDay(selectedDay);
  state.weight = state.weight || [];
  const existing = state.weight.find(w=>w.date===iso);
  if(existing) existing.kg = kg; else state.weight.push({date:iso, kg});
  state.weight.sort((a,b)=>a.date.localeCompare(b.date));
  el.value = "";
  save();
}
function deleteWeight(date){ snapshotForUndo("Weight entry deleted"); state.weight = state.weight.filter(w=>w.date!==date); save(); }
function setWeightGoal(){
  const s=document.getElementById("goalStart"), t=document.getElementById("goalTarget"), d=document.getElementById("goalDate");
  const start=parseFloat(s.value), target=parseFloat(t.value);
  if(!start || !target || !d.value) return;
  state.weightGoal = {start, target, targetDate:d.value, setDate:todayISO()};
  save();
}
function clearWeightGoal(){ state.weightGoal = {start:null,target:null,targetDate:null}; save(); }
function setProfile(){
  const a=document.getElementById("profAge"), h=document.getElementById("profHeight"),
        sx=document.getElementById("profSex"), ac=document.getElementById("profActivity");
  const age=parseInt(a.value,10), heightCm=parseFloat(h.value);
  if(!age || !heightCm) return;
  state.profile = {age, heightCm, sex:sx.value, activity:ac.value};
  save();
}
const ACTIVITY_MULT = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725};
function bmrFor(weightKg){
  const p = state.profile||{};
  const age = p.age||30, h = p.heightCm||155, sex = p.sex||"female";
  return sex==="male" ? (10*weightKg + 6.25*h - 5*age + 5) : (10*weightKg + 6.25*h - 5*age - 161);
}
function tdeeFor(weightKg){
  const p = state.profile||{};
  const mult = ACTIVITY_MULT[p.activity||"sedentary"] || 1.2;
  return bmrFor(weightKg) * mult;
}
function calorieTargetFor(weightKg){
  const t = tdeeFor(weightKg);
  const sex = (state.profile||{}).sex||"female";
  const floor = sex==="male" ? 1500 : 1200;
  return Math.max(floor, Math.round(t - 500));
}
function goalTargetForDate(iso){
  const g = state.weightGoal;
  if(!g || !g.start || !g.target || !g.targetDate) return null;
  const total = toMin; // noop guard not used
  const d0 = new Date(g.setDate+"T00:00:00"), d1 = new Date(g.targetDate+"T00:00:00"), dq = new Date(iso+"T00:00:00");
  const totalDays = Math.max(1,(d1-d0)/86400000);
  const elapsed = Math.max(0,(dq-d0)/86400000);
  const frac = Math.min(1, elapsed/totalDays);
  return g.start + (g.target - g.start)*frac;
}
function renderWeightSVG(entries){
  if(entries.length<2) return `<p class="small">Log at least two days to see your trend line.</p>`;
  const g = state.weightGoal;
  const hasGoal = g && g.start && g.target && g.targetDate;
  const w=560,h=140,pad=24;
  const kgs = entries.map(e=>e.kg);
  if(hasGoal){ kgs.push(g.start, g.target); }
  const min=Math.min(...kgs)-1, max=Math.max(...kgs)+1;
  const x = i => pad + (i/(entries.length-1))*(w-pad*2);
  const y = kg => h-pad - ((kg-min)/(max-min||1))*(h-pad*2);
  const pts = entries.map((e,i)=>x(i)+","+y(e.kg)).join(" ");
  const goalPts = hasGoal ? entries.map((e,i)=>x(i)+","+y(goalTargetForDate(e.date))).join(" ") : "";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px;margin-top:10px">
    ${hasGoal? `<polyline points="${goalPts}" fill="none" stroke="#9c8268" stroke-width="1.6" stroke-dasharray="4 4"/>` : ""}
    <polyline points="${pts}" fill="none" stroke="#3d4a8a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${entries.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.kg)}" r="3.5" fill="#c9ae77"/>`).join("")}
  </svg>
  ${hasGoal? `<p class="small">Solid line: your actual weight. Dashed: the pace needed to hit ${g.target}kg by ${niceDate(g.targetDate,{day:"numeric",month:"short",year:"numeric"})}.</p>` : ""}`;
}
function renderWeight(){
  const entries = state.weight||[];
  const first = entries[0], last = entries[entries.length-1];
  const change = (first && last && entries.length>1) ? (last.kg-first.kg) : 0;
  const g = state.weightGoal || {};
  const hasGoal = g.start && g.target && g.targetDate;
  let goalCard = "";
  const prof = state.profile || {};
  const profileFields = `<div class="weight-row" style="margin-top:10px">
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Age</label><input type="number" id="profAge" value="${prof.age||''}" placeholder="30"></div>
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Height (cm)</label><input type="number" id="profHeight" value="${prof.heightCm||''}" placeholder="155"></div>
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Sex</label>
          <select id="profSex">
            <option value="female" ${prof.sex==="female"?"selected":""}>Female</option>
            <option value="male" ${prof.sex==="male"?"selected":""}>Male</option>
          </select>
        </div>
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Activity</label>
          <select id="profActivity">
            <option value="sedentary" ${(prof.activity||"sedentary")==="sedentary"?"selected":""}>Sedentary</option>
            <option value="light" ${prof.activity==="light"?"selected":""}>Lightly active</option>
            <option value="moderate" ${prof.activity==="moderate"?"selected":""}>Moderately active</option>
            <option value="active" ${prof.activity==="active"?"selected":""}>Very active</option>
          </select>
        </div>
        <button class="btn" onclick="setProfile()">Save profile</button>
      </div>`;
  if(hasGoal){
    const todayTarget = goalTargetForDate(todayISO());
    const currentKg = last ? last.kg : g.start;
    const aheadBy = todayTarget!=null ? (todayTarget - currentKg) : 0;
    const proteinLow = Math.round(g.target*1.6), proteinHigh = Math.round(g.target*2);
    goalCard = `<div class="card" style="margin-bottom:14px">
      <h3>🎯 Goal</h3>
      <p class="small">${g.start}kg → ${g.target}kg by ${niceDate(g.targetDate,{day:"numeric",month:"short",year:"numeric"})}.</p>
      <div class="weight-stats">
        <div class="wstat"><b>${todayTarget!=null?todayTarget.toFixed(1)+" kg":"—"}</b><span>today's pace target</span></div>
        <div class="wstat"><b>${currentKg? (aheadBy>=0?"on pace":(Math.abs(aheadBy)).toFixed(1)+"kg behind") : "—"}</b><span>vs. pace</span></div>
        <div class="wstat"><b>${proteinLow}–${proteinHigh}g</b><span>daily protein target</span></div>
      </div>
      <p class="small" style="margin-top:8px">No calorie or fat counting here — just the weight trend against your pace line, and a protein target to keep muscle while you lose. Treat the trend as truth and adjust how you eat if the pace drifts for more than ~2 weeks.</p>
      <button class="btn ghost" style="margin-top:6px" onclick="clearWeightGoal()">Clear goal</button>
    </div>`;
  } else {
    goalCard = `<div class="card" style="margin-bottom:14px">
      <h3>🎯 Set a goal</h3>
      <p class="small">Pick a start weight, target, and date — the chart below will show the pace you need alongside your actual trend.</p>
      <div class="weight-row">
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Start (kg)</label><input type="number" id="goalStart" value="${last?last.kg:''}" placeholder="100"></div>
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Target (kg)</label><input type="number" id="goalTarget" placeholder="70"></div>
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Target date</label><input type="date" id="goalDate"></div>
        <button class="btn" onclick="setWeightGoal()">Set goal</button>
      </div>
    </div>`;
  }
  return `<div class="grid">
    <div class="span12">${goalCard}</div>
    <div class="span12 card">
      <h3>⚖️ Weight trend</h3>
      <p class="small">A gentle log, not a judgment. Weekly glances matter more than daily swings.</p>
      <div class="weight-row">
        <div><label class="small" style="font-weight:700;display:block;margin-bottom:5px">Log for ${niceDate(dateForDay(selectedDay),{day:"numeric",month:"short"})}</label>
        <input type="number" step="0.1" id="weightInput" placeholder="kg"></div>
        <button class="btn" onclick="logWeight()">Save</button>
      </div>
      <div class="weight-stats">
        <div class="wstat"><b>${last? last.kg+" kg" : "—"}</b><span>latest</span></div>
        <div class="wstat"><b>${entries.length>1? (change>0?"+":"")+change.toFixed(1)+" kg" : "—"}</b><span>since first log</span></div>
        <div class="wstat"><b>${entries.length}</b><span>entries logged</span></div>
      </div>
      ${renderWeightSVG(entries)}
      <div class="weight-log">
        ${entries.slice().reverse().map(e=>`<div class="wl"><span>${niceDate(e.date,{day:"numeric",month:"short"})}</span><span>${e.kg} kg <button onclick="deleteWeight('${e.date}')" style="background:none;border:0;color:var(--muted);cursor:pointer;margin-left:6px">✕</button></span></div>`).join("")}
      </div>
    </div>
  </div>`;
}

/* ---- custom plan: write/paste your own business plan, get a Claude prompt to turn it into a
   tracked checklist, then paste Claude's JSON reply back in to apply it. Stored in state.myPlan,
   which lives inside this profile's own `state` — so it's already per-profile, no extra wiring. ---- */
function activePlanPhases(){
  const mp = state.myPlan;
  if(mp && mp.useCustom && Array.isArray(mp.phases) && mp.phases.length) return mp.phases;
  return BUSINESS_PLAN;
}
function bizPlanProgress(){
  const total = activePlanPhases().reduce((s,p)=>s+p.items.length,0);
  const done = Object.values(state.bizPlanDone||{}).filter(Boolean).length;
  return {done, total};
}
function savePlanText(){
  const el = document.getElementById("myPlanText");
  if(!el) return;
  state.myPlan = state.myPlan || {text:"", phases:null, useCustom:false};
  state.myPlan.text = el.value;
  save();
}
function buildClaudePrompt(){
  // A flexible starter — works pasted into Claude, ChatGPT, or anything else. The planning
  // conversation happens over there; this just tells it what shape to hand back at the end.
  const planText = ((state.myPlan && state.myPlan.text) || "").trim();
  return "I want to turn a business plan into a day-by-day accountability checklist.\n\n"
    +(planText? "Here's what I have so far:\n\"\"\"\n"+planText+"\n\"\"\"\n\n" : "")
    +"Ask me whatever you need about my business, goals and timeline, and help me think it through. "
    +"Once we've worked out the plan, give me the final result as ONLY a JSON array, no other text before or after it, in exactly this shape:\n\n"
    +"[\n  {\"phase\": \"Week 1 · <short phase name>\", \"items\": [\"step 1\", \"step 2\"]},\n  {\"phase\": \"Week 2 · <short phase name>\", \"items\": [\"...\"]}\n]\n\n"
    +"Keep each item one short, concrete, actionable line. Scale the number of phases and items to how long the plan actually needs — don't pad it out. "
    +"I'll paste that JSON back into my tracker app, so it must be valid JSON and nothing else.";
}
async function copyClaudePrompt(){
  const prompt = buildClaudePrompt();
  try{
    await navigator.clipboard.writeText(prompt);
    toast("Prompt copied — paste it into Claude, ChatGPT, or any AI chat");
  }catch(e){
    showPromptFallback(prompt);
  }
}
function showPromptFallback(text){
  const old = document.getElementById("promptFallbackOverlay"); if(old) old.remove();
  const el = document.createElement("div");
  el.id = "promptFallbackOverlay"; el.className = "pc-overlay";
  el.innerHTML = `<div class="pc-box" style="max-width:480px">
    <h3>📋 Copy this prompt</h3>
    <p class="small">Couldn't copy automatically — tap the box below to select it all, then copy.</p>
    <textarea readonly style="width:100%;min-height:220px;font-size:12.5px;box-sizing:border-box" onclick="this.select()">${escapeHtml(text)}</textarea>
    <button type="button" class="link-btn" style="margin-top:10px" onclick="document.getElementById('promptFallbackOverlay').remove()">Close</button>
  </div>`;
  el.addEventListener("click", e=>{ if(e.target===el) el.remove(); });
  document.body.appendChild(el);
}
function applyClaudeChecklist(){
  const el = document.getElementById("myPlanPaste");
  const raw = ((el&&el.value)||"").trim();
  if(!raw){ toast("Paste the AI's checklist reply first"); return; }
  let parsed;
  try{
    const match = raw.match(/\[[\s\S]*\]/); // tolerate stray text/code fences around the JSON
    parsed = JSON.parse(match ? match[0] : raw);
  }catch(e){
    alert("Couldn't read that as a checklist. Paste the JSON reply (the [ ... ] list) and nothing else.");
    return;
  }
  if(!Array.isArray(parsed) || !parsed.length || !parsed.every(p=>p && typeof p.phase==="string" && Array.isArray(p.items) && p.items.every(i=>typeof i==="string"))){
    alert("That doesn't match the expected checklist shape. Ask it to reply with exactly the JSON array format from the copied prompt.");
    return;
  }
  if(!confirm("Replace your current checklist with this one? Progress on the old checklist will be cleared (your written plan text is kept).")) return;
  state.myPlan = state.myPlan || {text:"", phases:null, useCustom:false};
  state.myPlan.phases = parsed;
  state.myPlan.useCustom = true;
  state.bizPlanDone = {};
  if(el) el.value = "";
  save();
  toast("Checklist applied ✓");
}
function useDefaultPlan(){
  if(!confirm("Switch to the default 30-day plan? Your custom checklist stays saved — you can switch back any time.")) return;
  state.myPlan.useCustom = false;
  state.bizPlanDone = {};
  save();
}
function useCustomPlan(){
  state.myPlan.useCustom = true;
  state.bizPlanDone = {};
  save();
}
function renderPlanBuilder(){
  const mp = Object.assign({text:"", phases:null, useCustom:false}, state.myPlan||{});
  const hasCustom = Array.isArray(mp.phases) && mp.phases.length;
  return `<details class="card" style="margin-bottom:14px">
    <summary style="cursor:pointer"><b>✨ Build your own plan with AI</b></summary>
    <p class="small" style="margin-top:8px">Copy the starter prompt below and paste it into Claude, ChatGPT, or any AI chat. Talk the plan through over there — the AI will ask what it needs. When you're done, ask it for the final checklist and paste that reply back in below to apply it here. (The notes box is optional — anything you jot here gets included in the prompt as a starting point.) This is saved on this profile only.</p>
    <label class="small">Notes for the prompt (optional)</label>
    <textarea id="myPlanText" rows="4" style="width:100%;box-sizing:border-box" placeholder="Anything you already know — business type, goal, timeline…" onblur="savePlanText()">${escapeHtml(mp.text||"")}</textarea>
    <div class="pc-actions" style="margin:8px 0">
      <button type="button" class="btn secondary" onclick="copyClaudePrompt()">📋 Copy starter prompt</button>
    </div>

    <div class="pc-actions" style="margin:8px 0 2px">
      <button type="button" class="btn" onclick="applyClaudeChecklist()">Apply checklist</button>
      ${hasCustom? `<button type="button" class="btn secondary" onclick="${mp.useCustom? "useDefaultPlan()":"useCustomPlan()"}">${mp.useCustom? "Use default plan instead":"Use my checklist instead"}</button>` : ""}
    </div>
    ${hasCustom? `<p class="small">Currently tracking: <b>${mp.useCustom? "your custom checklist":"the default 30-day plan"}</b></p>` : ""}
  </details>`;
}
function setBizPlanEffort(day, val){
  state.bizPlanEffort = state.bizPlanEffort || {};
  state.bizPlanEffort[day] = parseInt(val)||0;
  saveQuiet();
}
function renderPlan(){
  const prog = bizPlanProgress();
  let day = 0;
  const effort = state.bizPlanEffort||{};
  const phases = activePlanPhases().map(p=>{
    const rows = p.items.map(txt=>{
      day++;
      const d = day;
      const isDone = !!(state.bizPlanDone||{})[d];
      const ef = effort[d]||0;
      return `<div class="plan-item ${isDone?'done':''}">
        <span class="checkdot pd ${isDone?'on':''}" onclick="toggleBizPlan(${d})"></span>
        <div class="ptxt"><b>${escapeHtml(txt)}</b><span>Day ${d}</span></div>
        <select class="effort-pick" title="Effort" onchange="setBizPlanEffort(${d},this.value)">
          <option value="0" ${ef===0?"selected":""}>Effort</option>
          ${[1,2,3,4,5].map(n=>`<option value="${n}" ${ef===n?"selected":""}>${"●".repeat(n)}${"○".repeat(5-n)}</option>`).join("")}
        </select>
      </div>`;
    }).join("");
    return `<div class="phase-head"><span class="pn">${escapeHtml(p.phase)}</span></div>${rows}`;
  }).join("");
  return renderPlanBuilder()+`<div class="card" style="margin-bottom:14px">
    <h3>🧭 ${state.myPlan&&state.myPlan.useCustom? "My "+prog.total+"-day business plan":prog.total+"-day business plan"}</h3>
    <p class="small">Work through this at your own pace — tick off each step and log your effort as you go. ${prog.done}/${prog.total} done.</p>
    <div class="progtrack"><i style="width:${Math.round(prog.done/prog.total*100)}%"></i></div>
  </div>
  <div class="card">${phases}</div>`;
}

function expenseCategories(){ return EXPENSE_CATS.concat(state.customExpenseTypes||[]); }
function closeCustomExpenseTypePopup(){ const el=document.getElementById("custExpTypeOverlay"); if(el) el.remove(); }
function openCustomExpenseTypePopup(projectId){

function saveCustomExpenseType(projectId){
  const inp = document.getElementById("custExpTypeInput");
  const nm = ((inp && inp.value)||"").trim();
  closeCustomExpenseTypePopup();
  if(!nm) return;
  state.customExpenseTypes = state.customExpenseTypes||[];
  if(!expenseCategories().some(c=>c.toLowerCase()===nm.toLowerCase())){ state.customExpenseTypes.push(nm); save(); }
  if(projectId) openProjectDetail(projectId);
}
function addExpense(){
  const descEl=document.getElementById("expDesc"), amtEl=document.getElementById("expAmount"), catEl=document.getElementById("expCat");
  const desc=(descEl.value||"").trim(), amt=parseFloat(amtEl.value);
  if(!desc || !amt) return;
  state.expenses = state.expenses||[];
  state.expenses.unshift({id:"ex"+Date.now(), desc, amount:amt, cat:catEl.value, status:"Pending", date:todayISO(), projectId:""});
  descEl.value=""; amtEl.value=""; save();
}
function setExpenseStatus(id,status){ const e=(state.expenses||[]).find(x=>x.id===id); if(e){ e.status=status; save(); } }
function deleteExpense(id){ snapshotForUndo("Expense deleted"); state.expenses=(state.expenses||[]).filter(x=>x.id!==id); save(); }

function addProjectGoal(projectId){
  const nmEl=document.getElementById("pdGoalName"), tgEl=document.getElementById("pdGoalTarget");

  if(!nm||!target) return;
  state.goals = state.goals||[];
  state.goals.push({id:"go"+Date.now(), name:nm, metric:"manual", type:"number", target, unit:"", manualValue:0, projectId});
  save();
  openProjectDetail(projectId);
}
function addProjectInvoice(projectId){
  const nmEl=document.getElementById("pdInvName"), txEl=document.getElementById("pdInvTxnId"), amtEl=document.getElementById("pdInvAmount"), dueEl=document.getElementById("pdInvDue");

  if(!desc||!amt) return;
  state.expenses = state.expenses||[];

function closeAddMeetingForm(){ const el=document.getElementById("addMeetingOverlay"); if(el) el.remove(); }
function addProjectMeeting(projectId){
  const dtEl=document.getElementById("pdMtgDate"), lnEl=document.getElementById("pdMtgLink"), atEl=document.getElementById("pdMtgAttendees"), noEl=document.getElementById("pdMtgNotes");
  const p = projectById(projectId); if(!p) return;
  const date = (dtEl&&dtEl.value)||"";
  if(!date){ toast("Pick a meeting date first"); return; }
  p.meetings = p.meetings||[];
  p.meetings.unshift({id:"mt"+Date.now(), date, link:(lnEl&&lnEl.value||"").trim(), attendees:(atEl&&atEl.value||"").trim(), notes:(noEl&&noEl.value||"").trim()});
  save();
  closeAddMeetingForm();
  openProjectDetail(projectId);
}
function deleteProjectMeeting(projectId, mtgId){
  const p = projectById(projectId); if(!p) return;
  p.meetings = (p.meetings||[]).filter(m=>m.id!==mtgId);
  if(openMeetingId===mtgId) openMeetingId = null;
  save();
  openProjectDetail(projectId);
}
function addTaskFromMeeting(projectId, mtgId){
  const el = document.getElementById("mtgTaskInput_"+mtgId);
  const txt = ((el&&el.value)||"").trim();
  if(!txt){ toast("Type the task first"); return; }
  const p = projectById(projectId); if(!p) return;
  state.brainDump = state.brainDump||[];
  state.brainDump.unshift({id:"bd"+Date.now()+Math.random().toString(36).slice(2,6), text:"["+p.name+"] "+txt, type:"todo", priority:"yellow", day:selectedDay, done:false, ts:Date.now()});
  save();
  toast("Task sent to Thought Vault ✓");
  openProjectDetail(projectId);
}
/* ---- export: whole Ledger or a single project, as a real .xlsx workbook (SheetJS, loaded via CDN) ---- */
function downloadWorkbook(sheets, filename){
  if(typeof XLSX==="undefined"){ alert("Export needs an internet connection the first time (to load the Excel library). Try again once you're online."); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(({name,rows})=>{
    const ws = XLSX.utils.json_to_sheet(rows&&rows.length? rows : [{}]);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  XLSX.writeFile(wb, filename);
}
function exportLedgerToExcel(){
  downloadWorkbook([
    {name:"Pipeline", rows:(state.pipeline||[]).map(l=>({Lead:l.text||l.name||"", Stage:l.stage, Value:l.value||"", Date:l.date||""}))},
    {name:"Clients", rows:(state.clients||[]).map(c=>({Client:c.name, Contact:c.contact||"", Status:c.status, Date:c.date||""}))},
    {name:"Projects", rows:(state.projects||[]).map(p=>({Project:p.name, Client:p.client||"", Contact:p.contact||"", Start:p.start||"", TargetClose:p.due||"", Delivery:p.deliveryStage||"", Status:p.status, Date:p.date||""}))},
    {name:"Invoices", rows:(state.invoices||[]).map(i=>({Invoice:i.name||i.client||"", TxnID:i.txnId||"", Amount:i.amount, Due:i.due||"", Status:i.status, Project:(projectById(i.projectId)||{}).name||"", Date:i.date||""}))},
    {name:"Expenses", rows:(state.expenses||[]).map(e=>({Item:e.desc, Category:e.cat, Amount:e.amount, Status:e.status||"Pending", Project:(projectById(e.projectId)||{}).name||"", Date:e.date||""}))}
  ], "dinacharya-ledger-"+todayISO()+".xlsx");
}
function exportProjectToExcel(id){
  const p = projectById(id); if(!p) return;
  const invoices = (state.invoices||[]).filter(i=>i.projectId===id);
  const expenses = (state.expenses||[]).filter(e=>e.projectId===id);
  const goals = (state.goals||[]).filter(g=>g.projectId===id);
  const meetings = p.meetings||[];
  downloadWorkbook([
    {name:"Project", rows:[{Project:p.name, Client:p.client||"", Contact:p.contact||"", Start:p.start||"", TargetClose:p.due||"", Delivery:p.deliveryStage||"", Status:p.status}]},
    {name:"Invoices", rows:invoices.map(i=>({Invoice:i.name||"", TxnID:i.txnId||"", Amount:i.amount, Due:i.due||"", Status:i.status}))},
    {name:"Expenses", rows:expenses.map(e=>({Item:e.desc, Category:e.cat, Amount:e.amount, Status:e.status||"Pending"}))},
    {name:"Goals", rows:goals.map(g=>({Goal:g.name, Target:g.type==="date"? g.targetDate : g.target, Progress:g.manualValue||""}))},
    {name:"Meetings", rows:meetings.map(m=>({Date:m.date||"", Link:m.link||"", Attendees:m.attendees||"", Notes:m.notes||""}))}
  ], "project-"+p.name.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".xlsx");
}

function addCustomGoal(){
  const nmEl = document.getElementById("goalName"), tgEl = document.getElementById("goalTarget");
  const nm = (nmEl.value||"").trim(), target = parseFloat(tgEl.value);
  if(!nm || !target) return;
  state.goals = state.goals || [];
  state.goals.push({id:"go"+Date.now(), name:nm, metric:"manual", type:"number", target, unit:"", manualValue:0});
  nmEl.value=""; tgEl.value="";
  save();
}

  state.goals.push({id:"go"+Date.now(), name:nm, metric:"manual", type:"date", targetDate, unit:"", manualValue:0});

/* ---- pomodoro ---- */
let pomo = { mode:"focus", secondsLeft:25*60, total:25*60, running:false, timer:null };
function pomoSessions(n){ state.pomodoro = state.pomodoro || {}; return state.pomodoro[dayKey(n)] = state.pomodoro[dayKey(n)] || {sessions:0}; }
function pomoTick(){
  if(pomo.secondsLeft<=0){
    if(pomo.mode==="focus"){ pomoSessions(selectedDay).sessions++; saveQuiet(); pomo.mode="break"; pomo.total=5*60; pomo.secondsLeft=5*60; }
    else { pomo.mode="focus"; pomo.total=25*60; pomo.secondsLeft=25*60; }
  } else {
    pomo.secondsLeft--;
  }
  renderPomoRing();
}
function pomoStart(){ if(pomo.running) return; pomo.running=true; pomo.timer=setInterval(pomoTick,1000); renderPomoRing(); }
function pomoPause(){ pomo.running=false; clearInterval(pomo.timer); renderPomoRing(); }
function pomoReset(){ pomo.running=false; clearInterval(pomo.timer); pomo.mode="focus"; pomo.total=25*60; pomo.secondsLeft=25*60; renderPomoRing(); }
function renderPomoRing(){
  const pct = Math.round((1-pomo.secondsLeft/pomo.total)*100);
  const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
  const ss = String(pomo.secondsLeft%60).padStart(2,"0");
  const el = document.getElementById("pomoRingWrap");
  if(el){
    el.querySelector(".pomo-ring").style.setProperty("--p", pct);
    el.querySelector(".inner b").textContent = mm+":"+ss;
    el.querySelector(".inner span").textContent = pomo.mode;
  }
  const ct = document.getElementById("pomoCompactTime");
  if(ct){ ct.textContent = mm+":"+ss; }
  const cm = document.getElementById("pomoCompactMode");
  if(cm){ cm.textContent = pomo.mode; }
  const startBtn = document.getElementById("pomoStartBtn");
  if(startBtn) startBtn.textContent = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
}
function pomoToggle(){ pomo.running? pomoPause() : pomoStart(); }
function renderPomodoro(){
  const s = pomoSessions(selectedDay);
  const pct = Math.round((1-pomo.secondsLeft/pomo.total)*100);
  const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
  const ss = String(pomo.secondsLeft%60).padStart(2,"0");
  const btnLabel = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
  return `<div class="card">
    <h3>⏳ Focus timer</h3>
    <p class="small">25 minutes of focus, 5 to breathe. ${s.sessions} focus session${s.sessions===1?"":"s"} today.</p>
    <div id="pomoRingWrap">
      <div class="pomo-ring" style="--p:${pct}"><div class="inner"><b>${mm}:${ss}</b><span>${pomo.mode}</span></div></div>
      <div class="pomo-actions">
        <button class="btn" id="pomoStartBtn" onclick="pomoToggle()">${btnLabel}</button>
        <button class="btn secondary" onclick="pomoReset()">Reset</button>
      </div>
    </div>
  </div>`;
}
/* compact one-line version — used at the top of the Control panel so focus stays small and out
   of the way rather than taking up a full card. */
function renderPomodoroCompact(){
  const s = pomoSessions(selectedDay);
  const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
  const ss = String(pomo.secondsLeft%60).padStart(2,"0");
  const btnLabel = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
  return `<div class="card" style="margin-bottom:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <div style="display:flex;align-items:baseline;gap:8px">

      <span class="small" id="pomoCompactMode">${pomo.mode}</span>

    </div>
    <div class="row" style="gap:6px">
      <button class="btn secondary" id="pomoStartBtn" style="padding:5px 12px;font-size:12px" onclick="pomoToggle()">${btnLabel}</button>
      <button class="btn secondary" style="padding:5px 12px;font-size:12px" onclick="pomoReset()">Reset</button>

}

function toggleSankalpDay(d){

  const s = state.sankalp || {text:"", startDay:selectedDay, done:{}};

  const doneCount = Object.values(s.done||{}).filter(Boolean).length;
  const cells = Array.from({length:40}).map((_,i)=>{

function ensureSavedLinksSeed(){
  if(!state.savedLinksSeeded){
    state.savedSubstackLinks = SAVED_SUBSTACK_LINKS.map((l,i)=>({id:"ss"+i, ...l}));
    state.savedYoutubeLinks = SAVED_YOUTUBE_LINKS.map((l,i)=>({id:"sy"+i, ...l}));

}
function toggleSavedLinkRead(listKey, id, checked){
  const list = state[listKey]||[];
  const item = list.find(x=>x.id===id);
  if(!item) return;
  item.read = !!checked;
  item.readOn = checked ? todayISO() : "";
  save();
}
let newSavedLinkType = "article";
let savedLinksViewType = "article";
const savedLinksPages = {article:{todo:1,done:1},video:{todo:1,done:1}};
function setNewSavedLinkType(t){ newSavedLinkType = t; savedLinksViewType = t; render(); }
function setSavedLinksViewType(t){ savedLinksViewType = t; render(); }
function setSavedLinksPage(type, bucket, page){ savedLinksPages[type][bucket] = Math.max(1, page); render(); }
function addSavedLink(){
  const nameEl = document.getElementById("newSavedLinkName"), urlEl = document.getElementById("newSavedLinkUrl");
  const name = (nameEl.value||"").trim(), url = (urlEl.value||"").trim();
  if(!name || !url) return;
  const listKey = newSavedLinkType==="video" ? "savedYoutubeLinks" : "savedSubstackLinks";
  state[listKey] = state[listKey] || [];
  state[listKey].unshift({id:(newSavedLinkType==="video"?"sy":"ss")+Date.now(), name, url, read:false, readOn:""});
  savedLinksViewType = newSavedLinkType;
  savedLinksPages[savedLinksViewType].todo = 1;
  nameEl.value=""; urlEl.value="";
  save();
}
function deleteSavedLink(listKey, id){
  const type = listKey==="savedYoutubeLinks" ? "video" : "article";
  state[listKey] = (state[listKey]||[]).filter(x=>x.id!==id);
  savedLinksPages[type].todo = 1;

}
/* Compact rows with a checkbox, title, open link and remove control. */
function savedLinksRowsFiltered(items, listKey, icon){
  const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  return items.map(item => `<div style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)">
    <input type="checkbox" ${item.read?"checked":""} onchange="toggleSavedLinkRead('${listKey}','${item.id}',this.checked)" aria-label="Mark ${esc(item.name)} completed" style="width:15px;height:15px;cursor:pointer;flex:0 0 auto">
    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;${item.read?'color:var(--muted);text-decoration:line-through':''}">${icon} ${esc(item.name)}</span>
    <a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" title="Open" style="flex:0 0 auto;color:var(--accent);font-size:13px;text-decoration:none">↗</a>
    <button type="button" onclick="deleteSavedLink('${listKey}','${item.id}')" title="Remove" style="flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px">✕</button>
  </div>`).join("");
}
function savedLinksBucket(items, listKey, icon, type, bucket, heading){
  const perPage = 10;
  const totalPages = Math.max(1, Math.ceil(items.length/perPage));
  const page = Math.min(savedLinksPages[type][bucket]||1, totalPages);
  savedLinksPages[type][bucket] = page;
  const shown = items.slice((page-1)*perPage, page*perPage);
  const pager = totalPages>1 ? `<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 0 2px">
    <button type="button" class="btn secondary" style="padding:4px 10px;font-size:12px" ${page<=1?'disabled':''} onclick="setSavedLinksPage('${type}','${bucket}',${page-1})">← Prev</button>
    <span class="small">Page ${page} of ${totalPages}</span>
    <button type="button" class="btn secondary" style="padding:4px 10px;font-size:12px" ${page>=totalPages?'disabled':''} onclick="setSavedLinksPage('${type}','${bucket}',${page+1})">Next →</button>
  </div>` : "";
  return `<div style="margin-top:12px"><h4 style="font-size:13px;margin:0 0 4px;color:var(--accent-2)">${heading} <span class="small" style="font-weight:400">(${items.length})</span></h4>
    ${shown.length ? savedLinksRowsFiltered(shown,listKey,icon) : `<p class="small" style="margin:7px 0">${bucket==='done'?'No completed items yet.':'Nothing here yet.'}</p>`}
    ${pager}</div>`;
}

let appleDayInitialScrollDone = false;
function render(){
  if(appLocked) return; // hold off touching the page while the lock screen is up
  renderNav();
  renderBgArt();
  // Keep both the horizontal day strip and the day-calendar's vertical position stable
  // when checking tasks, editing blocks, or dragging events (render rebuilds the DOM).
  const scrollEl = document.querySelector(".strip-scroll");
  const scrollLeft = scrollEl ? scrollEl.scrollLeft : 0;
  const oldAppleScroll = document.getElementById('appleDayScroll');
  const appleScrollTop = oldAppleScroll ? oldAppleScroll.scrollTop : null;
  const oldTimeplanScroll = document.querySelector('.timeplan-scroll');
  const oldTimeplanScrollTop = oldTimeplanScroll ? oldTimeplanScroll.scrollTop : null;
  const app = document.getElementById("app");
  if(currentNest==="dashboard") app.innerHTML = renderDashboard();
  else if(currentNest==="today"){ app.innerHTML = renderToday(); }
  else if(currentNest==="arogya") app.innerHTML = renderArogya();
  else if(currentNest==="business") app.innerHTML = renderBusiness();
  else if(currentNest==="journal") app.innerHTML = renderJournal();
  const newScrollEl = document.querySelector(".strip-scroll");
  if(newScrollEl && scrollLeft) newScrollEl.scrollLeft = scrollLeft;
  const newAppleScroll = document.getElementById('appleDayScroll');
  if(newAppleScroll && appleScrollTop !== null) {
    newAppleScroll.scrollTop = appleScrollTop;
  } else if(newAppleScroll && !appleDayInitialScrollDone && document.getElementById('appleNowLine')) {
    const now = new Date();
    newAppleScroll.scrollTop = Math.max(0, now.getHours()*60 + now.getMinutes() - 90);
    appleDayInitialScrollDone = true;
  }
  const newTimeplanScroll = document.querySelector('.timeplan-scroll');
  if(newTimeplanScroll && oldTimeplanScrollTop !== null) newTimeplanScroll.scrollTop = oldTimeplanScrollTop;
  else if(newTimeplanScroll && currentNest==='today') { const active=document.querySelector('.today-agenda .tblock.now'); if(active) newTimeplanScroll.scrollTop=Math.max(0,active.offsetTop-newTimeplanScroll.offsetTop-50); }
  updateSavedLabel();
  updateAppleDayClock();
}
