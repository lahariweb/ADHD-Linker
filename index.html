<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinacharya • A Daily Promise</title>
<meta name="theme-color" content="#232150">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fffefa; --ink:#2a2740; --muted:#73708a;
  --accent:#3d4a8a; --accent-2:#232150; --soft:#e6e3f2; --mint:#eceaf7;
  --line:#dcd8ea; --gold:#c9ae77; --warn:#8a5a2e; --rest-bg:#eceaf2;
  --turquoise:#4a7a8a; --indigo:#6a4a8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 "Nunito Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:500;letter-spacing:-.015em;margin:0 0 6px;color:var(--accent-2)}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ===== Header / nest nav ===== */
header{background:linear-gradient(150deg,#1c1a3d 0%,#232150 55%,#2f2d66 100%);padding:0 0 0;color:#fdf9ee;position:sticky;top:0;z-index:30;box-shadow:0 6px 24px #1c1a3d2e}
.hdr-inner{padding:18px 0 0}
.hdr-trim{height:9px;background-image:linear-gradient(135deg,var(--gold) 25%,transparent 25.5%),linear-gradient(225deg,var(--gold) 25%,transparent 25.5%);background-position:0 0,7px 0;background-size:14px 9px;opacity:.55}
.affirm-strip{text-align:center;font-family:"Fraunces",serif;font-style:italic;font-size:14px;color:var(--accent-2);background:var(--mint);border:1px solid var(--line);border-radius:14px;padding:11px 16px;margin-bottom:14px}
.lotus-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 16px;color:var(--gold)}
.lotus-divider::before,.lotus-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.lotus-divider span{font-size:13px;letter-spacing:.06em}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .leaf{font-size:20px}
.brand b{font-family:"Fraunces",serif;font-weight:500;font-size:19px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:#d8d4ec;letter-spacing:.04em}
.datepill{font-size:12px;background:#ffffff1c;border:1px solid #ffffff30;padding:5px 11px;border-radius:99px;color:#fdf9ee;white-space:nowrap}
.nestnav{display:flex;gap:6px;margin-top:18px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.nestnav::-webkit-scrollbar{display:none}
.nestbtn{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:transparent;border:0;color:#d8d4ec;padding:10px 16px;border-radius:14px 14px 0 0;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;position:relative;top:1px}
.nestbtn .ic{font-size:15px}
.nestbtn.on{background:var(--bg);color:var(--accent-2)}
.nestbtn.soon{opacity:.55;cursor:default}
.nestbtn .tag{font-size:9px;font-weight:800;background:#ffffff20;border-radius:99px;padding:1px 6px;margin-left:2px}
.nestbtn.on .tag{background:var(--mint);color:var(--accent)}
main{padding:22px 0 60px}

/* ===== shared card ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 19px;box-shadow:0 3px 16px #23215010}
.card h3{font-size:14.5px;margin:0 0 4px;letter-spacing:.01em}
.card>p.small:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}
@media(max-width:720px){.span6,.span4{grid-column:span 12}}
.small{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:#fff;padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:700;font-size:13.5px}
.btn.secondary{background:var(--mint);color:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--accent-2);text-decoration:underline;padding:4px 2px;font-weight:600}
.chip{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-size:12.5px;cursor:pointer;color:var(--accent-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.mini{padding:3px 8px;font-size:10.5px}
.blkicon{cursor:pointer;display:inline-block}

/* ===== Dashboard ===== */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 28px;color:#fdf9ee;background:radial-gradient(ellipse at 110% -10%,#c9ae7745 0%,transparent 55%),linear-gradient(150deg,#232150,#15132e 75%)}
.hero .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#e8c98a;font-weight:700}
.hero h1{color:#fdf9ee;font-size:clamp(26px,4vw,34px);margin:8px 0 6px}
.hero p{color:#ecdcc0;max-width:48ch;margin:0}
.hero .hero-text{position:relative;z-index:1}
.hero .mandala2{position:absolute;right:-26px;top:-26px;width:170px;height:170px;opacity:.26;pointer-events:none;z-index:0}
.hero-art-picker{position:absolute;right:10px;top:10px;z-index:2;display:flex;gap:4px}
.hero-art-picker .hap-btn{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;opacity:.55;transition:opacity .15s}
.hero-art-picker .hap-btn.on{opacity:1;background:rgba(255,255,255,.18)}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative}
.stat{background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;padding:10px 14px;min-width:92px}
.stat b{display:block;font-family:"Fraunces",serif;font-size:22px;font-weight:500;color:var(--gold)}
.stat span{font-size:10.5px;color:#e8c98a}
.quotecard{background:linear-gradient(135deg,#eceaf7,#fffefa);border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative}
.quotecard p{font-family:"Fraunces",serif;font-style:italic;font-size:18px;line-height:1.5;margin:0 0 6px;color:var(--accent-2)}
.quotecard span{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.knot{width:14px;height:14px;flex:0 0 auto;opacity:.75}
.mantra-line{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:var(--mint);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:9px 13px;margin-bottom:12px}
.mantra-line b{font-family:"Fraunces",serif;font-size:14.5px;color:var(--accent-2);white-space:nowrap}
.mantra-line p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.4}
.tip-card{padding:12px 14px}
.tip-card-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-2);margin-bottom:4px}
.tip-card-text{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.calcard .caltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calcard .caltop .nm{font-family:"Fraunces",serif;font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid .wd{font-size:10px;text-align:center;color:var(--muted);padding-bottom:3px}
.calgrid .cell{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#f4f7ee;color:var(--muted);border:1px solid transparent}
.calgrid .cell.empty{background:transparent}
.calgrid .cell.l1{background:var(--soft);color:var(--accent)}
.calgrid .cell.l2{background:#cfc9ec;color:#2f2d66}
.calgrid .cell.l3{background:var(--accent);color:#fff}
.calgrid .cell.today{outline:2px solid var(--gold);outline-offset:1px}

/* ===== Today nest ===== */
.todaytabs{display:inline-flex;gap:3px;background:var(--mint);padding:4px;border-radius:12px;margin-bottom:16px}
.todaytabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--accent-2);cursor:pointer}
.todaytabs button.on{background:#fff;box-shadow:0 1px 4px #23215014}

/* strip */
.strip-scroll{position:relative;display:flex;gap:16px;overflow-x:auto;padding:18px 6px 14px;scrollbar-width:thin}
.strip-scroll::before{content:"";position:absolute;left:6px;right:6px;top:38px;height:2px;background:var(--line);z-index:0}
.bead{flex:0 0 auto;width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;z-index:1}
.bead .circ{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;transition:transform .12s}
.bead:active .circ{transform:scale(.92)}
.bead.done .circ{background:var(--accent);border-color:var(--accent);filter:grayscale(.15) brightness(1.6)}
.bead.now .circ{border-color:var(--gold);box-shadow:0 0 0 3px #c9ae7733}
.bead .t{font-size:9.5px;color:var(--muted);font-weight:700;white-space:nowrap}

/* timeline */
.timeline{position:relative;margin-top:4px}
.tblock{display:flex;gap:12px;padding:10px 0;border-left:2px solid var(--line);margin-left:7px;padding-left:16px;position:relative}
.tblock:last-child{border-left-color:transparent}
.tblock::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tblock.done::before{background:var(--accent);border-color:var(--accent)}
.tblock.now::before{background:var(--gold);border-color:var(--gold)}
.tblock.anchor .bar{border-left:3px solid var(--warn)}
.tblock.skipped{opacity:.6}
.tblock.skipped .tbody{background:var(--rest-bg)}
.skiptag{background:var(--warn)!important;color:#fff!important}
.tbody{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer}
.tblock.done .tbody{background:var(--mint);border-color:var(--gold)}
.tblock.now .tbody{border-color:var(--gold)}
.tbody .thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tbody .time{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.tbody .nm{font-weight:700;font-size:14.5px;margin:3px 0 0}
.tbody .nm.doneline{text-decoration:line-through;color:var(--muted)}
.tbody .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.tbody .dur{font-size:10.5px;background:var(--mint);color:var(--accent-2);padding:2px 8px;border-radius:99px;white-space:nowrap}
.checkdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;align-self:center;cursor:pointer;background:#fff}
.checkdot.on{background:var(--accent);border-color:var(--accent);position:relative}
.checkdot.on::after{content:"✓";color:#fff;font-size:12px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

/* editor sheet */
.sheet-overlay{position:fixed;inset:0;background:#15132e55;display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:620px){.sheet-overlay{align-items:center}}
.sheet{background:#fffef9;width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 20px 26px;box-shadow:0 -10px 40px #00000022}
@media(min-width:620px){.sheet{border-radius:22px}}
.sheet h3{margin-bottom:14px}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:700}
.sheet input[type=text],.sheet input[type=time]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:14px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:4px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer;color:var(--accent-2)}
.stepper .durval,.stepper .timeval{font-family:"Fraunces",serif;font-size:19px;min-width:74px;text-align:center}
.sheet .sheetactions{display:flex;gap:8px;margin-top:20px}
.anchornote{font-size:11.5px;color:var(--warn);background:#fbf1e6;border-radius:10px;padding:8px 10px;margin-top:12px}
.cascade-alert{font-size:12px;background:#fbf1e6;border:1px solid #ecd3ae;color:#8a5e32;border-radius:12px;padding:9px 12px;margin:10px 0}

/* checkin */
.checkin-card{background:linear-gradient(160deg,#fffefa 0%,var(--mint) 120%);border:1px solid var(--line);position:relative;overflow:hidden;padding:12px 13px 11px}
.checkin-card::before{content:"";position:absolute;top:-30px;right:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#c9ae7733,transparent 70%)}
.checkin-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:0}
.checkin-grid{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1}
.checkin-field{background:#fffdf8;border:1px solid var(--line);border-radius:11px;padding:6px 9px 7px;box-shadow:0 1px 0 #ffffff inset}
.checkin-field .ci-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.checkin-field .lbl{font-size:9px;color:var(--accent-2);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.ci-slider-label{font-size:10px;font-weight:800;color:var(--fc,var(--accent-2))}
.ci-slider-row{display:flex;align-items:center;gap:7px}
.ci-slider-emoji{font-size:15px;line-height:1;width:18px;text-align:center;flex:0 0 auto;transition:transform .15s}
.ci-slider{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:99px;outline:none;cursor:pointer}
.ci-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid var(--fc,var(--accent));box-shadow:0 1px 4px #00000033;cursor:pointer;margin-top:-1px}
.ci-slider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid var(--fc,var(--accent));box-shadow:0 1px 4px #00000033;cursor:pointer}
.ci-slider::-moz-range-track{height:5px;border-radius:99px;background:transparent}
.checkin-note{width:100%;border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin-top:4px;min-height:38px;font-size:12px;background:#fffdf8;font-family:inherit;resize:vertical}
.checkin-note:focus{outline:none;border-color:var(--gold)}

/* brain dump */
.bd-input{display:flex;gap:8px}
.bd-input input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
.bd-list{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.bd-item{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.bd-item.done span{text-decoration:line-through;color:var(--muted)}
.bdtype-tag{font-size:10.5px;color:var(--muted);margin-top:2px}
.pchip{border:1px solid var(--line);background:#fff;padding:5px 10px 5px 8px;border-radius:99px;font-size:11.5px;cursor:pointer;color:var(--accent-2);display:inline-flex;align-items:center;gap:6px;text-transform:capitalize}
.pchip .dot{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}
.pchip.on{background:var(--pc);color:#fff;border-color:var(--pc)}
.pchip.on .dot{background:#fff}
.bd-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.bd-item button{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}

/* ===== Arogya ===== */
.mealgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
@media(max-width:480px){.mealgrid{grid-template-columns:1fr}}
.hydration-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;margin-bottom:14px}
@media(max-width:560px){.hydration-grid{grid-template-columns:1fr}}
.hydration-grid .card{margin-bottom:0}
.mealcard{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff}
.mealcard.done{background:var(--mint);border-color:var(--gold)}
.mealcard .mtitle{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13.5px;color:var(--accent-2)}
.mealcard textarea,.mealcard input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#fcfdf9;font-size:13.5px;font-family:inherit}
.mealitems{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mealitem-chip{display:flex;align-items:center;gap:5px;background:var(--mint);border-radius:9px;padding:4px 7px 4px 9px;font-size:12px;color:var(--ink)}
.mealitem-chip a{color:var(--muted);cursor:pointer;text-decoration:none;font-size:11px}
.mealcard .mactions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.food-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.foodchip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:12px;font-size:12px;cursor:pointer;color:var(--accent-2);text-align:left}
.foodchip .fmacro{font-size:10px;color:var(--muted);font-weight:400}
.foodchip.addnew{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700}
.food-list{display:flex;flex-direction:column;margin-top:8px;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.food-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.food-row:last-child{border-bottom:none}
.food-row:hover{background:var(--soft)}
.food-row .fname{font-weight:600;font-size:13px;color:var(--accent-2)}
.food-row .fmacro{font-size:11px;color:var(--muted);flex-shrink:0}
.food-row.addnew{color:var(--accent);font-weight:700;border-top:1px dashed var(--accent)}
.food-row.recipe{background:var(--mint)}
.recipe-fallback{margin-top:12px}
.recipe-fallback summary{font-size:12px;color:var(--muted);cursor:pointer}

.counterbox{display:flex;align-items:center;gap:14px;margin-top:8px}
.counterbox .cval{font-family:"Fraunces",serif;font-size:26px;min-width:76px;text-align:center}
.progtrack{height:8px;border-radius:99px;background:var(--mint);overflow:hidden;margin-top:10px}
.progtrack i{display:block;height:100%;background:var(--accent);border-radius:99px}

.pantry-list,.shop-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.pantry-item,.shop-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.pantry-item.low{border-color:#ecd3ae;background:#fbf1e6}
.pantry-item .pname{flex:1;font-weight:700;font-size:13.5px}
.pantry-item .pqty{font-size:12px;color:var(--muted);min-width:76px;text-align:center}
.qtybtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--accent-2)}
.lowtag{font-size:10px;font-weight:800;color:var(--warn);background:#fbf1e6;padding:2px 7px;border-radius:99px}
.shop-item span{flex:1}
.shop-item.done span{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.addrow input{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;font-size:13px}
.addrow input.nm{flex:1;min-width:120px}
.addrow input.qty{width:70px}

.recipe-list{display:flex;flex-direction:column;gap:8px}
.recipe-row{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.recipe-row.open{border-color:var(--gold)}
.recipe-row-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.recipe-row-head .ric{font-size:17px}
.recipe-row-head .rname{flex:1;font-weight:700;font-size:13.5px}
.recipe-row-head .chev{font-size:10px;color:var(--muted)}
.recipe-card{border-top:1px solid var(--line);padding:12px 15px 14px;background:#fcfdf9}
.recipe-card h4{margin-bottom:3px}
.recipe-card .rtags{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.rtag{font-size:10px;background:var(--mint);color:var(--accent-2);padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.recipe-card ul{margin:6px 0 10px;padding-left:18px;font-size:12.5px;color:var(--muted)}

.weight-row{display:flex;gap:10px;align-items:flex-end;margin-top:8px;flex-wrap:wrap}
.weight-row input[type=number]{width:100px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px}
.weight-stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}

let state = loadState();

  try{

/* ============================= CLOUD SYNC (Firebase Realtime Database) ============================= */
/* Reuses the same Firebase project as the original "A Daily Promise" app, but a separate data path
   (dinacharyaState/<profileId>) so this app's data shape never collides with the old one's. */
const firebaseConfig = {
  apiKey: "AIzaSyA8PsNjdoarbCCNP0iCJhek539IoTvcHgM",
  authDomain: "adhd-planner-11eed.firebaseapp.com",
  databaseURL: "https://adhd-planner-11eed-default-rtdb.firebaseio.com",
  projectId: "adhd-planner-11eed",
  storageBucket: "adhd-planner-11eed.firebasestorage.app",
  messagingSenderId: "1047752512506",
  appId: "1:1047752512506:web:ccfb5a9a5ac192cd410a43"
};
function sanitizeProfileId(s){ return (s||"guest").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "guest"; }
let profileId = localStorage.getItem("dinacharya_profileId");
if(!profileId){ profileId = sanitizeProfileId("blahari.au@gmail.com"); localStorage.setItem("dinacharya_profileId", profileId); }
let fbReady = false, stateRef = null, lastPushedJSON = "", syncTimer = null;
function setSyncPill(text){ const el=document.getElementById("syncPill"); if(el) el.textContent = text; }
function initFirebaseAndStart(){
  try{
    firebase.initializeApp(firebaseConfig);
    stateRef = firebase.database().ref("dinacharyaState/"+profileId);
    fbReady = true;
  }catch(e){ console.error("Firebase init failed:", e); fbReady = false; }

  if(!fbReady){ setSyncPill("📴 offline (device only)"); render(); return; }

  setSyncPill("☁️ syncing…");
  stateRef.once("value").then(snap=>{
    const remote = snap.val();
    if(remote){
      state = Object.assign({}, loadState(), remote);
      state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
      saveLocalOnly();
    }
    attachRemoteListener();
    setSyncPill("☁️ synced");
    render();
    autoImportOldAppData();
  }).catch(err=>{
    console.error("Firebase pull failed:", err);
    setSyncPill("⚠️ sync error — using device copy");
    render();
  });
}
function attachRemoteListener(){
  stateRef.on("value", snap=>{
    const remote = snap.val();
    if(!remote) return;
    const json = JSON.stringify(remote);
    if(json === lastPushedJSON) return; // our own write echoing back
    state = Object.assign({}, state, remote);
    state.dietPrefs = Object.assign({}, state.dietPrefs, {noEgg:false});
    saveLocalOnly();
    setSyncPill("☁️ updated from another device");
    render();
  });
}
function pushToFirebase(){
  if(!fbReady || !stateRef) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{
    const json = JSON.stringify(state);
    lastPushedJSON = json;
    setSyncPill("☁️ saving…");
    stateRef.set(state).then(()=>setSyncPill("☁️ synced")).catch(err=>{
      console.error("Firebase push failed:", err);
      setSyncPill("⚠️ sync error — saved on device");
    });
  }, 400);
}
function saveLocalOnly(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function save(){ saveLocalOnly(); render(); pushToFirebase(); }
function saveQuiet(){ saveLocalOnly(); pushToFirebase(); }

/* ---- undo: snapshot the whole state before each destructive action, keep up to 15 steps of history ---- */
const UNDO_MAX = 15;
let undoStack = [], undoTimer = null;
function snapshotForUndo(label){
  undoStack.push({label, json: JSON.stringify(state)});
  if(undoStack.length>UNDO_MAX) undoStack.shift();
  clearTimeout(undoTimer);
  renderUndoToast();
  undoTimer = setTimeout(()=>{ undoStack=[]; renderUndoToast(); }, 8000);
}
function performUndo(){
  if(!undoStack.length) return;
  const last = undoStack.pop();
  state = JSON.parse(last.json);
  clearTimeout(undoTimer);
  saveLocalOnly(); pushToFirebase(); render(); renderUndoToast();
  if(undoStack.length){ undoTimer = setTimeout(()=>{ undoStack=[]; renderUndoToast(); }, 8000); }
}
function renderUndoToast(){
  const el = document.getElementById("undoToast");
  if(!el) return;
  if(!undoStack.length){ el.style.display="none"; el.innerHTML=""; return; }
  const top = undoStack[undoStack.length-1];
  el.style.display="flex";
  el.innerHTML = `<span>${top.label}${undoStack.length>1?` <span style="opacity:.7">(${undoStack.length-1} more)</span>`:""}</span><button onclick="performUndo()">Undo</button>`;
}

/* ---- automatic pull from the OLD app's Firebase data (adhdPlannerState/<profileId>) ----
   The old app ("A Daily Promise" / reset30) stored everything — pantry, shopping, and any
   custom foods you'd saved (with a "place" field marking restaurant dishes) — under the same
   kind of profile id this app uses. Runs quietly after every sync; only adds what's missing,
   never overwrites anything you've already got here. */
async function autoImportOldAppData(){
  if(!fbReady) return;
  try{
    const snap = await firebase.database().ref("adhdPlannerState/"+profileId).once("value");
    const old = snap.val();
    if(!old) return;
    let changed = false;
    state.pantry = state.pantry || [];
    state.shopping = state.shopping || [];
    state.customFoods = state.customFoods || [];
    if(old.pantry){
      Object.keys(old.pantry).forEach(name=>{
        if(old.pantry[name] && !state.pantry.some(p=>p.name.toLowerCase()===name.toLowerCase())){
          state.pantry.push({id:"p"+Date.now()+Math.random().toString(36).slice(2,6), name, qty:1, unit:"pcs", low:1});
          changed = true;
        }
      });
    }
    if(old.shopping){
      Object.keys(old.shopping).forEach(name=>{
        if(old.shopping[name] && !state.shopping.some(s=>s.name.toLowerCase()===name.toLowerCase())){
          state.shopping.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,6), name, done:false});
          changed = true;
        }
      });
    }
    const oldFoods = (old.wl && Array.isArray(old.wl.foods)) ? old.wl.foods : [];
    oldFoods.forEach(f=>{
      if(!f || !f.n) return;
      const exists = allFoodsForMeal("lunch").some(x=>x.n.toLowerCase()===f.n.toLowerCase());
      if(!exists){
        state.customFoods.push({n:f.n, k:Math.round(f.k)||0, p:Math.round(f.p)||0, c:Math.round(f.c)||0, f:Math.round(f.f)||0, meal:"lunch", src: f.place?"restaurant":"homemade"});
        changed = true;
      }
    });
    if(changed){ saveLocalOnly(); pushToFirebase(); render(); }
  }catch(err){ console.error("Auto old-app import failed:", err); }
}

/* ---- date helpers ---- */
function fmtLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNumberFor(iso){
  const a = new Date(START_DATE+"T00:00:00"), b = new Date(iso+"T00:00:00");
  return Math.round((b-a)/86400000)+1;
}
function dateForDay(n){
  const d = new Date(START_DATE+"T00:00:00"); d.setDate(d.getDate()+(n-1)); return fmtLocal(d);
}
function todayISO(){ return fmtLocal(new Date()); }
function todayDayNum(){ return dayNumberFor(todayISO()); }
let selectedDay = Math.max(1, todayDayNum());
function niceDate(iso, opts){ return new Date(iso+"T00:00:00").toLocaleDateString(undefined, opts||{weekday:"long",day:"numeric",month:"long"}); }
function toMin(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function toHHMM(min){ min=((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }
function fmt12(hhmm){ const m=toMin(hhmm); let h=Math.floor(m/60), mm=m%60; const ap=h<12?"am":"pm"; h=h%12||12; return h+(mm?":"+String(mm).padStart(2,"0"):"")+" "+ap; }

/* ---- per-day block list ---- */
function dayKey(n){ return "d"+n; }
function getDayBlocks(n){
  state.days = state.days || {};
  if(!state.days[dayKey(n)]){
    state.days[dayKey(n)] = DEFAULT_TEMPLATE.map(b=>({...b, done:false}));
  }
  return state.days[dayKey(n)];
}
function setDayBlocks(n, list){ state.days[dayKey(n)] = list; }

/* ---- cascade edit logic ---- */
const DAY_END_TARGET = 23*60; // 11:00pm sleep target
function applyBlockEdit(n, id, patch){
  const list = getDayBlocks(n).map(b=>({...b}));
  const idx = list.findIndex(b=>b.id===id);
  if(idx<0) return {list, overflow:0};
  Object.assign(list[idx], patch);
  // recompute forward chain from idx+1 based on idx's new end time (skipped blocks cost 0 time)
  let cursor = toMin(list[idx].time) + effDur(list[idx]);
  for(let i=idx+1;i<list.length;i++){
    list[i].time = toHHMM(cursor);
    cursor += effDur(list[i]);
  }
  let overflow = Math.max(0, cursor - DAY_END_TARGET);
  if(overflow>0){
    // squeeze flexible (non-anchor, non-skipped) blocks after idx first
    let remaining = overflow;
    const flexIdxs = [];
    for(let i=idx+1;i<list.length;i++) if(!list[i].anchor && !list[i].skipped && list[i].dur>10) flexIdxs.push(i);
    const totalFlex = flexIdxs.reduce((s,i)=>s+(list[i].dur-10),0);
    if(totalFlex>0){
      flexIdxs.forEach(i=>{
        const share = (list[i].dur-10)/totalFlex;
        const cut = Math.min(remaining*share, list[i].dur-10);
        list[i].dur = Math.max(10, Math.round(list[i].dur - cut));
      });
      // recompute times again after trimming
      let c2 = toMin(list[idx].time) + effDur(list[idx]);
      for(let i=idx+1;i<list.length;i++){ list[i].time = toHHMM(c2); c2 += effDur(list[i]); }
      overflow = Math.max(0, c2 - DAY_END_TARGET);
    }
  }
  setDayBlocks(n, list);
  return {list, overflow};
}

/* ---- streak / activity ---- */
function dayActivity(n){
  const list = state.days && state.days[dayKey(n)];
  if(!list) return {frac:0, level:0, done:0, total:0};
  const done = list.filter(b=>b.done).length;
  const total = list.length;
  const frac = total? done/total : 0;
  return {frac, done, total, level: frac>=0.8?3:frac>=0.5?2:done>0?1:0};
}
function streakCount(){
  let n = todayDayNum(), streak=0;
  if(dayActivity(n).level===0) n--;
  while(n>=1 && dayActivity(n).level>0 && streak<3650){ streak++; n--; }
  return streak;
}

function petal(cx,cy,angleDeg,len,width){
  const a=angleDeg*Math.PI/180, perp=a+Math.PI/2;
  const tipX=(cx+len*Math.cos(a)).toFixed(1), tipY=(cy+len*Math.sin(a)).toFixed(1);
  const midX=cx+len*0.55*Math.cos(a), midY=cy+len*0.55*Math.sin(a);
  const c1x=(midX+width*Math.cos(perp)).toFixed(1), c1y=(midY+width*Math.sin(perp)).toFixed(1);
  const c2x=(midX-width*Math.cos(perp)).toFixed(1), c2y=(midY-width*Math.sin(perp)).toFixed(1);
  return `<path d="M${cx} ${cy} Q${c1x} ${c1y} ${tipX} ${tipY} Q${c2x} ${c2y} ${cx} ${cy} Z"/>`;
}

/* ---- done / skip-inference logic ---- */
function effDur(b){ return b.skipped ? 0 : b.dur; }
function recomputeCascade(list){
  if(!list.length) return;
  let cursor = toMin(list[0].time);
  for(let i=0;i<list.length;i++){
    list[i].time = toHHMM(cursor);
    cursor += effDur(list[i]);
  }
}
function inferSkipped(list, idx){
  let i = idx-1;
  while(i>=0 && !list[i].done){
    if(list[i].anchor) break; // anchors are checkpoints — don't guess past them
    list[i].skipped = true;
    i--;
  }
}
function toggleDone(id){
  const list = getDayBlocks(selectedDay);
  const idx = list.findIndex(x=>x.id===id); if(idx<0) return;
  const b = list[idx];
  b.done = !b.done;
  if(b.done){
    b.skipped = false;
    inferSkipped(list, idx);
  }
  recomputeCascade(list);
  save();
}
function unskipBlock(id){
  const list = getDayBlocks(selectedDay);
  const b = list.find(x=>x.id===id); if(!b) return;
  b.skipped = false;
  recomputeCascade(list);
  save();
}

/* ---- gap-before-sleep handling (ask each time) ---- */
function sleepGapInfo(list){
  if(!list.length) return null;
  const sleep = list[list.length-1];
  const gap = DAY_END_TARGET - toMin(sleep.time);
  return {sleep, gap};
}
function resolveGap(n, choice){
  state.gapDecisions = state.gapDecisions || {};
  state.gapDecisions[dayKey(n)] = choice;
  save();
}

function addAdhocTask(){
  const t = document.getElementById("adhocTitle");
  const title = (t.value||"").trim();
  if(!title) return;
  const task = {id:"ad"+Date.now(), title, mode:adhocDraftMode, icon:adhocDraftIcon};
  if(adhocDraftMode==="range"){
    const s=document.getElementById("adhocStart"), e=document.getElementById("adhocEnd");
    if(!s.value || !e.value) return;
    task.startDate = s.value; task.endDate = e.value;
  } else {
    if(!adhocDraftDates.length) return;
    task.dates = [...adhocDraftDates];
  }
  state.adhocTasks = state.adhocTasks || [];
  state.adhocTasks.push(task);
  t.value = "";
  adhocDraftDates = [];
  save();
}
function deleteAdhocTask(id){ snapshotForUndo("Task deleted"); state.adhocTasks = (state.adhocTasks||[]).filter(x=>x.id!==id); save(); }
function adhocAppliesToDay(task, iso){
  return task.mode==="range" ? (iso>=task.startDate && iso<=task.endDate) : (task.dates||[]).includes(iso);
}
function adhocForDay(iso){ return (state.adhocTasks||[]).filter(t=>adhocAppliesToDay(t, iso)); }
function toggleAdhocDone(id, iso){
  state.adhocDone = state.adhocDone || {};
  const k = id+"_"+iso;
  state.adhocDone[k] = !state.adhocDone[k];
  save();
}
const ADHOC_ICONS = ["📌","📞","✉️","🛍️","🧳","🏥","🚗","🎉","💻","🏦","📄","🧹"];
function setAdhocIcon(ic){ adhocDraftIcon = ic; render(); }

  return `<p class="small">One-off things that only show up on the days you pick — they won't touch your regular timetable.</p>

        const k = t.id+"_"+iso;

/* ---- edit sheet with +5/-5 steppers ---- */
let sheetDraft = null;
function openSheetFor(id){ openSheetId=id; sheetDraft=null; render(); }
function renderEditSheet(block){
  if(!block) return "";
  const draft = sheetDraft || {title:block.title, time:block.time, dur:block.dur};
  sheetDraft = draft;
  return `
  <div class="sheet-overlay" onclick="if(event.target===this){openSheetId=null;render();}">
    <div class="sheet">
      <h3>${block.icon||""} Edit block</h3>
      <label>Title</label>
      <input type="text" value="${draft.title.replace(/"/g,'&quot;')}" oninput="sheetDraft.title=this.value">
      <label>Start time</label>
      <input type="time" value="${draft.time}" onchange="sheetDraft.time=this.value;document.querySelector('.sheet .timeval').textContent=fmt12(this.value)">
      <div class="stepper">
        <button onclick="stepTime(-5)">−5</button>
        <span class="timeval">${fmt12(draft.time)}</span>
        <button onclick="stepTime(5)">+5</button>
      </div>
      <label>Duration</label>
      <div class="stepper">
        <button onclick="stepDur(-5)">−5</button>
        <span class="durval">${draft.dur} min</span>
        <button onclick="stepDur(5)">+5</button>
      </div>
      ${block.anchor? `<div class="anchornote">⚓ This is an anchor block (bath, meals, job block, sleep). It won't shrink below a sensible minimum when the day gets squeezed.</div>` : ""}
      <div class="sheetactions">
        <button class="btn" onclick="confirmEdit('${block.id}')">Save</button>
        <button class="btn secondary" onclick="openSheetId=null;sheetDraft=null;render()">Cancel</button>
      </div>
    </div>
  </div>`;
}
function stepDur(delta){
  sheetDraft.dur = Math.max(5, sheetDraft.dur + delta);
  // live-update the number in place without a full re-render (keeps sheet open smoothly)
  const el = document.querySelector(".sheet .durval");
  if(el) el.textContent = sheetDraft.dur + " min";
}
function stepTime(delta){
  sheetDraft.time = toHHMM(toMin(sheetDraft.time) + delta);
  const inputEl = document.querySelector('.sheet input[type=time]');
  if(inputEl) inputEl.value = sheetDraft.time;
  const el = document.querySelector(".sheet .timeval");
  if(el) el.textContent = fmt12(sheetDraft.time);
}
function confirmEdit(id){
  const {list, overflow} = applyBlockEdit(selectedDay, id, {title:sheetDraft.title, time:sheetDraft.time, dur:sheetDraft.dur});
  cascadeMsg = overflow>0 ? `Today's a bit full — even after trimming flexible blocks, your day runs about ${overflow} min past 11:00pm.` : "";
  openSheetId = null; sheetDraft = null;
  save();
}

function getCheckin(n){
  state.checkins = state.checkins || {};
  return state.checkins[dayKey(n)] = state.checkins[dayKey(n)] || {};
}
function setCheckin(field, val){
  const c = getCheckin(selectedDay);
  c[field] = c[field]===val ? "" : val;
  save();
}
const CHECKIN_SLIDER_OPTS = {
  energy:["Very low","Low","Moderate","Good","High"],
  mood:["Anxious","Low","Neutral","Good","Great"],
  gut:["Uncomfortable","Bloated","Okay","Good","Great"]
};
const CHECKIN_SLIDER_EMOJI = {
  energy:["🪫","🥱","😐","🙂","⚡"],
  mood:["😰","😔","😐","🙂","😄"],
  gut:["😖","🎈","😐","🙂","✨"]
};
const CHECKIN_FIELD_COLOR = {energy:"#c9ae77", mood:"#3d4a8a", gut:"#3f7a52"};
function setCheckinSlider(field, val){
  const c = getCheckin(selectedDay);
  c[field] = val;
  save();
}
function ciSliderPreview(field, v){
  v = +v;
  const opts = CHECKIN_SLIDER_OPTS[field];
  const pct = v/(opts.length-1)*100;
  const emojiEl = document.getElementById("ciEmoji_"+field);
  const labelEl = document.getElementById("ciLabel_"+field);
  const rangeEl = document.getElementById("ciRange_"+field);
  if(emojiEl) emojiEl.textContent = CHECKIN_SLIDER_EMOJI[field][v];
  if(labelEl) labelEl.textContent = opts[v];
  if(rangeEl) rangeEl.style.background = `linear-gradient(to right, var(--fc) ${pct}%, var(--line) ${pct}%)`;
}
function checkinSlider(field, icon, label){
  const c = getCheckin(selectedDay);
  const opts = CHECKIN_SLIDER_OPTS[field];
  let idx = opts.indexOf(c[field]);
  if(idx<0) idx = 2;
  const col = CHECKIN_FIELD_COLOR[field]||"var(--accent)";
  const pct = idx/(opts.length-1)*100;
  return `<div class="checkin-field slider-field" style="--fc:${col}">
    <div class="ci-row-top">
      <span class="lbl">${icon} ${label}</span>
      <span class="ci-slider-label" id="ciLabel_${field}">${opts[idx]}</span>
    </div>
    <div class="ci-slider-row">
      <span class="ci-slider-emoji" id="ciEmoji_${field}">${CHECKIN_SLIDER_EMOJI[field][idx]}</span>
      <input type="range" min="0" max="4" step="1" value="${idx}" class="ci-slider" id="ciRange_${field}"
        style="background:linear-gradient(to right, var(--fc) ${pct}%, var(--line) ${pct}%)"
        oninput="ciSliderPreview('${field}', this.value)"
        onchange="setCheckinSlider('${field}', CHECKIN_SLIDER_OPTS['${field}'][this.value])">
    </div>
  </div>`;
}
function renderCheckinFields(){
  const c = getCheckin(selectedDay);
  return `
    <div class="checkin-grid" style="margin-top:10px">
      ${checkinSlider("energy","⚡","Energy")}
      ${checkinSlider("mood","💭","Mood")}
      ${checkinSlider("gut","🌿","Gut")}
    </div>
    <label class="small" style="display:block;margin-top:12px;font-weight:700;font-size:11.5px">✍️ A line for today</label>

}
function saveNote(v){ getCheckin(selectedDay).note = v; saveQuiet(); }

const BD_TYPES = [["call","📞 To call"],["email","📧 To email"],["todo","✅ To do"],["learn","📚 Learn"],["lookup","🔍 Look up"]];
const BD_PRIORITIES = [["red","Most important"],["yellow","Important"],["green","When free"],["grey","Someday"]];
const BD_COLOR = {red:"#b4552b", yellow:"#caa23c", green:"#3f7a52", grey:"#9c8268"};
let bdDraftType = "todo", bdDraftPriority = "yellow", bdFilter = "All";
function addBrainDump(){
  const el = document.getElementById("bdInput");
  const v = (el.value||"").trim();
  if(!v) return;
  state.brainDump = state.brainDump || [];
  state.brainDump.unshift({id:"bd"+Date.now(), text:v, type:bdDraftType, priority:bdDraftPriority, day:selectedDay, done:false, ts:Date.now()});
  el.value = "";
  save();
}
function toggleBd(id){ const it=state.brainDump.find(x=>x.id===id); if(it){ it.done=!it.done; save(); } }
function deleteBd(id){ snapshotForUndo("Item deleted"); state.brainDump = state.brainDump.filter(x=>x.id!==id); save(); }
function setBdType(t){ bdDraftType = t; render(); }
function setBdPriority(p){ bdDraftPriority = p; render(); }
function bdOnInput(){
  const el = document.getElementById("bdInput");
  const panel = document.getElementById("bdOptions");
  if(el && panel) panel.style.display = (el.value && el.value.trim()) ? "" : "none";
}
function renderBrainDump(){
  const all = (state.brainDump||[]);
  const items = bdFilter==="All" ? all : all.filter(it=>it.priority===bdFilter);
  const typeLabel = id => (BD_TYPES.find(t=>t[0]===id)||[,""])[1];
  return `<div class="card">
    <h3>🧠 Brain dump</h3>
    <p class="small">Catch it here before it becomes a worry — tag it so you can find it again.</p>
    <div class="bd-input" style="margin-top:10px">
      <input type="text" id="bdInput" placeholder="Call the dentist, business idea, worry about rent…" oninput="bdOnInput()" onkeydown="if(event.key==='Enter')addBrainDump()">
      <button class="btn" onclick="addBrainDump()">Add</button>
    </div>
    <div id="bdOptions" style="display:none">
      <div class="row" style="margin-top:9px;gap:6px">
        ${BD_TYPES.map(([id,l])=>`<button class="chip ${bdDraftType===id?'on':''}" onclick="setBdType('${id}')">${l}</button>`).join("")}
      </div>
      <div class="row" style="margin-top:7px;gap:6px">
        ${BD_PRIORITIES.map(([id,l])=>`<button class="pchip ${bdDraftPriority===id?'on':''}" style="--pc:${BD_COLOR[id]}" title="${l}" onclick="setBdPriority('${id}')"><span class="dot"></span>${id}</button>`).join("")}
      </div>
    </div>
    <div class="row" style="margin-top:14px;gap:6px">
      <button class="chip ${bdFilter==='All'?'on':''}" onclick="bdFilter='All';render()">All (${all.length})</button>
      ${BD_PRIORITIES.map(([id])=>`<button class="pchip ${bdFilter===id?'on':''}" style="--pc:${BD_COLOR[id]}" onclick="bdFilter='${id}';render()"><span class="dot"></span>${id} (${all.filter(x=>x.priority===id).length})</button>`).join("")}
    </div>
    <div class="bd-list" style="margin-top:12px">
      ${items.length? items.map(it=>`
        <div class="bd-item ${it.done?'done':''}" style="border-left:4px solid ${BD_COLOR[it.priority]||'var(--line)'}">
          <input type="checkbox" ${it.done?"checked":""} onchange="toggleBd('${it.id}')">
          <div style="flex:1">
            <span>${it.text}</span>
            <div class="bdtype-tag">${typeLabel(it.type)}</div>
          </div>
          <button onclick="deleteBd('${it.id}')">✕</button>
        </div>`).join("") : `<p class="small">Nothing here for this filter.</p>`}
    </div>
  </div>`;
}

function ensurePantrySeed(){
  if(!state.pantrySeeded){
    state.pantry = PANTRY_SEED.map((p,i)=>({id:"p"+i, ...p}));
    state.pantrySeeded = true;
    saveQuiet();
  }
}

function renderArogya(){
  ensurePantrySeed();
  const tabs = [["meals","🍽 Meals"],["watermove","🏃 Fitness"],["pantry","🧺 Pantry & shopping"],["recipes","📖 Recipes"],["weight","⚖️ Weight"]];
  let body = "";
  if(arogyaTab==="meals") body = renderMeals();
  else if(arogyaTab==="watermove") body = renderWaterMove();
  else if(arogyaTab==="pantry") body = renderPantryShopping();
  else if(arogyaTab==="recipes") body = renderRecipes();
  else if(arogyaTab==="weight") body = renderWeight();
  return `
  ${renderTipCard("🌿","Wellness tip",(WEEKDAY_MANTRA[weekdayForDay(selectedDay)]||WEEKDAY_MANTRA.Monday).tip)}
  <div class="todaytabs">
    ${tabs.map(([k,l])=>`<button class="${arogyaTab===k?'on':''}" onclick="arogyaTab='${k}';render()">${l}</button>`).join("")}
  </div>
  ${body}`;
}

/* ---- meals ---- */
function getMeals(n){
  state.meals = state.meals || {};
  return state.meals[dayKey(n)] = state.meals[dayKey(n)] || {breakfast:{text:"",done:false},lunch:{text:"",done:false},dinner:{text:"",done:false},snack:{text:"",done:false}};
}
function setMealText(meal, val){ getMeals(selectedDay)[meal].text = val; saveQuiet(); }
function toggleMealDone(meal){ const m=getMeals(selectedDay)[meal]; m.done=!m.done; save(); }
function useRecipeForMeal(id, meal){
  const r = RECIPES.find(x=>x.id===id); if(!r) return;
  getMeals(selectedDay)[meal].text = r.icon+" "+r.name;
  logFoodEntry(meal, r.name);
  save();
}
const EGG_RE = /egg|omelette|omelet|frittata/i;
const SI_RE = /idli|dosa|sambar|rasam|uttapam|pongal|upma|poriyal|vada|pesarattu|adai|chutney|bisi bele|avial|thoran|kootu|rava|semiya|kadhi/i;
function dietAllowed(f){
  const p = state.dietPrefs || {noEgg:true};
  if(p.noEgg && EGG_RE.test(f.n)) return false;
  return true;
}
function allFoodsForMeal(meal){
  // unsegregated: the full catalog is searchable from every meal card, not just items tagged for that meal
  return FOOD_CATALOG.concat(state.customFoods||[]).concat(BRANDED_FOODS);
}
function brandedFoodFor(name){
  const n = (name||"").toLowerCase();
  return BRANDED_FOODS.find(f=>f.n.toLowerCase()===n) || null;
}
/* ---- daily macro log (protein/carbs/fat/sugar/caffeine consumed vs target) ---- */
function foodMacroLookup(name){
  const n = (name||"").toLowerCase();
  const hit = FOOD_CATALOG.concat(state.customFoods||[]).concat(BRANDED_FOODS).find(f=>f.n.toLowerCase()===n);
  return hit ? {k:hit.k||0, p:hit.p||0, c:hit.c||0, f:hit.f||0, s:hit.s||0, caf:hit.caf||0} : null;
}
function logFoodEntry(meal, name){
  state.foodLog = state.foodLog || {};
  const key = dayKey(selectedDay);
  state.foodLog[key] = state.foodLog[key] || [];
  const macro = foodMacroLookup(name) || {k:0,p:0,c:0,f:0,s:0,caf:0};
  state.foodLog[key].push({id:"fl"+Date.now()+Math.random().toString(36).slice(2,5), name, meal, ...macro, ts:Date.now()});
}
/* ---- frequency nudges: how often has this item been logged recently ---- */
function foodFrequencyCount(name, days){
  const nl = (name||"").toLowerCase();
  let count = 0;
  for(let d=selectedDay-(days-1); d<=selectedDay; d++){
    const entries = (state.foodLog||{})[dayKey(d)] || [];
    entries.forEach(e=>{ if((e.name||"").toLowerCase()===nl) count++; });
  }
  return count;
}
let lastFoodNote = null;
function noteForLoggedFood(name){
  const b = brandedFoodFor(name);
  if(!b || (b.tag!=="bad" && b.tag!=="okay")) { lastFoodNote = null; return; }
  const freq = foodFrequencyCount(name, 7);
  let msg = b.tag==="bad" ? `Not recommended: ${b.note}.` : `Okay, watch it: ${b.note}.`;
  if(freq>=3) msg += ` That's ${freq} times in the last 7 days — getting frequent.`;
  if(b.swap) msg += ` Next time try: ${b.swap}.`;
  lastFoodNote = {name, tag:b.tag, msg};
}
function dismissFoodNote(){ lastFoodNote = null; render(); }
function removeFoodLogEntry(id){
  snapshotForUndo("Food entry removed");
  const key = dayKey(selectedDay);
  state.foodLog = state.foodLog || {};
  state.foodLog[key] = (state.foodLog[key]||[]).filter(e=>e.id!==id);
  save();
}

/* ---- weight trend ---- */
function logWeight(){
  const el = document.getElementById("weightInput");
  const kg = parseFloat(el.value);
  if(!kg || kg<=0) return;
  const iso = dateForDay(selectedDay);
  state.weight = state.weight || [];
  const existing = state.weight.find(w=>w.date===iso);
  if(existing) existing.kg = kg; else state.weight.push({date:iso, kg});

}
function deleteWeight(date){ snapshotForUndo("Weight entry deleted"); state.weight = state.weight.filter(w=>w.date!==date); save(); }
function setWeightGoal(){
  const s=document.getElementById("goalStart"), t=document.getElementById("goalTarget"), d=document.getElementById("goalDate");
  const start=parseFloat(s.value), target=parseFloat(t.value);
  if(!start || !target || !d.value) return;
  state.weightGoal = {start, target, targetDate:d.value, setDate:todayISO()};
  save();
}
function clearWeightGoal(){ state.weightGoal = {start:null,target:null,targetDate:null}; save(); }
function setProfile(){
  const a=document.getElementById("profAge"), h=document.getElementById("profHeight"),
        sx=document.getElementById("profSex"), ac=document.getElementById("profActivity");
  const age=parseInt(a.value,10), heightCm=parseFloat(h.value);
  if(!age || !heightCm) return;
  state.profile = {age, heightCm, sex:sx.value, activity:ac.value};
  save();
}
const ACTIVITY_MULT = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725};
function bmrFor(weightKg){
  const p = state.profile||{};
  const age = p.age||30, h = p.heightCm||155, sex = p.sex||"female";
  return sex==="male" ? (10*weightKg + 6.25*h - 5*age + 5) : (10*weightKg + 6.25*h - 5*age - 161);
}
function tdeeFor(weightKg){
  const p = state.profile||{};
  const mult = ACTIVITY_MULT[p.activity||"sedentary"] || 1.2;
  return bmrFor(weightKg) * mult;
}
function calorieTargetFor(weightKg){
  const t = tdeeFor(weightKg);
  const sex = (state.profile||{}).sex||"female";
  const floor = sex==="male" ? 1500 : 1200;
  return Math.max(floor, Math.round(t - 500));
}
function goalTargetForDate(iso){
  const g = state.weightGoal;
  if(!g || !g.start || !g.target || !g.targetDate) return null;
  const total = toMin; // noop guard not used
  const d0 = new Date(g.setDate+"T00:00:00"), d1 = new Date(g.targetDate+"T00:00:00"), dq = new Date(iso+"T00:00:00");
  const totalDays = Math.max(1,(d1-d0)/86400000);
  const elapsed = Math.max(0,(dq-d0)/86400000);
  const frac = Math.min(1, elapsed/totalDays);
  return g.start + (g.target - g.start)*frac;
}
function renderWeightSVG(entries){
  if(entries.length<2) return `<p class="small">Log at least two days to see your trend line.</p>`;
  const g = state.weightGoal;
  const hasGoal = g && g.start && g.target && g.targetDate;
  const w=560,h=140,pad=24;
  const kgs = entries.map(e=>e.kg);
  if(hasGoal){ kgs.push(g.start, g.target); }
  const min=Math.min(...kgs)-1, max=Math.max(...kgs)+1;
  const x = i => pad + (i/(entries.length-1))*(w-pad*2);
  const y = kg => h-pad - ((kg-min)/(max-min||1))*(h-pad*2);
  const pts = entries.map((e,i)=>x(i)+","+y(e.kg)).join(" ");
  const goalPts = hasGoal ? entries.map((e,i)=>x(i)+","+y(goalTargetForDate(e.date))).join(" ") : "";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px;margin-top:10px">
    ${hasGoal? `<polyline points="${goalPts}" fill="none" stroke="#9c8268" stroke-width="1.6" stroke-dasharray="4 4"/>` : ""}
    <polyline points="${pts}" fill="none" stroke="#3d4a8a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${entries.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.kg)}" r="3.5" fill="#c9ae77"/>`).join("")}
  </svg>
  ${hasGoal? `<p class="small">Solid line: your actual weight. Dashed: the pace needed to hit ${g.target}kg by ${niceDate(g.targetDate,{day:"numeric",month:"short",year:"numeric"})}.</p>` : ""}`;
}

/* ---- pomodoro ---- */
let pomo = { mode:"focus", secondsLeft:25*60, total:25*60, running:false, timer:null };
function pomoSessions(n){ state.pomodoro = state.pomodoro || {}; return state.pomodoro[dayKey(n)] = state.pomodoro[dayKey(n)] || {sessions:0}; }
function pomoTick(){
  if(pomo.secondsLeft<=0){
    if(pomo.mode==="focus"){ pomoSessions(selectedDay).sessions++; saveQuiet(); pomo.mode="break"; pomo.total=5*60; pomo.secondsLeft=5*60; }
    else { pomo.mode="focus"; pomo.total=25*60; pomo.secondsLeft=25*60; }
  } else {
    pomo.secondsLeft--;
  }
  renderPomoRing();
}
function pomoStart(){ if(pomo.running) return; pomo.running=true; pomo.timer=setInterval(pomoTick,1000); renderPomoRing(); }
function pomoPause(){ pomo.running=false; clearInterval(pomo.timer); renderPomoRing(); }
function pomoReset(){ pomo.running=false; clearInterval(pomo.timer); pomo.mode="focus"; pomo.total=25*60; pomo.secondsLeft=25*60; renderPomoRing(); }
function renderPomoRing(){
  const el = document.getElementById("pomoRingWrap");
  if(!el) return;
  const pct = Math.round((1-pomo.secondsLeft/pomo.total)*100);
  const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
  const ss = String(pomo.secondsLeft%60).padStart(2,"0");
  el.querySelector(".pomo-ring").style.setProperty("--p", pct);
  el.querySelector(".inner b").textContent = mm+":"+ss;
  el.querySelector(".inner span").textContent = pomo.mode;
  const startBtn = document.getElementById("pomoStartBtn");
  if(startBtn) startBtn.textContent = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
}
function pomoToggle(){ pomo.running? pomoPause() : pomoStart(); }
function renderPomodoro(){
  const s = pomoSessions(selectedDay);
  const pct = Math.round((1-pomo.secondsLeft/pomo.total)*100);
  const mm = String(Math.floor(pomo.secondsLeft/60)).padStart(2,"0");
  const ss = String(pomo.secondsLeft%60).padStart(2,"0");
  const btnLabel = pomo.running? "Pause" : (pomo.secondsLeft===pomo.total? "Start" : "Resume");
  return `<div class="card">
    <h3>⏳ Focus timer</h3>
    <p class="small">25 minutes of focus, 5 to breathe. ${s.sessions} focus session${s.sessions===1?"":"s"} today.</p>
    <div id="pomoRingWrap">
      <div class="pomo-ring" style="--p:${pct}"><div class="inner"><b>${mm}:${ss}</b><span>${pomo.mode}</span></div></div>
      <div class="pomo-actions">
        <button class="btn" id="pomoStartBtn" onclick="pomoToggle()">${btnLabel}</button>
        <button class="btn secondary" onclick="pomoReset()">Reset</button>
      </div>
    </div>
  </div>`;
}

  ${books.length? books.map(b=>`
    <div class="book-item">
      <div class="bhead"><span class="btitle">${b.title}</span></div>
      ${b.author? `<span class="bauthor">${b.author}</span>` : ""}
      <input type="text" placeholder="Notes, quotes, takeaways…" value="${(b.notes||"").replace(/"/g,'&quot;')}" oninput="setBookNotes('${b.id}',this.value)" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-top:8px;font-size:12.5px;background:#fcfdf9">
      <div class="brow">
        <div class="row" style="gap:5px">
          ${READ_STATUSES.map(s=>`<button class="stagechip ${b.status===s?'on':''}" style="${b.status===s?'background:'+READ_COLOR[s]:''}" onclick="setBookStatus('${b.id}','${s}')">${s}</button>`).join("")}
        </div>
        <button onclick="deleteBook('${b.id}')" style="background:none;border:0;color:var(--muted);cursor:pointer">✕</button>
      </div>
    </div>`).join("") : `<p class="small">Nothing on the list yet.</p>`}`;
}

/* ---- summary / consistency ---- */
function renderJournalSummary(){
  const streak = streakCount();
  const sankalpDone = Object.values((state.sankalp||{}).done||{}).filter(Boolean).length;
  const bizProg = bizPlanProgress();
  const journalDays = Object.values(state.journal||{}).filter(j=>j.entry&&j.entry.trim()).length;
  const incomeTotal = (state.income||[]).reduce((s,i)=>s+i.amount,0);
  const booksRead = (state.reading||[]).filter(b=>b.status==="Done").length;
  let last7 = 0;
  for(let i=0;i<7;i++){ const n = todayDayNum()-i; if(n>=1 && dayActivity(n).level>0) last7++; }
  return `<div class="card" style="margin-bottom:14px">
    <h3>🌙 Summary & consistency</h3>
    <p class="small">A quiet look at how the pieces are adding up.</p>
  </div>
  <div class="summary-grid">
    <div class="sumtile"><b>${streak}</b><span>day streak</span></div>
    <div class="sumtile"><b>${last7}/7</b><span>active last 7 days</span></div>
    <div class="sumtile"><b>${sankalpDone}/40</b><span>sankalp days kept</span></div>
    <div class="sumtile"><b>${bizProg.done}/${bizProg.total}</b><span>business plan steps</span></div>
    <div class="sumtile"><b>${journalDays}</b><span>journal entries</span></div>
    <div class="sumtile"><b>${booksRead}</b><span>books finished</span></div>
    <div class="sumtile"><b>${incomeTotal.toFixed(0)}</b><span>income logged</span></div>
    <div class="sumtile"><b>${(state.pipeline||[]).filter(l=>l.stage==="Won").length}</b><span>leads won</span></div>
    <div class="sumtile"><b>${monthActiveCount()}</b><span>active days this month</span></div>
  </div>`;
}

function renderJournal(){
  const tabs = [["reading","📚 Reading"],["sankalp","🔥 Sankalp"],["journal","📓 Journal"],["summary","🌙 Summary"]];
  let body = "";
  if(journalTab==="sankalp") body = renderSankalp();
  else if(journalTab==="journal") body = renderJournalEntry();
  else if(journalTab==="reading") body = renderReading();
  else if(journalTab==="summary") body = renderJournalSummary();
  return `
  <div class="todaytabs">
    ${tabs.map(([k,l])=>`<button class="${journalTab===k?'on':''}" onclick="journalTab='${k}';render()">${l}</button>`).join("")}
  </div>
  ${body}`;
}

/* ============================= SOON PLACEHOLDER ============================= */
function renderSoon(name, icon){
  return `<div class="card soon-card">
    <div class="ic">${icon}</div>
    <h2>${name} is next</h2>
    <p class="small">Building this nest right after you review Today. It'll follow the same calm style.</p>
    <button class="btn secondary" onclick="goNest('today')" style="margin-top:12px">← Back to Today</button>
  </div>`;
}

/* ============================= RENDER ROOT ============================= */
function render(){
  renderNav();
  const app = document.getElementById("app");
  if(currentNest==="dashboard") app.innerHTML = renderDashboard();
  else if(currentNest==="today") app.innerHTML = renderToday();
  else if(currentNest==="arogya") app.innerHTML = renderArogya();
  else if(currentNest==="business") app.innerHTML = renderBusiness();
  else if(currentNest==="journal") app.innerHTML = renderJournal();
}
render();
initFirebaseAndStart();
</script>
</body>
</html>
