<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gentle Reset • Lahari • Brain Dump</title>
<meta name="theme-color" content="#eef3ec">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#26302b;--muted:#6e7771;--accent:#657c68;--soft:#e7eee7;--line:#dfe4df;--warn:#9a7650}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(135deg,#e5eee4,#f8f5ec);padding:28px 18px 20px;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.title{font-size:27px;font-weight:800}.sub{color:var(--muted)}
nav{display:flex;gap:7px;overflow:auto;margin-top:16px}nav button,.pill{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer}
nav button.active{background:var(--accent);color:white}
/* Brain Dump + Priority Matrix polish */
.task-transfer{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;margin-top:12px;padding:0;border:0;background:transparent;box-shadow:none}
.task-transfer .transfer-count{display:none}
.task-transfer .transfer-count .badge{display:none}
.task-transfer .transfer-btn{font-size:13px;padding:8px 11px}
.transfer-btn{box-shadow:0 4px 12px #0000000b}
.matrix-header{background:linear-gradient(135deg,#f4f8f3,#fbfaf6);border-color:#dbe4db}
.matrix-grid{margin-top:12px}
.matrix-quadrant{position:relative;overflow:hidden}
.matrix-quadrant:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent);opacity:.55}
.matrix-quadrant h4{margin:2px 0 10px;font-size:16px}
.matrix-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 2px}
.matrix-empty{padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fafbf9}
main{padding:22px 14px 60px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 3px 15px #00000006}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}
h2,h3{margin:0 0 10px}.small{font-size:13px;color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px}.score{font-size:40px;font-weight:800}.progress{height:10px;background:#edf0ec;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f1ef}.check:last-child{border:0}.check input{margin-top:4px;accent-color:var(--accent)}
.daygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.day{padding:8px 2px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;text-align:center}.day.selected{outline:2px solid var(--accent)}.day.done{background:var(--soft)}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--soft);font-size:12px}.timer{font-size:28px;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;background:var(--accent);color:white;padding:9px 13px;border-radius:10px;cursor:pointer}.btn.secondary{background:#eef1ed;color:var(--ink)}
.meal{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.foodgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.food{border:1px solid var(--line);padding:9px;border-radius:11px;cursor:pointer}.food input{margin-right:6px;accent-color:var(--accent)}
textarea,input[type=text],input[type=url]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}textarea{min-height:80px}
.quote{font-size:18px;font-weight:700}.alert{background:#fbf5e9;border-left:4px solid #b48a51;padding:11px;border-radius:8px}
@media(max-width:800px){.span8,.span6,.span4{grid-column:span 12}.daygrid{grid-template-columns:repeat(6,1fr)}.hero{display:block}}

.business-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:10px}
.business-kpi{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafbf9}
.business-kpi b{display:block;font-size:23px}
.business-kpi span{font-size:12px;color:var(--muted)}
.business-day{border:1px solid var(--line);border-radius:15px;margin:10px 0;background:#fff;overflow:hidden}
.business-day summary{cursor:pointer;list-style:none;padding:13px 15px;display:flex;align-items:center;gap:10px}
.business-day summary::-webkit-details-marker{display:none}
.business-day summary:before{content:"＋";font-weight:800;color:var(--accent)}
.business-day[open] summary:before{content:"−"}
.business-day.done summary{background:var(--soft)}
.business-day .bd-body{padding:0 15px 15px}
.business-meta{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.business-progress{height:7px;background:#edf0ec;border-radius:99px;overflow:hidden;margin:5px 0 10px}
.business-progress .bar{height:100%;background:var(--accent)}
.business-checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.business-checkgrid .check{min-height:38px}
.business-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.business-metrics input{min-width:0}
.status-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.status-row button{font-size:12px}
.followup-row{display:grid;grid-template-columns:1.2fr .9fr .9fr 1fr auto;gap:7px;align-items:center;margin:7px 0}
.food .btn.secondary{border:0;line-height:1}.pipeline-table{width:100%;border-collapse:collapse;font-size:13px}
.pipeline-table th,.pipeline-table td{padding:7px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:800px){.business-kpis{grid-template-columns:repeat(2,1fr)}.business-checkgrid,.business-metrics{grid-template-columns:1fr}.followup-row{grid-template-columns:1fr 1fr}.business-meta{margin-left:0}}

/* Food Choices layout */
.food-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
.food-choice-section{background:#fbfcfa;border:1px solid var(--line);border-radius:14px;padding:15px}
.food-choice-section h4{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.food-choice-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.food-choice-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid #e8ece8;border-radius:10px;background:#fff;min-height:42px}
.food-choice-item input{margin-top:3px;flex:0 0 auto;accent-color:var(--accent)}
.food-choice-item span{line-height:1.35}
.food-choice-intro{margin-bottom:2px}
@media(max-width:800px){.food-choice-grid{grid-template-columns:1fr}.food-choice-items{grid-template-columns:1fr}}

/* Manage added items — compact single-line rows */
.custom-item-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.custom-item-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(180px,260px);gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid #eef0ed}
.custom-item-row:last-child{border-bottom:0}
.custom-item-row:hover{background:#fafbf9}
.custom-item-row input[type=checkbox]{margin:0;accent-color:var(--accent)}
.custom-item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.custom-item-row select{width:100%;min-width:0;margin:0}
@media(max-width:650px){.custom-item-row{grid-template-columns:auto minmax(0,1fr);gap:8px}.custom-item-row select{grid-column:2}}

/* Shopping list: category header + drag/drop + move-to dropdown */
.cat-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cat-header h4{margin:0;padding:0;border:0}
.cat-edit-btn{padding:4px 10px;font-size:12px;white-space:nowrap}
.cat-drop{transition:background .12s,outline .12s}
.cat-drop.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;background:#f3f8f2}
.shop-item-row{cursor:grab}
.shop-item-row:active{cursor:grabbing}
.shop-item-row .drag-handle{color:var(--muted);margin-right:2px}
.buy-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.buy-summary-grid .custom-item-row{border-bottom:1px solid #eef0ed}
@media(max-width:650px){.buy-summary-grid{grid-template-columns:1fr}}

/* Today planner — matches the app's card/check/badge language instead of standalone colors */
.plan-task{border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin:10px 0;background:#fff}
.plan-task.plan-done{background:var(--soft)}
.plan-top{display:flex;align-items:flex-start;gap:12px}
.plan-order{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.plan-order button{width:24px;height:20px;font-size:10px;padding:0;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--muted);cursor:pointer}
.plan-order button:disabled{opacity:.3;cursor:default}
.plan-time{font-size:12.5px;color:var(--muted);min-width:86px;padding-top:2px}
.plan-time input[type=time]{padding:4px 6px;font-size:12.5px;margin-top:4px;width:100%}
.plan-body{flex:1;min-width:0}
.plan-body h4{margin:0 0 3px;font-size:15px}
.plan-body p{margin:0;color:var(--muted)}
.plan-target{font-size:12.5px;color:var(--muted);margin-top:7px}
.plan-target input{width:54px;padding:3px 6px;font-size:12.5px;margin:0 4px}
.plan-check{flex-shrink:0}
.plan-check input{width:19px;height:19px;accent-color:var(--accent);margin-top:2px}
.plan-confirm{margin-top:10px;padding-top:10px;border-top:1px solid #f0f1ef;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.plan-confirm input[type=time]{padding:6px 8px;width:auto}
.plan-items{margin-top:10px;padding-top:10px;border-top:1px solid #f0f1ef}
.plan-items .check{padding:5px 0}
.plan-add-sub{border:0!important;border-bottom:1px dashed var(--line)!important;border-radius:0!important;padding:6px 2px!important;font-size:13px;background:transparent!important}
.plan-add-sub:focus{outline:none;border-bottom-color:var(--accent)!important}
.plan-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:700;margin-left:7px;vertical-align:middle}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.plan-recap{background:var(--soft);border-radius:12px;padding:11px 14px;font-size:13.5px;margin:10px 0}
.plan-time-big{font-weight:800;font-size:15px;color:var(--ink);min-width:104px;line-height:1.3}
.plan-time-big input[type=time]{font-weight:400;font-size:12.5px;padding:4px 6px;margin-top:5px;width:100%}
.subtask-toggle{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0;margin-bottom:8px;display:inline-block}
.subtask-table{width:100%;border-collapse:collapse;margin-top:2px;font-size:13px}
.subtask-table th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.subtask-table td{padding:7px 6px;border-bottom:1px solid #f0f1ef;vertical-align:middle}
.subtask-table tr.sub-done td{color:var(--muted);text-decoration:line-through}
.subtask-table td input[type=number]{width:56px;padding:3px 5px;font-size:12.5px}
.subtask-table tfoot td{border-top:1px solid var(--line);border-bottom:0;padding-top:9px}
.sub-del{background:none;border:0;color:#b23b3b;cursor:pointer;font-size:15px;padding:2px 8px;line-height:1}
.sub-hide{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;line-height:1}
.plan-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.plan-title-edit{border:none;background:transparent;font-weight:700;font-size:15px;color:var(--ink);padding:2px 4px;margin-left:-4px;flex:1;min-width:80px;font-family:inherit}
.plan-title-edit:focus{outline:none;border-bottom:1px dashed var(--accent);background:#fff}

/* ===== v2 polish: shared ===== */
:root{--bg:#f4f3ee;--ink:#243029;--muted:#6b756f;--accent:#5b7a61;--accent-2:#3f5f47;--soft:#e4ede4;--line:#dde3dc;--warn:#a06f3c;--mint:#f2f7f1}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15.5px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
input,select,textarea,button{font:inherit;color:inherit}
header{padding:18px 18px 12px;background:linear-gradient(160deg,#e3ece2 0%,#f4f3ee 70%)}
.title{font-size:25px;letter-spacing:-.015em}
.sub{font-size:14px}
nav{scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin-top:12px}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;flex:0 0 auto;font-size:14.5px;font-weight:600;color:var(--ink)}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{font-weight:600;transition:filter .12s}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.icon{padding:8px 10px}
.link-btn{background:none;border:0;padding:0;color:var(--accent-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px;font-weight:600}
.card{border-radius:18px;box-shadow:0 1px 2px #0000000a}
h2{font-size:22px;letter-spacing:-.01em}
h3{font-size:17px}
h4{margin:14px 0 4px;font-size:14.5px}
label.small{display:block;margin:10px 0 4px}
select,input[type=number],input[type=date],input[type=time]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px}
textarea.tall{min-height:120px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.card-head h3{margin:0}
.daynav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px}
.daynav-date{font-weight:500;margin-left:4px}
.back-row{margin-top:16px}
.split-left{grid-column:span 7}
.split-right{grid-column:span 5;align-self:start}
#app > .daynav{margin-bottom:14px}
.more-almost summary{list-style:none;margin:8px 0}
.more-almost summary::-webkit-details-marker{display:none}
.more-almost[open] summary{display:none}
.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daygrid{grid-template-columns:repeat(15,1fr)}
.day{font-weight:600;font-variant-numeric:tabular-nums;min-height:38px}
.page-head h2{margin-bottom:4px}
.stat-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--mint);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
.stat b{font-size:17px;margin-right:3px}
.stat.warn{background:#fbf3e8;border-color:#eed9bd}

/* Dashboard check-in */
.checkin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 22px;margin-top:6px}
.checkin-grid section{min-width:0}
.checkin-grid h4{margin:12px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.checkin-grid select,.checkin-grid input,.checkin-grid textarea{width:100%}
.gratitude input{margin-bottom:8px}

/* Today */
.today-hero{background:linear-gradient(150deg,#e6efe5,#fbfaf6 75%);border-color:#d6e2d5}
.today-hero h2{font-size:26px;margin:8px 0 4px}
.quote-main{font-size:20px;font-weight:700;line-height:1.35;margin:6px 0 10px;max-width:40ch}
.quote-more{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.quote-more li{padding-left:12px;border-left:3px solid #c9d8c8;color:var(--muted);font-size:14.5px}
.mini-row{grid-column:span 12;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mini{padding:13px 15px}
.mini h3{font-size:15px;margin:0 0 8px}
.mini p.small{margin:6px 0 0}
.mini input[type=date]{width:100%}
.mini-fields{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.mini-fields input,.mini-fields select{width:100%;min-width:0}
.timer-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mini .timer{font-size:26px;font-variant-numeric:tabular-nums}
.mini .row .btn{padding:7px 11px}
.routine-progress{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.routine-progress .progress{flex:1;height:8px}
.routine{width:100%;border-collapse:collapse}
.routine td{padding:9px 6px;border-bottom:1px solid #eef1ed;vertical-align:top}
.routine tr:last-child td{border-bottom:0}
.routine td.c{width:1%;padding-left:2px}
.routine td.t{width:1%;white-space:nowrap;font-weight:700;color:var(--accent-2);font-size:13.5px;font-variant-numeric:tabular-nums;padding-top:10px}
.routine td.a{line-height:1.4}
.routine label{cursor:pointer}
.routine input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin:1px 0 0}
.routine tr.done td.a label{color:var(--muted);text-decoration:line-through;text-decoration-color:#b9c4bb}
.routine tr.now td{background:var(--mint)}
.routine tr.now td.c{box-shadow:inset 3px 0 0 var(--accent)}
.go-btn{display:inline-block;margin-left:8px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:1px 9px;font-size:12px;color:var(--accent-2);cursor:pointer;vertical-align:1px}
.routine-edit{display:grid;gap:6px;margin:8px 0 10px}
.re-row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:6px}
.re-row input{width:100%;min-width:0}
.re-new{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.care h4{color:var(--accent-2)}
.care .check{padding:6px 0;font-size:14.5px}

/* Food */
.water{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}
.water-count{font-size:15px;color:var(--muted)}
.water-count b{font-size:30px;color:var(--ink);margin-right:2px}
.cups{display:flex;gap:4px;flex-wrap:wrap}
.cup{width:36px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;cursor:pointer;filter:grayscale(1);opacity:.35;padding:0}
.cup.full{filter:none;opacity:1;background:#eef5fb;border-color:#cfe0ee}
.cup.extra{border-style:dashed}
.drink-week{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:8px}
.drink{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer}
.drink input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.drink>span{display:flex;flex-direction:column;gap:3px}
.drink-day{font-size:12.5px;color:var(--muted);font-weight:600}
.drink.today{background:var(--mint);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tips{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fbf6ee;border:1px solid #efe2cf}
.tips h4{margin:0 0 4px}
.tips p{margin:4px 0}

/* Grocery */
.pantry-cat{border:1px solid var(--line);border-radius:14px;background:#fff;margin:8px 0;overflow:hidden}
.pantry-cat summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;font-weight:700}
.pantry-cat summary::-webkit-details-marker{display:none}
.pantry-cat summary:before{content:"+";color:var(--accent);font-weight:800;margin-right:8px}
.pantry-cat[open] summary:before{content:"−"}
.pantry-cat summary span:first-child{flex:1}
.pantry-row{display:grid;grid-template-columns:auto minmax(0,1fr) 78px 76px;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid #f0f2ef}
.pantry-row.have{background:#f5f9f4}
.pantry-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.pantry-row input[type=number],.pantry-row select{width:100%;min-width:0;padding:6px 8px;min-height:36px}
.pname{min-width:0;overflow:hidden;text-overflow:ellipsis}
.low-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);background:#fbf0e2;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.recipe-list{display:flex;flex-wrap:wrap;gap:7px}

function sanitizeProfileId(v){
  return (v||"").trim().toLowerCase().replace(/[^a-z0-9-_]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);

function hashPasscode(p){
  const s=String(p||""); let h=0;
  for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  return h.toString(36);
}
async function fetchExistingProfiles(){
  // Union of the metadata node AND the actual data node — a profile with saved
  // data but no passcode-metadata entry (e.g. created before that concept existed)
  // must still show up, or it becomes invisible/unopenable and risks being
  // silently overwritten by someone creating a "new" profile with the same name.
  try{
    const [profSnap,stateSnap]=await Promise.all([
      firebase.database().ref("adhdPlannerProfiles").once("value"),
      firebase.database().ref("adhdPlannerState").once("value")
    ]);
    const a=Object.keys(profSnap.val()||{});
    const b=Object.keys(stateSnap.val()||{});
    return Array.from(new Set([...a,...b]));
  }catch(e){return [];}
}
async function fetchProfileMeta(id){

// Deleting a profile always requires its passcode. If none is set yet, one must be
// created (and re-typed to confirm) as the deletion gate — this is the deliberate
// "passcode must be added to delete" safety rail.
async function requirePasscodeToDelete(id){
  if(id===GUEST_ID){alert("The Guest profile is shared and can't be deleted.");return false;}
  const meta=await fetchProfileMeta(id);
  if(meta && meta.passcodeHash){
    for(let tries=0;tries<3;tries++){
      const entered=window.prompt("Deleting \""+id+"\" permanently removes its saved data.\n\nEnter its passcode to confirm:","");
      if(entered===null)return false;
      if(hashPasscode(entered)===meta.passcodeHash)return true;
      alert("Incorrect passcode.");
    }
    return false;
  }
  const p1=window.prompt("\""+id+"\" has no passcode set yet. Set one now and re-enter it to confirm you want to permanently delete it:","");
  if(!p1)return false;
  const p2=window.prompt("Re-enter the passcode to confirm deleting \""+id+"\":","");
  if(p1!==p2){alert("Passcodes didn't match — deletion cancelled.");return false;}
  return true;
}
async function deleteProfile(id){
  const ok=await requirePasscodeToDelete(id);
  if(!ok)return false;
  const isSelf=(id===profileId);
  // Deleting the profile that's currently live-syncing in THIS session needs its
  // listener detached first — otherwise the listener sees the removal as "cloud is
  // empty" and immediately re-pushes the local copy back up, resurrecting it.
  if(isSelf && stateRef){ try{stateRef.off();}catch(e){} }
  try{
    await firebase.database().ref("adhdPlannerState/"+id).remove();
    await firebase.database().ref("adhdPlannerProfiles/"+id).remove();
  }catch(e){
    alert("Couldn't reach the shared dashboard to delete that profile right now. Try again once you're online.");
    return false;
  }

const MASTER_DELETE_ALL_HASH="b0axxf";
async function deleteAllProfiles(ids){
  if(!ids.length){alert("There are no other profiles to delete.");return false;}
  for(let tries=0;tries<3;tries++){
    const entered=window.prompt("This permanently deletes ALL "+ids.length+" profile(s) and their saved data from this shared dashboard. Guest is not affected.\n\nEnter the master passcode to confirm:","");
    if(entered===null)return false;
    if(hashPasscode(entered)===MASTER_DELETE_ALL_HASH)break;
    if(tries===2){alert("Incorrect passcode. Nothing was deleted.");return false;}
    alert("Incorrect passcode.");
  }
  const includesSelf=ids.includes(profileId);
  if(includesSelf && stateRef){ try{stateRef.off();}catch(e){} } // same resurrection risk as deleteProfile — see there
  for(const id of ids){
    try{
      await firebase.database().ref("adhdPlannerState/"+id).remove();
      await firebase.database().ref("adhdPlannerProfiles/"+id).remove();
    }catch(e){console.error("Failed to delete profile "+id,e);}
  }
  clearDeviceMemory();
  alert("All profiles were deleted. Guest is still available.");
  if(includesSelf){
    sessionStorage.removeItem("reset30_skipPickerOnce");

  }

let stateRef=null, firebaseOnline=false;
function setSyncStatus(text){const el=document.getElementById("syncStatus");if(el)el.textContent=text;}
// ---- Cloud sync: every 5 minutes, or straight away when you press Save ----
const SYNC_EVERY_MS=5*60*1000;
let cloudDirty=false, syncTimer=null, lastSyncAt=null;
function syncTimeLabel(){return lastSyncAt?lastSyncAt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}):"";}
function applyRemote(remote){
  firebaseOnline=true;
  if(!remote){ if(state&&Object.keys(state).length) return cloudPush(true); return Promise.resolve(); }
  if(remote.lastSaved===state.lastSaved){ lastSyncAt=new Date(); setSyncStatus("☁️ synced "+syncTimeLabel()); return Promise.resolve(); }
  // keep whichever copy is newer
  if(state.lastSaved && remote.lastSaved && new Date(remote.lastSaved)<=new Date(state.lastSaved)){ return cloudPush(true); }
  state=remote;
  if(selectedDayLocal!=null) state.day=selectedDayLocal;
  ensureStateDefaults();
  localStorage.setItem(dataKey(),JSON.stringify(state));
  cloudDirty=false; lastSyncAt=new Date(); resetUndo();
  updateLastSavedLabel();
  setSyncStatus("☁️ synced "+syncTimeLabel());
  if(typeof currentTab!=="undefined"){ if(currentTab==="Dashboard"){render();}else{tab(currentTab);} }
  return Promise.resolve();
}
function cloudPull(){
  if(!stateRef) return Promise.resolve();
  return stateRef.once("value").then(snap=>applyRemote(fbDecode(snap.val()))).catch(err=>{firebaseOnline=false;setSyncStatus("☁️ offline, saved on this device");console.error("Cloud read failed:",err);});
}
function cloudPush(force){
  if(!stateRef || (!cloudDirty && !force)) return Promise.resolve();
  setSyncStatus("☁️ syncing…");
  return stateRef.set(fbEncode(state)).then(()=>{cloudDirty=false;lastSyncAt=new Date();setSyncStatus("☁️ synced "+syncTimeLabel());})
    .catch(err=>{setSyncStatus("☁️ offline, saved on this device");console.error("Cloud save failed:",err);});
}
function cloudSyncNow(){ return cloudPull().then(()=>cloudPush()); }
function attachStateSync(){
  stateRef=firebase.database().ref("adhdPlannerState/"+profileId);
  cloudPull();
  if(syncTimer) clearInterval(syncTimer);
  syncTimer=setInterval(cloudSyncNow,SYNC_EVERY_MS);
  // don't lose unsynced changes when the app is closed or put in the background
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") cloudPush(); });
  window.addEventListener("pagehide",()=>cloudPush());
}
async function initApp(){

  // and delete), pins Guest on top, and offers a one-tap "Continue" for whichever
  // profile this device last used, plus "Start fresh" to forget it.
  // Exception: right after a deliberate switch (see changeProfileId), skip it once
  // so the person lands straight on the app's pages instead of re-picking immediately.
  const remembered=profileId||null;
  const skipOnce=sessionStorage.getItem("reset30_skipPickerOnce")==="1";
  sessionStorage.removeItem("reset30_skipPickerOnce");

}
// ---- Undo: remembers the last 25 changes on this device ----
let undoStack=[], lastSnap=null, lastPushAt=0, undoing=false;
function snapOf(st){return JSON.stringify(Object.assign({},st,{day:0,lastSaved:""}));}
function resetUndo(){undoStack=[];lastSnap=snapOf(state);updateUndoBtn();}
function recordUndo(){
  if(undoing) return;
  const cur=snapOf(state);
  if(lastSnap===null){lastSnap=cur;return;}
  if(cur===lastSnap) return;
  const now=Date.now();
  if(now-lastPushAt>900 || !undoStack.length){undoStack.push(lastSnap); if(undoStack.length>25) undoStack.shift();}
  lastPushAt=now; lastSnap=cur; updateUndoBtn();
}
function updateUndoBtn(){const b=document.getElementById("undoBtn");if(b){b.disabled=!undoStack.length;b.title=undoStack.length?"Undo last change":"Nothing to undo";}}
function undoLast(){
  if(!undoStack.length) return;
  const prev=undoStack.pop(), day=state.day;
  state=JSON.parse(prev); state.day=day; ensureStateDefaults();
  undoing=true; persist(); undoing=false;
  lastSnap=snapOf(state); updateUndoBtn();
  if(currentTab==="Dashboard"){render();}else{tab(currentTab);}
  toast("Undone");
}

function importBackup(evt){
  const file=evt.target.files&&evt.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const incoming=JSON.parse(e.target.result);
      if(!confirm("Import this backup? It will replace everything currently on this device."))return;
      state=incoming;
      ensureStateDefaults();
      persist();
      location.reload();
    }catch(err){
      alert("That file doesn't look like a valid backup (couldn't be read as JSON).");
    }
  };
  reader.readAsText(file);
  evt.target.value="";
}

function fmtLocalDate(dt){
 const y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,"0"), da=String(dt.getDate()).padStart(2,"0");
 return `${y}-${m}-${da}`;

function dateForDay(d){
 if(!state.startDate)return "";

 start.setDate(start.getDate()+(d-1));
 return fmtLocalDate(start);
}
function weekdayForDay(d){
 const iso=dateForDay(d);
 const names=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
 if(iso) return names[new Date(iso+"T00:00:00").getDay()];
 return names[[1,2,3,4,5,6,0][(d-1)%7]];
}

function incomeTotals(){
 const total=state.incomeLog.reduce((s,e)=>s+e.amount,0);
 let weekTotal=0;
 if(state.incomeLog.length){
  const sorted=[...state.incomeLog].sort((a,b)=>a.date<b.date?1:-1);

// ================= Calendar (dashboard) =================
let calMonth=null;
function dayActivity(n){
  const rt=dayRoutine(n), done=rt.filter(r=>state.done["routine_"+n+"_"+r.id]).length;
  const frac=rt.length?done/rt.length:0;
  const rec=(state.records&&state.records[n])||{};
  const any=done>0||(state.water&&state.water[n]>0)||Object.keys(rec).some(k=>rec[k]!==""&&rec[k]!=null)||Object.keys(state.done).some(k=>state.done[k]&&k.split("_")[1]===String(n));
  return {frac,done,level:frac>=0.8?3:frac>=0.5?2:any?1:0};
}
function streakInfo(){
  let n=todayDayNumber(), streak=0;
  if(dayActivity(n).level===0) n--; // today not started yet doesn't break the streak
  while(dayActivity(n).level>0 && streak<3650){streak++;n--;}
  return streak;
}
function calShift(delta){const base=calMonth||dateForDay(state.day).slice(0,7);let [y,m]=base.split("-").map(Number);m+=delta;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}calMonth=y+"-"+String(m).padStart(2,"0");render();}
function calendarHtml(){
  const selIso=dateForDay(state.day), todayIso=fmtLocalDate(new Date());
  const base=calMonth||selIso.slice(0,7); const [y,m]=base.split("-").map(Number);
  const first=new Date(y,m-1,1), lead=(first.getDay()+6)%7, dim=new Date(y,m,0).getDate();
  let cells="", active=0, strong=0;
  for(let i=0;i<lead;i++) cells+=`<span class="cal-cell empty"></span>`;
  for(let dd=1;dd<=dim;dd++){
    const iso=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`, n=dayNumberForDate(iso), a=dayActivity(n);
    if(a.level>0) active++; if(a.level>=2) strong++;
    cells+=`<button type="button" class="cal-cell l${a.level} ${iso===selIso?'sel':''} ${iso===todayIso?'today':''}" onclick="onSelectDate('${iso}')" aria-label="${niceDate(iso)}">${dd}</button>`;
  }
  const monthName=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  return `<div class="card span12 cal-card">
   <div class="cal-top"><h3>📅 ${monthName}</h3><div class="row"><button class="btn secondary sm" onclick="calShift(-1)" aria-label="Previous month">‹</button><button class="btn secondary sm" onclick="calMonth=null;goToday()">Today</button><button class="btn secondary sm" onclick="calShift(1)" aria-label="Next month">›</button></div></div>
   <div class="cal-stats"><span class="stat"><b>${streakInfo()}</b> day streak</span><span class="stat"><b>${active}</b> active days this month</span><span class="stat"><b>${strong}</b> days with half the routine or more</span></div>
   <div class="cal-grid">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<span class="cal-wd">${w}</span>`).join("")}${cells}</div>
   <div class="cal-legend small"><span><i class="l1"></i>started</span><span><i class="l2"></i>half the routine</span><span><i class="l3"></i>80%+</span></div>
  </div>`;
}

function plannerCompress(blocks,available){
  const totalTarget=blocks.reduce((s,b)=>s+b.target,0);
  if(totalTarget<=available) return {list:blocks.map(b=>Object.assign({},b,{dur:b.target})),overflow:0};
  let needed=totalTarget-available;
  const dur={}; blocks.forEach(b=>dur[b.id]=b.target);
  function applyReduction(tier,amount){
    const pool=blocks.filter(b=>b.tier===tier && dur[b.id]>b.min);
    const poolReducible=pool.reduce((s,b)=>s+(dur[b.id]-b.min),0);
    if(poolReducible<=0) return amount;
    const actualCut=Math.min(amount,poolReducible);
    pool.forEach(b=>{const share=(dur[b.id]-b.min)/poolReducible; dur[b.id]-=actualCut*share;});
    return amount-actualCut;
  }
  needed=applyReduction(1,needed);
  if(needed>0.5) needed=applyReduction(2,needed);
  const overflow=needed>0.5?needed:0;
  return {list:blocks.map(b=>Object.assign({},b,{dur:Math.max(b.min,Math.round(dur[b.id]/5)*5)})),overflow};
}
function plannerCompute(){
  const pd=plannerDay();
  let cursor=plannerToMinutes(pd.wakeTime);
  const doneList=[],remaining=[];
  pd.tasks.forEach(t=>{
    if(t.done){
      const end=(t.actualEnd!=null)?t.actualEnd:cursor+t.target;
      cursor=Math.max(cursor,end);
      doneList.push(Object.assign({},t,{start:cursor,end:end}));
    } else remaining.push(t);
  });
  if(pd.tasks.some(t=>t.done)){const now=plannerNowMinutes(); if(now>cursor) cursor=now;}
  const available=PLANNER_DAY_END-cursor;
  const {list,overflow}=plannerCompress(remaining,Math.max(available,0));
  let t2=cursor; list.forEach(b=>{b.start=t2;b.end=t2+b.dur;t2=b.end;});
  return {doneList,pendingList:list,overflow};
}

async function plannerFetchWeather(){
  const noteEl=document.getElementById("plannerWeatherNote");
  if(noteEl) noteEl.textContent="Checking local weather…";
  try{
    const coords=await new Promise((resolve)=>{
      if(!navigator.geolocation){resolve({lat:-37.8136,lon:144.9631});return;}
      const timer=setTimeout(()=>resolve({lat:-37.8136,lon:144.9631}),4000);
      navigator.geolocation.getCurrentPosition(
        pos=>{clearTimeout(timer);resolve({lat:pos.coords.latitude,lon:pos.coords.longitude});},
        ()=>{clearTimeout(timer);resolve({lat:-37.8136,lon:144.9631});},
        {timeout:3800}
      );
    });
    const url="https://api.open-meteo.com/v1/forecast?latitude="+coords.lat+"&longitude="+coords.lon+"&current_weather=true&temperature_unit=celsius";
    const res=await fetch(url);
    if(!res.ok) throw new Error("bad response");
    const data=await res.json();
    const cw=data.current_weather;
    const isRain=(cw.weathercode>=51&&cw.weathercode<=67)||(cw.weathercode>=80&&cw.weathercode<=82)||(cw.weathercode>=95);
    let cat; if(isRain) cat="rainy"; else if(cw.temperature>=29) cat="hot"; else if(cw.temperature<=11) cat="cold"; else if(cw.weathercode<=1) cat="sunny"; else cat="cloudy";
    const pd=plannerDay(); pd.weather=cat; pd.weatherManual=false; plannerApplyWeather(cat);
    save();
    const noteEl2=document.getElementById("plannerWeatherNote");
    if(noteEl2) noteEl2.textContent=Math.round(cw.temperature)+"°C. "+(WALK_TIP[cat]||"");
  }catch(e){
    if(noteEl) noteEl.textContent="Couldn't get live weather — set it manually.";
  }
}

  const clash=allBaseCategories().some(c=>c.toLowerCase()===val.toLowerCase()&&c.toLowerCase()!==oldName.toLowerCase());
  if(clash){alert(`A category named "${val}" already exists.`);return;}
  Object.keys(state.itemCategories).forEach(item=>{if(state.itemCategories[item]===oldName)state.itemCategories[item]=val;});
  if(Object.keys(shoppingCatalog).includes(oldName)){
    shoppingCatalog[oldName].forEach(it=>{if(!state.itemCategories[it])state.itemCategories[it]=val;});
  }
  if(state.customCategories.includes(oldName)){
    state.customCategories=state.customCategories.map(c=>c===oldName?val:c);

function nutritionEstimate(text){
  const t=(text||"").toLowerCase();
  let kcal=0, protein=0, hits=[];
  const keys=Object.keys(nutritionDB).sort((a,b)=>b.length-a.length);
  keys.forEach(k=>{
    if(t.includes(k)){
      const n=nutritionDB[k];
      kcal+=n.kcal; protein+=n.protein; hits.push(`${k}: ~${n.kcal} kcal, ${n.protein} g protein (${n.unit})`);
    }
  });
  if(!hits.length)return {kcal:0,protein:0,hits:[]};
  return {kcal:Math.round(kcal),protein:Number(protein.toFixed(1)),hits};
}

// ================= Firebase-safe keys =================
function skey(name){return String(name).replace(/[.#$\/\[\]]/g,"_");}
function fbEncodeKey(k){return String(k).replace(/[%.#$\/\[\]]/g,c=>"%"+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,"0"));}
function fbDecodeKey(k){return String(k).replace(/%([0-9A-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));}
function fbEncode(v){
  if(v===undefined) return null;
  if(Array.isArray(v)) return v.map(fbEncode);
  if(v&&typeof v==="object"){const o={};Object.keys(v).forEach(k=>{const x=fbEncode(v[k]);if(x!==null&&x!==undefined)o[fbEncodeKey(k)]=x;});return o;}
  return v;
}
function fbDecode(v){
  if(Array.isArray(v)) return v.map(fbDecode);
  if(v&&typeof v==="object"){const o={};Object.keys(v).forEach(k=>{o[fbDecodeKey(k)]=fbDecode(v[k]);});return o;}
  return v;
}

  if(/milk|buttermilk|oil|vinegar|soy sauce|cream|honey|coconut water/.test(it)) return "ml";
  if(cat==="Beverages & extras"||cat==="Frozen & bakery") return "pack";
  return "g";
}

function hasItem(item){return !!pq(item).have;}
function isLow(item,cat){
  const p=pq(item); if(!p.have||p.q===""||p.q==null) return false;
  const q=Number(p.q), u=p.u||defaultUnit(item,cat);
  const spice=cat==="Pantry & spices";
  if(u==="g"||u==="ml") return q<(spice?50:250);
  if(u==="kg"||u==="L") return q<(spice?0.05:0.25);
  if(u==="pcs") return q<=2;

}

function pantrySetQty(item,val){const p=pantryEntry(item);if(val===""){p.q="";}else{const n=Number(val);if(isNaN(n)||n<0)return;p.q=n;if(n>0)p.have=true;else{p.have=false;p.was=true;}}state.pantry[skey(item)]=p.have;save();}
function pantrySetUnit(item,val){const p=pantryEntry(item);p.u=val;persist();}
function pantryRow(it,cat){
  const p=pq(it), u=p.u||defaultUnit(it,cat), low=isLow(it,cat);
  return `<div class="pantry-row ${p.have?'have':''}">
    <input type="checkbox" ${p.have?'checked':''} data-item="${escapeAttr(it)}" onchange="pantryToggle(this.dataset.item)" aria-label="I have ${escapeAttr(it)}">
    <span class="pname">${escapeAttr(it)}${low?' <span class="low-tag">low</span>':''}</span>
    <input type="number" min="0" step="any" inputmode="decimal" placeholder="Qty" value="${p.q===undefined?"":p.q}" data-item="${escapeAttr(it)}" onchange="pantrySetQty(this.dataset.item,this.value)" aria-label="Quantity of ${escapeAttr(it)}">
    <select data-item="${escapeAttr(it)}" onchange="pantrySetUnit(this.dataset.item,this.value)" aria-label="Unit">${PANTRY_UNITS.map(x=>`<option ${x===u?'selected':''}>${x}</option>`).join("")}</select>
  </div>`;
}
let pantryOpen={};
function pantryHtml(){
  const {order,itemsByCategory}=unifiedShoppingData();
  return order.filter(c=>(itemsByCategory[c]||[]).length).map(cat=>{
    const items=itemsByCategory[cat], haveN=items.filter(hasItem).length;
    return `<details class="pantry-cat" ${pantryOpen[cat]?"open":""} data-cat="${escapeAttr(cat)}" ontoggle="pantryOpen[this.dataset.cat]=this.open"><summary><span>${escapeAttr(cat)}</span><span class="small">${haveN?haveN+" in stock":"none yet"}</span></summary>${items.map(it=>pantryRow(it,cat)).join("")}</details>`;
  }).join("");
}

function needMet(tok){return tok.split("|").some(hasItem);}
function recipeMatches(){
  const can=[],almost=[];
  RECIPES.forEach(r=>{const miss=r.need.filter(t=>!needMet(t));if(!miss.length)can.push(r);else if(miss.length===1&&r.need.length>1)almost.push({r,miss:miss[0]});});
  return {can,almost};
}
function recipeLink(r){return `<a href="${r.u}" target="_blank" rel="noopener">${r.n}</a>`;}
function recipesHtml(){
  const inStock=Object.values(state.pantryQty).filter(p=>p&&p.have).length;
  if(!inStock) return `<p class="small">Tick what you have at home and recipe names will appear here.</p>`;
  const {can,almost}=recipeMatches();
  const groups=[...new Set(RECIPES.map(r=>r.g))];
  let out="";
  if(can.length){out+=groups.map(g=>{const list=can.filter(r=>r.g===g);return list.length?`<h4>${g}</h4><div class="recipe-list">${list.map(recipeLink).join("")}</div>`:"";}).join("");}
  else out+=`<p class="small">Nothing complete yet. Add a few staples like onion, tomato, rice or a dal.</p>`;
  const almostRow=({r,miss})=>{const it=miss.split("|")[0];const added=!!state.shopping[it];return `<div class="almost-row">${recipeLink(r)}<span class="small">needs ${escapeHtml(miss.replace(/\|/g," or "))}</span><button class="btn secondary sm" ${added?"disabled":""} data-item="${escapeAttr(it)}" onclick="shopAdd(this.dataset.item)">${added?"✓ On list":"+ List"}</button></div>`;};
  if(almost.length){const first=almost.slice(0,6),rest=almost.slice(6);out+=`<h4 class="almost-h">One item away</h4><div class="almost">${first.map(almostRow).join("")}</div>${rest.length?`<details class="more-almost"><summary class="link-btn">Show ${rest.length} more</summary><div class="almost">${rest.map(almostRow).join("")}</div></details>`:""}`;}
  return out+`<p class="small src">Recipes from Swasthi's Recipes and Dassana's Veg Recipes. Tap a name to open it.</p>`;
}

function shopAdd(item){state.shopping[item]=true;save();}
function nextWeekSuggestions(){
  const cm=itemCategoryMap(), stock=[], recipe=[], seen=new Set();
  const push=(arr,it,why)=>{if(seen.has(it)||state.shopping[it])return;seen.add(it);arr.push({it,why});};
  Object.keys(cm).forEach(it=>{if(isLow(it,cm[it])){const p=pq(it);push(stock,it,`running low, ${p.q} ${p.u||defaultUnit(it,cm[it])} left`);}});
  Object.keys(cm).forEach(it=>{const p=pq(it);if(!p.have&&p.was)push(stock,it,"used up");});
  recipeMatches().almost.forEach(({r,miss})=>push(recipe,miss.split("|")[0],"for "+r.n));
  return {stock,recipe};
}

  const recFirst=recipe.slice(0,5), recRest=recipe.slice(5);
  const sugHtml=(stock.length||recipe.length)?`
   ${stock.length?`<h4>Restock</h4><div class="sug-list">${stock.map(sugRow).join("")}</div>`:""}
   ${recipe.length?`<h4>One item unlocks a recipe</h4><div class="sug-list">${recFirst.map(sugRow).join("")}</div>${recRest.length?`<details class="more-almost"><summary class="link-btn">Show ${recRest.length} more</summary><div class="sug-list">${recRest.map(sugRow).join("")}</div></details>`:""}`:""}`
   :`<p class="small">No suggestions yet. Add amounts on the My Nutrition page and anything running low or used up shows here.</p><button class="btn secondary sm" onclick="tab('Nutrition')">Open My Nutrition</button>`;
  return `<div class="grid">
  <div class="card span12 page-head"><h2>🛒 Shopping list</h2><p class="small">Your buy list, plus ideas for next week's prep based on what's low at home.</p></div>
  <div class="card span6"><h3>🧾 Your buy list</h3>${shoppingSummaryHtml()}
   <label class="small">Other items to note</label><textarea id="shoppingNotes" placeholder="Anything else to pick up…" oninput="state.shoppingNotes=this.value;persist()">${escapeHtml(state.shoppingNotes||"")}</textarea></div>
  <div class="card span6"><h3>✨ Suggested for next week's prep</h3>${sugHtml}</div>
  <div class="card span12"><h3>🛍️ Full supermarket list</h3><p class="small">Tick what you need. Rename a category with ✏️, or drag an item (⠿) onto another category.</p>${shoppingChecklist()}</div>
  </div>`;
}

let pomoTimer=null,pomoSeconds=0,pomoMode="work",pomoCycle=0;
function pomoLen(mode){return mode==="work"?25*60:(mode==="longbreak"?15*60:5*60)}
function pomoStart(){
  if(pomoTimer)return;
  if(pomoSeconds<=0)pomoSeconds=pomoLen(pomoMode);
  updatePomoDisplay();
  pomoTimer=setInterval(()=>{
    pomoSeconds--;
    updatePomoDisplay();
    if(pomoSeconds<=0){
      clearInterval(pomoTimer);pomoTimer=null;
      if(pomoMode==="work"){
        pomoCycle++;
        state.records=state.records||{};state.records[state.day]=state.records[state.day]||{};
        state.records[state.day].pomodoros=(state.records[state.day].pomodoros||0)+1;
        persist();
        const nextMode=(pomoCycle%4===0)?"longbreak":"break";
        alert("Focus block complete. Time for a "+(nextMode==="longbreak"?"long (15 min)":"short (5 min)")+" break.");
        pomoMode=nextMode;
      }else{
        alert("Break's over. Ready for the next focus block.");
        pomoMode="work";
      }
      pomoSeconds=0;
      updatePomoDisplay();
    }
  },1000);
}
function pomoPause(){clearInterval(pomoTimer);pomoTimer=null;}
function pomoReset(){clearInterval(pomoTimer);pomoTimer=null;pomoMode="work";pomoCycle=0;pomoSeconds=0;updatePomoDisplay();}
function updatePomoDisplay(){
  const disp=document.getElementById("pomodoroDisplay");
  if(!disp)return;
  const s=pomoSeconds>0?pomoSeconds:pomoLen(pomoMode);
  disp.textContent=fmt(s);
  const lbl=document.getElementById("pomodoroLabel");
  if(lbl)lbl.textContent=pomoMode==="work"?"Focus block":(pomoMode==="longbreak"?"Long break":"Short break");
  const cnt=document.getElementById("pomodoroCount");
  if(cnt)cnt.textContent=((state.records&&state.records[state.day]&&state.records[state.day].pomodoros)||0);
}
let timer=null,seconds=0;
function startTimer(min){clearInterval(timer);seconds=min*60;document.getElementById("timer").textContent=fmt(seconds);timer=setInterval(()=>{seconds--;document.getElementById("timer").textContent=fmt(seconds);if(seconds<=0){clearInterval(timer);alert("Focus block complete. Stand up, breathe, and take your planned break.");}},1000)}
function stopTimer(){clearInterval(timer);seconds=0;if(document.getElementById("timer"))document.getElementById("timer").textContent="25:00"}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function record(field,value){
  state.records=state.records||{};
  state.records[state.day]=state.records[state.day]||{};
  state.records[state.day][field]=value;
  persist();
  if(field==="cycle" && document.getElementById("cyclePhase")) restoreRecord();
}
function restoreRecord(){
  const r=(state.records&&state.records[state.day])||{};
  ["gut","energy","stiff","mood","stress","focus","foodfeel","bestmeal","sleep","calm","summary","cycle","periodstart","alcohol","morningJournal","emoMorning","emoNoon","emoEvening","emoNight","emoGeneral","gratitude1","gratitude2","gratitude3","calories","protein","weight","waist","pain","inflammation"].forEach(id=>{
    const el=document.getElementById(id); if(el && r[id]!==undefined) el.value=r[id];
  });
  const cycleEl=document.getElementById("cycle");
  if(cycleEl){
    const day=parseInt(cycleEl.value||"0",10);
    const phaseEl=document.getElementById("cyclePhase");
    const ovuEl=document.getElementById("ovulationExpectation");
    if(day && phaseEl && ovuEl){
      if(day<=5) phaseEl.textContent="Menstrual";
      else if(day<=13) phaseEl.textContent="Follicular";
      else if(day<=16) phaseEl.textContent="Around ovulation";
      else phaseEl.textContent="Luteal";
      if(day>=10 && day<=16) ovuEl.textContent="Possible ovulation window (estimate)";
      else if(day<10) ovuEl.textContent="Likely approaching the fertile window";
      else ovuEl.textContent="Likely past the typical ovulation window";
    }
  }
}
function saveNote(type,value){
  state.notes=state.notes||{};
  state.notes.day=state.notes.day||{};
  if(type==="day") state.notes.day[state.day]=value;
  else state.notes.general=value;
  persist();
}
function resetAll(){if(confirm("Clear all progress for \""+profileId+"\"?\n\nThis only clears this tracker/login — it won't touch any other profile's data.")){localStorage.removeItem(dataKey());if(stateRef)stateRef.remove();location.reload()}}
const originalRender=render;
render=function(){originalRender();setTimeout(restoreRecord,0);updateLastSavedLabel();};
initApp();
window.addEventListener("storage",(e)=>{
  if(e.key!==dataKey()||!e.newValue)return;
  try{state=JSON.parse(e.newValue);ensureStateDefaults();if(currentTab==="Dashboard")render();else tab(currentTab);}catch(err){}
});
</script>
